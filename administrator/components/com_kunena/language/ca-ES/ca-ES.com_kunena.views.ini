COM_KUNENA_MAINTENANCE_UTF8MB4_DESC = "Els fòrums instal·lats abans de l'utf8mb4 de MySQL van mantenir les columnes de les taules en utf8 (utf8mb3), fins i tot després d'actualitzacions: els missatges no poden contenir emojis ni altres caràcters de 4 bytes, i cercar-los falla amb \"Illegal mix of collations\". Això converteix cada taula de Meela que encara tingui aquestes columnes a utf8mb4, una taula alhora. Les taules grans (missatges) poden trigar diversos minuts i queden bloquejades mentrestant: executeu-ho en un moment tranquil, després d'una còpia de seguretat; en fòrums molt grans, la línia d'ordres (php cli/joomla.php kunena:database:utf8mb4) no té límit de temps."
