COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "اراکین کون سی فائل اقسام منسلک کر سکتے ہیں: کوما سے الگ کی گئی، چھوٹے حروف میں ایکسٹینشنز (خالی جگہیں ہٹا دی جاتی ہیں)۔ پہلے سے طے شدہ: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov۔ قابل عمل اور ویب صفحہ کی اقسام کی کبھی اجازت نہیں ہوتی۔ خالی چھوڑنے پر محفوظ کرتے وقت پہلے سے طے شدہ قدر واپس آ جاتی ہے۔"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "جب &quot;MIME اقسام جانچیں&quot; آن ہو تو تصاویر کی کون سی MIME اقسام قبول کی جاتی ہیں: کوما سے الگ، <strong>چھوٹے حروف میں</strong>۔ پہلے سے طے شدہ: image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif۔ خالی چھوڑنے پر محفوظ کرتے وقت پہلے سے طے شدہ قدر واپس آ جاتی ہے۔"
COM_KUNENA_A_IMAGEALLOWEDTYPES_DESC = "اراکین کون سی تصویری اقسام منسلک کر سکتے ہیں: کوما سے الگ کی گئی، <strong>چھوٹے حروف میں</strong> ایکسٹینشنز (خالی جگہیں ہٹا دی جاتی ہیں)۔ پہلے سے طے شدہ: jpg,jpeg,gif,png,webp,avif (WebP اور AVIF وہاں جہاں سرور کا PHP انہیں پروسیس کر سکے)۔ خالی چھوڑنے پر محفوظ کرتے وقت پہلے سے طے شدہ قدر واپس آ جاتی ہے۔"
COM_KUNENA_A_IMGQUALITY_DESC = "سائز تبدیل کی گئی JPEG، WebP اور AVIF تصاویر کا معیار، 1 سے 100: زیادہ کا مطلب بہتر معیار لیکن بڑی فائلیں۔ پہلے سے طے شدہ: 50 (عام قدریں: 50-85)۔ PNG اور GIF تصاویر کا سائز بغیر نقصان کے تبدیل ہوتا ہے۔"
COM_KUNENA_CFG_LEGACY_URLS_DESC = "اس ورژن سے پرانے URL کی معاونت شامل کرنے کے لیے Kunena کا ورژن منتخب کریں۔ آپ Kunena ورژن %s سے استعمال کر رہے ہیں۔ یہ خصوصیت مجلس کی طرف جانے والے تمام پرانے روابط کو کام کرتا رکھتی ہے۔"
COM_KUNENA_CONFIG_LEGACY_URL_DEPRECATED_DESC = "<em><b>پرانے URL کی معاونت آئندہ ورژن میں ہٹا دی جائے گی، براہ کرم دیکھ لیں کہ آپ کو یہ خصوصیت ابھی بھی فعال رکھنے کی ضرورت ہے یا نہیں۔</b></em>"
COM_KUNENA_CONFIG_AVATAR_FILESALLOWED_DESC = "اراکین نشان کے طور پر کون سی تصویری اقسام اپ لوڈ کر سکتے ہیں: کوما سے الگ کی گئی، چھوٹے حروف میں ایکسٹینشنز (خالی جگہیں ہٹا دی جاتی ہیں)۔ پہلے سے طے شدہ: gif,jpeg,jpg,png,webp,avif (WebP اور AVIF وہاں جہاں سرور کا PHP انہیں پروسیس کر سکے)۔ خالی چھوڑنے پر محفوظ کرتے وقت پہلے سے طے شدہ قدر واپس آ جاتی ہے۔"
COM_KUNENA_A_AVATAR_DEFAULT_DESC = "ان اراکین کا نشان جن کا اپنا نہیں ہے: میڈیا مینیجر سے کوئی تصویر منتخب کریں۔ پہلے سے طے شدہ: <em>nophoto.png</em>، ٹیمپلیٹ کی اپنی تصویر (سادہ فائل کا نام ٹیمپلیٹ اور <em>/media/kunena/avatars/</em> میں تلاش کیا جاتا ہے)۔"
COM_KUNENA_A_AVATAR_DEFAULT_SMALL_DESC = "ان اراکین کا چھوٹا نشان (فہرستیں، 90 پکسل یا اس سے کم) جن کا اپنا نہیں ہے: میڈیا مینیجر سے کوئی تصویر منتخب کریں۔ پہلے سے طے شدہ: <em>s_nophoto.png</em>، ٹیمپلیٹ کی اپنی تصویر (سادہ فائل کا نام ٹیمپلیٹ اور <em>/media/kunena/avatars/</em> میں تلاش کیا جاتا ہے)۔"
