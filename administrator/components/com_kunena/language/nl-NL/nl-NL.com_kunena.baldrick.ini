COM_KUNENA_BALDRICK = "Baldrick AI"
COM_KUNENA_BALDRICK_DESC = "Baldrick is de AI-eerstelijnsreageerder van het forum: hij reageert op nieuwe onderwerpen, en op onderwerpen die na een lange stilte weer tot leven komen, wanneer geen beheerder of moderator heeft geantwoord. Eerst sorteert een klein model elke vraag; duidelijke vragen worden beantwoord door een krachtiger model op basis van gerelateerde openbare onderwerpen, brede vragen krijgen een standaardantwoord, en spam wordt niet geplaatst."
