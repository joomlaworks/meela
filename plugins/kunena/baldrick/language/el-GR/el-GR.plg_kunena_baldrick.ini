PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, ο πρώτος απαντών AI του φόρουμ: απαντά σε νέα θέματα και σε θέματα που αναβιώνουν μετά από μεγάλη σιωπή, όταν δεν έχει απαντήσει διαχειριστής ή συντονιστής, χρησιμοποιώντας APIs της Anthropic ή συμβατά με OpenAI. <strong>Απόρρητο:</strong> το κείμενο των θεμάτων που χειρίζεται (και των σχετικών δημόσιων θεμάτων) στέλνεται στον πάροχο AI που ορίζετε· αναφέρετέ το στην πολιτική απορρήτου σας. Δραστηριότητα, σύνολα και κόστη: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Βήμα 1: μοντέλο ταξινόμησης (μικρό, φθηνό)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Διαβάζει πρώτο κάθε νέα ερώτηση: την βαθμολογεί (μπορεί να απαντηθεί, πολύ γενική, χωρίς λεπτομέρειες, δεν είναι ερώτηση, spam) και γράφει τα ερωτήματα αναζήτησης για σχετικά θέματα. Ένα μικρό, γρήγορο μοντέλο αρκεί."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Βήμα 2: μοντέλο απάντησης (πιο ικανό)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Γράφει την απάντηση σε σαφείς ερωτήσεις, χρησιμοποιώντας το θέμα και τα σχετικά δημόσια θέματα του φόρουμ. Μπορεί να χρησιμοποιεί τη σύνδεση του βήματος 1 με άλλο μοντέλο, ή μια δική του σύνδεση."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Πότε απαντά ο Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Ο Baldrick εξετάζει κάθε νέο θέμα, τις απαντήσεις του δημιουργού του θέματος προς τον Baldrick (μια συνομιλία) και τις απαντήσεις σε θέματα που ήταν σιωπηλά για περισσότερες ημέρες από τον αριθμό παρακάτω. Δεν απαντά ποτέ όταν η τελευταία ανάρτηση προέρχεται από διαχειριστή ή συντονιστή."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Πώς απαντά ο Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Οι απαντήσεις δημοσιεύονται αμέσως με τον χρήστη του Baldrick, σε BBCode του φόρουμ. Οι σύνδεσμοι προς θέματα του φόρουμ είναι σχετικοί."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Όταν το μοντέλο ταξινόμησης είναι βέβαιο ότι μια ανάρτηση είναι spam (διαφημίσεις, τηλεφωνικοί αριθμοί, SEO συνδέσμοι...), ο Baldrick την αποσύρει: ολόκληρο το θέμα όταν είναι η πρώτη ανάρτηση. Οι αποσυρμένες αναρτήσεις περιμένουν έλεγχο, οπότε ένα λάθος αναιρείται εγκρίνοντάς τες."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Ειδοποιήσεις"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Ένα e-mail απλού κειμένου στέλνεται μέσω των ρυθμίσεων αλληλογραφίας του Joomla, με την πρώτη ανάρτηση του θέματος και τις τελευταίες 5 αναρτήσεις του, από τη νεότερη στην παλαιότερη. Οι ενέργειες spam και τα σφάλματα (ένα θέμα που εγκατέλειψε ο Baldrick, μια παύση επειδή ο πάροχος AI απορρίπτει τα αιτήματά του) ειδοποιούνται πάντα. Το αποτέλεσμα κάθε e-mail φαίνεται στο ημερολόγιο δραστηριότητας."

PLG_KUNENA_BALDRICK_PROVIDER = "Τύπος API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, και συμβατά με Anthropic endpoints, όπως το Qwen), ή OpenAI-compatible Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Συμβατό με Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Συμβατό με OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Βασική διεύθυνση"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Αφήστε κενό για το επίσημο API (https://api.anthropic.com ή https://api.openai.com/v1). Παραδείγματα για το Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (συμβατό με Anthropic) ή https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (συμβατό με OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Κενό: το επίσημο API"
PLG_KUNENA_BALDRICK_API_KEY = "Κλειδί API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Το κλειδί API του παρόχου. Ο Baldrick δεν κάνει τίποτα μέχρι να οριστούν κλειδί και μοντέλα."
PLG_KUNENA_BALDRICK_MODEL = "Μοντέλο"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Μοντέλο του βήματος ταξινόμησης, π.χ. claude-haiku-5-5. Το &quot;Λήψη μοντέλων&quot; εμφανίζει τα μοντέλα του παρόχου με τις τιμές παραπάνω (αποθηκευμένες ή όχι) σε λίστα με αναζήτηση (διατηρείται για μία ώρα· το &quot;Ανανέωση&quot; ζητά ξανά)· μπορείτε επίσης να πληκτρολογήσετε ένα όνομα. Το &quot;Δοκιμή&quot; στέλνει ένα μικρό αίτημα στο μοντέλο."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Μοντέλο του βήματος απάντησης, π.χ. claude-sonnet-5-5 (ή claude-opus-5-5 για τις καλύτερες απαντήσεις). Το &quot;Λήψη μοντέλων&quot; εμφανίζει τα μοντέλα του παρόχου· μπορείτε επίσης να πληκτρολογήσετε ένα όνομα. Το &quot;Δοκιμή&quot; στέλνει ένα μικρό αίτημα στο μοντέλο."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Λήψη μοντέλων"
PLG_KUNENA_BALDRICK_TEST = "Δοκιμή"
PLG_KUNENA_BALDRICK_WORKING = "Σε εξέλιξη..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Επιλέξτε μοντέλο -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Το αίτημα απέτυχε."
PLG_KUNENA_BALDRICK_PRICE_IN = "Τιμή: είσοδος"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Τιμή: έξοδος"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD ανά εκατομμύριο tokens, για τις εκτιμήσεις κόστους. Κενό: η τιμή καταλόγου για γνωστά μοντέλα Claude, αλλιώς 0 (εκτός αν ο πάροχος αναφέρει το ίδιο το κόστος)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Χρήση της σύνδεσης του βήματος 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Χρησιμοποιεί τον ίδιο τύπο API, βασική διεύθυνση και κλειδί με το βήμα ταξινόμησης (με το μοντέλο που επιλέγεται παρακάτω). Επιλέξτε Όχι για να χρησιμοποιήσετε άλλον πάροχο για τις απαντήσεις."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: εναλλακτικό μοντέλο σε περίπτωση άρνησης"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Μόνο στο ίδιο το API της Anthropic, με μοντέλα Opus/Sonnet 5.x: όταν οι έλεγχοι ασφαλείας του μοντέλου απορρίπτουν ένα αίτημα, το API το εκτελεί ξανά σε εναλλακτικό μοντέλο που επιλέγει η Anthropic (εναλλακτικά μοντέλα στον διακομιστή). Δεν είναι διαθέσιμο για το Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Δοκιμαστική λειτουργία"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Για δοκιμή της ρύθμισης: ο Baldrick απαντά μόνο σε θέματα που ξεκίνησαν από διαχειριστές και συντονιστές (νέα θέματα και οι συνέχειές τους προς τον Baldrick), και δεν αποσύρει ποτέ μηνύματα (το spam μόνο αναφέρεται)."
PLG_KUNENA_BALDRICK_USER = "Χρήστης του Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Ο χρήστης με τον οποίο δημοσιεύει ο Baldrick. Αφήστε κενό για να δημιουργηθεί αυτόματα ένας χρήστης &quot;Baldrick&quot; (χωρίς χρησιμοποιήσιμο κωδικό και χωρίς πραγματική διεύθυνση e-mail). Ορίστε το avatar και την υπογραφή του στο προφίλ του φόρουμ (ένας νέος χρήστης παίρνει την υπογραφή &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Αναβίωση μετά από (ημέρες)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Μια απάντηση σε θέμα του οποίου η προηγούμενη ανάρτηση είναι παλαιότερη από αυτόν τον αριθμό αντιμετωπίζεται ως νέα ερώτηση."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Απαντήσεις ανά θέμα"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Πόσες φορές μπορεί ο Baldrick να απαντήσει στο ίδιο θέμα: η πρώτη του απάντηση, και οι απαντήσεις του όταν ο δημιουργός του θέματος του απαντά (λεπτομέρειες που ζήτησε, μια περαιτέρω ερώτηση) ή όταν το θέμα αναβιώνει μετά από μεγάλη σιωπή."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Απαντήσεις ανά ημέρα"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Το πολύ τόσες απαντήσεις σε 24 ώρες (0: χωρίς όριο). Προστατεύει τον προϋπολογισμό API σας από κατακλυσμό."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Ελάχιστο μήκος μηνύματος"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Τα μηνύματα μικρότερα από αυτό (χαρακτήρες, χωρίς μορφοποίηση) αγνοούνται."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Μόνο σε αυτές τις κατηγορίες"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Απαντά μόνο σε αυτές τις κατηγορίες (καμία επιλογή: όλες οι κατηγορίες)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Ποτέ σε αυτές τις κατηγορίες"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Ποτέ δεν απαντά σε αυτές τις κατηγορίες."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Μόνο δημόσιες κατηγορίες"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Απαντά μόνο σε κατηγορίες που μπορούν να διαβάσουν οι επισκέπτες, ώστε να μη σταλεί ιδιωτικό περιεχόμενο στον πάροχο AI. Τα σχετικά θέματα προέρχονται πάντα μόνο από δημόσιες κατηγορίες."

PLG_KUNENA_BALDRICK_TRANSLATE = "Προσθήκη αγγλικής μετάφρασης"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Ο Baldrick απαντά στη γλώσσα του συντάκτη. Με αυτή την επιλογή, οι απαντήσεις σε άλλες γλώσσες ακολουθούνται από αγγλική μετάφραση (χρήσιμο για αγγλόφωνο προσωπικό και αναγνώστες)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Σχετικά θέματα"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Πόσα σχετικά δημόσια θέματα (που βρέθηκαν με τα ερωτήματα αναζήτησης του βήματος ταξινόμησης) δίνονται στο μοντέλο απάντησης."
PLG_KUNENA_BALDRICK_PRESET = "Ενσωματωμένο κύριο prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Οι οδηγίες από τις οποίες ξεκινά κάθε απάντηση (μόνο για ανάγνωση). Το πλαίσιο του ιστότοπού σας προστίθεται παρακάτω."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Πλαίσιο ιστότοπου"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Περί τίνος είναι το φόρουμ, προϊόντα και υποστηριζόμενες εκδόσεις, συνδέσμοι τεκμηρίωσης, ο τόνος που πρέπει να χρησιμοποιηθεί, τι δεν πρέπει ποτέ να κάνει ο Baldrick... Προστίθεται στις οδηγίες και των δύο βημάτων (βοηθά και το μοντέλο ταξινόμησης να ξεχωρίζει το spam από τις σχετικές αναρτήσεις)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "π.χ. Αυτό είναι το φόρουμ υποστήριξης της ExampleSoft. Υποστηρίζουμε τις εκδόσεις 3 και 4. Η τεκμηρίωση βρίσκεται στο https://docs.example.com. Ποτέ μην υπόσχεστε επιστροφές χρημάτων."
PLG_KUNENA_BALDRICK_CANNED = "Έτοιμες απαντήσεις"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Απαντήσεις σε ερωτήσεις που είναι πολύ γενικές (δεν γράφεται απάντηση AI), και εφεδρικές απαντήσεις όταν δεν μπορεί να γραφτεί απάντηση. Διαχωρίστε τις απαντήσεις με μια γραμμή από τρεις παύλες (---)· επιλέγεται μία τυχαία. Μεταβλητές: {name} (ο συντάκτης), {search_url} (αναζήτηση στο φόρουμ για την ερώτηση), {forum_url}, {topic_url}. Επιτρέπεται το BBCode του φόρουμ."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Τι να γίνεται όταν το μοντέλο ταξινόμησης είναι βέβαιο ότι μια ανάρτηση είναι spam. Στέλνεται e-mail και στις δύο πρώτες περιπτώσεις."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Απόσυρση (ολόκληρο το θέμα για πρώτη ανάρτηση) και ειδοποίηση"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Μόνο ειδοποίηση"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Αγνόηση"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Αξιόπιστος μετά από (μηνύματα)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Τα μηνύματα χρηστών με τουλάχιστον τόσα δημοσιευμένα μηνύματα, και του προσωπικού, δεν αποσύρονται ποτέ: μόνο αναφέρονται."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Ειδοποίηση σε αυτό το προσωπικό"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Υπερδιαχειριστές, διαχειριστές του Meela και συντονιστές που λαμβάνουν τις ειδοποιήσεις (Ctrl/Cmd+κλικ για να επιλέξετε περισσότερους)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Ειδοποίηση για"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Κάθε απάντηση που δημοσιεύει ο Baldrick (απαντήσεις, έτοιμες απαντήσεις, αιτήματα για λεπτομέρειες) και το spam, ή μόνο το spam. Τα σφάλματα ειδοποιούνται πάντα."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Κάθε απάντηση, spam και σφάλματα"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Μόνο spam και σφάλματα"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Ειδοποίηση σε αυτές τις διευθύνσεις"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Περισσότερες διευθύνσεις e-mail, χωρισμένες με κόμματα."

PLG_KUNENA_BALDRICK_PROCESSING = "Επεξεργασία"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Αυτόματη: αμέσως μετά τη σελίδα που έβαλε ένα θέμα στην ουρά (με PHP-FPM), ή με αίτημα παρασκηνίου προς τον ίδιο τον ιστότοπο. Μόνο γραμμή εντολών: εκτελέστε το &quot;php cli/joomla.php kunena:baldrick:process&quot; από το cron (Joomla 3.x UTD), π.χ. κάθε λεπτό."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Αυτόματη"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Μόνο από τη γραμμή εντολών (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Διατήρηση ημερολογίου δραστηριότητας (ημέρες)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Οι εγγραφές του ημερολογίου δραστηριότητας παλαιότερες από αυτόν τον αριθμό διαγράφονται. Τα μηνιαία σύνολα διατηρούνται για 36 μήνες."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Για προχωρημένους: επεξεργασία, όρια και χρονικά όρια"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Η δημοσίευση δεν περιμένει ποτέ την AI: τα θέματα μπαίνουν στην ουρά και επεξεργάζονται στο παρασκήνιο. Σφάλματα δικτύου, όρια ρυθμού και υπερφορτωμένοι πάροχοι επαναλαμβάνονται (μόλις το επιτρέψει ο πάροχος), και μετά το θέμα δοκιμάζεται ξανά αργότερα (3 προσπάθειες). Σφάλματα του λογαριασμού (άκυρο κλειδί, χωρίς credits, άγνωστο μοντέλο) βάζουν τον Baldrick σε παύση και ειδοποιούν τους παραλήπτες παραπάνω."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Χρονικό όριο σύνδεσης (δευτερόλεπτα)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Πόσο περιμένει ο πάροχος να δεχτεί τη σύνδεση. Σύντομο, ώστε τα προβλήματα δικτύου να φαίνονται γρήγορα."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Χρονικό όριο απάντησης ταξινόμησης (δευτερόλεπτα)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Πόσο περιμένει το σύστημα την πλήρη απάντηση του μοντέλου ταξινόμησης (είναι σύντομη)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Χρονικό όριο απάντησης (δευτερόλεπτα)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Πόσο περιμένει το σύστημα την πλήρη απάντηση του μοντέλου απάντησης. Οι απαντήσεις δεν μεταδίδονται σε ροή: αυτό καλύπτει τη συγγραφή ολόκληρης της απάντησης, και τα μοντέλα που σκέφτονται πρώτα μπορεί να χρειαστούν ένα λεπτό ή περισσότερο."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Μέγιστα tokens ταξινόμησης"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Μέγιστα tokens απάντησης"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Ανώτατο όριο της εξόδου του μοντέλου (συμπεριλαμβανομένου του συλλογισμού του, για μοντέλα που σκέφτονται). Αυξήστε το αν κόβονται οι απαντήσεις."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Μέγιστη αναμονή στην ουρά (ώρες)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Τα θέματα που περιμένουν ακόμα μετά από τόσο (π.χ. μετά από διακοπή του παρόχου) παραλείπονται: μια απάντηση μέρες αργότερα θα ήταν περίεργη. 0: χωρίς όριο."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Παύση μετά από σφάλματα λογαριασμού (λεπτά)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Μετά από μη έγκυρο κλειδί, εξαντλημένα credits ή ποσόστωση, ή άγνωστο μοντέλο, ο Baldrick μπαίνει σε παύση (τα θέματα της ουράς περιμένουν), στέλνει μία φορά ειδοποίηση e-mail στους παραλήπτες και δοκιμάζει ξανά μετά από τόσα λεπτά, μέχρι να απαντήσει ο πάροχος. Η αποθήκευση αυτών των ρυθμίσεων τερματίζει την παύση."
