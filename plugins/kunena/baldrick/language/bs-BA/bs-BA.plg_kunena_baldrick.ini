PLG_KUNENA_BALDRICK_PROCESSING = "Obrada"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatski: odmah nakon što je poslana stranica koja je temu stavila u red (s PHP-FPM) ili pozadinskim zahtjevom samoj stranici. Samo komandna linija: pokrenite &quot;php cli/joomla.php kunena:baldrick:process&quot; iz crona (Joomla 3.x UTD), npr. svake minute."
