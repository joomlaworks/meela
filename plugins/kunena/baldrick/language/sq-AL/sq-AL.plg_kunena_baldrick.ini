PLG_KUNENA_BALDRICK_MODEL = "Modeli"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modeli i hapit të klasifikimit, p.sh. claude-haiku-5-5. &quot;Merr modelet&quot; liston modelet e ofruesit me vlerat më sipër (të ruajtura ose jo) në një listë të kërkueshme (ruhet për një orë; &quot;Rifresko&quot; e kërkon sërish); mund të shkruani edhe një emër. &quot;Testo&quot; dërgon një kërkesë të vogël te modeli."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modeli i hapit të përgjigjes, p.sh. claude-sonnet-5-5 (ose claude-opus-5-5 për përgjigjet më të mira). &quot;Merr modelet&quot; liston modelet e ofruesit; mund të shkruani edhe një emër. &quot;Testo&quot; dërgon një kërkesë të vogël te modeli."
