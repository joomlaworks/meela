PLG_KUNENA_BALDRICK_LOG_DAYS = "Čuvaj dnevnik aktivnosti (dana)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Redovi dnevnika aktivnosti stariji od ovoga se brišu. Mjesečni zbirni podaci čuvaju se 36 mjeseci."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Napredno: obrada, ograničenja i vremenska ograničenja"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Objavljivanje nikad ne čeka AI: teme se stavljaju u red i obrađuju u pozadini. Mrežne greške, ograničenja brzine i preopterećeni pružatelji ponovno se pokušavaju (čim pružatelj dopusti), zatim se tema pokušava kasnije ponovno (3 pokušaja). Greške računa (neispravan ključ, nema kredita, nepoznat model) pauziraju Baldricka i obavješćuju gore navedene primatelje."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Vremensko ograničenje veze (sekunde)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Koliko dugo čekati da pružatelj prihvati vezu. Kratko, da se mrežni problemi brzo pokažu."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Vremensko ograničenje odgovora razvrstavanja (sekunde)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Koliko dugo čekati potpuni odgovor modela za razvrstavanje (on je kratak)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Vremensko ograničenje odgovora (sekunde)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Koliko dugo čekati potpuni odgovor modela za odgovore. Odgovori se ne prenose streamingom: ovo obuhvaća pisanje cijelog odgovora, a modeli koji najprije razmišljaju mogu trebati minutu ili više."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Najviše tokena razvrstavanja"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Najviše tokena odgovora"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Gornja granica izlaza modela (uključujući njegovo razmišljanje, za modele koji razmišljaju). Povećaj je ako su odgovori odsječeni."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Najduže čekanje u redu (sati)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Teme koje i nakon ovoga još čekaju (npr. nakon prekida rada pružatelja) preskaču se: odgovor nakon nekoliko dana bio bi čudan. 0: bez ograničenja."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pauza nakon grešaka računa (minute)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Nakon neispravnog ključa, iscrpljenih kredita ili kvote, ili nepoznatog modela, Baldrick se pauzira (teme u redu čekaju), jednom šalje e-poruku primateljima obavijesti i pokušava ponovno nakon ovoliko minuta dok pružatelj ne odgovori. Spremanje ovih postavki završava pauzu."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Osvježi"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Prikaži sve modele"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Uključi modele koji ne mogu pisati chat odgovore (ugradnje, govor, slike...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Upiši za pretragu modela"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Nijedan model ne odgovara"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Cijene su popunjene prema popisu pružatelja."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Obična pretraga: najnovijih objava za pretragu"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Bez indeksa punog teksta (SQLite, ili prije nego ga stvoriš u Meela > Baldrick AI) povezane teme pronalaze se čitanjem objava, oko 2,5 sekunde na 50.000 objava: pretražuje se samo ovoliko najnovijih objava (0: sve). S indeksom pretražuje se svaka objava."
