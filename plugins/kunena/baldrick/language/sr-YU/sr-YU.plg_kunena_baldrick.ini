PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Redovi evidencije aktivnosti stariji od ovoga se brišu. Mesečni zbirovi se čuvaju 36 meseci."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Napredno: obrada, ograničenja i vremenska ograničenja"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Objavljivanje nikada ne čeka na AI: teme se stavljaju u red i obrađuju u pozadini. Mrežne greške, ograničenja učestalosti i preopterećeni dobavljači se ponavljaju (čim to dobavljač dozvoli), a zatim se tema pokušava ponovo kasnije (3 pokušaja). Greške naloga (nevažeći ključ, nema kredita, nepoznat model) pauziraju Baldrick i obaveštavaju primaoce iznad."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Vremensko ograničenje veze (sekunde)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Koliko dugo se čeka da dobavljač prihvati vezu. Kratko, da se problemi sa mrežom brzo vide."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Vremensko ograničenje odgovora razvrstavanja (sekunde)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Koliko dugo se čeka na ceo odgovor modela za razvrstavanje (kratak je)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Vremensko ograničenje odgovora (sekunde)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Koliko dugo se čeka na ceo odgovor modela za odgovore. Odgovori se ne prenose u toku: ovo pokriva pisanje celog odgovora, a modelima koji prvo razmišljaju može biti potreban minut ili više."
