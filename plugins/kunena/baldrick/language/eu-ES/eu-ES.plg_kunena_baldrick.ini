PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Aurreratua: prozesatzea, mugak eta itxaron-denborak"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Argitaratzeak ez du inoiz AA-ren zain egoten: gaiak ilaran jartzen dira eta atzeko planoan prozesatzen dira. Sare-erroreak, abiadura-mugak eta gainkargatutako hornitzaileak berriro saiatzen dira (hornitzaileak onartzen duenean), gero gaia geroago saiatzen da berriro (3 saiakera). Kontuaren erroreek (gako baliogabea, kreditu faltak, eredu ezezaguna) Baldrick pausatzen dute eta goiko hartzaileei jakinarazten diete."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Konexioaren itxaron-denbora (segundo)"
