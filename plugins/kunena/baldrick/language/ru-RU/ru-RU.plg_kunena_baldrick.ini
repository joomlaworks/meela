PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Верхний предел вывода модели (включая её рассуждения, для моделей, которые рассуждают). Увеличьте его, если ответы обрываются."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Максимальное ожидание в очереди (часов)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Темы, которые ждут дольше этого срока (например, после сбоя поставщика), пропускаются: ответ через несколько дней был бы неуместен. 0: без ограничения."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Пауза после ошибок учётной записи (минут)"
