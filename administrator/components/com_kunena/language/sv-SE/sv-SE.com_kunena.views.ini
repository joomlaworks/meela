COM_KUNENA_A_POLL_ENABLED = "Aktiverad"
COM_KUNENA_A_POLL_NUMBER_OPTIONS = "Maximalt antal omröstnings alternativ"
COM_KUNENA_A_POLL_NUMBER_OPTIONS_DESC = "Ange antalet maximalt tillåtna fältalternativ för omröstningen när användare skapar ett nytt inlägg."
COM_KUNENA_A_POLL_NUMBER_VOTES_BY_DESC = "Ange det maximala antalet röster som tillåts för en användare. Om ett enda omröstning alternativet har aktiverats, ignoreras den här inställningen."
COM_KUNENA_A_POLL_NUMBER_VOTES_BY_USER = "Maximalt antal röster per användare"
COM_KUNENA_A_POLL_SHOW_USER_LIST = "Visa en lista på användare som har röstat"
