PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Публикация никогда не ждёт ИИ: темы ставятся в очередь и обрабатываются в фоне. Сетевые ошибки, ограничения частоты запросов и перегруженные поставщики повторяются (как только поставщик позволит), затем тема пробуется позже (3 попытки). Ошибки учётной записи (неверный ключ, нет кредитов, неизвестная модель) приостанавливают Baldrick и уведомляют получателей выше."
