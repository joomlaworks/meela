PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, המענה הראשון של הפורום בעזרת בינה מלאכותית: משיב לנושאים חדשים ולנושאים שהופעלו מחדש לאחר שתיקה ארוכה, כאשר אף מנהל או מפקח לא ענה, בעזרת API של Anthropic או API תואם OpenAI. <strong>פרטיות:</strong> הטקסט של הנושאים שהוא מטפל בהם (ושל נושאים ציבוריים קשורים) נשלח לספק הבינה המלאכותית שתגדיר; ציין זאת במדיניות הפרטיות שלך. פעילות, סיכומים ועלויות: Meela &gt; Baldrick AI."
