PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, првиот одговарач на форумот со вештачка интелигенција: одговара на нови теми и на теми оживеани по долго мирување кога ниту еден администратор или модератор не одговорил, користејќи API на Anthropic или компатибилни со OpenAI. <strong>Приватност:</strong> текстот на темите што ги обработува (и на сродните јавни теми) се праќа до давателот на вештачка интелигенција што го конфигурирате; спомнете го тоа во вашата политика за приватност. Активност, збирови и трошоци: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Чекор 1: модел за класификација (мал, евтин)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Прво го чита секое ново прашање: го оценува (може да се одговори, премногу широко, недостигаат детали, не е прашање, спам) и ги пишува пребарувањата за сродни теми. Доволен е мал, брз модел."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Чекор 2: модел за одговори (помоќен)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Го пишува одговорот на јасните прашања користејќи ја темата и сродните јавни теми пронајдени на форумот. Може да ја користи врската од чекор 1 со друг модел или своја врска."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Кога одговара Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick ја разгледува секоја нова тема, одговорите на започнувачот на темата до Baldrick (разговор) и одговорите на теми што биле тивки подолго од бројот дена подолу. Никогаш не одговара кога последната порака е од администратор или модератор."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Како одговара Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Одговорите се објавуваат веднаш како корисникот Baldrick, во BBCode на форумот. Врските до темите на форумот се релативни."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Спам"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Кога моделот за класификација е сигурен дека пораката е спам (реклами, телефонски броеви, SEO врски...), Baldrick ја повлекува: целата тема кога е прва порака. Повлечените пораки чекаат модерација, па грешката се поправа со нивно одобрување."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Известувања"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Се праќа е-пошта со обичен текст преку поставките за пошта на Joomla, со првата порака од темата и нејзините последни 5 пораки, најновите први. За акциите со спам и за грешките (тема од која Baldrick се откажал, пауза бидејќи давателот на вештачка интелигенција ги одбива неговите барања) секогаш се известува. Резултатот од секоја е-пошта е прикажан во дневникот на активности."

