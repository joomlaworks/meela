PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, pierwszy odpowiadający AI na forum: odpowiada w nowych wątkach i w wątkach wznowionych po długiej ciszy, gdy nie odpowiedział administrator ani moderator, korzystając z API Anthropic lub zgodnych z OpenAI. <strong>Prywatność:</strong> treść obsługiwanych przez niego wątków (i powiązanych publicznych wątków) jest wysyłana do skonfigurowanego dostawcy AI; wspomnij o tym w polityce prywatności. Działania, sumy i koszty: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Krok 1: model sortujący (mały, tani)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Najpierw czyta każde nowe pytanie: ocenia je (można odpowiedzieć, zbyt ogólne, brakuje szczegółów, to nie pytanie, spam) i przygotowuje zapytania wyszukiwania powiązanych wątków. Wystarczy mały, szybki model."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Krok 2: model odpowiedzi (bardziej zdolny)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Pisze odpowiedzi na jasne pytania, korzystając z wątku i powiązanych publicznych wątków znalezionych na forum. Może używać połączenia z kroku 1 z innym modelem albo własnego połączenia."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kiedy Baldrick odpowiada"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick sprawdza każdy nowy wątek, odpowiedzi autora wątku do Baldricka (rozmowę) oraz odpowiedzi w wątkach, które milczały dłużej niż liczba dni poniżej. Nigdy nie odpowiada, gdy ostatni post pochodzi od administratora lub moderatora."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Jak Baldrick odpowiada"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Odpowiedzi są publikowane od razu jako użytkownik Baldrick, w BBCode forum. Odnośniki do wątków forum są względne."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Gdy model sortujący jest pewny, że post to spam (reklama, numery telefonów, linki SEO...), Baldrick go ukrywa: cały wątek, jeśli to pierwszy post. Ukryte posty czekają na moderację, więc pomyłkę cofa ich zatwierdzenie."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Powiadomienia"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Zwykły tekst e-maila jest wysyłany przez ustawienia poczty Joomla: pierwszy post wątku i jego ostatnie 5 postów, od najnowszego. Działania przeciwko spamowi i błędy (wątek, z którego Baldrick zrezygnował, wstrzymanie z powodu odmów dostawcy AI) są zawsze zgłaszane. Wynik każdego e-maila widoczny jest w dzienniku działań."

PLG_KUNENA_BALDRICK_PROVIDER = "Typ API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Messages API Anthropic (Claude oraz punkty końcowe zgodne z Anthropic, np. Qwen) albo Chat Completions zgodne z OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Zgodny z Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Zgodny z OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Podstawowy adres URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Pozostaw puste dla oficjalnego API (https://api.anthropic.com lub https://api.openai.com/v1). Przykłady dla Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (zgodny z Anthropic) lub https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (zgodny z OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Puste: oficjalne API"
PLG_KUNENA_BALDRICK_API_KEY = "Klucz API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Klucz API dostawcy. Baldrick nic nie robi, dopóki nie zostaną ustawione klucz i modele."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model kroku sortowania, np. claude-haiku-5-5. &quot;Pobierz modele&quot; wyświetla listę modeli dostawcy z wartościami powyżej (zapisanymi lub nie) jako listę z wyszukiwaniem (przechowywana przez godzinę; &quot;Odśwież&quot; pobiera ją ponownie); możesz też wpisać nazwę. &quot;Test&quot; wysyła do modelu niewielkie zapytanie."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model kroku odpowiedzi, np. claude-sonnet-5-5 (lub claude-opus-5-5 dla najlepszych odpowiedzi). &quot;Pobierz modele&quot; wyświetla listę modeli dostawcy; możesz też wpisać nazwę. &quot;Test&quot; wysyła do modelu niewielkie zapytanie."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Pobierz modele"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Trwa praca..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Wybierz model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Żądanie nie powiodło się."
PLG_KUNENA_BALDRICK_PRICE_IN = "Cena: wejście"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cena: wyjście"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD za milion tokenów, do szacunków kosztów. Puste: cena z listy dla znanych modeli Claude, w przeciwnym razie 0 (chyba że dostawca sam podaje koszt)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Użyj połączenia z kroku 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Użyj tego samego typu API, podstawowego adresu URL i klucza co w kroku sortowania (z modelem wybranym poniżej). Wybierz Nie, aby do odpowiedzi użyć innego dostawcy."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: model zapasowy przy odmowach"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Tylko w oficjalnym API Anthropic z modelami Opus/Sonnet 5.x: gdy kontrole bezpieczeństwa modelu odrzucą żądanie, API ponawia je na modelu zapasowym wybranym przez Anthropic (zapasowe modele po stronie serwera). Niedostępne dla Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Tryb próbny"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Do sprawdzania konfiguracji: Baldrick odpowiada tylko w wątkach założonych przez administratorów i moderatorów (w nowych wątkach oraz w ich kontynuacjach z Baldrickiem) i nigdy nie ukrywa postów (spam jest tylko zgłaszany)."
PLG_KUNENA_BALDRICK_USER = "Użytkownik Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Użytkownik, jako który publikuje Baldrick. Pozostaw puste, aby automatycznie utworzyć użytkownika &quot;Baldrick&quot; (bez użytecznego hasła i prawdziwego adresu e-mail). Ustaw jego awatar i podpis w profilu forum (nowy użytkownik dostaje podpis &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Wznów po (dniach)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Odpowiedź w wątku, którego poprzedni post jest starszy niż ten okres, jest traktowana jak nowe pytanie."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Odpowiedzi w wątku"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Ile razy Baldrick może odpowiedzieć w tym samym wątku: pierwsza odpowiedź oraz odpowiedzi, gdy autor wątku odpowiada mu (wymagane szczegóły, kolejne pytanie) albo wątek zostaje wznowiony po długiej ciszy."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Odpowiedzi dziennie"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Najwyżej tyle odpowiedzi w ciągu 24 godzin (0: bez limitu). Chroni budżet API przed zalewem zapytań."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimalna długość postu"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Posty krótsze niż ta liczba (znaków, bez formatowania) są ignorowane."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Tylko w tych kategoriach"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Odpowiadaj tylko w tych kategoriach (jeśli nic nie wybrano: we wszystkich kategoriach)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nigdy w tych kategoriach"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nigdy nie odpowiadaj w tych kategoriach."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Tylko kategorie publiczne"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Odpowiadaj tylko w kategoriach, które mogą czytać goście, aby żadne prywatne treści nie trafiały do dostawcy AI. Powiązane wątki są zawsze pobierane wyłącznie z kategorii publicznych."

PLG_KUNENA_BALDRICK_TRANSLATE = "Dodawaj tłumaczenie na angielski"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick odpowiada w języku autora. Przy tej opcji odpowiedziom w innych językach towarzyszy tłumaczenie na angielski (przydatne dla anglojęzycznego personelu i czytelników)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Powiązane wątki"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Ile powiązanych publicznych wątków (znalezionych zapytaniami wyszukiwania z kroku sortowania) jest przekazywanych modelowi odpowiedzi."
PLG_KUNENA_BALDRICK_PRESET = "Wbudowany główny prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Instrukcje, od których zaczyna się każda odpowiedź (tylko do odczytu). Kontekst Twojej strony poniżej jest do nich dodawany."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontekst strony"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "O czym jest forum, jakie produkty i wersje są obsługiwane, odnośniki do dokumentacji, pożądany ton, czego Baldrick nigdy nie może robić... Dodawane do podpowiedzi obu kroków (pomaga też modelowi sortującemu odróżnić spam od postów na temat)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "np. To forum wsparcia ExampleSoft. Obsługujemy wersje 3 i 4. Dokumentacja znajduje się pod adresem https://docs.example.com. Nigdy nie obiecuj zwrotów."
PLG_KUNENA_BALDRICK_CANNED = "Gotowe odpowiedzi"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Odpowiedzi na zbyt ogólne pytania (nie pisze się wtedy odpowiedzi AI) oraz odpowiedzi awaryjne, gdy nie da się napisać odpowiedzi. Oddzielaj odpowiedzi linią trzech myślników (---); jedna jest wybierana losowo. Symbole zastępcze: {name} (autor), {search_url} (wyszukiwanie na forum dla pytania), {forum_url}, {topic_url}. Dozwolony jest BBCode forum."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Co zrobić, gdy model sortujący jest pewny, że post to spam. W obu pierwszych przypadkach wysyłany jest e-mail."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Ukryj (cały wątek dla pierwszego posta) i powiadom"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Tylko powiadom"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignoruj"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Zaufany po (postach)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Posty użytkowników z co najmniej tyloma opublikowanymi postami oraz personelu nigdy nie są ukrywane: są tylko zgłaszane."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Powiadamiaj tych członków personelu"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, administratorzy i moderatorzy Meela, którzy otrzymują powiadomienia (Ctrl/Cmd+klik, aby wybrać kilku)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Powiadamiaj o"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Każdej odpowiedzi, którą publikuje Baldrick (odpowiedzi, gotowe odpowiedzi, prośby o szczegóły), oraz spamie albo tylko o spamie. Błędy są zawsze zgłaszane."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Każdej odpowiedzi, spamie i błędach"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Tylko o spamie i błędach"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Powiadamiaj te adresy"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Dodatkowe adresy e-mail, oddzielone przecinkami."

PLG_KUNENA_BALDRICK_PROCESSING = "Przetwarzanie"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatyczne: zaraz po wysłaniu strony, która dodała wątek do kolejki (z PHP-FPM), albo żądaniem w tle do samej strony. Tylko wiersz poleceń: uruchamiaj z crona (Joomla 3.x UTD) &quot;php cli/joomla.php kunena:baldrick:process&quot;, np. co minutę."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatyczne"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Tylko wiersz poleceń (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Przechowuj dziennik działań (dni)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Wpisy dziennika działań starsze niż ten okres są usuwane. Miesięczne sumy są przechowywane przez 36 miesięcy."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Zaawansowane: przetwarzanie, limity i limity czasu"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Publikowanie nigdy nie czeka na AI: wątki trafiają do kolejki i są przetwarzane w tle. Błędy sieci, limity częstotliwości i przeciążeni dostawcy są ponawiane (gdy tylko dostawca na to pozwoli), a potem wątek jest próbowany ponownie później (3 próby). Błędy konta (nieprawidłowy klucz, brak środków, nieznany model) wstrzymują Baldricka i powiadamiają wyżej wymienionych odbiorców."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Limit czasu połączenia (sekundy)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Jak długo czekać, aż dostawca przyjmie połączenie. Krótki czas, aby problemy z siecią były widoczne szybko."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Limit czasu odpowiedzi sortowania (sekundy)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Jak długo czekać na pełną odpowiedź modelu sortującego (jest krótka)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Limit czasu odpowiedzi (sekundy)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Jak długo czekać na pełną odpowiedź modelu odpowiedzi. Odpowiedzi nie są przesyłane strumieniowo: ten czas obejmuje napisanie całej odpowiedzi, a modele, które najpierw „myślą”, mogą potrzebować minuty lub dłużej."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maksymalna liczba tokenów sortowania"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maksymalna liczba tokenów odpowiedzi"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Górny limit wyjścia modelu (wliczając jego rozumowanie, w przypadku modeli, które rozumują). Zwiększ go, jeśli odpowiedzi są ucinane."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maksymalny czas oczekiwania w kolejce (godziny)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Wątki, które czekają dłużej niż ten czas (np. po awarii dostawcy), są pomijane: odpowiedź po kilku dniach byłaby nie na miejscu. 0: bez limitu."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Wstrzymanie po błędach konta (minuty)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Po nieprawidłowym kluczu, wyczerpanych środkach lub limicie albo nieznanym modelu Baldrick wstrzymuje działanie (wątki w kolejce czekają), raz wysyła powiadomienie e-mailem do odbiorców i ponawia próbę po tylu minutach, aż dostawca odpowie. Zapisanie tych ustawień kończy wstrzymanie."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Odśwież"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Pokaż wszystkie modele"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Uwzględnij modele, które nie potrafią pisać odpowiedzi w czacie (osadzenia, mowa, obrazy...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Wpisz, aby wyszukać modele"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Brak pasujących modeli"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Ceny uzupełniono z listy dostawcy."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Zwykłe wyszukiwanie: ile najnowszych postów przeszukać"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Bez indeksu pełnotekstowego (SQLite lub dopóki nie utworzysz go w Meela > Baldrick AI) powiązane wątki są wyszukiwane przez czytanie postów, około 2,5 sekundy na 50 000 postów: przeszukiwana jest tylko tyle najnowszych postów (0: wszystkie). Z indeksem przeszukiwane są wszystkie posty."
