COM_KUNENA_BALDRICK_MAIL_PAUSED_BODY = "Baldrick AI har sat sig selv på pause, fordi AI-udbyderen afviste dens forespørgsler med en fejl, der ikke forsvinder af sig selv:\n\n%s\n\nAlmindelige årsager: en ugyldig eller udløbet API-nøgle, ingen kreditter eller kvote tilbage, eller en model eller basis-URL, der ikke findes.\n\nTråde i køen bliver gemt. Baldrick prøver igen hvert %d. minut og genoptages af sig selv, når udbyderen svarer; gemmer du pluginnets indstillinger, afbrydes pausen med det samme. Du får ikke endnu en e-mail om denne pause.\n\nAktivitet og indstillinger: %s"
