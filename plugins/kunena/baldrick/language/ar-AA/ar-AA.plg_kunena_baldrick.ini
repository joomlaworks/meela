PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick، أول من يجيب بالذكاء الاصطناعي في المنتدى: يرد على المواضيع الجديدة والمواضيع التي عادت بعد صمت طويل، حين لا يكون قد أجاب مدير أو مشرف، باستخدام واجهات Anthropic أو واجهات متوافقة مع OpenAI. <strong>الخصوصية:</strong> يُرسل نص المواضيع التي يعالجها (ونص المواضيع العامة ذات الصلة) إلى مزود الذكاء الاصطناعي الذي تضبطه؛ اذكر ذلك في سياسة الخصوصية لديك. النشاط والمجاميع والتكاليف: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "الخطوة 1: نموذج الفرز (صغير ورخيص)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "يقرأ كل سؤال جديد أولا: يصنّفه (قابل للإجابة، واسع جدا، ينقصه تفاصيل، ليس سؤالا، بريد مزعج) ويكتب عبارات البحث عن المواضيع ذات الصلة. يكفي نموذج صغير وسريع."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "الخطوة 2: نموذج الإجابة (أكثر قدرة)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "يكتب الإجابة على الأسئلة الواضحة، مستعينا بالموضوع والمواضيع العامة ذات الصلة في المنتدى. يستطيع استخدام اتصال الخطوة 1 بنموذج آخر، أو اتصال خاص به."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "متى يرد Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "ينظر Baldrick في كل موضوع جديد، وفي ردود صاحب الموضوع عليه (حوار)، وفي الردود على المواضيع التي صمتت أكثر من عدد الأيام أدناه. لا يرد أبدا عندما تكون آخر مشاركة من مدير أو مشرف."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "كيف يرد Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "تُنشر الردود فورا باسم مستخدم Baldrick، بتنسيق BBCode الخاص بالمنتدى. روابط مواضيع المنتدى نسبية."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "البريد المزعج"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "عندما يكون نموذج الفرز واثقا أن المشاركة بريد مزعج (إعلانات، وأرقام هواتف، وروابط SEO...)، يسحبها Baldrick من النشر: الموضوع كله إن كانت أول مشاركة فيه. تنتظر المشاركات المسحوبة من النشر الإشراف، فيُصحَّح الخطأ بالموافقة عليها."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "الإشعارات"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "يُرسل بريد نصي عادي عبر إعدادات البريد في Joomla، يحوي أول مشاركة في الموضوع وآخر 5 مشاركات، الأحدث أولا. إجراءات البريد المزعج والأخطاء (موضوع تخلى عنه Baldrick، أو إيقاف مؤقت لأن مزود الذكاء الاصطناعي يرفض طلباته) تُرسل دائما. تظهر نتيجة كل رسالة في سجل النشاط."

PLG_KUNENA_BALDRICK_PROVIDER = "نوع الواجهة"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "واجهة Anthropic Messages API (Claude، ونقاط نهاية متوافقة مع Anthropic مثل Qwen)، أو Chat Completions المتوافقة مع OpenAI (OpenAI وQwen/DashScope وOpenRouter وDeepSeek وOllama وvLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "متوافقة مع Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "متوافقة مع OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "عنوان URL الأساسي"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "اتركه فارغا للواجهة الرسمية (https://api.anthropic.com أو https://api.openai.com/v1). أمثلة لـ Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (متوافق مع Anthropic) أو https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (متوافق مع OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "فارغ: الواجهة الرسمية"
PLG_KUNENA_BALDRICK_API_KEY = "مفتاح API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "مفتاح API الخاص بالمزود. لا يفعل Baldrick شيئا حتى يُضبط المفتاح والنماذج."
PLG_KUNENA_BALDRICK_MODEL = "النموذج"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "نموذج خطوة الفرز، مثل claude-haiku-5-5. يعرض «جلب النماذج» نماذج المزود بالقيم أعلاه (محفوظة أو غير محفوظة) في قائمة قابلة للبحث (تُحفظ ساعة؛ و«تحديث» يطلبها من جديد)، ويمكنك أيضا كتابة الاسم. يرسل «اختبار» طلبا صغيرا إلى النموذج."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "نموذج خطوة الإجابة، مثل claude-sonnet-5-5 (أو claude-opus-5-5 لأفضل الإجابات). يعرض «جلب النماذج» نماذج المزود، ويمكنك أيضا كتابة الاسم. يرسل «اختبار» طلبا صغيرا إلى النموذج."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "جلب النماذج"
PLG_KUNENA_BALDRICK_TEST = "اختبار"
PLG_KUNENA_BALDRICK_WORKING = "جارٍ العمل..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- اختر نموذجا -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "فشل الطلب."
PLG_KUNENA_BALDRICK_PRICE_IN = "السعر: الإدخال"
PLG_KUNENA_BALDRICK_PRICE_OUT = "السعر: الإخراج"
PLG_KUNENA_BALDRICK_PRICE_DESC = "دولار أمريكي لكل مليون رمز، لتقديرات التكلفة. فارغ: سعر القائمة للنماذج المعروفة من Claude، وإلا 0 (ما لم يُبلغ المزود بالتكلفة بنفسه)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "استخدم اتصال الخطوة 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "استخدم نوع الواجهة وعنوان URL الأساسي والمفتاح نفسها لخطوة الفرز (مع النموذج المختار أدناه). اختر «لا» لاستخدام مزود آخر للإجابات."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: بديل عند الرفض"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "فقط على واجهة Anthropic نفسها مع نماذج Opus/Sonnet 5.x: عندما ترفض فحوص السلامة في النموذج طلبا، تُعيد الواجهة تشغيله على نموذج بديل تختاره Anthropic (بدائل من جانب الخادم). غير متاح لـ Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "تجربة بدون تنفيذ"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "لاختبار الإعدادات: يرد Baldrick فقط في المواضيع التي يبدؤها المديرون والمشرفون (المواضيع الجديدة، ومتابعاتهم لـ Baldrick)، ولا يسحب أي مشاركة من النشر أبدا (يُبلَّغ عن البريد المزعج فقط)."
PLG_KUNENA_BALDRICK_USER = "مستخدم Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "المستخدم الذي ينشر باسمه Baldrick. اتركه فارغا لإنشاء مستخدم «Baldrick» تلقائيا (بلا كلمة مرور قابلة للاستخدام ولا عنوان بريد حقيقي). اضبط صورته الرمزية وتوقيعه في ملفه الشخصي في المنتدى (يحصل المستخدم الجديد على التوقيع \"Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)\")."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "إحياء بعد (أيام)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "يُعامَل الرد على موضوع كانت آخر مشاركة فيه أقدم من هذا العدد كسؤال جديد."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "الردود في الموضوع الواحد"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "كم مرة يجوز لـ Baldrick أن يرد في الموضوع نفسه: ردّه الأول، وإجاباته عندما يرد صاحب الموضوع عليه (تفاصيل طلبها، أو سؤال آخر)، أو عندما يُحيا الموضوع بعد صمت طويل."
PLG_KUNENA_BALDRICK_DAILY_CAP = "الردود في اليوم"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "عدد أقصى من الردود خلال 24 ساعة (0: بلا حد). يحمي ميزانية API من الطوفان."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "الحد الأدنى لطول المشاركة"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "تُتجاهل المشاركات الأقصر من هذا (بالأحرف، دون التنسيق)."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "هذه الأقسام فقط"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "يرد فقط في هذه الأقسام (إن لم يُحدَّد أي قسم: كل الأقسام)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "ليس في هذه الأقسام أبدا"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "لا يرد أبدا في هذه الأقسام."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "الأقسام العامة فقط"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "يرد فقط في الأقسام التي يستطيع الزوار قراءتها، حتى لا يُرسل أي محتوى خاص إلى مزود الذكاء الاصطناعي. تُؤخذ المواضيع ذات الصلة من الأقسام العامة فقط دائما."

PLG_KUNENA_BALDRICK_TRANSLATE = "أضف ترجمة إنجليزية"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "يرد Baldrick بلغة كاتب المشاركة. مع هذا الخيار تُتبع الردود بلغات أخرى بترجمة إنجليزية (مفيدة لطاقم وقراء يتحدثون الإنجليزية)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "المواضيع ذات الصلة"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "عدد المواضيع العامة ذات الصلة (التي تُوجد بعبارات البحث في خطوة الفرز) التي تُعطى لنموذج الإجابة."
PLG_KUNENA_BALDRICK_PRESET = "التعليمات الرئيسية المدمجة"
PLG_KUNENA_BALDRICK_PRESET_DESC = "التعليمات التي تبدأ منها كل إجابة (للقراءة فقط). يُضاف إليها سياق موقعك أدناه."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "سياق الموقع"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "عمّا يدور المنتدى، والمنتجات والإصدارات المدعومة، وروابط الوثائق، والنبرة المطلوبة، وما يجب على Baldrick ألا يفعله أبدا... تُضاف إلى تعليمات الخطوتين (ويساعد نموذج الفرز أيضا على التمييز بين البريد المزعج والمشاركات في الموضوع)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "مثلا: هذا منتدى الدعم لشركة ExampleSoft. ندعم الإصدارين 3 و4. الوثائق على https://docs.example.com. لا تَعِد أبدا باسترداد الأموال."
PLG_KUNENA_BALDRICK_CANNED = "الردود الجاهزة"
PLG_KUNENA_BALDRICK_CANNED_DESC = "ردود على الأسئلة الواسعة جدا (لا تُكتب فيها إجابة بالذكاء الاصطناعي)، وبدائل عندما تتعذر كتابة إجابة. افصل بين الردود بسطر من ثلاث شرطات (---)؛ يُختار أحدها عشوائيا. المتغيرات: {name} (كاتب المشاركة)، {search_url} (البحث في المنتدى عن السؤال)، {forum_url}، {topic_url}. يُسمح بـ BBCode الخاص بالمنتدى."

