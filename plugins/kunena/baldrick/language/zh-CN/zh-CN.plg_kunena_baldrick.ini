PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick，论坛的 AI 首位应答者：当没有管理员或版主作答时，它会回复新主题以及沉寂很久后重新活跃的主题，使用 Anthropic 或兼容 OpenAI 的 API。<strong>隐私：</strong>它所处理的主题文本（以及相关公开主题的文本）会被发送给您配置的 AI 服务商；请在您的隐私政策中说明。活动、合计和费用：Meela &gt; Baldrick AI。"

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "第 1 步：分类模型（小型、廉价）"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "先读取每个新问题：对其评级（可回答、过于宽泛、缺少细节、不是问题、垃圾信息），并为相关主题编写搜索查询。小型快速模型即可胜任。"
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "第 2 步：回答模型（能力更强）"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "为明确的问题撰写回答，使用主题以及论坛中找到的相关公开主题。它可以使用第 1 步的连接搭配另一个模型，也可以使用自己的连接。"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Baldrick 何时回复"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick 会查看每个新主题、主题发起人对 Baldrick 的回复（即对话），以及对沉寂时间超过下方天数的主题的回复。当最后一帖来自管理员或版主时，它从不回复。"
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Baldrick 如何回复"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "回复会立即以 Baldrick 用户的身份发布，使用论坛 BBCode。指向论坛主题的链接为相对链接。"
PLG_KUNENA_BALDRICK_SECTION_SPAM = "垃圾信息"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "当分类模型确信某帖是垃圾信息（广告、电话号码、SEO 链接……）时，Baldrick 会取消发布它：若是首帖，则取消整个主题。已取消发布的帖子会等待审核，因此若判断有误，批准它们即可撤销。"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "通知"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "通过 Joomla 的邮件设置发送纯文本电子邮件，包含主题的首帖及其最后 5 条帖子，最新的在前。垃圾信息操作和错误（Baldrick 放弃的主题，或因 AI 服务商拒绝请求而暂停）始终会通知。每封电子邮件的发送结果会显示在活动日志中。"

PLG_KUNENA_BALDRICK_PROVIDER = "API 类型"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API（Claude，以及兼容 Anthropic 的端点，如 Qwen 的端点），或兼容 OpenAI 的 Chat Completions（OpenAI、Qwen/DashScope、OpenRouter、DeepSeek、Ollama、vLLM……）。"
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "兼容 Anthropic（Messages API）"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "兼容 OpenAI（Chat Completions）"
PLG_KUNENA_BALDRICK_BASE_URL = "基础 URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "留空则使用官方 API（https://api.anthropic.com 或 https://api.openai.com/v1）。Qwen Cloud 示例：https://token-plan.maas.qwencloudapi.com/apps/anthropic（兼容 Anthropic）或 https://token-plan.maas.qwencloudapi.com/compatible-mode/v1（兼容 OpenAI）。"
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "留空：官方 API"
PLG_KUNENA_BALDRICK_API_KEY = "API 密钥"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "服务商的 API 密钥。在设置了密钥和模型之前，Baldrick 不会做任何事情。"
PLG_KUNENA_BALDRICK_MODEL = "模型"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "分类步骤所用的模型，例如 claude-haiku-5-5。“获取模型”会以上面的值（无论是否已保存）列出服务商的模型，形成可搜索的列表（保留一小时；“刷新”会重新获取）；您也可以直接输入名称。“测试”会向该模型发送一个很小的请求。"
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "回答步骤所用的模型，例如 claude-sonnet-5-5（若要获得最佳回答，可用 claude-opus-5-5）。“获取模型”会列出服务商的模型；您也可以直接输入名称。“测试”会向该模型发送一个很小的请求。"
PLG_KUNENA_BALDRICK_FETCH_MODELS = "获取模型"
PLG_KUNENA_BALDRICK_TEST = "测试"
PLG_KUNENA_BALDRICK_WORKING = "处理中……"
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- 选择模型 -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "请求失败。"
PLG_KUNENA_BALDRICK_PRICE_IN = "价格：输入"
PLG_KUNENA_BALDRICK_PRICE_OUT = "价格：输出"
PLG_KUNENA_BALDRICK_PRICE_DESC = "每百万令牌的美元价格，用于费用估计。留空：已知 Claude 模型使用标价，否则为 0（除非服务商自行报告费用）。"
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "使用第 1 步的连接"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "使用与分类步骤相同的 API 类型、基础 URL 和密钥（配合下方选择的模型）。选择“否”可为回答使用其他服务商。"
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic：拒绝时使用备用模型"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "仅适用于 Anthropic 自身的 API 以及 Opus/Sonnet 5.x 模型：当模型的安全检查拒绝某个请求时，API 会改用 Anthropic 选定的备用模型重新运行（服务端备用）。Haiku 不支持。"

PLG_KUNENA_BALDRICK_DRY_RUN = "试运行"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "用于测试配置：Baldrick 只在管理员和版主发起的主题中回复（新主题及其与 Baldrick 的后续讨论），且从不取消发布帖子（垃圾信息只会被报告）。"
PLG_KUNENA_BALDRICK_USER = "Baldrick 的用户"
PLG_KUNENA_BALDRICK_USER_DESC = "Baldrick 以之发帖的用户。留空则自动创建名为 &quot;Baldrick&quot; 的用户（无可用密码，无真实电子邮件地址）。请在其论坛资料中设置头像和签名（新用户获得的签名为 &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;）。"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "沉寂后重新激活（天）"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "对其上一帖早于此天数的主题的回复，将按新问题处理。"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "每个主题的回复数"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Baldrick 可在同一主题中回复的次数：首次回复，以及当主题发起人回复它时（它所请求的详细信息、进一步的问题）或主题在长期沉寂后重新激活时的回答。"
PLG_KUNENA_BALDRICK_DAILY_CAP = "每天回复数"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "24 小时内最多回复这么多条（0：不限）。防止 API 预算被大量请求耗尽。"
PLG_KUNENA_BALDRICK_MIN_LENGTH = "最短帖子长度"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "短于此长度（字符数，不含格式）的帖子将被忽略。"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "仅限这些版块"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "仅在这些版块中回复（未选择任何版块：所有版块）。"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "永不在这些版块中回复"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "永不在这些版块中回复。"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "仅公开版块"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "仅在游客可以阅读的版块中回复，以免任何非公开内容被发送给 AI 服务商。相关主题始终仅取自公开版块。"

PLG_KUNENA_BALDRICK_TRANSLATE = "添加英文翻译"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick 使用发帖人的语言回复。启用此选项后，非英文回复之后会附上英文翻译（适用于说英语的管理人员和读者）。"
PLG_KUNENA_BALDRICK_RETRIEVAL = "相关主题"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "将多少个相关的公开主题（通过分类步骤的搜索查询找到）提供给回答模型。"
PLG_KUNENA_BALDRICK_PRESET = "内置主提示词"
PLG_KUNENA_BALDRICK_PRESET_DESC = "每个回答都以之为起点的指令（只读）。您在下方填写的网站上下文会添加到其后。"
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "网站上下文"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "论坛的主题、支持的产品和版本、文档链接、应使用的语气、Baldrick 绝不能做的事……这些内容会添加到两个步骤的提示词中（它还有助于分类模型区分垃圾信息与切题的帖子）。"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "例如：这是 ExampleSoft 的支持论坛。我们支持版本 3 和 4。文档位于 https://docs.example.com。切勿承诺退款。"
PLG_KUNENA_BALDRICK_CANNED = "预设回复"
PLG_KUNENA_BALDRICK_CANNED_DESC = "对过于宽泛的问题的回复（不会写出 AI 回答），以及无法写出回答时的备用回复。用单独一行的三个连字符（---）分隔各条回复；将随机选取一条。占位符：{name}（发帖人）、{search_url}（针对该问题的论坛搜索）、{forum_url}、{topic_url}。允许使用论坛 BBCode。"

PLG_KUNENA_BALDRICK_SPAM_ACTION = "垃圾信息"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "当分类模型确信某帖是垃圾信息时要执行的操作。前两种情况下都会发送电子邮件。"
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "取消发布（若是首帖，则取消整个主题）并通知"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "仅通知"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "忽略"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "信任阈值（帖子数）"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "拥有至少这么多条已发布帖子的用户，以及管理人员的帖子，永远不会被取消发布：只会被报告。"

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "通知这些管理人员"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "接收通知的超级用户、Meela 管理员和版主（按住 Ctrl/Cmd 并点击可选择多个）。"
PLG_KUNENA_BALDRICK_NOTIFY_ON = "通知范围"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Baldrick 发布的每次回复（回答、预设回复、详细信息请求）以及垃圾信息，或仅垃圾信息。错误始终会通知。"
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "每次回复、垃圾信息和错误"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "仅垃圾信息和错误"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "通知这些地址"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "更多电子邮件地址，用逗号分隔。"

PLG_KUNENA_BALDRICK_PROCESSING = "处理"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "自动：在将主题加入队列的页面发送之后立即处理（使用 PHP-FPM 时），或由对网站自身的后台请求处理。仅命令行：在 cron 中运行 &quot;php cli/joomla.php kunena:baldrick:process&quot;（Joomla 3.x UTD），例如每分钟一次。"
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "自动"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "仅命令行（cron）"
PLG_KUNENA_BALDRICK_LOG_DAYS = "保留活动日志（天）"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "早于此天数的活动日志记录将被删除。每月合计保留 36 个月。"

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "高级：处理、限制和超时"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "发帖从不等待 AI：主题排队后在后台处理。网络错误、速率限制和过载的服务商会被重试（服务商允许时立即重试），之后主题会在稍后再次尝试（共 3 次尝试）。帐户错误（API 密钥无效、额度不足、模型未知）会暂停 Baldrick 并通知上述收件人。"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "连接超时（秒）"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "等待服务商接受连接的时长。时间较短，以便网络问题能够快速显示。"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "分类响应超时（秒）"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "等待分类模型完整回答的时长（回答很短）。"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "回答响应超时（秒）"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "等待回答模型完整回答的时长。回答不是流式输出的：这包括写完整个回复的时间，先进行思考的模型可能需要一分钟或更长时间。"
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "分类最大令牌数"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "回答最大令牌数"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "模型输出的上限（包括其思考过程，适用于会思考的模型）。如果回答被截断，请调高此值。"
PLG_KUNENA_BALDRICK_MAX_WAIT = "队列中的最长等待时间（小时）"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "等待超过此时长的主题（例如服务商中断之后）将被跳过：几天后才回复会显得奇怪。0：不限。"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "帐户错误后的暂停时长（分钟）"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "出现 API 密钥无效、额度或配额用尽或模型未知的情况时，Baldrick 会暂停（排队中的主题等待），向通知收件人发送一次电子邮件，并在此分钟数之后重试，直到服务商作出响应。保存这些设置会结束暂停。"
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "刷新"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "显示所有模型"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "包括无法撰写聊天回答的模型（嵌入、语音、图像……）"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "输入以搜索模型"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "没有匹配的模型"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "价格已从服务商的价目表中填入。"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "普通搜索：搜索的最新帖子数"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "没有全文索引时（SQLite，或在 Meela > Baldrick AI 中创建索引之前），相关主题通过读取帖子来查找，每 5 万条帖子约需 2.5 秒：只搜索这么多条最新的帖子（0：全部）。有索引时，搜索所有帖子。"
