PLG_KUNENA_BALDRICK_REQUEST_FAILED = "요청이 실패했습니다."
PLG_KUNENA_BALDRICK_PRICE_IN = "단가: 입력"
PLG_KUNENA_BALDRICK_PRICE_OUT = "단가: 출력"
PLG_KUNENA_BALDRICK_PRICE_DESC = "비용 추정에 쓰는 100만 토큰당 USD입니다. 비워 두면: 알려진 Claude 모델의 정가를 쓰고, 그 밖에는 0입니다(제공자가 비용을 직접 보고하지 않는 한)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "1단계의 연결 사용"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "분류 단계와 같은 API 유형, 기본 URL, 키를 사용합니다(아래에서 선택한 모델과 함께). 답변에 다른 제공자를 쓰려면 아니요를 선택하세요."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: 거부 시 대체 모델 사용"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Anthropic 자체 API에서 Opus/Sonnet 5.x 모델을 쓸 때만 해당합니다: 모델의 안전 검사가 요청을 거부하면, API는 Anthropic이 선택한 대체 모델로 요청을 다시 실행합니다(서버 측 대체). Haiku에서는 사용할 수 없습니다."

PLG_KUNENA_BALDRICK_DRY_RUN = "시험 실행"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "설정을 테스트하기 위한 옵션: Baldrick은 관리자와 모더레이터가 시작한 주제(새 주제와 Baldrick에 대한 후속 글)에서만 답하며, 게시물을 절대 비공개 처리하지 않습니다(스팸은 신고만 합니다)."
PLG_KUNENA_BALDRICK_USER = "Baldrick의 사용자"
PLG_KUNENA_BALDRICK_USER_DESC = "Baldrick이 게시물을 올리는 사용자입니다. 비워 두면 &quot;Baldrick&quot; 사용자가 자동으로 생성됩니다(사용 가능한 비밀번호와 실제 이메일 주소 없음). 포럼 프로필에서 아바타와 시그너처를 설정하세요(새 사용자는 시그너처 &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;를 받습니다)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "다시 활성화 기준(일)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "이전 게시물이 이 일수보다 오래된 주제에 대한 답글은 새 질문처럼 처리됩니다."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "주제당 답글 수"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Baldrick이 같은 주제에서 답할 수 있는 횟수입니다: 첫 답글, 그리고 주제 작성자가 Baldrick에게 답할 때(요청한 세부 정보, 추가 질문)나 오랫동안 잠잠했다가 다시 살아난 주제에 대한 답변."
PLG_KUNENA_BALDRICK_DAILY_CAP = "하루 답변 수"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "24시간 동안 최대 이 개수만큼만 답변합니다(0: 제한 없음). 과도한 요청으로부터 API 예산을 보호합니다."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "최소 게시물 길이"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "이보다 짧은 게시물(서식을 제외한 글자 수)은 무시합니다."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "다음 카테고리에서만"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "이 카테고리에서만 답합니다(아무것도 선택하지 않으면 모든 카테고리)."
