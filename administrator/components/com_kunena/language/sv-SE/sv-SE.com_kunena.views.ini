COM_KUNENA_A_IMGSIZE_DESC = "Maximal tillåtna bildfilstorlek för uppladdning. <strong>Du kan inte överstiga PHP uppladdningsgräns på post_max_size: %s & upload_max_filesize: %s </strong>. För att ändra PHP uppladdningsgränsen, kontrollera din php.ini (%s) inställningar."
COM_KUNENA_A_IMGTHUMBHEIGHT = "Höjd miniatyrbild"
COM_KUNENA_A_IMGTHUMBHEIGHT_DESC = "Höjd för den lagrade miniatyren av bilden. Visnings egenskaper för mallen kan variera från filens fysiska egenskaper."
COM_KUNENA_A_IMGTHUMBWIDTH = "Bredd miniatyrbild"
COM_KUNENA_A_IMGTHUMBWIDTH_DESC = "Bredd för den lagrade miniatyren av bilden. Visnings egenskaper för mallen kan variera från filens fysiska egenskaper."
COM_KUNENA_A_IMGWIDTH = "Maximal bildbredd"
COM_KUNENA_A_IMGWIDTH_DESC = "Större filer kommer fortfarande att vara uppladdade men nedskurna för att begränsa."
COM_KUNENA_A_KARMA = "Visa Karma indikator"
COM_KUNENA_A_KARMA_DESC = "Sätt till <em>Ja</em> för att visa användarens karma och relaterade knappar (öka / minska) om användarens statistik är aktiverade."
COM_KUNENA_A_KEYWORDS = "Tillåt nyckelord för ämnen."
COM_KUNENA_A_KEYWORDS_DESC = "Välj <em>Ja</em> för att tillåta nyckelord. Detta gör det möjligt för moderatorer att lägga till nyckelord i ämnet."
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT = "Session Lifetime"
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT_DESC = "Standard är 1800 [sekunder]. Session livstid (timeout) i sekunder liknar Joomla session livstid. Sessionens livslängd är viktigt för access rättighetens omräkning, vem som är online visning och ny indikator. När en session går ut efter denna tidsgräns, nyttjanderätt och den NYA indikatorn återställs."
COM_KUNENA_A_LATESTCATEGORY = "Kategorilista i aktuella ämnen"
COM_KUNENA_A_LATESTCATEGORY_DESC = "Välj alla kategorier som du vill visa eller gömma i aktuella ämnen."
COM_KUNENA_A_LATESTCATEGORY_IN = "Kategori filter i aktuella ämnen"
COM_KUNENA_A_LATESTCATEGORY_IN_DESC = "Välj om du vill visa eller dölja följande kategorier i aktuella ämnen."
COM_KUNENA_A_LENGTHS = "Längdinställningar"
COM_KUNENA_A_LOOKS = "Utseende och känsla"
COM_KUNENA_A_MAILADMIN = "E-post Administratörer"
COM_KUNENA_A_MAILADMIN_DESC = "Sätt till <em>Ej godkända inlägg</em> eller <em>Alla nya inlägg</em> om du vill att e-postaviseringar på nya inlägg ska sändas till Meela administratörerna."
COM_KUNENA_A_MESSAGES = "Meddelanden per sida"
