PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, prvi odgovarač foruma zasnovan na veštačkoj inteligenciji: odgovara na nove teme i na teme oživljene posle dugog ćutanja kada nijedan administrator ili moderator nije odgovorio, koristeći Anthropic ili API-je kompatibilne sa OpenAI. <strong>Privatnost:</strong> tekst tema koje obrađuje (i srodnih javnih tema) šalje se dobavljaču veštačke inteligencije koji podesite; pomenite to u svojoj politici privatnosti. Aktivnost, zbirovi i troškovi: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Korak 1: model za razvrstavanje (mali, jeftin)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Prvo čita svako novo pitanje: ocenjuje ga (može se odgovoriti, preširoko, nedostaju detalji, nije pitanje, spam) i piše upite za pretragu srodnih tema. Dovoljan je mali, brz model."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Korak 2: model za odgovore (sposobniji)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Piše odgovor na jasna pitanja koristeći temu i srodne javne teme pronađene na forumu. Može koristiti vezu iz koraka 1 sa drugim modelom, ili sopstvenu vezu."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kada Baldrick odgovara"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick razmatra svaku novu temu, odgovore pokretača teme Baldrick-u (razgovor) i odgovore na teme koje su ćutale duže od broja dana ispod. Nikada ne odgovara kada poslednja poruka potiče od administratora ili moderatora."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kako Baldrick odgovara"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Odgovori se objavljuju odmah kao Baldrick-ov korisnik, u BBCode-u foruma. Veze do tema foruma su relativne."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kada je model za razvrstavanje siguran da je poruka spam (reklame, brojevi telefona, SEO veze...), Baldrick je uklanja iz objavljenih: celu temu kada je u pitanju prva poruka. Neobjavljene poruke čekaju moderaciju, pa se greška ispravlja njihovim odobravanjem."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Obaveštenja"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "E-pošta u običnom tekstu šalje se preko Joomla postavki pošte, sa prvom porukom teme i njenih poslednjih 5 poruka, najnovije prvo. O radnjama nad spamom i greškama (tema od koje je Baldrick odustao, pauza jer dobavljač veštačke inteligencije odbija njegove zahteve) uvek se obaveštava. Rezultat svake e-pošte prikazan je u evidenciji aktivnosti."

PLG_KUNENA_BALDRICK_PROVIDER = "Tip API-ja"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude i krajnje tačke kompatibilne sa Anthropic, kao što su Qwen-ove), ili Chat Completions kompatibilan sa OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Kompatibilno sa Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Kompatibilno sa OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Osnovni URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Ostavite prazno za zvanični API (https://api.anthropic.com ili https://api.openai.com/v1). Primeri za Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (kompatibilno sa Anthropic) ili https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (kompatibilno sa OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Prazno: zvanični API"
