PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, forumets KI-førstesvarer: svarer på nye emner og på emner gjenopplivet etter lang stillhet når ingen administrator eller moderator har svart, ved hjelp av Anthropic- eller OpenAI-kompatible API-er. <strong>Personvern:</strong> teksten i emnene den håndterer (og relaterte offentlige emner) sendes til KI-leverandøren du konfigurerer; nevn dette i personvernerklæringen din. Aktivitet, totalt og kostnader: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Trinn 1: sorteringsmodell (liten, billig)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Leser hvert nytt spørsmål først: vurderer det (kan besvares, for bredt, mangler detaljer, ikke et spørsmål, spam) og skriver søkene for relaterte emner. En liten, rask modell er nok."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Trinn 2: svarmodell (mer kapabel)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Skriver svaret på klare spørsmål, ved hjelp av emnet og de relaterte offentlige emnene som finnes i forumet. Den kan bruke tilkoblingen fra trinn 1 med en annen modell, eller en egen tilkobling."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Når Baldrick svarer"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick ser på hvert nytt emne, på emnestarterens svar til Baldrick (en samtale), og på svar i emner som har vært stille lenger enn antallet dager nedenfor. Den svarer aldri når det siste innlegget er fra en administrator eller moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Slik svarer Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Svar publiseres umiddelbart som Baldricks bruker, i forumets BBCode. Lenker til forumemner er relative."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Når sorteringsmodellen er sikker på at et innlegg er spam (reklame, telefonnumre, SEO-lenker ...), avpubliserer Baldrick det: et helt emne når det er det første innlegget. Avpublisert innlegg venter på moderering, så en feil rettes ved å godkjenne dem."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Varsler"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "En e-post i ren tekst sendes via Joomlas e-postinnstillinger, med emnets første innlegg og dets siste 5 innlegg, nyeste først. Spamhandlinger og feil (et emne Baldrick ga opp, en pause fordi KI-leverandøren avviser forespørslene) varsles alltid. Resultatet av hver e-post vises i aktivitetsloggen."

PLG_KUNENA_BALDRICK_PROVIDER = "API-type"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, og Anthropic-kompatible endepunkter som Qwens), eller OpenAI-kompatible Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM ...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-kompatibel (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-kompatibel (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Grunn-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "La feltet stå tomt for det offisielle API-et (https://api.anthropic.com eller https://api.openai.com/v1). Eksempler for Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-kompatibel) eller https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-kompatibel)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Tomt: det offisielle API-et"
PLG_KUNENA_BALDRICK_API_KEY = "API-nøkkel"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Leverandørens API-nøkkel. Baldrick gjør ingenting før en nøkkel og modellene er satt."
PLG_KUNENA_BALDRICK_MODEL = "Modell"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modell for sorteringssteget, f.eks. claude-haiku-5-5. &quot;Hent modeller&quot; lister leverandørens modeller med verdiene over (lagret eller ikke) i en søkbar liste (lagres i en time; &quot;Oppdater&quot; henter på nytt); du kan også skrive et navn. &quot;Test&quot; sender en liten forespørsel til modellen."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modell for svarsteget, f.eks. claude-sonnet-5-5 (eller claude-opus-5-5 for de beste svarene). &quot;Hent modeller&quot; lister leverandørens modeller; du kan også skrive et navn. &quot;Test&quot; sender en liten forespørsel til modellen."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Hent modeller"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Jobber..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Velg en modell -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Forespørselen mislyktes."
PLG_KUNENA_BALDRICK_PRICE_IN = "Pris: inn"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Pris: ut"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per million tokens, til kostnadsanslagene. Tomt: listeprisen for kjente Claude-modeller, ellers 0 (med mindre leverandøren selv oppgir kostnaden)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Bruk tilkoblingen fra trinn 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Bruk samme API-type, grunn-URL og nøkkel som sorteringssteget (med modellen valgt nedenfor). Velg Nei for å bruke en annen leverandør til svarene."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: reserve ved avslag"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Bare på Anthropics eget API med Opus/Sonnet 5.x-modeller: når modellens sikkerhetssjekk avslår en forespørsel, kjøres den på nytt på en reservemodell valgt av Anthropic (reserver på tjenersiden). Ikke tilgjengelig for Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Prøvekjøring"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "For å teste oppsettet: Baldrick svarer bare i emner startet av administratorer og moderatorer (nye emner, og oppfølgingene deres til Baldrick), og avpubliserer aldri innlegg (spam rapporteres bare)."
PLG_KUNENA_BALDRICK_USER = "Baldricks bruker"
PLG_KUNENA_BALDRICK_USER_DESC = "Brukeren Baldrick skriver som. La feltet stå tomt for at en bruker &quot;Baldrick&quot; skal opprettes automatisk (ingen brukbart passord, ingen ekte e-postadresse). Angi profilbilde og signatur i forumprofilen (en ny bruker får signaturen &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Gjenoppliv etter (dager)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Et svar i et emne der forrige innlegg er eldre enn dette, behandles som et nytt spørsmål."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Svar per emne"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Hvor mange ganger Baldrick kan svare i samme emne: det første svaret, og svarene når emnestarteren svarer på det (detaljer den ba om, et nytt spørsmål), eller emnet gjenopplives etter lang stillhet."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Svar per dag"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Høyst så mange svar på 24 timer (0: ingen grense). Beskytter API-budsjettet ditt mot oversvømmelser."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minste lengde på innlegg"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Innlegg som er kortere enn dette (tegn, uten formatering), ignoreres."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Bare i disse kategoriene"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Svar bare i disse kategoriene (ingen valgt: alle kategorier)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Aldri i disse kategoriene"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Svar aldri i disse kategoriene."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Bare offentlige kategorier"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Svar bare i kategorier gjester kan lese, slik at intet privat innhold sendes til KI-leverandøren. Relaterte emner hentes alltid fra offentlige kategorier."

PLG_KUNENA_BALDRICK_TRANSLATE = "Legg til en engelsk oversettelse"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick svarer på innleggsskriverens språk. Med dette alternativet følges svar på andre språk av en engelsk oversettelse (nyttig for en engelskspråklig stab og lesere)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Relaterte emner"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Hvor mange relaterte offentlige emner (funnet med søkene fra sorteringssteget) som gis til svarmodellen."
PLG_KUNENA_BALDRICK_PRESET = "Innebygd hovedprompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Instruksjonene alle svar tar utgangspunkt i (skrivebeskyttet). Nettstedskonteksten din nedenfor legges til dem."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Nettstedskontekst"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Hva forumet handler om, produkter og versjoner som støttes, lenker til dokumentasjon, tonen som skal brukes, det Baldrick aldri må gjøre ... Legges til i instruksjonene for begge trinn (det hjelper også sorteringsmodellen å skille spam fra relevante innlegg)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "f.eks. Dette er støtteforumet for ExampleSoft. Vi støtter versjon 3 og 4. Dokumentasjonen finnes på https://docs.example.com. Lov aldri refusjon."
PLG_KUNENA_BALDRICK_CANNED = "Standardsvar"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Svar på spørsmål som er for brede (ingen KI-svar skrives), og reservesvar når intet svar kan skrives. Skill svarene med en linje med tre bindestreker (---); ett velges tilfeldig. Plassholdere: {name} (innleggsskriveren), {search_url} (forumsøk etter spørsmålet), {forum_url}, {topic_url}. Forumets BBCode er tillatt."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Hva som skal skje når sorteringsmodellen er sikker på at et innlegg er spam. En e-post sendes i de to første tilfellene."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Avpublisér (hele emnet for et første innlegg) og varsle"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Bare varsle"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorer"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Betrodd etter (innlegg)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Innlegg fra brukere med minst så mange publiserte innlegg, og fra staben, avpubliseres aldri: de rapporteres bare."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Varsle disse medlemmene av staben"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, Meela-administratorer og moderatorer som mottar varslene (Ctrl/Cmd+klikk for å velge flere)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Varsle om"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Hvert svar Baldrick legger inn (svar, standardsvar, forespørsler om detaljer) og spam, eller bare spam. Feil varsles alltid."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Hvert svar, spam og feil"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Bare spam og feil"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Varsle disse adressene"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Flere e-postadresser, skilt med komma."

PLG_KUNENA_BALDRICK_PROCESSING = "Behandling"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatisk: rett etter at siden som satte emnet i kø er sendt (med PHP-FPM), eller via en bakgrunnsforespørsel til nettstedet selv. Bare kommandolinjen: kjør \"php cli/joomla.php kunena:baldrick:process\" fra cron (Joomla 3.x UTD), f.eks. hvert minutt."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatisk"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Bare kommandolinjen (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Behold aktivitetsloggen (dager)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Rader i aktivitetsloggen som er eldre enn dette, slettes. Månedlige totaler beholdes i 36 måneder."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avansert: behandling, grenser og tidsavbrudd"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Publisering venter aldri på KI: emner settes i kø og behandles i bakgrunnen. Nettverksfeil, hastighetsgrenser og overbelastede leverandører forsøkes på nytt (så snart leverandøren tillater det), deretter forsøkes emnet igjen senere (3 forsøk). Kontofeil (ugyldig nøkkel, ingen kreditter, ukjent modell) setter Baldrick på pause og varsler mottakerne ovenfor."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Tidsavbrudd for tilkobling (sekunder)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Hvor lenge det skal ventes på at leverandøren godtar tilkoblingen. Kort, slik at nettverksproblemer vises raskt."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Sortering: tidsavbrudd for svar (sekunder)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Hvor lenge det skal ventes på sorteringsmodellens fullstendige svar (det er kort)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Svar: tidsavbrudd for svar (sekunder)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Hvor lenge det skal ventes på svarmodellens fullstendige svar. Svar strømmes ikke: dette gjelder hele svaret, og modeller som tenker først kan trenge et minutt eller mer."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Sortering: maks. tokens"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Svar: maks. tokens"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Øvre grense for modellens utdata (inkludert tenkingen, for modeller som tenker). Øk den hvis svar blir avkortet."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Lengste ventetid i køen (timer)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Emner som fortsatt venter etter så lang tid (f.eks. etter et driftsavbrudd hos leverandøren) hoppes over: et svar flere dager senere ville vært rart. 0: ingen grense."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pause etter kontofeil (minutter)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Etter en ugyldig nøkkel, brukte opp kreditter eller kvote, eller en ukjent modell, setter Baldrick seg på pause (køede emner venter), sender varsel til mottakerne én gang, og prøver igjen etter så mange minutter til leverandøren svarer. Å lagre innstillingene avslutter pausen."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Oppdater"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Vis alle modeller"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Ta med modeller som ikke kan skrive chatsvar (embeddings, tale, bilder ...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Skriv for å søke i modellene"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Ingen modeller samsvarer"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Prisene er fylt inn fra leverandørens liste."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Enkelt søk: siste innlegg som søkes i"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Uten fulltekstindeks (SQLite, eller før du oppretter den i Meela > Baldrick AI) finnes relaterte emner ved å lese innleggene, omtrent 2,5 sekunder per 50 000 innlegg: bare så mange av de siste innleggene søkes (0: alle). Med indeksen søkes alle innlegg."
