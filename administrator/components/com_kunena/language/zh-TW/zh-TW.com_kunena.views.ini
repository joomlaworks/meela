COM_KUNENA_A_CAPTCHA_POST_LIMIT = "會員驗證碼"
COM_KUNENA_A_CAPTCHA_POST_LIMIT_DESC = "輸入一個文章的數目。低於此閾值，所有會員都面臨的挑戰，希望通過CAPTCHA使垃圾郵件發送者找到更容易的目標。此設定不會影響受信任的會員，如版主或管理員。"
COM_KUNENA_A_CATEGORY_SUBSCRIPTIONS = "分類討論區訂閱"
COM_KUNENA_A_CATEGORY_SUBSCRIPTIONS_DESC = "該選項需要<em>允許分類訂閱 = 是</em>。如果設定為<em>郵件通知新主題</em>，只會通知訂閱者該分類的新主題；訂閱者不會接收到主題的回文，除非他們對主題單獨訂閱。如果設定為<em>郵件通知新帖</em>，會通知訂閱者訂閱的所有分類新帖。"
COM_KUNENA_A_CONFIG = "討論區設定"
COM_KUNENA_A_DELETEMESSAGE = "會員可以刪除自己的文章"
