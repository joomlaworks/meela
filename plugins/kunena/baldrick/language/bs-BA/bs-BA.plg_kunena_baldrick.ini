PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Redovi dnevnika aktivnosti stariji od ovoga se brišu. Mjesečni zbirovi čuvaju se 36 mjeseci."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Napredno: obrada, ograničenja i vremenska ograničenja"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Objavljivanje nikada ne čeka AI: teme se stavljaju u red i obrađuju u pozadini. Greške mreže, ograničenja brzine i preopterećeni provajderi se ponovo pokušavaju (čim provajder dozvoli), zatim se tema ponovo pokušava kasnije (3 pokušaja). Greške računa (nevažeći ključ, nema kredita, nepoznat model) pauziraju Baldricka i obavještavaju primaoce iznad."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Vremensko ograničenje veze (sekunde)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Koliko dugo čekati da provajder prihvati vezu. Kratko, da se problemi s mrežom brzo pokažu."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Vremensko ograničenje odgovora razvrstavanja (sekunde)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Koliko dugo čekati cijeli odgovor modela za razvrstavanje (kratak je)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Vremensko ograničenje odgovora (sekunde)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Koliko dugo čekati cijeli odgovor modela za odgovore. Odgovori se ne šalju strujanjem: ovo obuhvata pisanje cijelog odgovora, a modelima koji prvo razmišljaju može trebati minuta ili više."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maks. tokena razvrstavanja"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maks. tokena odgovora"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Gornja granica izlaza modela (uključujući njegovo razmišljanje, za modele koji razmišljaju). Povećajte ako se odgovori prekidaju."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maksimalno čekanje u redu (sati)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Teme koje i nakon toliko vremena još čekaju (npr. nakon prekida rada provajdera) se preskaču: odgovor nakon nekoliko dana bio bi čudan. 0: bez ograničenja."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pauza nakon grešaka računa (minute)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Nakon nevažećeg ključa, istrošenih kredita ili kvote, ili nepoznatog modela, Baldrick pauzira (teme u redu čekaju), jednom šalje e-mail primaocima obavijesti i pokušava ponovo nakon toliko minuta dok provajder ne odgovori. Spremanje ovih postavki okončava pauzu."
