COM_KUNENA_A_RSS_OLD_TITLES_DESC = "<u>No</u> - Els títols es mantindran intactes, es mostraran de la següent manera: \\'#títol de l'entrada#\\'<br/><u>Sí</u> - Els títols es mostraran de la següent manera:\\'Assumpte: #títol del tema# - Per: #autor#\\'"
