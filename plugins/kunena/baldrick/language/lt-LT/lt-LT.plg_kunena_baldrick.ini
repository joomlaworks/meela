PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Naudoti tą patį API tipą, bazinį URL ir raktą kaip rūšiavimo žingsnyje (su žemiau pasirinktu modeliu). Pasirinkite Ne, jei atsakymams norite naudoti kitą teikėją."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: atsarginis modelis atsisakymo atveju"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Tik Anthropic API su Opus/Sonnet 5.x modeliais: kai modelio saugos patikros atmeta užklausą, API ją paleidžia iš naujo su Anthropic parinktu atsarginiu modeliu (serverio pusės atsarginiai modeliai). Neprieinama Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Bandomasis režimas"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Konfigūracijai išbandyti: Baldrick atsako tik temose, kurias pradėjo administratoriai ir moderatoriai (naujose temose ir jų tolesniuose atsakymuose Baldrick), ir niekada nenustoja skelbti žinučių (apie šlamštą tik pranešama)."
PLG_KUNENA_BALDRICK_USER = "Baldrick naudotojas"
PLG_KUNENA_BALDRICK_USER_DESC = "Naudotojas, kuriuo Baldrick skelbia. Palikite tuščią, kad naudotojas &quot;Baldrick&quot; būtų sukurtas automatiškai (be tinkamo naudoti slaptažodžio, be tikro el. pašto adreso). Jo avatarą ir parašą nustatykite jo forumo profilyje (naujas naudotojas gauna parašą &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Atgaivinti po (dienų)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Atsakymas į temą, kurios ankstesnė žinutė senesnė nei tiek, traktuojamas kaip naujas klausimas."
