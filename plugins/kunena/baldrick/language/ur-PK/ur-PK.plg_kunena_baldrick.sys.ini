PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick، مجلس کا AI سے چلنے والا پہلا جواب دہندہ: نئے موضوعات اور طویل خاموشی کے بعد دوبارہ زندہ ہونے والے موضوعات کا جواب دیتا ہے جب کسی منتظم یا مبصر نے جواب نہ دیا ہو، Anthropic یا OpenAI سے ہم آہنگ API استعمال کرتے ہوئے۔ <strong>رازداری:</strong> جن موضوعات کو یہ سنبھالتا ہے ان کا متن (اور متعلقہ عوامی موضوعات کا) اس AI فراہم کنندہ کو بھیجا جاتا ہے جو آپ ترتیب دیتے ہیں؛ اپنی رازداری کی پالیسی میں اس کا ذکر کریں۔ سرگرمی، کل اور لاگتیں: Meela &gt; Baldrick AI۔"
