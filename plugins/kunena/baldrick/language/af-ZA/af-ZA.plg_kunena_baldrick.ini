PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, die forum se KI-eerste-reageerder: antwoord op nuwe gesprekke en op gesprekke wat ná 'n lang stilte herleef het wanneer geen administrateur of moderator geantwoord het nie, met Anthropic- of OpenAI-versoenbare API's. <strong>Privaatheid:</strong> die teks van die gesprekke wat hy hanteer (en van verwante openbare gesprekke) word na die KI-verskaffer gestuur wat jy opstel; noem dit in jou privaatheidsbeleid. Aktiwiteit, totale en koste: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Stap 1: triage-model (klein, goedkoop)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Lees elke nuwe vraag eerste: gradeer dit (beantwoordbaar, te wyd, besonderhede ontbreek, nie 'n vraag nie, strooipos) en skryf die soekvrae vir verwante gesprekke. 'n Klein, vinnige model is genoeg."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Stap 2: antwoordmodel (bekwamer)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Skryf die antwoord op duidelike vrae, met die gesprek en die verwante openbare gesprekke wat in die forum gevind is. Dit kan die verbinding van stap 1 met 'n ander model gebruik, of 'n eie verbinding."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Wanneer Baldrick antwoord"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick kyk na elke nuwe gesprek, na die gespreksbeginner se antwoorde aan Baldrick (’n gesprek), en na antwoorde op gesprekke wat langer as die aantal dae hieronder stil was. Hy antwoord nooit wanneer die laaste inskrywing van 'n administrateur of moderator kom nie."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Hoe Baldrick antwoord"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Antwoorde word dadelik as Baldrick se gebruiker gepubliseer, in forum-BBCode. Skakels na forumgesprekke is relatief."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Strooipos"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Wanneer die triage-model seker is dat 'n inskrywing strooipos is (advertensies, foonnommers, SEO-skakels...), publiseer Baldrick dit ongedaan: 'n hele gesprek wanneer dit die eerste inskrywing is. Ongepubliseerde inskrywings wag vir moderering, so 'n fout word herstel deur hulle goed te keur."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Kennisgewings"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "'n Gewone-teks-e-pos word deur Joomla se e-posinstellings gestuur, met die gesprek se eerste inskrywing en sy laaste 5 inskrywings, nuutste eerste. Strooiposaksies en foute (’n gesprek waarvan Baldrick afgesien het, 'n pouse omdat die KI-verskaffer sy versoeke weier) word altyd gemeld. Die uitslag van elke e-pos word in die aktiwiteitslogboek gewys."

PLG_KUNENA_BALDRICK_PROVIDER = "API-tipe"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, en Anthropic-versoenbare eindpunte soos dié van Qwen), of OpenAI-versoenbare Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-versoenbaar (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-versoenbaar (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Basis-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Laat leeg vir die amptelike API (https://api.anthropic.com of https://api.openai.com/v1). Voorbeelde vir Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-versoenbaar) of https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-versoenbaar)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Leeg: die amptelike API"
PLG_KUNENA_BALDRICK_API_KEY = "API-sleutel"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Die verskaffer se API-sleutel. Baldrick doen niks totdat 'n sleutel en die modelle gestel is nie."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model van die triage-stap, bv. claude-haiku-5-5. &quot;Haal modelle&quot; lys die verskaffer se modelle met die waardes hierbo (gestoor of nie) in 'n deursoekbare lys (vir 'n uur behou; &quot;Verfris&quot; vra weer); jy kan ook 'n naam intik. &quot;Toets&quot; stuur 'n klein versoek na die model."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model van die antwoordstap, bv. claude-sonnet-5-5 (of claude-opus-5-5 vir die beste antwoorde). &quot;Haal modelle&quot; lys die verskaffer se modelle; jy kan ook 'n naam intik. &quot;Toets&quot; stuur 'n klein versoek na die model."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Haal modelle"
PLG_KUNENA_BALDRICK_TEST = "Toets"
PLG_KUNENA_BALDRICK_WORKING = "Besig..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Kies 'n model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Die versoek het misluk."
PLG_KUNENA_BALDRICK_PRICE_IN = "Prys: invoer"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Prys: uitvoer"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per miljoen tekens, vir die koste-skattings. Leeg: die lysprys vir bekende Claude-modelle, andersins 0 (tensy die verskaffer self die koste rapporteer)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Gebruik die verbinding van stap 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Gebruik dieselfde API-tipe, basis-URL en sleutel as die triage-stap (met die model wat hieronder gekies word). Kies Nee om 'n ander verskaffer vir die antwoorde te gebruik."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: terugval by weiering"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Slegs op Anthropic se eie API met Opus/Sonnet 5.x-modelle: wanneer die model se veiligheidskontroles 'n versoek van die hand wys, voer die API dit weer uit op 'n terugvalmodel wat deur Anthropic gekies word (bedienerkant-terugvalle). Nie vir Haiku beskikbaar nie."

PLG_KUNENA_BALDRICK_DRY_RUN = "Proeflopie"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Vir die toets van die opstelling: Baldrick antwoord slegs in gesprekke wat deur administrateurs en moderators begin is (nuwe gesprekke, en hul opvolgings aan Baldrick), en publiseer nooit inskrywings ongedaan nie (strooipos word slegs gerapporteer)."
PLG_KUNENA_BALDRICK_USER = "Baldrick se gebruiker"
PLG_KUNENA_BALDRICK_USER_DESC = "Die gebruiker as wie Baldrick plaas. Laat leeg om 'n gebruiker &quot;Baldrick&quot; outomaties te laat skep (geen bruikbare wagwoord, geen regte e-posadres). Stel sy avatar en handtekening in sy forumprofiel (’n nuwe gebruiker kry die handtekening &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Laat herleef ná (dae)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "'n Antwoord op 'n gesprek waarvan die vorige inskrywing ouer as dit is, word soos 'n nuwe vraag hanteer."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Antwoorde per gesprek"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Hoeveel keer Baldrick in dieselfde gesprek mag antwoord: sy eerste antwoord, en sy antwoorde wanneer die gespreksbeginner hom antwoord (besonderhede waarvoor hy gevra het, 'n verdere vraag) of die gesprek ná 'n lang stilte herleef."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Antwoorde per dag"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Hoogstens soveel antwoorde in 24 uur (0: geen limiet). Beskerm jou API-begroting teen stortvloede."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimum lengte van inskrywing"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Inskrywings korter as dit (karakters, sonder formatering) word geïgnoreer."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Slegs hierdie kategorieë"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Antwoord slegs in hierdie kategorieë (niks gekies: alle kategorieë)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nooit in hierdie kategorieë"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Antwoord nooit in hierdie kategorieë nie."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Slegs openbare kategorieë"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Antwoord slegs in kategorieë wat gaste kan lees, sodat geen private inhoud na die KI-verskaffer gestuur word nie. Verwante gesprekke word altyd slegs uit openbare kategorieë geneem."

PLG_KUNENA_BALDRICK_TRANSLATE = "Voeg 'n Engelse vertaling by"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick antwoord in die plasser se taal. Met hierdie opsie word antwoorde in ander tale gevolg deur 'n Engelse vertaling (nuttig vir Engelssprekende personeel en lesers)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Verwante gesprekke"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Hoeveel verwante openbare gesprekke (gevind met die triage-stap se soekvrae) aan die antwoordmodel gegee word."
PLG_KUNENA_BALDRICK_PRESET = "Ingeboude hoofopdrag"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Die instruksies waarmee elke antwoord begin (slegs lees). Jou webwerfkonteks hieronder word daarby gevoeg."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Webwerfkonteks"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Waaroor die forum gaan, produkte en weergawes wat ondersteun word, skakels na dokumentasie, die toon om te gebruik, wat Baldrick nooit mag doen nie... Word by die opdragte van albei stappe gevoeg (dit help ook die triage-model om strooipos van onderwerpgebonde inskrywings te onderskei)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "bv. Dit is die ondersteuningsforum van ExampleSoft. Ons ondersteun weergawes 3 en 4. Die dokumentasie is by https://docs.example.com. Beloof nooit terugbetalings nie."
PLG_KUNENA_BALDRICK_CANNED = "Voorafgeskrewe antwoorde"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Antwoorde op vrae wat te wyd is (geen KI-antwoord word geskryf nie), en terugvalle wanneer geen antwoord geskryf kan word nie. Skei antwoorde met 'n reël van drie koppeltekens (---); een word ewekansig gekies. Plekhouers: {name} (die plasser), {search_url} (forumsoektog vir die vraag), {forum_url}, {topic_url}. Forum-BBCode word toegelaat."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Strooipos"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Wat om te doen wanneer die triage-model seker is dat 'n inskrywing strooipos is. 'n E-pos word in albei eerste gevalle gestuur."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Publiseer ongedaan (die hele gesprek by 'n eerste inskrywing) en stel in kennis"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Stel slegs in kennis"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignoreer"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Vertrou ná (inskrywings)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Inskrywings van gebruikers met minstens soveel gepubliseerde inskrywings, en van die personeel, word nooit ongepubliseer nie: hulle word slegs gerapporteer."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Stel hierdie personeellede in kennis"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, Meela-administrateurs en moderators wat die kennisgewings ontvang (Ctrl/Cmd+klik om verskeie te kies)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Stel in kennis oor"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Elke antwoord wat Baldrick plaas (antwoorde, voorafgeskrewe antwoorde, versoeke om besonderhede) en strooipos, of slegs strooipos. Foute word altyd gemeld."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Elke antwoord, strooipos en foute"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Slegs strooipos en foute"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Stel hierdie adresse in kennis"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Meer e-posadresse, deur kommas geskei."

PLG_KUNENA_BALDRICK_PROCESSING = "Verwerking"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Outomaties: dadelik nadat die bladsy wat 'n gesprek in die tou geplaas het, gestuur is (met PHP-FPM), of deur 'n agtergrondversoek aan die webwerf self. Slegs opdragreël: voer &quot;php cli/joomla.php kunena:baldrick:process&quot; vanaf cron uit (Joomla 3.x UTD), bv. elke minuut."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Outomaties"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Slegs opdragreël (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Hou die aktiwiteitslogboek (dae)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Rye van die aktiwiteitslogboek wat ouer as dit is, word uitgevee. Maandelikse totale word 36 maande behou."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Gevorderd: verwerking, limiete en tydsverloop"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Plasing wag nooit vir die KI nie: gesprekke word in die tou geplaas en op die agtergrond verwerk. Netwerkfoute, tempolimiete en oorlaaide verskaffers word weer probeer (sodra die verskaffer dit toelaat), dan word die gesprek later weer probeer (3 pogings). Foute van die rekening (ongeldige sleutel, geen krediete, onbekende model) pouseer Baldrick en stel die ontvangers hierbo in kennis."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Verbindingstydsverloop (sekondes)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Hoe lank om te wag dat die verskaffer die verbinding aanvaar. Kort, sodat netwerkprobleme gou wys."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Triage-reaksietydsverloop (sekondes)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Hoe lank om vir die triage-model se volledige antwoord te wag (dit is kort)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Antwoord-reaksietydsverloop (sekondes)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Hoe lank om vir die antwoordmodel se volledige antwoord te wag. Antwoorde word nie gestroom nie: dit dek die skryf van die hele antwoord, en modelle wat eers dink, kan 'n minuut of meer nodig hê."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maksimum tekens van triage"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maksimum tekens van antwoord"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Boonste limiet van die model se uitvoer (insluitend sy denke, vir modelle wat dink). Verhoog dit as antwoorde afgesny word."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maksimum wagtyd in die tou (ure)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Gesprekke wat ná hierdie tyd nog wag (bv. ná 'n onderbreking by die verskaffer) word oorgeslaan: 'n antwoord dae later sou vreemd wees. 0: geen limiet."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pouse ná rekeningfoute (minute)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Ná 'n ongeldige sleutel, uitgeputte krediete of kwota, of 'n onbekende model, pouseer Baldrick (gesprekke in die tou wag), stuur die kennisgewingontvangers een keer 'n e-pos, en probeer ná soveel minute weer totdat die verskaffer antwoord. As jy hierdie instellings stoor, eindig die pouse."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Verfris"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Wys alle modelle"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Sluit modelle in wat nie klets-antwoorde kan skryf nie (inbeddings, spraak, prente...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Tik om die modelle te deursoek"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Geen model pas nie"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Pryse ingevul uit die verskaffer se lys."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Gewone soektog: nuutste inskrywings deursoek"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Sonder 'n volteks-indeks (SQLite, of voordat jy dit in Meela > Baldrick AI skep) word verwante gesprekke gevind deur die inskrywings te lees, ongeveer 2,5 sekondes per 50 000 inskrywings: slegs soveel van die nuutste inskrywings word deursoek (0: almal). Met die indeks word elke inskrywing deursoek."
