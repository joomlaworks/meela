PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "Izvēlieties lietotāju grupas, kurām ir atļauts publicēt jaunu tēmu šajā kategorijā. Šis iestatījums ietekmē tikai lietotājus, kuriem jau ir lasīšanas piekļuve kategorijai. Viesi nevar veidot jaunas tēmas, ja vien neieslēdzat <em>Foruma konfigurācija > Drošība un moderēšana > Atļaut viesiem publicēt/rakstīt</em>. <br /><br /> <strong>Padoms:</strong> varat izvēlēties vairākas grupas, turot nospiestus taustiņus <em>Ctrl</em> vai <em>Shift</em>."
