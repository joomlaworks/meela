PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick، پاسخ‌دهنده اولیه هوش مصنوعی انجمن: به موضوع‌های جدید و موضوع‌هایی که پس از سکوت طولانی احیا شده‌اند، در صورتی که هیچ مدیر یا مدیر انجمنی پاسخ نداده باشد، با استفاده از APIهای Anthropic یا سازگار با OpenAI پاسخ می‌دهد. <strong>حریم خصوصی:</strong> متن موضوع‌هایی که رسیدگی می‌کند (و موضوع‌های عمومی مرتبط) به ارائه‌دهنده هوش مصنوعی‌ای که شما پیکربندی می‌کنید فرستاده می‌شود؛ این را در سیاست حریم خصوصی خود ذکر کنید. فعالیت، مجموع‌ها و هزینه‌ها: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "مرحله 1: مدل دسته‌بندی (کوچک، ارزان)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "هر پرسش جدید را ابتدا می‌خواند: آن را ارزیابی می‌کند (قابل پاسخ، بیش از حد کلی، جزئیات ناقص، پرسش نیست، اسپم) و پرسش‌های جستجو برای موضوع‌های مرتبط را می‌نویسد. یک مدل کوچک و سریع کافی است."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "مرحله 2: مدل پاسخ‌دهنده (توانمندتر)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "پاسخ پرسش‌های روشن را می‌نویسد، با استفاده از موضوع و موضوع‌های عمومی مرتبطی که در انجمن پیدا شده‌اند. می‌تواند از اتصال مرحله 1 با مدلی دیگر استفاده کند، یا اتصال مخصوص خود را داشته باشد."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "چه زمانی Baldrick پاسخ می‌دهد"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick هر موضوع جدید، پاسخ‌های شروع‌کننده موضوع به Baldrick (گفتگو) و پاسخ‌ها به موضوع‌هایی را که بیش از تعداد روز زیر ساکت بوده‌اند بررسی می‌کند. هنگامی که آخرین ارسال از طرف مدیر یا مدیر انجمن باشد هرگز پاسخ نمی‌دهد."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Baldrick چگونه پاسخ می‌دهد"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "پاسخ‌ها بلافاصله به‌عنوان کاربر Baldrick و با BBCode انجمن منتشر می‌شوند. پیوندها به موضوع‌های انجمن نسبی هستند."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "اسپم"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "هنگامی که مدل دسته‌بندی مطمئن باشد ارسالی اسپم است (تبلیغات، شماره تلفن، پیوندهای SEO...)، Baldrick آن را از انتشار خارج می‌کند: اگر اولین ارسال باشد کل موضوع. ارسال‌های منتشرنشده منتظر بررسی مدیریت می‌مانند، بنابراین اشتباه با تائید آنها جبران می‌شود."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "اعلان‌ها"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "یک ایمیل متنی ساده از طریق تنظیمات ایمیل Joomla فرستاده می‌شود، همراه با ارسال اول موضوع و 5 ارسال آخر آن، جدیدترین‌ها اول. اقدام‌های اسپم و خطاها (موضوعی که Baldrick از آن صرف‌نظر کرد، توقف به‌دلیل رد درخواست‌ها توسط ارائه‌دهنده هوش مصنوعی) همیشه اطلاع داده می‌شوند. نتیجه هر ایمیل در گزارش فعالیت نمایش داده می‌شود."

