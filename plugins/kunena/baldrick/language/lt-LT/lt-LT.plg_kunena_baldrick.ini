PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Atsakymo žingsnio modelis, pvz., claude-sonnet-5-5 (arba claude-opus-5-5 geriausiems atsakymams). &quot;Gauti modelius&quot; parodo teikėjo modelius; galite ir įvesti pavadinimą. &quot;Išbandyti&quot; nusiunčia modeliui mažytę užklausą."
