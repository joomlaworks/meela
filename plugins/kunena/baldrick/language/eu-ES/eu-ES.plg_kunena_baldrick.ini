PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Testu osoko indizerik gabe (SQLite, edo Meela > Baldrick AI atalean sortu aurretik) erlazionatutako gaiak mezuak irakurriz aurkitzen dira, 2,5 segundo inguru 50.000 mezuko: azken mezu hauetan bakarrik bilatzen da (0: guztiak). Indizearekin, mezu guztietan bilatzen da."
