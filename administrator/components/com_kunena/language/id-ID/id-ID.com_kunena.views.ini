COM_KUNENA_A_AVATARGALLERY = "Gunakan Galeri Avatar"
COM_KUNENA_A_AVATARGALLERY_DESC = "Set ke <em>Ya</em> Jika anda ingin pengguna terdaftar dapat memilih avatar di galeri yang anda berikan (/media/kunena/avatars/gallery)."
COM_KUNENA_A_AVATARUPLOAD = "Ijinkan Upload Avatar"
