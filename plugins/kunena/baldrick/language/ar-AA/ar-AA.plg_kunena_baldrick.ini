PLG_KUNENA_BALDRICK_PROCESSING = "المعالجة"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "تلقائيا: مباشرة بعد إرسال الصفحة التي أضافت الموضوع إلى القائمة (مع PHP-FPM)، أو بطلب خلفي إلى الموقع نفسه. من سطر الأوامر فقط: شغّل \"php cli/joomla.php kunena:baldrick:process\" من cron (Joomla 3.x UTD)، مثلا كل دقيقة."
