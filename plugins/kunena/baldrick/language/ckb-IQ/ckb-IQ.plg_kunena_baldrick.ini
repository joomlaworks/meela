PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "کەی Baldrick وەڵام دەداتەوە"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick سەیری هەموو بابەتێکی نوێ دەکات، وەڵامەکانی دەستپێکەری بابەت بۆ Baldrick (گفتوگۆیەک)، و وەڵام بۆ ئەو بابەتانەی لە ژمارەی ڕۆژی خوارەوە زیاتر بێدەنگ بوون. هەرگیز وەڵام نادات کاتێک دوایین بەشداری لە بەڕێوەبەر یان چاودێرەوە بێت."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "چۆن Baldrick وەڵام دەداتەوە"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "وەڵامەکان دەستبەجێ وەک بەکارهێنەری Baldrick بڵاو دەکرێنەوە، بە BBCode ی فۆرۆم. بەستەرەکان بۆ بابەتەکانی فۆرۆم نیسبین."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "سپام"
