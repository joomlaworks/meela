PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, el primer respondedor d'IA del fòrum: respon als temes nous i als temes reactivats després d'un llarg silenci quan cap administrador o moderador no ha contestat, usant APIs d'Anthropic o compatibles amb OpenAI. <strong>Privadesa:</strong> el text dels temes que tracta (i dels temes públics relacionats) s'envia al proveïdor d'IA que configureu; mencioneu-ho a la vostra política de privadesa. Activitat, totals i costos: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Pas 1: model de classificació (petit, econòmic)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Llegeix primer cada pregunta nova: la valora (resoluble, massa general, falten detalls, no és una pregunta, spam) i escriu les consultes de cerca per als temes relacionats. Amb un model petit i ràpid n'hi ha prou."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Pas 2: model de resposta (més capaç)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Escriu la resposta a les preguntes clares, usant el tema i els temes públics relacionats trobats al fòrum. Pot fer servir la connexió del pas 1 amb un altre model, o una connexió pròpia."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Quan respon Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick mira cada tema nou, les respostes de l'iniciador del tema a Baldrick (una conversa), i les respostes a temes que han estat en silenci més temps que el nombre de dies indicat a continuació. Mai no respon quan l'últim missatge és d'un administrador o moderador."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Com respon Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Les respostes es publiquen de seguida com a usuari de Baldrick, en BBCode del fòrum. Els enllaços als temes del fòrum són relatius."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Quan el model de classificació està segur que un missatge és spam (publicitat, números de telèfon, enllaços SEO...), Baldrick el despublica: tot el tema quan és el primer missatge. Els missatges despublicats esperen moderació, de manera que un error es desfà aprovant-los."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notificacions"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Es envia un correu de text pla amb la configuració de correu de Joomla, amb el primer missatge del tema i els seus últims 5 missatges, del més recent al més antic. Les accions de spam i els errors (un tema que Baldrick ha abandonat, una aturada perquè el proveïdor d'IA rebutja les peticions) es notifiquen sempre. El resultat de cada correu es mostra al registre d'activitat."

PLG_KUNENA_BALDRICK_PROVIDER = "Tipus d'API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "L'API de missatges d'Anthropic (Claude, i punts d'accés compatibles amb Anthropic com el de Qwen), o Chat Completions compatible amb OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Compatible amb Anthropic (API de missatges)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Compatible amb OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL base"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Deixeu-ho buit per a l'API oficial (https://api.anthropic.com o https://api.openai.com/v1). Exemples per a Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (compatible amb Anthropic) o https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (compatible amb OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Buit: l'API oficial"
PLG_KUNENA_BALDRICK_API_KEY = "Clau d'API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "La clau d'API del proveïdor. Baldrick no fa res fins que s'hagin definit una clau i els models."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model del pas de classificació, p. ex. claude-haiku-5-5. «Obté els models» llista els models del proveïdor amb els valors de dalt (desats o no) en una llista cercable (guardada una hora; «Actualitza» ho torna a demanar); també podeu escriure un nom. «Prova» envia una petició molt petita al model."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model del pas de resposta, p. ex. claude-sonnet-5-5 (o claude-opus-5-5 per a les millors respostes). «Obté els models» llista els models del proveïdor; també podeu escriure un nom. «Prova» envia una petició molt petita al model."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Obté els models"
PLG_KUNENA_BALDRICK_TEST = "Prova"
PLG_KUNENA_BALDRICK_WORKING = "Processant..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Trieu un model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "La petició ha fallat."
PLG_KUNENA_BALDRICK_PRICE_IN = "Preu: entrada"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Preu: sortida"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per milió de tokens, per a les estimacions de cost. Buit: el preu de llista dels models Claude coneguts, si no 0 (tret que el proveïdor informi del cost)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Fes servir la connexió del pas 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Fa servir el mateix tipus d'API, la mateixa URL base i la mateixa clau que el pas de classificació (amb el model escollit a continuació). Trieu No per fer servir un altre proveïdor per a les respostes."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: alternativa en cas de rebuig"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Només a l'API pròpia d'Anthropic amb models Opus/Sonnet 5.x: quan les comprovacions de seguretat del model rebutgen una petició, l'API la torna a executar amb un model alternatiu escollit per Anthropic (alternatives al servidor). No disponible per a Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Mode de prova"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Per provar la configuració: Baldrick només respon en temes iniciats per administradors i moderadors (temes nous, i les seves continuacions amb Baldrick), i mai despublica missatges (el spam només es notifica)."
PLG_KUNENA_BALDRICK_USER = "Usuari de Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "L'usuari amb què publica Baldrick. Deixeu-ho buit perquè es crei automàticament un usuari «Baldrick» (sense contrasenya utilitzable ni adreça de correu real). Definiu-ne l'avatar i la signatura al seu perfil del fòrum (un usuari nou rep la signatura «Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)»)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Reactiva després de (dies)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Una resposta a un tema el missatge anterior del qual és més antic que això es tracta com una pregunta nova."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Respostes per tema"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Quantes vegades pot respondre Baldrick al mateix tema: la seva primera resposta, i les seves respostes quan l'iniciador del tema li respon (detalls que ha demanat, una pregunta més) o quan el tema es reactiva després d'un llarg silenci."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Respostes per dia"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Com a màxim aquest nombre de respostes en 24 hores (0: sense límit). Protegeix el pressupost d'API de les avalanches."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Longitud mínima del missatge"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Els missatges més curts que això (caràcters, sense format) s'ignoren."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Només en aquestes categories"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Respon només en aquestes categories (cap seleccionada: totes les categories)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Mai en aquestes categories"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Mai no responguis en aquestes categories."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Només categories públiques"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Respon només en categories que els visitants poden llegir, de manera que cap contingut privat s'envia al proveïdor d'IA. Els temes relacionats s'agafen sempre només de categories públiques."

PLG_KUNENA_BALDRICK_TRANSLATE = "Afegeix una traducció a l'anglès"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick respon en la llengua de qui escriu. Amb aquesta opció, les respostes en altres llengües van seguides d'una traducció a l'anglès (útil per a un equip i lectors de parla anglesa)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Temes relacionats"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Quants temes públics relacionats (trobats amb les consultes de cerca del pas de classificació) es donen al model de resposta."
PLG_KUNENA_BALDRICK_PRESET = "Instrucció mestra integrada"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Les instruccions de les quals parteix cada resposta (només lectura). El context del vostre lloc, a continuació, s'hi afegeix."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Context del lloc"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "De què va el fòrum, productes i versions compatibles, enllaços a la documentació, el to que cal usar, el que Baldrick no ha de fer mai... S'afegeix a les instruccions dels dos passos (també ajuda el model de classificació a distingir el spam dels missatges del tema)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "p. ex. Aquest és el fòrum de suport de ExampleSoft. Donem suport a les versions 3 i 4. La documentació és a https://docs.example.com. No prometis mai reemborsaments."
PLG_KUNENA_BALDRICK_CANNED = "Respostes predeterminades"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Respostes a preguntes massa generals (no s'escriu cap resposta d'IA), i alternatives quan no es pot redactar cap resposta. Separeu les respostes amb una línia de tres guionets (---); se'n tria una a l'atzar. Marcadors: {name} (qui escriu), {search_url} (cerca del fòrum per a la pregunta), {forum_url}, {topic_url}. El BBCode del fòrum és permès."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Què fer quan el model de classificació està segur que un missatge és spam. En els dos primers casos s'envia un correu."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Despublica (tot el tema si és el primer missatge) i notifica"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Només notifica"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignora"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "De confiança després de (missatges)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Els missatges dels usuaris amb almenys aquest nombre de missatges publicats, i els de l'equip, no es despublican mai: només s'informa d'ells."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notifica aquests membres de l'equip"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Superusuaris, administradors de Meela i moderadors que reben les notificacions (Ctrl/Cmd + clic per triar-ne diversos)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notifica sobre"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Cada resposta que publica Baldrick (respostes, respostes predeterminades, peticions de detalls) i el spam, o només el spam. Els errors sempre es notifiquen."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Cada resposta, spam i errors"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Només spam i errors"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notifica aquestes adreces"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Més adreces de correu, separades per comes."

PLG_KUNENA_BALDRICK_PROCESSING = "Processament"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automàtic: just després que s'hagi enviat la pàgina que ha posat un tema a la cua (amb PHP-FPM), o mitjançant una petició en segon pla al mateix lloc. Només línia d'ordres: executeu «php cli/joomla.php kunena:baldrick:process» des de cron (Joomla 3.x UTD), p. ex. cada minut."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automàtic"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Només des de la línia d'ordres (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Conserva el registre d'activitat (dies)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Les files del registre d'activitat més antigues que això s'eliminen. Els totals mensuals es conserven durant 36 mesos."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avançat: processament, límits i temps d'espera"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "La publicació no espera mai la IA: els temes es posen a la cua i es processen en segon pla. Els errors de xarxa, els límits de peticions i els proveïdors saturats es tornen a provar (tan aviat com el proveïdor ho permeti), i després el tema es torna a provar més tard (3 intents). Els errors del compte (clau no vàlida, sense crèdits, model desconegut) aturen Baldrick i notifiquen els destinataris de dalt."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Temps d'espera de la connexió (segons)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Quant de temps s'espera que el proveïdor accepti la connexió. Curt, perquè els problemes de xarxa es vegin de seguida."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Temps d'espera de la classificació (segons)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Quant de temps s'espera la resposta completa del model de classificació (és curta)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Temps d'espera de la resposta (segons)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Quant de temps s'espera la resposta completa del model de resposta. Les respostes no es transmeten en flux: això inclou escriure tota la resposta, i els models que pensen primer poden necessitar un minut o més."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Màxim de tokens de la classificació"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Màxim de tokens de la resposta"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Límit superior de la sortida del model (incloent-hi el seu raonament, per als models que pensen). Augmenteu-lo si les respostes es tallen."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Espera màxima a la cua (hores)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Els temes que encara esperen després d'això (p. ex. després d'una interrupció del proveïdor) s'ometen: una resposta dies després seria estranya. 0: sense límit."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pausa després d'errors del compte (minuts)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Després d'una clau no vàlida, de crèdits o quota esgotats, o d'un model desconegut, Baldrick s'atura (els temes de la cua esperen), envia un correu als destinataris de notificacions una sola vegada, i ho torna a provar després d'aquests minuts fins que el proveïdor respongui. Desar aquesta configuració acaba l'aturada."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Actualitza"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Mostra tots els models"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Inclou els models que no poden escriure respostes de xat (embeddings, veu, imatges...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Escriviu per cercar els models"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Cap model coincideix"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Preus omplerts a partir de la llista del proveïdor."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Cerca simple: darrers missatges cercats"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Sense un índex de text complet (SQLite, o abans de crear-lo a Meela > Baldrick AI), els temes relacionats es troben llegint els missatges: uns 2,5 segons per cada 50.000 missatges; només es cerquen aquests darrers missatges (0: tots). Amb l'índex, es cerquen tots els missatges."
