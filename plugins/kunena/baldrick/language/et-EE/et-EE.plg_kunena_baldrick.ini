PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, foorumi tehisintellektist esmavastaja: vastab uutele teemadele ja pärast pikka vaikust taaselustatud teemadele, kui ükski administraator ega moderaator pole vastanud, kasutades Anthropicu või OpenAI-ga ühilduvaid API-sid. <strong>Privaatsus:</strong> tema käsitletavate teemade (ja seotud avalike teemade) tekst saadetakse sinu seadistatud tehisintellekti pakkujale; maini seda oma privaatsuspoliitikas. Tegevused, summad ja hinnad: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1. etapp: sorteerimismudel (väike, odav)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Loeb iga uue küsimuse kõigepealt läbi: hindab seda (vastatav, liiga lai, üksikasjad puuduvad, pole küsimus, rämps) ja koostab seotud teemade otsingupäringud. Piisab väikesest kiirest mudelist."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2. etapp: vastamismudel (võimekam)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Koostab vastuse selgetele küsimustele, kasutades teemat ja foorumist leitud seotud avalikke teemasid. See võib kasutada 1. etapi ühendust teise mudeliga või oma ühendust."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Millal Baldrick vastab"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick vaatab iga uut teemat, teema algataja vastuseid Baldrickule (vestlus) ja vastuseid teemadele, mis on olnud vaiksed kauem kui allolev päevade arv. Ta ei vasta kunagi, kui viimane postitus on administraatorilt või moderaatorilt."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kuidas Baldrick vastab"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Vastused avaldatakse kohe Baldricku kasutajana, foorumi BBCode'is. Lingid foorumiteemadele on suhtelised."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Rämps"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kui sorteerimismudel on kindel, et postitus on rämps (reklaam, telefoninumbrid, SEO-lingid...), peidab Baldrick selle: esimese postituse korral kogu teema. Peidetud postitused ootavad modereerimist, nii et eksimuse saab heakskiiduga tühistada."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Teavitused"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Tavatekstis e-kiri saadetakse Joomla meiliseadete kaudu, koos teema esimese postituse ja selle viimase 5 postitusega, uuemad eespool. Rämpsutoimingutest ja vigadest (teema, millest Baldrick loobus, peatus, kuna tehisintellekti pakkuja lükkab päringud tagasi) teavitatakse alati. Iga e-kirja tulemus on näha tegevuste logis."

