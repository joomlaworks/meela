COM_KUNENA_BALDRICK_PAUSED_NOTICE = "<strong>Baldrick AIは一時停止中です</strong>（%sから）。AIプロバイダーがリクエストを拒否したためです: <em>%s</em>。キューのトピックは待機中です。Baldrickは数分ごとに再試行し、プロバイダーが応答すると自動的に再開します。<a href=\"%s\">その設定</a>でAPIキー、クレジットや利用枠、モデルを確認してください（設定を保存すると、ただちに一時停止が終わります）。"
