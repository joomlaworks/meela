COM_KUNENA_A_BBCODE_SETTINGS = "Pengaturan BBCode"
COM_KUNENA_A_BOARD_OFFLINE = "Forum Offline"
COM_KUNENA_A_BOARD_OFFLINE_DESC = "Set ke <em>Ya</em> jika anda ingin mengalihkan secara offline bagian dari forum. Forum akan tetap beroperasi untuk Super Administrator."
COM_KUNENA_A_BOARD_OFFLINE_MES = "Pesan Forum Offline"
COM_KUNENA_A_BOARD_TITLE = "Judul Forum"
COM_KUNENA_A_BOARD_TITLE_DESC = "Nama forum anda?"
COM_KUNENA_A_CATEGORY_SUBSCRIPTIONS = "Katagori Berlangganan"
COM_KUNENA_A_CATEGORY_SUBSCRIPTIONS_DESC = "Pilihan ini <em>Izinkan Berlangganan = Ya</em>. Jika di atur ke <em>Email Topik Baru</em>,email hanya akan diposting ke kategori pelanggan ketika topik baru dibuat, pengguna tidak akan menerima update dengan topik kecuali mereka berlangganan topik individu. Jika di atur ke <em>Email Posting Baru</em>, email akan diposting untuk semua posting baru yang dibuat dalam kategori bahwa pengguna berlangganan."
COM_KUNENA_A_CONFIG = "Forum Konfigurasi"
COM_KUNENA_A_DELETEMESSAGE = "Pengguna Tidak Dapat Menghapus Postingannya Sendiri"
COM_KUNENA_A_DELETEMESSAGE_DESC = "Pilih apakah pengguna terdaftar (tanpa hak untuk moderator) harus dapat menghapus tulisan mereka sendiri."
COM_KUNENA_A_DISPLAY_NAME = "Tampilkan Nama Pengguna"
COM_KUNENA_A_EBAYLANGUAGECODE = "Kode Bahasa eBay widget"
COM_KUNENA_A_EBAYLANGUAGECODE_DESC = "Hal ini penting untuk mendefinisikan kode bahasa yang sesuai seperti widget eBay berasal baik bahasa dan mata uang. Default adalah en-us ebay.com. Contoh: ebay.de: de-de, ebay.at: de-at, ebay.co.uk: en-gb"
COM_KUNENA_A_EMAIL = "Alamat E-mail Forum"
COM_KUNENA_A_ENABLED_DESC = "Aktifkan fungsi polling ke Forum. Hal ini perlu diatur ke <em>Ya</em> untuk mendukung polling."
COM_KUNENA_A_FAVORITES = "Izinkan Favorit"
COM_KUNENA_A_FAVORITES_DESC = "Set ke <em>Ya</em> jika anda ingin mengizinkan pengguna terdaftar untuk topik favorit"
COM_KUNENA_A_FILE = "File"
COM_KUNENA_A_FILEALLOWEDTYPES = "Tipe File diijinkin"
COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "Jenis berkas yang boleh dilampirkan anggota: ekstensi huruf kecil dipisah koma (spasi dihapus). Bawaan: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov. Jenis berkas yang dapat dijalankan dan halaman web tidak pernah diizinkan. Jika dikosongkan, nilai bawaan kembali saat disimpan."
COM_KUNENA_A_FILESIZE = "Ukuran File Maksimum"
COM_KUNENA_A_FILESIZE_DESC = "ukuran file maksimum yang diperbolehkan untuk Upload. <strong>Anda tidak dapat melebihi batas PHP Upload: post_max_size: %s & upload_max_filesize: %s </strong>. Untuk mengubah batas upload PHP, silakan cek php.ini anda (%s) pengaturan."
COM_KUNENA_A_FILESIZE_KB = "KB"
COM_KUNENA_A_FLOOD = "Perlindungan Flood"
COM_KUNENA_A_FLOOD_DESC = "Jumlah detik pengguna harus menunggu antara dua posting berturut-turut. Set ke 0 (nol) untuk mematikan perlindungan flood. Catatan: Perlindungan flood <em>dapat</em> menyebabkan penurunan kinerja."
COM_KUNENA_A_FORUM_JUMP = "Mengaktifkan Forum Jump"
COM_KUNENA_A_FORUM_JUMP_DESC = "Jika set ke <em>Ya</em>, pemilih akan ditampilkan pada halaman forum yang memungkinkan jump cepat ke forum atau kategori lain."
COM_KUNENA_A_FRONTEND = "Frontend"
COM_KUNENA_A_GHOSTMESSAGE = "Kotak pesan diperiksa secara default?"
COM_KUNENA_A_HIGHLIGHTCODE = "Mengaktifkan Kode Highlighting"
COM_KUNENA_A_HIGHLIGHTCODE_DESC = "Mengaktifkan Kode tag highlighting Javascript pada Meela. Jika anggota anda mem-posting PHP atau kode fragment lain dengan kode tag, ini akan mewarnai kode. Jika forum anda tidak menggunakan bahasa pemrograman ini, anda mungkin ingin menonaktifkan untuk menghindari tag kode menjadi tidak valid."
COM_KUNENA_A_HISTLIM = "Batas Sejarah"
COM_KUNENA_A_HISTLIM_DESC = "Jumlah posting untuk ditampilkan dalam sejarah"
COM_KUNENA_A_HISTORY = "Tampilkan Sejarah"
COM_KUNENA_A_HISTORY_DESC = "Set ke <em>Ya</em> jika anda ingin topik sejarah ditampilkan jika ada balasan/kutipan"
COM_KUNENA_A_IMAGE = "Gambar"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES = "Legal Tipe MIME"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "Tipe MIME gambar yang diterima saat &quot;Periksa tipe MIME&quot; aktif: dipisah koma, <strong>huruf kecil</strong>. Bawaan: image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif. Jika dikosongkan, nilai bawaan kembali saat disimpan."
COM_KUNENA_A_IMAGEALLOWEDTYPES = "Ijinkan Tipe gambar"
COM_KUNENA_A_IMAGEALLOWEDTYPES_DESC = "Jenis gambar yang boleh dilampirkan anggota: ekstensi <strong>huruf kecil</strong> dipisah koma (spasi dihapus). Bawaan: jpg,jpeg,gif,png,webp,avif (WebP dan AVIF jika PHP server dapat memprosesnya). Jika dikosongkan, nilai bawaan kembali saat disimpan."
COM_KUNENA_A_IMAGECHECKMIMETYPES = "Cek Tipe MIME"
COM_KUNENA_A_IMGHEIGHT = "Tinggi Gambar Maksimum"
COM_KUNENA_A_IMGHEIGHT_DESC = "File yang lebih besar sedang di-upload tapi ukuran file akan di-compress"
COM_KUNENA_A_IMGQUALITY = "Kualitas Gambar untuk Ukuran JPG"
COM_KUNENA_A_IMGQUALITY_DESC = "Kualitas gambar JPEG, WebP, dan AVIF yang diubah ukurannya, 1 sampai 100: makin tinggi makin bagus, tetapi berkasnya makin besar. Bawaan: 50 (nilai umum: 50-85). Gambar PNG dan GIF diubah ukurannya tanpa kehilangan kualitas."
COM_KUNENA_A_IMGSIZE = "Ukuran Maksimum File Gambar"
COM_KUNENA_A_IMGSIZE_DESC = "Maksimum ukuran file gambar yang dijinkan untuk di-upload. <strong>Anda tidak dapat melebihi batas upload PHP post_max_size: %s & upload_max_filesize: %s </strong>. Untuk mengubah batas upload PHP, periksa php.ini anda (%s) pengaturan."
COM_KUNENA_A_IMGTHUMBHEIGHT = "Tinggi Thumbnail"
COM_KUNENA_A_IMGTHUMBHEIGHT_DESC = "Tinggi thumbnail dari gambar yang disimpan. Tampilan properti dapat bervariasi dari properti file fisik."
COM_KUNENA_A_IMGTHUMBWIDTH = "Lebar Thumbnail"
COM_KUNENA_A_IMGTHUMBWIDTH_DESC = "Lebar thumbnail dari gambar yang disimpan. Tampilan properti dapat bervariasi dari properti file fisik."
COM_KUNENA_A_IMGWIDTH = "Maksimum Lebar Gambar"
COM_KUNENA_A_IMGWIDTH_DESC = "File yang lebih besar sedang di-upload tapi ukuran file akan di-compress."
COM_KUNENA_A_KARMA = "Menampilkan indikator karma"
COM_KUNENA_A_KARMA_DESC = "Set ke <em>Ya</em> untuk menunjukkan karma pengguna dan tombol terkait (kenaikan / penurunan) jika diaktifkan statistik pengguna."
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT = "Session Lifetime"
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT_DESC = "Default adalah 1800 [detik]. Sesi lifetime (timeout) dalam detik yang sama juga berkerja pada joomla. Sesi lifetime penting untuk menghitung ulang hak akses, tampilkan siapa yang online dan indikator baru. setiap sesi akan berakhir sesuai waktu timeout, hak akses dan inidkator baru akan diulang."
COM_KUNENA_A_LATESTCATEGORY = "Daftar Katagori Topik Terbaru"
COM_KUNENA_A_LATESTCATEGORY_DESC = "Pilih semua kategori yang anda inginkan untuk menampilkan atau menyembunyikan topik terbaru."
COM_KUNENA_A_LATESTCATEGORY_IN = "Kategori Saringan Dalam Topik Terbaru"
COM_KUNENA_A_LATESTCATEGORY_IN_DESC = "Pilih jika anda ingin menampilkan atau menyembunyikan kategori berikut dalam topik terbaru."
COM_KUNENA_A_LENGTHS = "Pengaturan Lebar"
COM_KUNENA_A_LOOKS = "Look and Feel"
COM_KUNENA_A_MAILADMIN = "E-mail Administrator"
COM_KUNENA_A_MESSAGES = "Pesan per Halaman"
COM_KUNENA_A_MESSAGES_DESC = "Jumlah pesan per halaman yang ditampilkan"
COM_KUNENA_A_MESSAGES_DESC_SEARCH = "Pesan per halaman untuk hasil pencarian"
COM_KUNENA_A_MESSAGES_SEARCH = "Hasil Pencarian"
COM_KUNENA_A_MAILMOD = "Moderator E-mail"
COM_KUNENA_A_PESONNALTEXT = "Maks. Panjang Teks Pribadi"
COM_KUNENA_A_PESONNALTEXT_DESC = "Jumlah maksimum karakter yang diperbolehkan untuk teks pribadi pada pengguna profile."
COM_KUNENA_A_POLL_ALLOW_ONE_VOTE = "Hanya satu voting"
COM_KUNENA_A_POLL_ALLOW_ONE_VOTE_DESC = "Batas pengguna individu untuk memilih hanya satu kali dalam setiap polling."
COM_KUNENA_A_POLL_ENABLED = "Mengaktifkan"
COM_KUNENA_A_POLL_NUMBER_OPTIONS = "Jumlah maksimum pilihan polling"
COM_KUNENA_A_POLL_NUMBER_OPTIONS_DESC = "Mengatur jumlah maksimum yang diizinkan untuk pilihan field untuk polling saat pengguna membuat postingan baru."
COM_KUNENA_A_POLL_NUMBER_VOTES_BY_DESC = "Mengatur jumlah maksimum untuk suara yang diperbolehkan untuk satu pengguna. Jika pilihan Single Vote diaktifkan, maka pengaturan ini diabaikan."
COM_KUNENA_A_POLL_NUMBER_VOTES_BY_USER = "Jumlah maksimum suara per pengguna"
COM_KUNENA_A_POLL_SHOW_USER_LIST = "Menampilkan daftar pengguna yang memilih"
COM_KUNENA_A_POLL_SHOW_USER_LIST_DESC = "Menampilkan daftar semua pemilih untuk polling khusus untuk menjaga kerahasiaan suara sendiri."
COM_KUNENA_A_POLL_TIME_VOTES = "Waktu antara voting berturut-turut"
COM_KUNENA_A_POLL_TIME_VOTES_DESC = "Untuk menghindari overloading server, atur waktu antara dua suara dari pengguna yang sama, misalnya 00:15:00 15 menit antara dua suara"
COM_KUNENA_A_POLL_TITLE = "Pengaturan Polling"
COM_KUNENA_A_PUBWRITE = "Ijinkan Tamu Untuk Mem-Posting/Menulis"
COM_KUNENA_A_PUBWRITE_DESC = "Set ke <em>Ya</em> untuk mengizinkan Tamu (bukan pengguna terdaftar e.a umum) memiliki hak untuk menulis posting. Set ke <em>Tidak</em> untuk akses tamu hanya untuk baca."
COM_KUNENA_A_RANKING = "Ranking"
COM_KUNENA_A_RANKING_DESC = "Set ke <em>Ya</em>, jika anda ingin menampilkan rank pengguna terdaftar yang didasarkan pada jumlah posting yang mereka buat.<br/><strong>Catatan: Anda harus mengaktifkan <em>Menampilkan Statistik Pengguna</em> dalam <em>pengguna</em> tab untuk menampilkan.</strong>"
COM_KUNENA_A_RANKING_SETTINGS = "Pengaturan Ranking"
COM_KUNENA_A_REGISTERED_ONLY = "Hanya Pengguna Terdaftar"
COM_KUNENA_A_REG_ONLY_DESC = "Set ke <em>Ya</em> untuk membatasi akses forum bagi pengguna terdaftar (lihat dan post). Set ke <em>Tidak</em> untuk mengizinkan Tamu mana saja (bukan pengguna terdaftar) untuk sekedar melihat forum. Lihat 'Mengizinkan Tamu untuk posting/menulis' untuk kontrol tambahan bagi akses tamu."
COM_KUNENA_A_RSS = "Mengaktifkan RSS feed"
COM_KUNENA_A_RSS_ALLOW_HTML = "Membuat HTML & bbcode di RSS feed"
COM_KUNENA_A_RSS_ALLOW_HTML_DESC = "Mengizinkan HTML di RSS feed dapat dilihat sebagai ancaman keamanan, hacker kadang-kadang mencoba menyusupkan javascripts berbahaya dan gambar ke dalam pesan forum..<br />Akan tetapi, Meela memiliki keamanan yang baik dalam kasus ini, dan dianjurkan untuk mengizinkan HTML di RSS feed untuk maksimum pengalaman pengguna."
COM_KUNENA_A_RSS_AUTHOR_FORMAT = "Format Penulis"
COM_KUNENA_A_RSS_AUTHOR_FORMAT_DESC = "Pilih untuk menampilkan nama penulis atau email penulis di RSS feed."
COM_KUNENA_A_RSS_AUTHOR_IN_TITLE = "Membuat Penulis Dalam Judul"
COM_KUNENA_A_RSS_AUTHOR_IN_TITLE_DESC = "Pilih jika penulis juga harus terlihat di judul RSS."
COM_KUNENA_A_RSS_CACHE = "Jeda caching"
COM_KUNENA_A_RSS_CACHE_DESC = "Berapa menit antara output caching RSS feed. Pilih '0' untuk mematikan cache. <br />Mohon perhatian, angka yang lebih rendah dapat mempengaruhi kinerja!"
COM_KUNENA_A_RSS_DESC = "RSS feed memungkinkan pengguna untuk men-download postingan terakhir di desktop atau aplikasi RSS reader mereka. See <a href='http://www.rssreader.com' target='_blank'>rssreader.com</a> sebagai contoh."
COM_KUNENA_A_RSS_EXCLUDED_CATEGORIES = "Mengeluarkan kategori"
COM_KUNENA_A_RSS_INCLUDED_CATEGORIES = "Memasukkan kategori"
COM_KUNENA_A_RSS_LIMIT = "Batas RSS"
COM_KUNENA_A_RSS_LIMIT_DESC = "Anda juga dapat membatasi jumlah post dalam RSS feed anda. Gunakan ini, bila batas waktu tidak cukup. Dapat digunakan dengan, atau tanpa, sebuah batas waktu.<br />Gunakan 0 atau kosongkan untuk tidak ada batas."
COM_KUNENA_A_RSS_OLD_TITLES = "Menggunakan Judul Lama"
