COM_KUNENA_BALDRICK_PAUSED_NOTICE = "<strong>Baldrick AI is gepauzeerd</strong> sinds %s omdat de AI-aanbieder zijn verzoeken heeft geweigerd: <em>%s</em>. Wachtende onderwerpen wachten; Baldrick probeert het elke paar minuten opnieuw en hervat zichzelf zodra de aanbieder antwoordt. Controleer de API-sleutel, het tegoed/quotum en de modellen in <a href=\"%s\">de instellingen</a> (opslaan beëindigt de pauze meteen)."
