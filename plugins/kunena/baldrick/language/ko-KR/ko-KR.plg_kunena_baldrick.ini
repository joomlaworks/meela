PLG_KUNENA_BALDRICK_MODEL = "모델"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "분류 단계의 모델입니다. 예: claude-haiku-5-5. &quot;모델 가져오기&quot;는 위의 값(저장 여부와 관계없이)으로 제공자의 모델 목록을 검색 가능한 목록으로 표시합니다(1시간 동안 보관, &quot;새로 고침&quot;을 누르면 다시 요청). 이름을 직접 입력할 수도 있습니다. &quot;테스트&quot;는 모델에 아주 작은 요청을 보냅니다."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "답변 단계의 모델입니다. 예: claude-sonnet-5-5 (가장 좋은 답변을 원하면 claude-opus-5-5). &quot;모델 가져오기&quot;는 제공자의 모델 목록을 표시하며, 이름을 직접 입력할 수도 있습니다. &quot;테스트&quot;는 모델에 아주 작은 요청을 보냅니다."
