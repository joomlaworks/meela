PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "O Baldrick, o primeiro atendente de IA do fórum: responde a novos tópicos e a tópicos reativados após um longo silêncio quando nenhum administrador ou moderador respondeu, usando APIs compatíveis com Anthropic ou OpenAI. <strong>Privacidade:</strong> o texto dos tópicos que ele processa (e dos tópicos públicos relacionados) é enviado ao provedor de IA que você configurar; mencione isso na sua política de privacidade. Atividade, totais e custos: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Etapa 1: modelo de triagem (pequeno, barato)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Lê primeiro cada pergunta nova: avalia-a (respondível, ampla demais, faltam detalhes, não é uma pergunta, spam) e escreve as consultas de pesquisa de tópicos relacionados. Um modelo pequeno e rápido basta."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Etapa 2: modelo de resposta (mais capaz)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Escreve a resposta para perguntas claras, usando o tópico e os tópicos públicos relacionados encontrados no fórum. Pode usar a conexão da etapa 1 com outro modelo, ou uma conexão própria."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Quando o Baldrick responde"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "O Baldrick analisa cada novo tópico, as respostas de quem iniciou o tópico ao Baldrick (uma conversa) e as respostas a tópicos que ficaram em silêncio por mais dias do que o número indicado abaixo. Ele nunca responde quando a última mensagem é de um administrador ou moderador."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Como o Baldrick responde"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "As respostas são publicadas imediatamente como o usuário do Baldrick, em BBCode do fórum. Links para tópicos do fórum são relativos."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Quando o modelo de triagem tem certeza de que uma mensagem é spam (publicidade, números de telefone, links de SEO...), o Baldrick a despublica: o tópico inteiro, se for a primeira mensagem. Mensagens despublicadas aguardam moderação, então um engano é desfeito aprovando-as."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notificações"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Um e-mail de texto simples é enviado pelas configurações de e-mail do Joomla, com a primeira mensagem do tópico e suas últimas 5 mensagens, da mais recente para a mais antiga. Ações contra spam e erros (um tópico que o Baldrick abandonou, uma pausa porque o provedor de IA recusa suas requisições) são sempre notificados. O resultado de cada e-mail aparece no registro de atividade."

PLG_KUNENA_BALDRICK_PROVIDER = "Tipo de API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, e endpoints compatíveis com Anthropic como os da Qwen), ou Chat Completions compatível com OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Compatível com Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Compatível com OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL base"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Deixe vazio para a API oficial (https://api.anthropic.com ou https://api.openai.com/v1). Exemplos para o Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (compatível com Anthropic) ou https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (compatível com OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Vazio: a API oficial"
PLG_KUNENA_BALDRICK_API_KEY = "Chave de API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "A chave de API do provedor. O Baldrick não faz nada até que uma chave e os modelos sejam definidos."
PLG_KUNENA_BALDRICK_MODEL = "Modelo"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modelo da etapa de triagem, por exemplo claude-haiku-5-5. &quot;Buscar modelos&quot; lista os modelos do provedor com os valores acima (salvos ou não) em uma lista pesquisável (mantida por uma hora; &quot;Atualizar&quot; consulta de novo); você também pode digitar um nome. &quot;Testar&quot; envia uma requisição pequena ao modelo."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modelo da etapa de resposta, por exemplo claude-sonnet-5-5 (ou claude-opus-5-5 para as melhores respostas). &quot;Buscar modelos&quot; lista os modelos do provedor; você também pode digitar um nome. &quot;Testar&quot; envia uma requisição pequena ao modelo."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Buscar modelos"
PLG_KUNENA_BALDRICK_TEST = "Testar"
PLG_KUNENA_BALDRICK_WORKING = "Processando..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Escolha um modelo -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "A requisição falhou."
PLG_KUNENA_BALDRICK_PRICE_IN = "Preço: entrada"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Preço: saída"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD por milhão de tokens, para as estimativas de custo. Vazio: a tabela de preços dos modelos Claude conhecidos, senão 0 (a menos que o provedor informe o custo)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Usar a conexão da etapa 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Usa o mesmo tipo de API, URL base e chave da etapa de triagem (com o modelo escolhido abaixo). Escolha Não para usar outro provedor nas respostas."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: alternativa em caso de recusa"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Somente na API própria da Anthropic, com os modelos Opus/Sonnet 5.x: quando as verificações de segurança do modelo recusam uma requisição, a API a executa de novo em um modelo alternativo escolhido pela Anthropic (alternativas no servidor). Não disponível para o Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Teste"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Para testar a configuração: o Baldrick só responde em tópicos iniciados por administradores e moderadores (novos tópicos e os seus desdobramentos dirigidos ao Baldrick), e nunca despublica mensagens (spam é apenas denunciado)."
PLG_KUNENA_BALDRICK_USER = "Usuário do Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "O usuário com o qual o Baldrick publica. Deixe vazio para que um usuário \"Baldrick\" seja criado automaticamente (sem senha utilizável, sem e-mail real). Defina a foto e a assinatura no perfil dele no fórum (um novo usuário recebe a assinatura &quot;Respondido pelo Baldrick AI, meu senhor, usando um modelo astuto (...e lembre-se de que a IA pode cometer erros, então confira as respostas)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Reativar após (dias)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Uma resposta a um tópico cuja mensagem anterior seja mais antiga que isto é tratada como uma nova pergunta."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Respostas por tópico"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Quantas vezes o Baldrick pode responder no mesmo tópico: sua primeira resposta, e suas respostas quando quem iniciou o tópico responde a ele (detalhes pedidos, uma nova pergunta) ou o tópico é reativado após um longo silêncio."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Respostas por dia"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "No máximo este número de respostas em 24 horas (0: sem limite). Protege o seu orçamento de API contra enxurradas."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Tamanho mínimo da mensagem"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Mensagens mais curtas que isto (caracteres, sem formatação) são ignoradas."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Somente nestas categorias"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Responder somente nestas categorias (nenhuma selecionada: todas as categorias)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nunca nestas categorias"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nunca responder nestas categorias."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Somente categorias públicas"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Responder somente em categorias que visitantes podem ler, para que nenhum conteúdo privado seja enviado ao provedor de IA. Tópicos relacionados são sempre obtidos somente de categorias públicas."

PLG_KUNENA_BALDRICK_TRANSLATE = "Adicionar uma tradução em inglês"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "O Baldrick responde no idioma de quem escreveu. Com esta opção, respostas em outros idiomas são seguidas de uma tradução em inglês (útil para uma equipe e leitores de língua inglesa)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Tópicos relacionados"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Quantos tópicos públicos relacionados (encontrados com as consultas de pesquisa da etapa de triagem) são enviados ao modelo de resposta."
PLG_KUNENA_BALDRICK_PRESET = "Prompt mestre integrado"
PLG_KUNENA_BALDRICK_PRESET_DESC = "As instruções com que toda resposta começa (somente leitura). O contexto do seu site, abaixo, é acrescentado a elas."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Contexto do site"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Sobre o que é o fórum, produtos e versões suportados, links para a documentação, o tom a usar, o que o Baldrick nunca deve fazer... É acrescentado aos prompts das duas etapas (também ajuda o modelo de triagem a distinguir spam de mensagens sobre o assunto)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "p. ex. Este é o fórum de suporte da ExampleSoft. Damos suporte às versões 3 e 4. A documentação está em https://docs.example.com. Nunca prometa reembolsos."
PLG_KUNENA_BALDRICK_CANNED = "Respostas padrão"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Respostas para perguntas amplas demais (nenhuma resposta de IA é escrita) e alternativas quando não é possível escrever uma resposta. Separe as respostas com uma linha de três hífens (---); uma é escolhida ao acaso. Marcadores: {name} (o autor), {search_url} (busca no fórum pela pergunta), {forum_url}, {topic_url}. BBCode do fórum é permitido."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "O que fazer quando o modelo de triagem tem certeza de que uma mensagem é spam. Um e-mail é enviado nos dois primeiros casos."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Despublicar (o tópico inteiro, para uma primeira mensagem) e notificar"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Apenas denunciar"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorar"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Confiável após (mensagens)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Mensagens de usuários com pelo menos este número de mensagens publicadas, e da equipe, nunca são despublicadas: são apenas denunciadas."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notificar estes membros da equipe"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Usuários, administradores e moderadores do Meela que recebem as notificações (Ctrl/Cmd+clique para escolher vários)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notificar sobre"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Cada resposta publicada pelo Baldrick (respostas, respostas padrão, pedidos de detalhes) e spam, ou somente spam. Erros são sempre notificados."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Cada resposta, spam e erros"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Somente spam e erros"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notificar estes endereços"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Mais endereços de e-mail, separados por vírgulas."

PLG_KUNENA_BALDRICK_PROCESSING = "Processamento"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automático: logo após o envio da página que colocou um tópico na fila (com PHP-FPM), ou por uma requisição em segundo plano ao próprio site. Somente linha de comando: execute &quot;php cli/joomla.php kunena:baldrick:process&quot; pelo cron (Joomla 3.x UTD), por exemplo a cada minuto."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automático"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Somente pela linha de comando (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Manter o registro de atividade (dias)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Linhas do registro de atividade mais antigas que isto são excluídas. Os totais mensais são mantidos por 36 meses."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avançado: processamento, limites e tempos limite"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "A publicação nunca espera pela IA: os tópicos entram na fila e são processados em segundo plano. Erros de rede, limites de taxa e provedores sobrecarregados são repetidos (assim que o provedor permitir) e depois o tópico é tentado mais tarde (3 tentativas). Erros da conta (chave inválida, sem créditos, modelo desconhecido) pausam o Baldrick e notificam os destinatários acima."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Tempo limite de conexão (segundos)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Quanto tempo esperar que o provedor aceite a conexão. Curto, para que problemas de rede apareçam rapidamente."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Tempo limite de resposta da triagem (segundos)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Quanto tempo esperar pela resposta completa do modelo de triagem (ela é curta)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Tempo limite de resposta da resposta (segundos)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Quanto tempo esperar pela resposta completa do modelo de resposta. As respostas não são transmitidas em fluxo: isso inclui escrever a resposta inteira, e modelos que raciocinam antes podem precisar de um minuto ou mais."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Máximo de tokens da triagem"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Máximo de tokens da resposta"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Limite máximo da saída do modelo (incluindo o seu raciocínio, para modelos que raciocinam). Aumente-o se as respostas forem cortadas."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Espera máxima na fila (horas)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Tópicos que ainda aguardem após este tempo (por exemplo, depois de uma queda do provedor) são ignorados: uma resposta dias depois seria estranha. 0: sem limite."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pausa após erros de conta (minutos)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Após uma chave inválida, créditos ou cota esgotados, ou um modelo desconhecido, o Baldrick pausa (tópicos na fila aguardam), envia por e-mail uma vez aos destinatários da notificação e tenta de novo após este número de minutos até que o provedor responda. Salvar estas configurações encerra a pausa."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Atualizar"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Mostrar todos os modelos"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Incluir modelos que não sabem escrever respostas de chat (embeddings, fala, imagens...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Digite para pesquisar os modelos"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Nenhum modelo corresponde"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Preços preenchidos a partir da lista do provedor."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Pesquisa simples: últimas mensagens pesquisadas"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Sem índice de texto completo (SQLite, ou antes de criá-lo em Meela > Baldrick AI), os tópicos relacionados são encontrados lendo as mensagens, cerca de 2,5 segundos a cada 50.000 mensagens: só estas últimas mensagens são pesquisadas (0: todas). Com o índice, todas as mensagens são pesquisadas."
