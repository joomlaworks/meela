COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "सदस्य किन प्रकार की फ़ाइलें संलग्न कर सकते हैं: अल्पविराम से अलग किए गए, छोटे अक्षरों वाले एक्सटेंशन (रिक्त स्थान हटा दिए जाते हैं)। डिफ़ॉल्ट: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov। निष्पादन योग्य और वेब पृष्ठ प्रकार कभी अनुमत नहीं होते। खाली छोड़ने पर, सुरक्षित करते समय डिफ़ॉल्ट वापस आ जाता है।"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "जब &quot;MIME प्रकार जाँचें&quot; चालू हो, तब कौन-से छवि MIME प्रकार स्वीकार किए जाएँ: अल्पविराम से अलग किए गए, <strong>छोटे अक्षरों</strong> में। डिफ़ॉल्ट: image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif। खाली छोड़ने पर, सुरक्षित करते समय डिफ़ॉल्ट वापस आ जाता है।"
