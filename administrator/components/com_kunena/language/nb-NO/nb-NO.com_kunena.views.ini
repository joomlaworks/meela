COM_KUNENA_A_FILE = "Filer"
COM_KUNENA_A_FILEALLOWEDTYPES = "Tillatte filtyper"
COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "Hvilke filtyper brukerne kan legge ved: kommaseparerte filendelser med små bokstaver (mellomrom fjernes). Standard: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov. Kjørbare filer og nettsidetyper tillates aldri. Er feltet tomt, settes standarden inn ved lagring."
COM_KUNENA_A_FILESIZE = "Maks. filstørrelse<br/><em>i Kilobyte</em>"
COM_KUNENA_A_FILESIZE_DESC = "Maks filstørrelse <em>i kilobyte</em> tillatt for opplasting. <strong>Du kan ikke overgå PHP opplastingsgrensen på: post_max_size: %s & upload_max_filesize: %s </strong>. For å endre PHP opplastingsgrensen se din php.ini (%s) innstillinger."
COM_KUNENA_A_FILESIZE_KB = "KB"
COM_KUNENA_A_FILE_UPLOAD = "Tillat opplasting av filer"
