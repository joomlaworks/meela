PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, prvi AI odgovaratelj foruma: odgovara na nove teme i na teme oživljene nakon duge šutnje kada nijedan administrator ili moderator nije odgovorio, koristeći Anthropic ili OpenAI-kompatibilne API-je. <strong>Privatnost:</strong> tekst tema koje obrađuje (i povezanih javnih tema) šalje se AI pružatelju koji konfiguriraš; navedi to u politici privatnosti. Aktivnost, zbirovi i troškovi: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Korak 1: model za razvrstavanje (mali, jeftin)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Najprije čita svako novo pitanje: ocjenjuje ga (može se odgovoriti, preširoko, nedostaju pojedinosti, nije pitanje, spam) i piše upite pretrage za povezane teme. Dovoljan je mali, brzi model."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Korak 2: model za odgovore (snažniji)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Piše odgovor na jasna pitanja, koristeći temu i povezane javne teme s foruma. Može koristiti vezu koraka 1 s drugim modelom ili vlastitu vezu."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kada Baldrick odgovara"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick pregledava svaku novu temu, odgovore pokretača teme Baldricku (razgovor) i odgovore na teme koje su bile tihe dulje od broja dana navedenog niže. Nikad ne odgovara kada zadnju objavu napiše administrator ili moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kako Baldrick odgovara"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Odgovori se odmah objavljuju kao Baldrickov korisnik, u forum BBCode-u. Poveznice na teme foruma su relativne."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kada je model za razvrstavanje siguran da je objava spam (oglasi, telefonski brojevi, SEO poveznice...), Baldrick je uklanja s objave: cijelu temu kada je riječ o prvoj objavi. Uklonjene objave čekaju moderaciju, pa se pogreška poništava odobravanjem."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Obavijesti"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Obična tekstualna e-poruka šalje se kroz postavke pošte u Joomla sustavu, s prvom objavom teme i njezinih posljednjih 5 objava, od najnovije. Radnje spama i greške (tema od koje je Baldrick odustao, pauza jer AI pružatelj odbija zahtjeve) uvijek se prijavljuju. Rezultat svake e-poruke prikazan je u dnevniku aktivnosti."

PLG_KUNENA_BALDRICK_PROVIDER = "Vrsta API-ja"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude i krajnje točke kompatibilne s Anthropicom, npr. Qwenova), ili OpenAI-kompatibilni Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Kompatibilno s Anthropicom (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Kompatibilno s OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Osnovna adresa"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Ostavi prazno za službeni API (https://api.anthropic.com ili https://api.openai.com/v1). Primjeri za Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (kompatibilno s Anthropicom) ili https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (kompatibilno s OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Prazno: službeni API"
