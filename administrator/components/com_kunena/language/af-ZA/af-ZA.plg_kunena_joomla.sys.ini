PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "Kies gebruikersgroepe wat 'n nuwe onderwerp in hierdie kategorie mag plaas. Hierdie instelling raak slegs gebruikers wat reeds leestoegang tot die kategorie het. Gaste kan nie nuwe onderwerpe skep nie, tensy jy <em>Forumopstelling > Sekuriteit & Moderering > Laat gaste toe om te plaas/skryf</em> aanskakel. <br /><br /> <strong>Wenk:</strong> Jy kan verskeie groepe kies deur die <em>Ctrl</em>- of <em>Shift</em>-knoppie te hou."
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_DESC = "Kies gebruikersgroepe wat op 'n onderwerp in hierdie kategorie mag antwoord. Hierdie instelling raak slegs gebruikers wat reeds leestoegang tot die kategorie het. Gaste kan nie op onderwerpe antwoord nie, tensy jy <em>Forumopstelling > Sekuriteit & Moderering > Laat gaste toe om te plaas/skryf</em> aanskakel. <br /><br /> <strong>Wenk:</strong> Jy kan verskeie groepe kies deur die <em>Ctrl</em>- of <em>Shift</em>-knoppie te hou."

