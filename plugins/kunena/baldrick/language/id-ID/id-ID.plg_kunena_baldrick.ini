PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, penjawab AI pertama forum: membalas topik baru dan topik yang dihidupkan kembali setelah lama sepi ketika tidak ada administrator atau moderator yang menjawab, dengan memakai API Anthropic atau yang kompatibel dengan OpenAI. <strong>Privasi:</strong> teks topik yang ditanganinya (dan topik publik terkait) dikirim ke penyedia AI yang Anda konfigurasi; sebutkan hal ini dalam kebijakan privasi Anda. Aktivitas, total, dan biaya: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Langkah 1: model triase (kecil, murah)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Membaca setiap pertanyaan baru lebih dulu: menilainya (dapat dijawab, terlalu luas, rincian kurang, bukan pertanyaan, spam) dan menulis kueri pencarian untuk topik terkait. Model kecil dan cepat sudah cukup."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Langkah 2: model jawaban (lebih cakap)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Menulis jawaban untuk pertanyaan yang jelas, memakai topik dan topik publik terkait yang ditemukan di forum. Dapat memakai koneksi langkah 1 dengan model lain, atau koneksinya sendiri."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kapan Baldrick membalas"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick memeriksa setiap topik baru, balasan pembuat topik kepada Baldrick (percakapan), dan balasan pada topik yang sepi lebih lama dari jumlah hari di bawah. Ia tidak pernah membalas ketika posting terakhir berasal dari administrator atau moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Cara Baldrick membalas"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Balasan langsung diterbitkan sebagai pengguna Baldrick, dalam BBCode forum. Tautan ke topik forum bersifat relatif."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Ketika model triase yakin sebuah posting adalah spam (iklan, nomor telepon, tautan SEO...), Baldrick membuatnya tak diterbitkan: seluruh topik jika itu posting pertama. Posting yang tak diterbitkan menunggu moderasi, sehingga kekeliruan dibatalkan dengan menyetujuinya."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Pemberitahuan"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "E-mail teks polos dikirim melalui pengaturan surat Joomla, berisi posting pertama topik dan 5 posting terakhirnya, dari yang terbaru. Tindakan spam dan galat (topik yang dibiarkan Baldrick, jeda karena penyedia AI menolak permintaannya) selalu diberitahukan. Hasil setiap e-mail ditampilkan di log aktivitas."

PLG_KUNENA_BALDRICK_PROVIDER = "Jenis API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Messages API Anthropic (Claude, dan endpoint yang kompatibel dengan Anthropic seperti milik Qwen), atau Chat Completions yang kompatibel dengan OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Kompatibel Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Kompatibel OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL dasar"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Kosongkan untuk API resmi (https://api.anthropic.com atau https://api.openai.com/v1). Contoh untuk Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (kompatibel dengan Anthropic) atau https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (kompatibel dengan OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Kosong: API resmi"
PLG_KUNENA_BALDRICK_API_KEY = "Kunci API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Kunci API penyedia. Baldrick tidak melakukan apa pun sampai kunci dan model diatur."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model langkah triase, misalnya claude-haiku-5-5. &quot;Ambil model&quot; mencantumkan model dari penyedia dengan nilai di atas (tersimpan atau belum) dalam daftar yang dapat dicari (disimpan selama satu jam; &quot;Segarkan&quot; meminta lagi); Anda juga dapat mengetikkan nama. &quot;Uji&quot; mengirim permintaan kecil ke model."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model langkah jawaban, misalnya claude-sonnet-5-5 (atau claude-opus-5-5 untuk jawaban terbaik). &quot;Ambil model&quot; mencantumkan model dari penyedia; Anda juga dapat mengetikkan nama. &quot;Uji&quot; mengirim permintaan kecil ke model."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Ambil model"
PLG_KUNENA_BALDRICK_TEST = "Uji"
PLG_KUNENA_BALDRICK_WORKING = "Sedang bekerja..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Pilih model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Permintaan gagal."
PLG_KUNENA_BALDRICK_PRICE_IN = "Harga: masukan"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Harga: keluaran"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per satu juta token, untuk perkiraan biaya. Kosong: harga daftar untuk model Claude yang dikenal; jika tidak, 0 (kecuali penyedia melaporkan biayanya sendiri)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Gunakan koneksi langkah 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Gunakan jenis API, URL dasar, dan kunci yang sama dengan langkah triase (dengan model yang dipilih di bawah). Pilih Tidak untuk memakai penyedia lain bagi jawaban."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: cadangan saat penolakan"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Hanya pada API Anthropic sendiri dengan model Opus/Sonnet 5.x: ketika pemeriksaan keamanan model menolak permintaan, API menjalankannya lagi pada model cadangan yang dipilih Anthropic (cadangan sisi server). Tidak tersedia untuk Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Uji coba"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Untuk menguji konfigurasi: Baldrick hanya membalas di topik yang dimulai oleh administrator dan moderator (topik baru, dan tindak lanjut mereka kepada Baldrick), dan tidak pernah menghentikan penerbitan posting (spam hanya dilaporkan)."
PLG_KUNENA_BALDRICK_USER = "Pengguna Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Pengguna tempat Baldrick memposting. Kosongkan agar pengguna &quot;Baldrick&quot; dibuat otomatis (tanpa kata sandi yang dapat dipakai, tanpa alamat e-mail asli). Atur avatar dan tanda tangannya di profil forumnya (pengguna baru mendapat tanda tangan &quot;Dijawab oleh Baldrick AI, tuanku, dengan model yang cerdik (...dan ingatlah bahwa AI dapat berbuat keliru, jadi periksa kembali jawabannya)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Hidupkan kembali setelah (hari)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Balasan pada topik yang posting sebelumnya lebih tua dari ini diperlakukan seperti pertanyaan baru."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Balasan per topik"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Berapa kali Baldrick boleh membalas di topik yang sama: balasan pertamanya, dan jawabannya ketika pembuat topik membalasnya (rincian yang diminta, pertanyaan lanjutan), atau topik dihidupkan kembali setelah lama sepi."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Balasan per hari"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Paling banyak sejumlah balasan ini dalam 24 jam (0: tanpa batas). Melindungi anggaran API Anda dari banjir permintaan."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Panjang posting minimum"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Posting yang lebih pendek dari ini (karakter, tanpa format) diabaikan."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Hanya kategori ini"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Balas hanya di kategori ini (tidak ada yang dipilih: semua kategori)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Jangan pernah di kategori ini"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Jangan pernah membalas di kategori ini."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Hanya kategori publik"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Balas hanya di kategori yang dapat dibaca tamu, sehingga tidak ada konten privat yang dikirim ke penyedia AI. Topik terkait selalu diambil dari kategori publik saja."

PLG_KUNENA_BALDRICK_TRANSLATE = "Tambahkan terjemahan bahasa Inggris"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick membalas dalam bahasa pemosting. Dengan opsi ini, balasan dalam bahasa lain diikuti terjemahan bahasa Inggris (berguna untuk staf dan pembaca berbahasa Inggris)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Topik terkait"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Berapa banyak topik publik terkait (ditemukan dengan kueri pencarian dari langkah triase) yang diberikan kepada model jawaban."
PLG_KUNENA_BALDRICK_PRESET = "Prompt induk bawaan"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Instruksi yang menjadi titik awal setiap jawaban (hanya baca). Konteks situs Anda di bawah ditambahkan padanya."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Konteks situs"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Tentang apa forum ini, produk dan versi yang didukung, tautan ke dokumentasi, nada yang digunakan, hal-hal yang tidak boleh pernah dilakukan Baldrick... Ditambahkan ke prompt kedua langkah (juga membantu model triase membedakan spam dari posting yang sesuai topik)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "contoh: Ini adalah forum dukungan ExampleSoft. Kami mendukung versi 3 dan 4. Dokumentasinya ada di https://docs.example.com. Jangan pernah menjanjikan pengembalian dana."
PLG_KUNENA_BALDRICK_CANNED = "Balasan baku"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Balasan untuk pertanyaan yang terlalu luas (tidak ada jawaban AI yang ditulis), dan cadangan jika tidak ada jawaban yang dapat disusun. Pisahkan balasan dengan satu baris tiga tanda hubung (---); satu dipilih secara acak. Placeholder: {name} (pemosting), {search_url} (pencarian forum untuk pertanyaan), {forum_url}, {topic_url}. BBCode forum diizinkan."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Apa yang dilakukan ketika model triase yakin sebuah posting adalah spam. E-mail dikirim pada dua kasus pertama."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Buat tak diterbitkan (seluruh topik untuk posting pertama) dan beritahu"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Hanya beritahu"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Abaikan"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Tepercaya setelah (posting)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Posting dari pengguna dengan sedikitnya sejumlah posting terbit ini, dan dari staf, tidak pernah dibuat tak diterbitkan: hanya dilaporkan."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Beritahu staf ini"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super User, administrator Meela, dan moderator yang menerima pemberitahuan (Ctrl/Cmd+klik untuk memilih beberapa)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Beritahu tentang"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Setiap balasan yang diposting Baldrick (jawaban, balasan baku, permintaan rincian) dan spam, atau hanya spam. Galat selalu diberitahukan."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Setiap balasan, spam, dan galat"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Hanya spam dan galat"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Beritahu alamat ini"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Alamat e-mail tambahan, dipisah koma."

PLG_KUNENA_BALDRICK_PROCESSING = "Pemrosesan"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Otomatis: tepat setelah halaman yang memasukkan topik ke antrean selesai dikirim (dengan PHP-FPM), atau melalui permintaan latar belakang ke situs itu sendiri. Hanya baris perintah: jalankan &quot;php cli/joomla.php kunena:baldrick:process&quot; dari cron (Joomla 3.x UTD), misalnya setiap menit."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Otomatis"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Hanya baris perintah (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Simpan log aktivitas (hari)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Baris log aktivitas yang lebih tua dari ini dihapus. Total bulanan disimpan selama 36 bulan."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Lanjutan: pemrosesan, batas, dan batas waktu"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Posting tidak pernah menunggu AI: topik dimasukkan ke antrean dan diproses di latar belakang. Galat jaringan, batas laju, dan penyedia yang kelebihan beban dicoba lagi (secepat yang diizinkan penyedia), lalu topik dicoba lagi nanti (3 percobaan). Galat akun (kunci tidak valid, tanpa kredit, model tidak dikenal) menjeda Baldrick dan memberi tahu penerima di atas."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Batas waktu koneksi (detik)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Berapa lama menunggu penyedia menerima koneksi. Singkat, agar masalah jaringan cepat terlihat."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Batas waktu respons triase (detik)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Berapa lama menunggu jawaban lengkap dari model triase (jawabannya singkat)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Batas waktu respons jawaban (detik)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Berapa lama menunggu jawaban lengkap dari model jawaban. Jawaban tidak dialirkan: ini mencakup penulisan seluruh balasan, dan model yang berpikir dahulu mungkin memerlukan satu menit atau lebih."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Token maksimum triase"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Token maksimum jawaban"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Batas atas keluaran model (termasuk pemikirannya, untuk model yang berpikir). Naikkan jika jawaban terpotong."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Waktu tunggu maksimum dalam antrean (jam)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Topik yang masih menunggu setelah selama ini (misalnya setelah gangguan penyedia) dilewati: balasan beberapa hari kemudian akan terasa janggal. 0: tanpa batas."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Jeda setelah galat akun (menit)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Setelah kunci tidak valid, kredit atau kuota habis, atau model tidak dikenal, Baldrick menjeda (topik dalam antrean menunggu), mengirim e-mail pemberitahuan kepada penerima sekali, dan mencoba lagi setelah sekian menit sampai penyedia menjawab. Menyimpan pengaturan ini mengakhiri jeda."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Segarkan"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Tampilkan semua model"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Sertakan model yang tidak dapat menulis jawaban obrolan (embedding, ucapan, gambar...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Ketik untuk mencari model"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Tidak ada model yang cocok"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Harga diisi dari daftar penyedia."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Pencarian biasa: posting terbaru yang dicari"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Tanpa indeks teks penuh (SQLite, atau sebelum Anda membuatnya di Meela > Baldrick AI), topik terkait ditemukan dengan membaca posting, sekitar 2,5 detik per 50.000 posting: hanya sejumlah posting terbaru ini yang dicari (0: semua). Dengan indeks, setiap posting dicari."
