PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Обновить"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Показать все модели"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Включить модели, которые не умеют писать ответы в чате (эмбеддинги, речь, изображения...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Введите, чтобы найти модели"
