PLG_KUNENA_BALDRICK_API_KEY_DESC = "API ključ dobavljača. Baldrick ne radi ništa dok se ne postavi ključ i modeli."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model koraka razvrstavanja, npr. claude-haiku-5-5. &quot;Preuzmi modele&quot; navodi modele dobavljača sa vrednostima iznad (sačuvanim ili ne) na listi koja se može pretraživati (čuva se sat vremena; &quot;Osveži&quot; traži ponovo); možete i ukucati naziv. &quot;Test&quot; šalje mali zahtev modelu."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model koraka odgovora, npr. claude-sonnet-5-5 (ili claude-opus-5-5 za najbolje odgovore). &quot;Preuzmi modele&quot; navodi modele dobavljača; možete i ukucati naziv. &quot;Test&quot; šalje mali zahtev modelu."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Preuzmi modele"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "U toku je rad..."
