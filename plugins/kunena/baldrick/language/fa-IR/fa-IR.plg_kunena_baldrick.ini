PLG_KUNENA_BALDRICK_MODEL = "مدل"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "مدل مرحله دسته‌بندی، مثلاً claude-haiku-5-5. «دریافت مدل‌ها» مدل‌های ارائه‌دهنده را با مقادیر بالا (ذخیره‌شده یا نه) در یک فهرست قابل جستجو نشان می‌دهد (یک ساعت نگه داشته می‌شود؛ «تازه‌سازی» دوباره می‌پرسد)؛ می‌توانید نامی را هم تایپ کنید. «آزمایش» یک درخواست کوچک به مدل می‌فرستد."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "مدل مرحله پاسخ، مثلاً claude-sonnet-5-5 (یا claude-opus-5-5 برای بهترین پاسخ‌ها). «دریافت مدل‌ها» مدل‌های ارائه‌دهنده را فهرست می‌کند؛ می‌توانید نامی را هم تایپ کنید. «آزمایش» یک درخواست کوچک به مدل می‌فرستد."
