PLG_KUNENA_BALDRICK_PROCESSING = "Përpunimi"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatik: menjëherë pasi të jetë dërguar faqja që e vuri një temë në radhë (me PHP-FPM), ose me një kërkesë në sfond te vetë faqja. Vetëm linja e komandës: ekzekutoni &quot;php cli/joomla.php kunena:baldrick:process&quot; nga cron (Joomla 3.x UTD), p.sh. çdo minutë."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatik"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Vetëm linja e komandës (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Ruaj regjistrin e aktivitetit (ditë)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Rreshtat e regjistrit të aktivitetit më të vjetër se kjo fshihen. Totalet mujore ruhen për 36 muaj."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Të avancuara: përpunimi, kufijtë dhe kohët e pritjes"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Postimi nuk pret kurrë për AI-n: temat vihen në radhë dhe përpunohen në sfond. Gabimet e rrjetit, kufijtë e shpejtësisë dhe ofruesit e mbingarkuar provohen sërish (sa më shpejt që e lejon ofruesi), pastaj tema provohet përsëri më vonë (3 përpjekje). Gabimet e llogarisë (çelës i pavlefshëm, pa kredite, model i panjohur) e pezullojnë Baldrick dhe njoftojnë marrësit më sipër."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Koha e pritjes së lidhjes (sekonda)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Sa gjatë pritet që ofruesi të pranojë lidhjen. E shkurtër, që problemet e rrjetit të shfaqen shpejt."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Koha e pritjes së përgjigjes së klasifikimit (sekonda)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Sa gjatë pritet për përgjigjen e plotë të modelit të klasifikimit (është e shkurtër)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Koha e pritjes së përgjigjes (sekonda)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Sa gjatë pritet për përgjigjen e plotë të modelit të përgjigjes. Përgjigjet nuk transmetohen në rrjedhë: kjo përfshin shkrimin e gjithë përgjigjes, dhe modelet që mendojnë fillimisht mund të kërkojnë një minutë ose më shumë."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Tokena maksimalë të klasifikimit"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Tokena maksimalë të përgjigjes"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Kufiri i sipërm i daljes së modelit (përfshirë të menduarit e tij, për modelet që mendojnë). Rriteni nëse përgjigjet priten."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Pritja maksimale në radhë (orë)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Temat që ende presin pas kësaj kohe (p.sh. pas një ndërprerjeje të ofruesit) anashkalohen: një përgjigje ditë më vonë do të ishte e çuditshme. 0: pa kufi."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pezullimi pas gabimeve të llogarisë (minuta)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Pas një çelësi të pavlefshëm, kredive ose kuotës së shteruar, ose një modeli të panjohur, Baldrick pezullohet (temat në radhë presin), dërgon një e-mail një herë marrësve të njoftimeve, dhe provon sërish pas kaq minutash derisa ofruesi të përgjigjet. Ruajtja e këtyre cilësimeve e përfundon pezullimin."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Rifresko"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Shfaq të gjitha modelet"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Përfshi modelet që nuk shkruajnë përgjigje bisede (embeddings, të folur, imazhe...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Shkruani për të kërkuar modelet"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Asnjë model nuk përputhet"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Çmimet u plotësuan nga lista e ofruesit."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Kërkim i thjeshtë: postimet e fundit të kërkuara"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Pa një indeks me tekst të plotë (SQLite, ose para se ta krijoni te Meela > Baldrick AI) temat e ngjashme gjenden duke lexuar postimet, rreth 2.5 sekonda për 50,000 postime: kërkohen vetëm kaq postime të fundit (0: të gjitha). Me indeksin, kërkohet çdo postim."
