PLG_KUNENA_BALDRICK_PRICE_IN = "Cijena: ulaz"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cijena: izlaz"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD po milijun tokena, za procjene troškova. Prazno: cijena s popisa za poznate Claude modele, inače 0 (osim ako pružatelj sam navodi trošak)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Koristi vezu koraka 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Koristi istu vrstu API-ja, osnovnu adresu i ključ kao korak razvrstavanja (s modelom odabranim niže). Odaberi Ne za drugog pružatelja za odgovore."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: zamjenski model pri odbijanju"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Samo na Anthropicovu vlastitom API-ju s Opus/Sonnet 5.x modelima: kada sigurnosne provjere modela odbiju zahtjev, API ga ponovno izvodi na zamjenskom modelu koji odabire Anthropic (zamjenski modeli na poslužiteljskoj strani). Nije dostupno za Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Probni rad"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Za testiranje postavki: Baldrick odgovara samo u temama koje su započeli administratori i moderatori (nove teme i njihovi nastavci na Baldrickove odgovore) i nikad ne povlači objave (spam se samo prijavljuje)."
PLG_KUNENA_BALDRICK_USER = "Baldrickov korisnik"
PLG_KUNENA_BALDRICK_USER_DESC = "Korisnik kao kojega Baldrick objavljuje. Ostavi prazno da se automatski stvori korisnik &quot;Baldrick&quot; (bez upotrebljive lozinke i stvarne e-adrese). Postavi mu avatar i potpis u forum profilu (novi korisnik dobiva potpis &quot;Odgovorio Baldrick AI, moj gospodaru, koristeći lukav model (...i zapamti da AI može griješiti, pa dvaput provjeri odgovore)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Oživi nakon (dana)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Odgovor na temu čija je prethodna objava starija od ovoga obrađuje se kao novo pitanje."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Odgovora po temi"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Koliko puta Baldrick smije odgovoriti u istoj temi: njegov prvi odgovor i njegovi odgovori kada pokretač teme odgovori njemu (traženi detalji, daljnje pitanje) ili se tema oživi nakon duge šutnje."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Odgovora dnevno"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Najviše toliko odgovora u 24 sata (0: bez ograničenja). Štiti tvoj API budžet od poplava."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Najmanja duljina objave"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Objave kraće od ovoga (znakova, bez oblikovanja) se ignoriraju."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Samo u ovim kategorijama"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Odgovaraj samo u ovim kategorijama (nijedna nije odabrana: sve kategorije)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nikad u ovim kategorijama"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nikad ne odgovaraj u ovim kategorijama."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Samo javne kategorije"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Odgovaraj samo u kategorijama koje gosti mogu čitati, tako da se nikakav privatni sadržaj ne šalje AI pružatelju. Povezane teme uvijek se uzimaju samo iz javnih kategorija."

PLG_KUNENA_BALDRICK_TRANSLATE = "Dodaj englesku inačicu"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick odgovara na jeziku autora. Uz ovu opciju odgovore na drugim jezicima slijedi engleski prijevod (korisno za englesko osoblje i čitatelje)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Povezane teme"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Koliko povezanih javnih tema (pronađenih upitima pretrage koraka razvrstavanja) se daje modelu za odgovore."
PLG_KUNENA_BALDRICK_PRESET = "Ugrađena glavna uputa"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Upute od kojih svaki odgovor polazi (samo za čitanje). Kontekst tvoje stranice ispod dodaje se njima."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontekst stranice"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Čime se forum bavi, podržani proizvodi i verzije, poveznice na dokumentaciju, ton koji treba koristiti, što Baldrick nikad ne smije raditi... Dodaje se uputama oba koraka (također pomaže modelu za razvrstavanje da razlikuje spam od objava na temu)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "npr. Ovo je forum za podršku tvrtke ExampleSoft. Podržavamo verzije 3 i 4. Dokumentacija je na https://docs.example.com. Nikad ne obećavaj povrat novca."
PLG_KUNENA_BALDRICK_CANNED = "Gotovi odgovori"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Odgovori na pitanja koja su preširoka (AI odgovor se ne piše) i zamjenski odgovori kada se odgovor ne može napisati. Odvoji odgovore crtom od tri crtice (---); jedan se bira nasumično. Zamjenske oznake: {name} (autor), {search_url} (pretraga foruma za pitanje), {forum_url}, {topic_url}. Forum BBCode je dopušten."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
