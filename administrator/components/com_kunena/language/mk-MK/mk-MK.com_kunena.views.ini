COM_KUNENA_CFG_SEO_STRUCTURED_DATA_DESC="Им ги опишува темите и профилите на членовите на пребарувачите со структурираните податоци на Google (JSON-LD: DiscussionForumPosting со одговорите прикажани на страницата, ProfilePage). Само за категории што гостите можат да ги читаат. Исклучете го ако друго проширување веќе додава структурирани податоци на страниците на форумот."
COM_KUNENA_CFG_SEO_SOCIAL_TAGS="Ознаки OpenGraph и X"
COM_KUNENA_CFG_SEO_SOCIAL_TAGS_DESC="Додава ознаки OpenGraph (Facebook, LinkedIn, апликации за пораки) и картички X на страниците на форумот, за споделените врски да прикажуваат наслов, опис и слика. Исклучете го ако друго проширување веќе ги додава овие ознаки."
COM_KUNENA_CFG_SEO_SHARE_IMAGE="Стандардна слика за споделување"
COM_KUNENA_CFG_SEO_SHARE_IMAGE_DESC="Слика што се прикажува со споделени врски на страници без своја слика (кога има, се користи првата прикачена слика на темата): изберете ја или качете ја со Media Manager. Препорачана големина: 1200 x 630 пиксели."
