PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "זמן המתנה לתשובה (שניות)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "כמה זמן להמתין לתשובה המלאה של מודל התשובות. התשובות אינן מועברות בזרם: זה כולל כתיבת התשובה כולה, ומודלים שחושבים קודם עשויים להזדקק לדקה או יותר."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "מספר טוקנים מירבי למיון"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "מספר טוקנים מירבי לתשובה"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "הגבול העליון לפלט של המודל (כולל החשיבה שלו, במודלים שחושבים). העלה אותו אם התשובות נקטעות."
PLG_KUNENA_BALDRICK_MAX_WAIT = "זמן המתנה מרבי בתור (שעות)"
