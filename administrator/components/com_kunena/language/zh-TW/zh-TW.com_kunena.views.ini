COM_KUNENA_A_DISPLAY_NAME = "顯示名稱"
COM_KUNENA_A_DISPLAY_THANKYOU_NUMBERS = "顯示的致謝數量"
COM_KUNENA_A_EBAYLANGUAGECODE = "eBay 標示語言代碼"
COM_KUNENA_A_EBAYLANGUAGECODE_DESC = "很重要！請設定正確的語言代碼，因為 eBay 標示根據此代碼來選擇正確的語言和貨幣。預設是 en-us ，針對 ebay.com 英文網站. 示範：ebay.de: de-de, ebay.at: de-at, ebay.co.uk: en-gb"
COM_KUNENA_A_EMAIL = "討論區 E-mail 地址"
COM_KUNENA_A_ENABLED_DESC = "開啟討論區上的投票功能。必須設為 <b>是</b> 才能支持投票。另外，你還必須在下面指定允許發起投票的分類分類 ID。如果不指定分類，則投票功能無法使用。"
COM_KUNENA_A_FAVORITES = "允許收藏"
COM_KUNENA_A_FAVORITES_DESC = "如果你想要允許註冊會員收藏某個話題，選擇“<b>是</b>”。"
COM_KUNENA_A_FILE = "檔案"
COM_KUNENA_A_FILEALLOWEDTYPES = "允許上傳的檔案類型"
COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "會員可附加的檔案類型：以逗號分隔的小寫副檔名（會移除空格）。預設：txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov。絕不允許可執行檔與網頁類型。留空時，儲存時會恢復預設值。"
COM_KUNENA_A_FILESIZE = "最大的檔案大小<br /><b>（以 KB 計）</b>"
COM_KUNENA_A_FILESIZE_DESC = "最大允許上傳多大的檔案<b>（單位：KB）</b>？   <strong>你不能超過 PHP 上傳限額 post_max_size: %s 和 upload_max_filesize: %s </strong>。如果想修改 PHP 上傳限額，請參看你的 php.ini (%s) 相關設定。"
COM_KUNENA_A_FILESIZE_KB = "KB"
COM_KUNENA_A_FLOOD = "防止灌水"
COM_KUNENA_A_FLOOD_DESC = "同一位會員連續寫文章的最小間隔時間（單位：秒）. 設為0 將會關閉此功能. 注意: 防灌水功能 <b>會降低系統性能</b>。"
COM_KUNENA_A_FORUM_JUMP = "啟用討論區跳轉"
COM_KUNENA_A_FORUM_JUMP_DESC = "如果選擇“是”，在討論區每個頁面上將出現選擇選單讓您快速跳至另一個分類討論區。"
COM_KUNENA_A_FRONTEND = "前台"
COM_KUNENA_A_GHOSTMESSAGE = "幽靈文章勾選框預設已勾選？"
COM_KUNENA_A_HIGHLIGHTCODE = "啟用代碼反白顯示"
COM_KUNENA_A_HIGHLIGHTCODE_DESC = "啟用 Meela 的代表標記反白顯示功能。如果會員在文章中用 [code] 標記包含了 php 及類似程式代碼片段，則啟用本功能後可以用不同顏色顯示不同的代碼字串。 如果您的討論區文章中不會有人張貼程式代碼，那麼可以關閉此功能以免代碼標記帶來錯誤。"
COM_KUNENA_A_HISTLIM = "最多顯示多少舊文章"
COM_KUNENA_A_HISTLIM_DESC = "顯示多少個前人文章？"
COM_KUNENA_A_HISTORY = "顯示前人文章"
COM_KUNENA_A_HISTORY_DESC = "選擇“<b>是</b>”，當您回覆或引用時，將顯示該話題的已發文章供參考"
COM_KUNENA_A_IMAGE = "影像"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES = "合法的 MIME 類型"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "開啟「檢查 MIME 類型」時接受的圖片 MIME 類型：以逗號分隔，<strong>小寫</strong>。預設：image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif。留空時，儲存時會恢復預設值。"
COM_KUNENA_A_IMAGEALLOWEDTYPES = "允許的影像類型"
COM_KUNENA_A_IMAGEALLOWEDTYPES_DESC = "會員可附加的圖片類型：以逗號分隔，<strong>小寫</strong>的副檔名（會移除空格）。預設：jpg,jpeg,gif,png,webp,avif（WebP 與 AVIF 僅在伺服器的 PHP 能處理時可用）。留空時，儲存時會恢復預設值。"
COM_KUNENA_A_IMAGECHECKMIMETYPES = "檢查 MIME 類型"
COM_KUNENA_A_IMGHEIGHT = "圖片高度最大值"
COM_KUNENA_A_IMGHEIGHT_DESC = "影像的最大高度（單位：像素）。比這個值大的影像也能上傳，但是會被自動縮小到這個限制值。"
COM_KUNENA_A_IMGQUALITY = "jpg 圖片調整尺寸時的品質"
COM_KUNENA_A_IMGQUALITY_DESC = "縮放後的 JPEG、WebP 與 AVIF 圖片品質，1 至 100：數值越高品質越好，但檔案越大。預設：50（常用值：50-85）。PNG 與 GIF 圖片縮放時不會失真。"
COM_KUNENA_A_IMGSIZE = "圖片檔案大小最大值<br />（<b>以 KB 計</b>）"
COM_KUNENA_A_IMGSIZE_DESC = "允許上傳的影像的最大檔案大小，單位：<b>KB</b>。 <strong>你不能超過 PHP 上傳限額： post_max_size: %s 及 upload_max_filesize: %s </strong>.若想修改 PHP 上傳限額，請編輯你的 php.ini (%s) 檔案中的設定。"
COM_KUNENA_A_IMGTHUMBHEIGHT = "縮圖高度"
COM_KUNENA_A_IMGTHUMBHEIGHT_DESC = "縮圖的高度（單位：像素）。最終顯示的屬性可能與圖片本身的屬性有差異。"
COM_KUNENA_A_IMGTHUMBWIDTH = "縮圖寬度"
COM_KUNENA_A_IMGTHUMBWIDTH_DESC = "縮圖的寬度（單位：像素）。 最終顯示的屬性可能與圖片本身的屬性有差異。"
COM_KUNENA_A_IMGWIDTH = "圖片寬度最大值"
COM_KUNENA_A_IMGWIDTH_DESC = "圖片寬度最大值（單位：像素）。 比這個值大的影像也能上傳，但是會被自動縮小到這個限制值。"
COM_KUNENA_A_KARMA = "顯示人氣指示器"
COM_KUNENA_A_KARMA_DESC = "設成“<b>是</b>”， 會顯示會員的人氣值以及相關的按鈕 (增加 / 減少) ，如果會員統計功能被啟用的話。"
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT = "Session 有效時間"
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT_DESC = "預設是 1800 秒. Session 有效時間類似於 Joomla 的 session 有效時間。session 有效時間對於判斷訪問權限、哪些會員線上以及文章是否算作“新文章”很重要。超過這個時間後，session 就過期，訪問權限和“新文章”標示就會重新設定。"
