PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Sailkatzearen erantzun-denbora (segundo)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Zenbat itxaron sailkatze-ereduaren erantzun osoaren zain (laburra da)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Erantzunaren itxaron-denbora (segundo)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Zenbat itxaron erantzun-ereduaren erantzun osoaren zain. Erantzunak ez dira streaming bidez bidaltzen: erantzun osoa idaztea hartzen du, eta lehenik pentsatzen duten ereduek minutu bat edo gehiago behar dezakete."
