PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: ordezko eredua uko egitean"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Anthropic-en API propioan eta Opus/Sonnet 5.x ereduekin bakarrik: ereduaren segurtasun-egiaztapenek eskaera bat baztertzen dutenean, API-ak berriro exekutatzen du Anthropic-ek aukeratutako ordezko eredu batekin (zerbitzari-aldeko ordezkoak). Haiku-rako ez dago eskuragarri."

PLG_KUNENA_BALDRICK_DRY_RUN = "Proba-exekuzioa"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Konfigurazioa probatzeko: Baldrick-ek administratzaileek eta moderatzaileek hasitako gaietan bakarrik erantzuten du (gai berriak, eta Baldrick-i egindako jarraipen-erantzunak), eta ez du inoiz mezurik argitaratu gabe uzten (spama salatu bakarrik egiten da)."
PLG_KUNENA_BALDRICK_USER = "Baldrick-en erabiltzailea"
PLG_KUNENA_BALDRICK_USER_DESC = "Baldrick-ek argitaratzeko erabiltzen duen erabiltzailea. Utzi hutsik &quot;Baldrick&quot; erabiltzaile bat automatikoki sor dadin (pasahitz erabilgarririk gabe, benetako e-posta helbiderik gabe). Ezarri bere abatarra eta sinadura bere foro-profilean (erabiltzaile berriak &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot; sinadura jasotzen du)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Berpiztu ondoren (egun)"
