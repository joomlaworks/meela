PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, la AI-unua respondanto de la forumo: respondas al novaj temoj kaj al temoj revivigitaj post longa silento kiam neniu administranto aŭ moderanto respondis, per Anthropic aŭ OpenAI-kongruaj API-oj. <strong>Privateco:</strong> la teksto de la temoj, kiujn ĝi traktas (kaj de rilataj publikaj temoj), estas sendata al la AI-provizanto, kiun vi agordas; mencii tion en via privateca politiko. Agado, sumoj kaj kostoj: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Paŝo 1: ordiga modelo (malgranda, malmultekosta)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Legas ĉiun novan demandon unue: taksas ĝin (respondebla, tro larĝa, mankas detaloj, ne demando, spamo) kaj verkas la serĉdemandojn por rilataj temoj. Malgranda, rapida modelo sufiĉas."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Paŝo 2: responda modelo (pli kapabla)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Verkas la respondon al klaraj demandoj, uzante la temon kaj la rilatajn publikajn temojn trovitajn en la forumo. Ĝi povas uzi la konekton de paŝo 1 kun alia modelo, aŭ propran konekton."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kiam Baldrick respondas"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick rigardas ĉiun novan temon, la respondojn de la komencinto de la temo al Baldrick (konversacio), kaj respondojn al temoj silentaj dum pli ol la nombro de tagoj sube. Ĝi neniam respondas kiam la lasta notico venas de administranto aŭ moderanto."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kiel Baldrick respondas"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Respondoj estas publikigataj tuj kiel la uzanto de Baldrick, en forumo-BBCode. Ligiloj al forumaj temoj estas relativaj."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spamo"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kiam la ordiga modelo certas, ke notico estas spamo (reklamo, telefonnumeroj, SEO-ligiloj...), Baldrick malpublikigas ĝin: la tutan temon kiam ĝi estas la unua notico. Malpublikigitaj noticoj atendas moderigon, do eraro estas malfarita per aprobo."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Sciigoj"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Plata teksta retmesaĝo estas sendata per la poŝtaj agordoj de Joomla, kun la unua notico de la temo kaj ĝiaj lastaj 5 noticoj, plej novaj unue. Spamagoj kaj eraroj (temo, pri kiu Baldrick rezignis, paŭzo ĉar la AI-provizanto rifuzas ĝiajn petojn) ĉiam estas sciigataj. La rezulto de ĉiu retmesaĝo estas montrata en la agadprotokolo."

PLG_KUNENA_BALDRICK_PROVIDER = "API-tipo"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, kaj Anthropic-kongruaj finpunktoj kiel tiu de Qwen), aŭ OpenAI-kongruaj Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-kongrua (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-kongrua (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Baza URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Lasu malplena por la oficiala API (https://api.anthropic.com aŭ https://api.openai.com/v1). Ekzemploj por Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-kongrua) aŭ https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-kongrua)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Malplena: la oficiala API"
PLG_KUNENA_BALDRICK_API_KEY = "API-ŝlosilo"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "La API-ŝlosilo de la provizanto. Baldrick faras nenion ĝis ŝlosilo kaj la modeloj estas agorditaj."
PLG_KUNENA_BALDRICK_MODEL = "Modelo"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modelo de la ordiga paŝo, ekz. claude-haiku-5-5. &quot;Preni modelojn&quot; listigas la modelojn de la provizanto kun la supraj valoroj (konservitaj aŭ ne) en serĉebla listo (konservita dum horo; &quot;Aktualigi&quot; demandas denove); vi ankaŭ povas tajpi nomon. &quot;Testi&quot; sendas etan peton al la modelo."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modelo de la responda paŝo, ekz. claude-sonnet-5-5 (aŭ claude-opus-5-5 por la plej bonaj respondoj). &quot;Preni modelojn&quot; listigas la modelojn de la provizanto; vi ankaŭ povas tajpi nomon. &quot;Testi&quot; sendas etan peton al la modelo."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Preni modelojn"
PLG_KUNENA_BALDRICK_TEST = "Testi"
PLG_KUNENA_BALDRICK_WORKING = "Laboras..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Elektu modelon -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "La peto malsukcesis."
PLG_KUNENA_BALDRICK_PRICE_IN = "Prezo: enigo"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Prezo: eligo"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD por miliono da ĵetonoj, por la kostotaksoj. Malplena: la listprezo por konataj Claude-modeloj, alie 0 (krom se la provizanto mem raportas la koston)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Uzi la konekton de paŝo 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Uzi la saman API-tipon, bazan URL kaj ŝlosilon kiel la ordiga paŝo (kun la modelo elektita sube). Elektu Ne por uzi alian provizanton por la respondoj."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: rezerva modelo ĉe rifuzoj"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Nur ĉe la propra API de Anthropic kun modeloj Opus/Sonnet 5.x: kiam la sekurecaj kontroloj de la modelo malakceptas peton, la API ruligas ĝin denove per rezerva modelo elektita de Anthropic (servilflankaj rezervoj). Ne disponebla por Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Provo sen efiko"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Por testi la agordon: Baldrick respondas nur en temoj komencitaj de administrantoj kaj moderantoj (novaj temoj, kaj iliaj postaj mesaĝoj al Baldrick), kaj neniam malpublikigas noticojn (spamo estas nur raportita)."
PLG_KUNENA_BALDRICK_USER = "Uzanto de Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "La uzanto, kiel kiu Baldrick afiŝas. Lasu malplena por ke uzanto &quot;Baldrick&quot; estu kreita aŭtomate (neniu uzebla pasvorto, neniu reala retpoŝtadreso). Agordu ĝian avataron kaj subskribon en ĝia foruma profilo (nova uzanto ricevas la subskribon &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Revivigi post (tagoj)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Respondo al temo, kies antaŭa notico estas pli malnova ol ĉi tio, estas traktata kiel nova demando."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Respondoj por temo"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Kiom fojojn Baldrick rajtas respondi en la sama temo: ĝia unua respondo, kaj ĝiaj respondoj kiam la komencinto de la temo respondas al ĝi (petitaj detaloj, plia demando) aŭ la temo estas revivigita post longa silento."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Respondoj tage"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Plejmulte tiom da respondoj en 24 horoj (0: sen limo). Protektas vian API-buĝeton kontraŭ inundoj."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimuma longo de notico"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Noticoj pli mallongaj ol ĉi tio (signoj, sen formatado) estas ignorataj."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Nur ĉi tiuj kategorioj"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Respondi nur en ĉi tiuj kategorioj (neniu elektita: ĉiuj kategorioj)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Neniam en ĉi tiuj kategorioj"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Neniam respondi en ĉi tiuj kategorioj."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Nur publikaj kategorioj"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Respondi nur en kategorioj legeblaj de gastoj, por ke neniu privata enhavo estu sendita al la AI-provizanto. Rilataj temoj estas ĉiam prenataj nur el publikaj kategorioj."

PLG_KUNENA_BALDRICK_TRANSLATE = "Aldoni anglan tradukon"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick respondas en la lingvo de la afiŝinto. Kun ĉi tiu opcio, respondoj en aliaj lingvoj estas sekvataj de angla traduko (utila por angleparolanta teamo kaj legantoj)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Rilataj temoj"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Kiom da rilataj publikaj temoj (trovitaj per la serĉdemandoj de la ordiga paŝo) estas donitaj al la responda modelo."
PLG_KUNENA_BALDRICK_PRESET = "Enkonstruita ĉefa instrukcio"
PLG_KUNENA_BALDRICK_PRESET_DESC = "La instrukcioj, de kiuj ĉiu respondo komenciĝas (nurlege). Via retejkunteksto sube estas aldonita al ili."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Retejkunteksto"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Pri kio temas la forumo, produktoj kaj subtenataj versioj, ligiloj al dokumentaro, la uzenda tono, kion Baldrick neniam devas fari... Aldonita al la instrukcioj de ambaŭ paŝoj (ĝi ankaŭ helpas la ordigan modelon distingi spamon de temaj noticoj)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "ekz. Ĉi tio estas la subtena forumo de ExampleSoft. Ni subtenas versiojn 3 kaj 4. La dokumentaro estas ĉe https://docs.example.com. Neniam promesu repagojn."
PLG_KUNENA_BALDRICK_CANNED = "Pretaj respondoj"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Respondoj al demandoj tro larĝaj (neniu AI-respondo estas verkita), kaj rezervaj kiam neniu respondo povas esti verkita. Apartigu respondojn per linio de tri streketoj (---); unu estas elektata hazarde. Lokokupiloj: {name} (la afiŝinto), {search_url} (foruma serĉo de la demando), {forum_url}, {topic_url}. Forumo-BBCode estas permesata."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spamo"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Kion fari kiam la ordiga modelo certas, ke notico estas spamo. Retmesaĝo estas sendata en la unuaj du kazoj."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Malpublikigi (la tutan temon por unua notico) kaj sciigi"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Nur sciigi"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignori"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Fidata post (noticoj)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Noticoj de uzantoj kun almenaŭ tiom da publikigitaj noticoj, kaj de la teamo, neniam estas malpublikigataj: ili estas nur raportataj."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Sciigi ĉi tiujn teamanojn"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Uzantoj, administrantoj kaj moderantoj de Meela, kiuj ricevas la sciigojn (Ctrl/Cmd+klako por elekti plurajn)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Sciigi pri"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Ĉiu respondo afiŝita de Baldrick (respondoj, pretaj respondoj, petoj de detaloj) kaj spamo, aŭ nur spamo. Eraroj ĉiam estas sciigataj."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Ĉiu respondo, spamo kaj eraroj"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Nur spamo kaj eraroj"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Sciigi ĉi tiujn adresojn"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Pliaj retpoŝtadresoj, apartigitaj per komoj."

PLG_KUNENA_BALDRICK_PROCESSING = "Prilaborado"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Aŭtomate: tuj post kiam la paĝo, kiu envicigis temon, estis sendita (kun PHP-FPM), aŭ per fona peto al la retejo mem. Nur komandlinio: ruligu &quot;php cli/joomla.php kunena:baldrick:process&quot; el cron (Joomla 3.x UTD), ekz. ĉiun minuton."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Aŭtomate"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Nur komandlinio (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Konservi la agadprotokolon (tagoj)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Linioj de la agadprotokolo pli malnovaj ol ĉi tio estas forigitaj. Monataj sumoj estas konservitaj dum 36 monatoj."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Altnivele: prilaborado, limoj kaj tempolimoj"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Afiŝado neniam atendas la AI: temoj estas envicigitaj kaj prilaborataj en la fono. Retaj eraroj, ritmolimoj kaj troŝarĝitaj provizantoj estas reprovataj (tuj kiam la provizanto permesas), poste la temo estas reprovata pli poste (3 provoj). Eraroj de la konto (nevalida ŝlosilo, neniuj kreditoj, nekonata modelo) paŭzigas Baldrick kaj sciigas la supre menciitajn ricevantojn."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Tempolimo de konekto (sekundoj)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Kiom longe atendi, ke la provizanto akceptu la konekton. Mallonga, por ke retaj problemoj montriĝu rapide."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Tempolimo de ordiga respondo (sekundoj)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Kiom longe atendi la kompletan respondon de la ordiga modelo (ĝi estas mallonga)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Tempolimo de respondo (sekundoj)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Kiom longe atendi la kompletan respondon de la responda modelo. Respondoj ne estas fluigitaj: ĉi tio kovras la skribon de la tuta respondo, kaj modeloj, kiuj unue pensas, eble bezonas minuton aŭ pli."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maksimumaj ĵetonoj de ordigo"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maksimumaj ĵetonoj de respondo"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Supra limo de la eligo de la modelo (inkluzive de ĝia pensado, ĉe modeloj kiuj pensas). Pliigu ĝin se respondoj estas detranĉitaj."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maksimuma atendo en la atendovico (horoj)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Temoj ankoraŭ atendantaj post tiom da tempo (ekz. post paneo de la provizanto) estas preterpasitaj: respondo post tagoj estus stranga. 0: sen limo."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Paŭzo post kontaj eraroj (minutoj)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Post nevalida ŝlosilo, elĉerpitaj kreditoj aŭ kvoto, aŭ nekonata modelo, Baldrick paŭzas (atendantaj temoj atendas), unufoje retpoŝte sciigas la ricevantojn, kaj reprovas post tiom da minutoj ĝis la provizanto respondas. Konservi ĉi tiujn agordojn finas la paŭzon."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Aktualigi"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Montri ĉiujn modelojn"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Inkluzivi modelojn, kiuj ne povas verki babilajn respondojn (enkonstruoj, parolo, bildoj...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Tajpu por serĉi la modelojn"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Neniu modelo kongruas"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Prezoj plenigitaj el la listo de la provizanto."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Simpla serĉo: serĉitaj lastaj noticoj"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Sen plenteksta indekso (SQLite, aŭ antaŭ ol vi kreas ĝin en Meela > Baldrick AI) rilataj temoj estas trovataj per legado de la noticoj, ĉirkaŭ 2,5 sekundoj por 50 000 noticoj: nur tiom da lastaj noticoj estas serĉataj (0: ĉiuj). Kun la indekso, ĉiu notico estas serĉata."
