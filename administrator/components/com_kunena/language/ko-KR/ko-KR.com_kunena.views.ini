COM_KUNENA_A_MAILADMIN_DESC = "Set to <em>Unapproved Posts</em> or <em>All New Posts</em> if you want e-mail notifications on new new posts sent to the Meela administrators."
COM_KUNENA_A_MESSAGES = "Messages Per Page"
COM_KUNENA_A_MESSAGES_DESC = "Number of messages per page to show"
