PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Bundan eski işlem günlüğü satırları silinir. Aylık toplamlar 36 ay saklanır."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Gelişmiş: işleme, sınırlar ve zaman aşımları"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Gönderi hiçbir zaman yapay zekâyı beklemez: konular kuyruğa alınır ve arka planda işlenir. Ağ hataları, hız sınırları ve aşırı yüklü sağlayıcılar yeniden denenir (sağlayıcının izin verdiği anda), ardından konu daha sonra yeniden denenir (3 deneme). Hesapla ilgili hatalar (geçersiz anahtar, kredi yok, bilinmeyen model) Baldrick'i duraklatır ve yukarıdaki alıcıları bilgilendirir."
