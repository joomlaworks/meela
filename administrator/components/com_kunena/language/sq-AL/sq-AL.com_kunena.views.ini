COM_KUNENA_A_IMGQUALITY_DESC = "Cilësia e imazheve JPEG, WebP dhe AVIF të ripërmasuara, 1 deri 100: më e lartë do të thotë cilësi më e mirë por skedarë më të mëdhenj. Parazgjedhja: 50 (vlera të zakonshme: 50-85). Imazhet PNG dhe GIF ripërmasohen pa humbje."
