PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, der KI-Erstantworter des Forums: antwortet auf neue Themen und auf Themen, die nach langer Stille wiederbelebt werden, wenn kein Administrator oder Moderator geantwortet hat, über Anthropic- oder OpenAI-kompatible APIs. <strong>Datenschutz:</strong> Der Text der Themen, die er bearbeitet (und verwandter öffentlicher Themen), wird an den von Ihnen konfigurierten KI-Anbieter gesendet; nennen Sie dies in Ihrer Datenschutzerklärung. Aktivität, Summen und Kosten: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Schritt 1: Sortiermodell (klein, günstig)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Liest zuerst jede neue Frage: bewertet sie (beantwortbar, zu allgemein, Details fehlen, keine Frage, Spam) und schreibt die Suchbegriffe für verwandte Themen. Ein kleines, schnelles Modell genügt."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Schritt 2: Antwortmodell (leistungsfähiger)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Schreibt die Antwort auf eindeutige Fragen anhand des Themas und der im Forum gefundenen verwandten öffentlichen Themen. Es kann die Verbindung von Schritt 1 mit einem anderen Modell verwenden oder eine eigene Verbindung haben."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Wann Baldrick antwortet"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick schaut sich jedes neue Thema an, die Antworten des Themenerstellers an Baldrick (ein Gespräch) und Antworten auf Themen, die länger als die unten genannte Anzahl Tage still waren. Er antwortet nie, wenn der letzte Beitrag von einem Administrator oder Moderator stammt."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Wie Baldrick antwortet"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Antworten werden sofort unter dem Benutzer von Baldrick veröffentlicht, im BBCode des Forums. Links zu Forenthemen sind relativ."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Ist das Sortiermodell sicher, dass ein Beitrag Spam ist (Werbung, Telefonnummern, SEO-Links ...), unveröffentlicht Baldrick ihn: bei einem ersten Beitrag das ganze Thema. Unveröffentlichte Beiträge warten auf Moderation, ein Irrtum lässt sich also durch Freigeben rückgängig machen."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Benachrichtigungen"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Eine reine Text-E-Mail wird über die Mail-Einstellungen von Joomla gesendet, mit dem ersten Beitrag des Themas und seinen letzten 5 Beiträgen, die neuesten zuerst. Spam-Aktionen und Fehler (ein Thema, das Baldrick aufgegeben hat, eine Pause, weil der KI-Anbieter Anfragen ablehnt) werden immer gemeldet. Das Ergebnis jeder E-Mail wird im Aktivitätsprotokoll angezeigt."

PLG_KUNENA_BALDRICK_PROVIDER = "API-Typ"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude sowie Anthropic-kompatible Endpunkte wie der von Qwen) oder OpenAI-kompatible Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM ...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-kompatibel (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-kompatibel (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Basis-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Leer lassen für die offizielle API (https://api.anthropic.com oder https://api.openai.com/v1). Beispiele für Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-kompatibel) oder https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-kompatibel)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Leer: die offizielle API"
PLG_KUNENA_BALDRICK_API_KEY = "API-Schlüssel"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Der API-Schlüssel des Anbieters. Baldrick tut nichts, bis ein Schlüssel und die Modelle eingestellt sind."
PLG_KUNENA_BALDRICK_MODEL = "Modell"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modell des Sortierschritts, z. B. claude-haiku-5-5. &quot;Modelle abrufen&quot; listet die Modelle des Anbieters mit den oben eingetragenen Werten (gespeichert oder nicht) in einer durchsuchbaren Liste auf (eine Stunde gespeichert; &quot;Aktualisieren&quot; fragt erneut ab); Sie können auch einen Namen eingeben. &quot;Testen&quot; sendet eine kleine Anfrage an das Modell."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modell des Antwortschritts, z. B. claude-sonnet-5-5 (oder claude-opus-5-5 für die besten Antworten). &quot;Modelle abrufen&quot; listet die Modelle des Anbieters auf; Sie können auch einen Namen eingeben. &quot;Testen&quot; sendet eine kleine Anfrage an das Modell."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Modelle abrufen"
PLG_KUNENA_BALDRICK_TEST = "Testen"
PLG_KUNENA_BALDRICK_WORKING = "Wird bearbeitet ..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Modell auswählen -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Die Anfrage ist fehlgeschlagen."
PLG_KUNENA_BALDRICK_PRICE_IN = "Preis: Eingabe"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Preis: Ausgabe"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD pro Million Tokens, für die Kostenschätzungen. Leer: der Listenpreis für bekannte Claude-Modelle, sonst 0 (sofern der Anbieter die Kosten nicht selbst meldet)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Verbindung von Schritt 1 verwenden"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Denselben API-Typ, dieselbe Basis-URL und denselben Schlüssel wie im Sortierschritt verwenden (mit dem unten gewählten Modell). Wählen Sie Nein, um für die Antworten einen anderen Anbieter zu verwenden."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: Ausweichmodell bei Ablehnungen"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Nur bei der eigenen API von Anthropic mit Opus- und Sonnet-5.x-Modellen: Lehnen die Sicherheitsprüfungen des Modells eine Anfrage ab, führt die API sie mit einem von Anthropic gewählten Ausweichmodell erneut aus (serverseitige Ausweichmodelle). Für Haiku nicht verfügbar."

PLG_KUNENA_BALDRICK_DRY_RUN = "Testlauf"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Zum Testen der Konfiguration: Baldrick antwortet nur in Themen, die von Administratoren und Moderatoren begonnen wurden (neue Themen und deren Folgebeiträge an Baldrick), und unveröffentlicht nie Beiträge (Spam wird nur gemeldet)."
PLG_KUNENA_BALDRICK_USER = "Benutzer von Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Der Benutzer, als den Baldrick postet. Leer lassen, damit automatisch ein Benutzer &quot;Baldrick&quot; angelegt wird (kein nutzbares Passwort, keine echte E-Mail-Adresse). Legen Sie Avatar und Signatur in seinem Forenprofil fest (ein neuer Benutzer erhält die Signatur &quot;Beantwortet von Baldrick AI, mein Herr, mit einem listigen Modell (...und denken Sie daran, dass KI Fehler machen kann, prüfen Sie Antworten daher genau)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Wiederbeleben nach (Tage)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Eine Antwort auf ein Thema, dessen letzter Beitrag älter als dies ist, wird wie eine neue Frage behandelt."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Antworten pro Thema"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Wie oft Baldrick im selben Thema antworten darf: seine erste Antwort und seine Antworten, wenn der Themenersteller darauf antwortet (nachgefragte Details, eine weitere Frage) oder das Thema nach langer Stille wiederbelebt wird."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Antworten pro Tag"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Höchstens so viele Antworten in 24 Stunden (0: keine Begrenzung). Schützt Ihr API-Budget vor Überflutung."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Mindestlänge des Beitrags"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Kürzere Beiträge (Zeichen ohne Formatierung) werden ignoriert."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Nur in diesen Kategorien"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Nur in diesen Kategorien antworten (keine ausgewählt: alle Kategorien)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Niemals in diesen Kategorien"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "In diesen Kategorien wird nie geantwortet."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Nur öffentliche Kategorien"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Nur in Kategorien antworten, die Gäste lesen dürfen, damit kein privater Inhalt an den KI-Anbieter gesendet wird. Verwandte Themen stammen immer nur aus öffentlichen Kategorien."

PLG_KUNENA_BALDRICK_TRANSLATE = "Eine englische Übersetzung hinzufügen"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick antwortet in der Sprache des Verfassers. Mit dieser Option folgt auf Antworten in anderen Sprachen eine englische Übersetzung (nützlich für ein englischsprachiges Team und englischsprachige Leser)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Verwandte Themen"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Wie viele verwandte öffentliche Themen (gefunden mit den Suchbegriffen des Sortierschritts) dem Antwortmodell übergeben werden."
PLG_KUNENA_BALDRICK_PRESET = "Eingebauter Master-Prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Die Anweisungen, von denen jede Antwort ausgeht (nur lesbar). Ihr Website-Kontext unten wird ihnen hinzugefügt."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontext der Website"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Worum es im Forum geht, unterstützte Produkte und Versionen, Links zur Dokumentation, der zu verwendende Ton, was Baldrick niemals tun darf ... Wird den Prompts beider Schritte hinzugefügt (es hilft auch dem Sortiermodell, Spam von Beiträgen zum Thema zu unterscheiden)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "z. B. Dies ist das Supportforum von ExampleSoft. Wir unterstützen die Versionen 3 und 4. Die Dokumentation finden Sie unter https://docs.example.com. Versprechen Sie niemals Rückerstattungen."
PLG_KUNENA_BALDRICK_CANNED = "Standardantworten"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Antworten auf Fragen, die zu allgemein sind (dann wird keine KI-Antwort geschrieben), und Ersatzantworten, wenn keine Antwort verfasst werden kann. Trennen Sie die Antworten durch eine Zeile aus drei Strichen (---); eine davon wird zufällig gewählt. Platzhalter: {name} (der Verfasser), {search_url} (Forensuche nach der Frage), {forum_url}, {topic_url}. BBCode des Forums ist erlaubt."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Was geschehen soll, wenn das Sortiermodell sicher ist, dass ein Beitrag Spam ist. In den ersten beiden Fällen wird eine E-Mail gesendet."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Unveröffentlichen (bei einem ersten Beitrag das ganze Thema) und benachrichtigen"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Nur melden"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorieren"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Vertrauenswürdig ab (Beiträge)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Beiträge von Benutzern mit mindestens so vielen veröffentlichten Beiträgen sowie vom Team werden nie unveröffentlicht: Sie werden nur gemeldet."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Diese Teammitglieder benachrichtigen"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super-Benutzer, Administratoren und Moderatoren von Meela, die die Benachrichtigungen erhalten (Strg/Cmd+Klick, um mehrere auszuwählen)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Benachrichtigen bei"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Jeder Antwort, die Baldrick veröffentlicht (Antworten, Standardantworten, Nachfragen nach Details), und Spam, oder nur Spam. Fehler werden immer gemeldet."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Jeder Antwort, Spam und Fehlern"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Nur Spam und Fehlern"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Diese Adressen benachrichtigen"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Weitere E-Mail-Adressen, durch Kommas getrennt."

PLG_KUNENA_BALDRICK_PROCESSING = "Verarbeitung"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatisch: unmittelbar nachdem die Seite gesendet wurde, die ein Thema eingereiht hat (mit PHP-FPM), oder durch eine Hintergrundanfrage an die Website selbst. Nur Kommandozeile: Führen Sie &quot;php cli/joomla.php kunena:baldrick:process&quot; per Cron aus (Joomla 3.x UTD), z. B. jede Minute."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatisch"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Nur über die Kommandozeile (Cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Aktivitätsprotokoll aufbewahren (Tage)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Zeilen des Aktivitätsprotokolls, die älter sind, werden gelöscht. Monatssummen werden 36 Monate lang aufbewahrt."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Erweitert: Verarbeitung, Grenzen und Zeitlimits"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Das Veröffentlichen wartet nie auf die KI: Themen werden eingereiht und im Hintergrund verarbeitet. Netzwerkfehler, Ratenbegrenzungen und überlastete Anbieter werden wiederholt (sobald der Anbieter es zulässt), danach wird das Thema später erneut versucht (3 Versuche). Fehler des Kontos (ungültiger Schlüssel, kein Guthaben, unbekanntes Modell) pausieren Baldrick und benachrichtigen die oben genannten Empfänger."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Zeitlimit der Verbindung (Sekunden)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Wie lange auf die Annahme der Verbindung durch den Anbieter gewartet wird. Kurz, damit Netzwerkprobleme sofort sichtbar werden."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Zeitlimit der Antwort des Sortierschritts (Sekunden)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Wie lange auf die vollständige Antwort des Sortiermodells gewartet wird (sie ist kurz)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Zeitlimit der Antwort (Sekunden)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Wie lange auf die vollständige Antwort des Antwortmodells gewartet wird. Antworten werden nicht gestreamt: Dies umfasst das Schreiben der ganzen Antwort, und Modelle, die vorher nachdenken, brauchen unter Umständen eine Minute oder länger."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maximale Tokens des Sortierschritts"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maximale Tokens der Antwort"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Obergrenze der Ausgabe des Modells (einschließlich seines Denkens, bei denkenden Modellen). Erhöhen Sie sie, wenn Antworten abgeschnitten werden."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maximale Wartezeit in der Warteschlange (Stunden)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Themen, die noch länger warten (z. B. nach einem Ausfall des Anbieters), werden übersprungen: Eine Antwort Tage später wäre seltsam. 0: keine Begrenzung."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pause nach Kontofehlern (Minuten)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Nach einem ungültigen Schlüssel, aufgebrauchtem Guthaben oder Kontingent oder einem unbekannten Modell pausiert Baldrick (wartende Themen warten), benachrichtigt die Empfänger einmal per E-Mail und versucht es nach dieser Anzahl Minuten erneut, bis der Anbieter antwortet. Das Speichern dieser Einstellungen beendet die Pause."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Aktualisieren"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Alle Modelle anzeigen"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Auch Modelle einbeziehen, die keine Chat-Antworten schreiben können (Embeddings, Sprache, Bilder ...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Zum Suchen der Modelle eingeben"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Kein Modell passt"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Preise aus der Liste des Anbieters übernommen."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Einfache Suche: durchsuchte neueste Beiträge"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Ohne Volltextindex (SQLite oder bevor Sie ihn unter Meela > Baldrick AI erstellen) werden verwandte Themen durch Lesen der Beiträge gefunden, etwa 2,5 Sekunden pro 50.000 Beiträge: Nur so viele der neuesten Beiträge werden durchsucht (0: alle). Mit dem Index wird jeder Beitrag durchsucht."
