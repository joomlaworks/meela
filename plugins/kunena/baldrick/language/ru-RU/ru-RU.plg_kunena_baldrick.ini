PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Тайм-аут ответа сортировки (секунды)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Сколько ждать полного ответа модели сортировки (он короткий)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Тайм-аут получения ответа (секунды)"
