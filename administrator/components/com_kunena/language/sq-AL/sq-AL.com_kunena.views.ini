COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "Cilat lloje skedarësh mund të bashkëngjitin anëtarët: shtesa të ndara me presje, me shkronja të vogla (hapësirat hiqen). Parazgjedhja: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov. Llojet e ekzekutueshme dhe të faqeve web nuk lejohen kurrë. Nëse lihet bosh, parazgjedhja kthehet gjatë ruajtjes."
