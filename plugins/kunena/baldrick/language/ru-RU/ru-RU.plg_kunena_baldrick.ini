PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, первый ИИ-ответчик форума: отвечает на новые темы и на темы, оживлённые после долгого молчания, если администратор или модератор ещё не ответил, используя API Anthropic или совместимые с OpenAI. <strong>Конфиденциальность:</strong> текст обрабатываемых им тем (и связанных публичных тем) передаётся настроенному вами поставщику ИИ; укажите это в политике конфиденциальности. Действия, итоги и стоимость: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Шаг 1: модель сортировки (небольшая, дешёвая)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Сначала читает каждый новый вопрос: оценивает его (можно ответить, слишком общий, не хватает подробностей, не вопрос, спам) и составляет поисковые запросы для связанных тем. Достаточно небольшой быстрой модели."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Шаг 2: модель ответов (более мощная)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Пишет ответы на ясные вопросы, используя тему и связанные публичные темы форума. Может использовать подключение шага 1 с другой моделью или собственное подключение."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Когда Baldrick отвечает"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick просматривает каждую новую тему, ответы автора темы самому Baldrick (диалог) и ответы в темах, которые молчали дольше числа дней ниже. Он никогда не отвечает, если последнее сообщение написано администратором или модератором."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Как Baldrick отвечает"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Ответы публикуются сразу от имени пользователя Baldrick, в BBCode форума. Ссылки на темы форума относительные."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Спам"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Когда модель сортировки уверена, что сообщение — спам (реклама, телефонные номера, SEO-ссылки...), Baldrick снимает его с публикации: всю тему, если это первое сообщение. Снятые с публикации сообщения ждут модерации, поэтому ошибку исправляет их одобрение."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Уведомления"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Текстовое письмо отправляется через настройки почты Joomla: первое сообщение темы и её последние 5 сообщений, сначала новые. О спаме и ошибках (тема, от которой Baldrick отказался, пауза из-за отказов поставщика ИИ) уведомления отправляются всегда. Результат каждого письма показан в журнале действий."

