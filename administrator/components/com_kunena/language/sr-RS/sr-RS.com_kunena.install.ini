COM_KUNENA_SAMPLEDATA_CATEGORY1_DESC = "Желимо да охрабримо нове чланове да се представе кратким описом у овој категорији форума. Упознајте се и поделите своја заједничка интересовања."
COM_KUNENA_SAMPLEDATA_CATEGORY1_HEADER = "[b]Добро дошли у Meela форум![/b] \n\n Испричајте нама и нашим члановима ко сте, шта вам се свиђа и зашто сте постали члан овог сајта. \n Желимо добродошлицу свим новим члановима у нади да ћемо се често виђати!"
COM_KUNENA_SAMPLEDATA_CATEGORY1_TITLE = "Праг добродошлице"
COM_KUNENA_SAMPLEDATA_CATEGORY2_DESC = "Имате да поделите неко мишљење? \n Не стидите се и пошаљите нам поруку. Желимо да нам се јавите јер стремимо да учинимо наш сајт што бољим и предусретљивијим за наше госте и чланове.."
COM_KUNENA_SAMPLEDATA_CATEGORY2_HEADER = "Ово је изборно заглавље форума за кутију за предлоге."
COM_KUNENA_SAMPLEDATA_CATEGORY2_TITLE = "Кутија за предлоге"
COM_KUNENA_SAMPLEDATA_POST_WELCOME_SUBJECT = "Добро дошли на Meela!"
COM_KUNENA_SAMPLEDATA_POST_WELCOME_TEXT_CONTENT = "[size=150][b]Добродошли у Meela![/b][/size] \n\n Хвала што сте изабрали Meela за форум своје заједнице у Joomla. \n\n Meela, од грчке речи &ldquo;μίλα&rdquo; (&ldquo;говори&rdquo;), наставља Kunena, форум који је направио Kunena тим, а одржава га JoomlaWorks. \n\n\n [size=150][b]Meela ресурси[/b][/size] \n\n [b]Изворни код, дневник измена и проблеми:[/b] [url=https://github.com/joomlaworks/meela]github.com/joomlaworks/meela[/url]"
COM_KUNENA_SAMPLEDATA_SECTION_DESC = "Ово је категорија главног форума. Као категорија првог нивоа она служи као садржалац за појединачне табле или форуме. Такође се назива и категорија нивоа 1 и обавезна је за сваку поставку Meela форума."
COM_KUNENA_SAMPLEDATA_SECTION_HEADER = "Да бисте пружили додатне информације вашим гостима и члановима, заглавље форума се може искористити за приказ текста при самом врху одређене категорије."
COM_KUNENA_SAMPLEDATA_SECTION_TITLE = "Главни форум"

