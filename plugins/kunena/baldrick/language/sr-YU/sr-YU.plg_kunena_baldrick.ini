PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Svaki odgovor koji Baldrick objavi (odgovori, gotovi odgovori, zahtevi za detalje) i spam, ili samo spam. O greškama se uvek obaveštava."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Svakom odgovoru, spamu i greškama"
