PLG_KUNENA_BALDRICK_PROCESSING = "Prosesu"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Awtomatig: yn syth ar ôl i'r dudalen a roddodd bwnc yn y ciw gael ei hanfon (gyda PHP-FPM), neu gan gais cefndir i'r wefan ei hun. Llinell orchymyn yn unig: rhedwch &quot;php cli/joomla.php kunena:baldrick:process&quot; o cron (Joomla 3.x UTD), e.e. bob munud."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Awtomatig"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Llinell orchymyn yn unig (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Cadw'r log gweithgarwch (dyddiau)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Caiff rhesi'r log gweithgarwch sy'n hŷn na hyn eu dileu. Cedwir cyfansymiau misol am 36 mis."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Uwch: prosesu, terfynau a therfynau amser"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Nid yw postio byth yn aros am yr AI: caiff pynciau eu rhoi yn y ciw a'u prosesu yn y cefndir. Ceisir eto gwallau rhwydwaith, terfynau cyfradd a darparwyr gorlwythog (cyn gynted ag y bydd y darparwr yn caniatáu), yna ceisir y pwnc eto yn nes ymlaen (3 ymgais). Mae gwallau'r cyfrif (allwedd annilys, dim credydau, model anhysbys) yn oedi Baldrick ac yn hysbysu'r derbynwyr uchod."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Terfyn amser cysylltu (eiliadau)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Am ba hyd i aros i'r darparwr dderbyn y cysylltiad. Byr, fel bod problemau rhwydwaith yn dangos yn gyflym."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Terfyn amser ymateb didoli (eiliadau)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Am ba hyd i aros am ateb cyflawn y model didoli (mae'n fyr)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Terfyn amser ymateb yr ateb (eiliadau)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Am ba hyd i aros am ateb cyflawn y model ateb. Ni chaiff atebion eu ffrydio: mae hyn yn cynnwys ysgrifennu'r ateb cyfan, a gall modelau sy'n meddwl yn gyntaf fod angen munud neu fwy."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Uchafswm tocynnau didoli"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Uchafswm tocynnau'r ateb"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Terfyn uchaf allbwn y model (gan gynnwys ei feddwl, ar gyfer modelau sy'n meddwl). Cynyddwch ef os caiff atebion eu torri."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Uchafswm aros yn y ciw (oriau)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Caiff pynciau sy'n dal i aros ar ôl cyhyd â hyn (e.e. ar ôl toriad gan y darparwr) eu hepgor: byddai ateb ddyddiau'n ddiweddarach yn od. 0: dim terfyn."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Oedi ar ôl gwallau cyfrif (munudau)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Ar ôl allwedd annilys, credydau neu chwota wedi'u hysu, neu fodel anhysbys, mae Baldrick yn oedi (mae pynciau yn y ciw yn aros), yn e-bostio derbynwyr yr hysbysiadau unwaith, ac yn ceisio eto ar ôl y nifer hwn o funudau nes bod y darparwr yn ateb. Mae cadw'r gosodiadau hyn yn dod â'r oedi i ben."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Adnewyddu"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Dangos pob model"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Cynnwys modelau na allant ysgrifennu atebion sgwrs (embeddings, lleferydd, delweddau...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Teipiwch i chwilio'r modelau"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Dim model yn cyfateb"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Prisiau wedi'u llenwi o restr y darparwr."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Chwiliad plaen: postiadau diweddaraf a chwilir"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Heb fynegai testun llawn (SQLite, neu cyn i chi ei greu yn Meela > Baldrick AI) caiff pynciau cysylltiedig eu canfod drwy ddarllen y postiadau, tua 2.5 eiliad am bob 50,000 postiad: dim ond y nifer hwn o'r postiadau diweddaraf a chwilir (0: pob un). Gyda'r mynegai, chwilir pob postiad."
