PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, първият AI отговарящ на форума: отговаря в нови теми и в теми, съживени след дълго мълчание, когато няма отговор от администратор или модератор, като използва API на Anthropic или съвместими с OpenAI. <strong>Поверителност:</strong> текстът на темите, които обработва (и на свързаните публични теми), се изпраща на настроения от вас доставчик на AI; споменете това в политиката си за поверителност. Активност, суми и разходи: Meela &gt; Baldrick AI."

