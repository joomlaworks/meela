PLG_KUNENA_BALDRICK_NOTIFY_ON = "Obavijesti o"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Svakom odgovoru koji Baldrick objavi (odgovori, gotovi odgovori, zahtjevi za detalje) i spamu, ili samo spamu. Greške se uvijek prijavljuju."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Svakom odgovoru, spamu i greškama"
