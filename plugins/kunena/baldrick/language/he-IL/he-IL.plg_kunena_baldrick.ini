PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, המענה הראשון של הפורום בעזרת בינה מלאכותית: משיב לנושאים חדשים ולנושאים שהופעלו מחדש לאחר שתיקה ארוכה, כאשר אף מנהל או מפקח לא ענה, בעזרת API של Anthropic או API תואם OpenAI. <strong>פרטיות:</strong> הטקסט של הנושאים שהוא מטפל בהם (ושל נושאים ציבוריים קשורים) נשלח לספק הבינה המלאכותית שתגדיר; ציין זאת במדיניות הפרטיות שלך. פעילות, סיכומים ועלויות: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "שלב 1: מודל מיון (קטן, זול)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "קורא תחילה כל שאלה חדשה: מדרג אותה (ניתנת למענה, רחבה מדי, חסרים פרטים, אינה שאלה, ספאם) וכותב את שאילתות החיפוש לנושאים קשורים. מודל קטן ומהיר מספיק."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "שלב 2: מודל התשובות (מתקדם יותר)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "כותב את התשובה לשאלות ברורות, בעזרת הנושא והנושאים הציבוריים הקשורים שנמצאו בפורום. יכול להשתמש בחיבור של שלב 1 עם מודל אחר, או בחיבור משלו."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "מתי Baldrick משיב"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick בודק כל נושא חדש, תגובות של פותח הנושא ל-Baldrick (שיחה), ותגובות לנושאים ששתקו זמן רב יותר ממספר הימים שלמטה. הוא לעולם אינו משיב כאשר ההודעה האחרונה נכתבה על ידי מנהל או מפקח."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "איך Baldrick משיב"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "התשובות מפורסמות מיד בשם המשתמש של Baldrick, ב-BBCode של הפורום. קישורים לנושאי הפורום הם יחסיים."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "ספאם"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "כאשר מודל המיון בטוח שהודעה היא ספאם (פרסומת, מספרי טלפון, קישורי SEO...), Baldrick מסיר אותה מפרסום: נושא שלם כאשר מדובר בהודעה הראשונה. הודעות שהוסרו מפרסום ממתינות לניהול, ולכן טעות מתבטלת באישור שלהן."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "התראות"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "הודעת דוא\"ל בטקסט פשוט נשלחת דרך הגדרות הדואר של Joomla, עם ההודעה הראשונה בנושא וחמש ההודעות האחרונות, מהחדשה לישנה. פעולות ספאם ושגיאות (נושא ש-Baldrick ויתר עליו, השהיה משום שספק הבינה המלאכותית דוחה את בקשותיו) מודיעים עליהן תמיד. תוצאת כל דוא\"ל מופיעה ביומן הפעילות."

