COM_KUNENA_CFG_SEO_STRUCTURED_DATA_DESC="موضوع‌ها و پروفایل اعضا را با داده‌های ساختاریافته Google به موتورهای جستجو معرفی می‌کند (JSON-LD: DiscussionForumPosting همراه با پاسخ‌های نمایش‌داده‌شده در صفحه، ProfilePage). فقط برای دسته‌هایی که مهمانان می‌توانند بخوانند. اگر افزونه دیگری از قبل داده‌های ساختاریافته به صفحات انجمن اضافه می‌کند آن را خاموش کنید."
