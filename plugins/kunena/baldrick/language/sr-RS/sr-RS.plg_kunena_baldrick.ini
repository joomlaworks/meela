PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, први одговарач форума заснован на вештачкој интелигенцији: одговара на нове теме и на теме оживљене после дугог ћутања када ниједан администратор или модератор није одговорио, користећи Anthropic или API-је компатибилне са OpenAI. <strong>Приватност:</strong> текст тема које обрађује (и сродних јавних тема) шаље се добављачу вештачке интелигенције који подесите; помените то у својој политици приватности. Активност, збирови и трошкови: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Корак 1: модел за разврставање (мали, јефтин)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Прво чита свако ново питање: оцењује га (може се одговорити, прешироко, недостају детаљи, није питање, спам) и пише упите за претрагу сродних тема. Довољан је мали, брз модел."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Корак 2: модел за одговоре (способнији)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Пише одговор на јасна питања користећи тему и сродне јавне теме пронађене на форуму. Може користити везу из корака 1 са другим моделом, или сопствену везу."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Када Baldrick одговара"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick разматра сваку нову тему, одговоре покретача теме Baldrick-у (разговор) и одговоре на теме које су ћутале дуже од броја дана испод. Никада не одговара када последња порука потиче од администратора или модератора."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Како Baldrick одговара"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Одговори се објављују одмах као Baldrick-ов корисник, у BBCode-у форума. Везе до тема форума су релативне."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Спам"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Када је модел за разврставање сигуран да је порука спам (рекламе, бројеви телефона, SEO везе...), Baldrick је уклања из објављених: целу тему када је у питању прва порука. Необјављене поруке чекају модерацију, па се грешка исправља њиховим одобравањем."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Обавештења"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Е-пошта у обичном тексту шаље се преко Joomla поставки поште, са првом поруком теме и њених последњих 5 порука, најновије прво. О радњама над спамом и грешкама (тема од које је Baldrick одустао, пауза јер добављач вештачке интелигенције одбија његове захтеве) увек се обавештава. Резултат сваке е-поште приказан је у евиденцији активности."

