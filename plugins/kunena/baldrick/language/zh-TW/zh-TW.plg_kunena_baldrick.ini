PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick，論壇的 AI 首位回應者：在沒有管理員或版主回覆時，回覆新話題以及沉寂很久後重新活躍的話題，使用 Anthropic 或 OpenAI 相容的 API。<strong>隱私：</strong>其處理的話題文字（以及相關的公開話題）會被送往你所設定的 AI 供應商；請在你的隱私政策中說明。活動、總計與費用：Meela &gt; Baldrick AI。"

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "步驟 1：分類模型（小型、低成本）"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "先閱讀每一個新問題：為其評級（可回答、過於寬泛、缺少詳細資料、不是問題、垃圾訊息），並撰寫相關話題的搜尋查詢。一個小型、快速的模型即已足夠。"
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "步驟 2：回答模型（能力較強）"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "針對明確的問題撰寫回答，使用話題以及論壇中找到的相關公開話題。它可以使用步驟 1 的連線搭配另一個模型，或使用自己的連線。"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Baldrick 何時回覆"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick 會查看每一個新話題、話題發起人對 Baldrick 的回覆（對話），以及沉寂時間超過下方天數的話題的回覆。若最後一篇文章來自管理員或版主，則絕不回覆。"
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Baldrick 如何回覆"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "回覆會以 Baldrick 的使用者身分立即發佈，採用論壇的 BBCode。指向論壇話題的連結為相對連結。"
PLG_KUNENA_BALDRICK_SECTION_SPAM = "垃圾訊息"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "當分類模型確信某篇文章是垃圾訊息（廣告、電話號碼、SEO 連結……）時，Baldrick 會取消其發佈：若為第一篇文章，則取消整個話題的發佈。已取消發佈的文章會等待審核，因此核准它們即可撤銷誤判。"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "通知"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "透過 Joomla 的郵件設定寄出純文字電子郵件，內含話題的第一篇文章以及最後 5 篇文章，由新到舊。垃圾訊息的處理與錯誤（Baldrick 放棄的話題、因 AI 供應商拒絕其請求而暫停）一律會通知。每封電子郵件的結果都會顯示在活動記錄中。"

PLG_KUNENA_BALDRICK_PROVIDER = "API 類型"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API（Claude，以及 Qwen 等 Anthropic 相容的端點），或 OpenAI 相容的 Chat Completions（OpenAI、Qwen/DashScope、OpenRouter、DeepSeek、Ollama、vLLM……）。"
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic 相容（Messages API）"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI 相容（Chat Completions）"
PLG_KUNENA_BALDRICK_BASE_URL = "基底 URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "留空則使用官方 API（https://api.anthropic.com 或 https://api.openai.com/v1）。Qwen Cloud 的範例：https://token-plan.maas.qwencloudapi.com/apps/anthropic（Anthropic 相容）或 https://token-plan.maas.qwencloudapi.com/compatible-mode/v1（OpenAI 相容）。"
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "留空：官方 API"
PLG_KUNENA_BALDRICK_API_KEY = "API 金鑰"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "供應商的 API 金鑰。在金鑰與模型都設定好之前，Baldrick 不會執行任何動作。"
PLG_KUNENA_BALDRICK_MODEL = "模型"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "分類步驟所用的模型，例如 claude-haiku-5-5。&quot;取得模型&quot;會以上方的值（無論是否已儲存）列出供應商的模型，並以可搜尋的清單呈現（保留一小時；&quot;重新整理&quot;會重新取得）；你也可以直接輸入名稱。&quot;測試&quot;會向模型送出一個極小的要求。"
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "回答步驟所用的模型，例如 claude-sonnet-5-5（若要最佳回答，可用 claude-opus-5-5）。&quot;取得模型&quot;會列出供應商的模型；你也可以直接輸入名稱。&quot;測試&quot;會向模型送出一個極小的要求。"
PLG_KUNENA_BALDRICK_FETCH_MODELS = "取得模型"
PLG_KUNENA_BALDRICK_TEST = "測試"
PLG_KUNENA_BALDRICK_WORKING = "處理中……"
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- 選擇模型 -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "要求失敗。"
PLG_KUNENA_BALDRICK_PRICE_IN = "價格：輸入"
PLG_KUNENA_BALDRICK_PRICE_OUT = "價格：輸出"
PLG_KUNENA_BALDRICK_PRICE_DESC = "每百萬個 token 的美元價格，用於費用估計。留空：已知 Claude 模型使用牌價，其他則為 0（除非供應商自行回報費用）。"
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "使用步驟 1 的連線"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "使用與分類步驟相同的 API 類型、基底 URL 與金鑰（搭配下方選擇的模型）。選擇「否」可為回答改用另一個供應商。"
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic：拒絕時改用備用模型"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "僅適用於 Anthropic 自己的 API 與 Opus/Sonnet 5.x 模型：當模型的安全檢查拒絕某個要求時，API 會改用 Anthropic 選定的備用模型再次執行（伺服器端備用）。Haiku 不支援。"

PLG_KUNENA_BALDRICK_DRY_RUN = "試運行"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "用於測試設定：Baldrick 只會在管理員與版主開始的話題中回覆（新話題，以及他們對 Baldrick 的後續回應），且絕不取消發佈文章（垃圾訊息只會回報）。"
PLG_KUNENA_BALDRICK_USER = "Baldrick 的使用者"
PLG_KUNENA_BALDRICK_USER_DESC = "Baldrick 發文時所用的使用者。留空可讓系統自動建立名為 &quot;Baldrick&quot; 的使用者（沒有可用的密碼，也沒有真實的電子郵件位址）。請在其論壇個人資料中設定頭像與簽名（新使用者會取得簽名 &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;）。"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "沉寂後重新啟用（天）"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "回覆一個前一篇文章早於此天數的話題時，會以新問題的方式處理。"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "每個話題的回覆數"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Baldrick 在同一話題中最多可回覆幾次：其第一則回覆，以及當話題發起人回應它時的答覆（它要求的詳細資料、進一步的問題），或話題在長時間沉寂後重新活躍時的答覆。"
PLG_KUNENA_BALDRICK_DAILY_CAP = "每日回覆數"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "24 小時內最多回覆這麼多則（0：無限制）。可防止 API 預算因洪水般的發文而耗盡。"
PLG_KUNENA_BALDRICK_MIN_LENGTH = "文章最短長度"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "短於此長度的文章（字元數，不計格式）會被忽略。"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "只限這些分類"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "只在這些分類中回覆（未選取任何分類：所有分類）。"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "永不在這些分類中回覆"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "永不在這些分類中回覆。"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "僅限公開分類"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "只在訪客可閱讀的分類中回覆，以免任何非公開內容被送往 AI 供應商。相關話題一律只取自公開分類。"

PLG_KUNENA_BALDRICK_TRANSLATE = "加入英文翻譯"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick 會以發文者的語言回覆。啟用此選項後，其他語言的回覆之後會附上英文翻譯（對使用英文的管理人員與讀者有幫助）。"
PLG_KUNENA_BALDRICK_RETRIEVAL = "相關話題"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "會將多少則相關的公開話題（透過分類步驟的搜尋查詢找到）提供給回答模型。"
PLG_KUNENA_BALDRICK_PRESET = "內建主提示詞"
PLG_KUNENA_BALDRICK_PRESET_DESC = "每個回答所依據的指示（唯讀）。你在下方填寫的網站背景會加入其中。"
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "網站背景"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "論壇的主題、支援的產品與版本、文件連結、使用的語氣、Baldrick 絕不可做的事……會加入兩個步驟的提示詞中（它也有助於分類模型分辨垃圾訊息與切題的文章）。"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "例如：這是 ExampleSoft 的支援論壇。我們支援第 3 與第 4 版。文件位於 https://docs.example.com。絕不承諾退款。"
PLG_KUNENA_BALDRICK_CANNED = "制式回覆"
PLG_KUNENA_BALDRICK_CANNED_DESC = "針對過於寬泛的問題的回覆（不撰寫 AI 答案），以及無法撰寫答案時的備用回覆。以一行三個連字號（---）分隔各則回覆；隨機挑選其中一則。佔位符：{name}（發文者）、{search_url}（針對該問題的論壇搜尋）、{forum_url}、{topic_url}。允許使用論壇的 BBCode。"

PLG_KUNENA_BALDRICK_SPAM_ACTION = "垃圾訊息"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "當分類模型確信某篇文章是垃圾訊息時該怎麼做。前兩種情況都會寄出電子郵件。"
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "取消發佈（若為第一篇文章則取消整個話題）並通知"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "只通知"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "忽略"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "信任門檻（篇數）"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "已有至少這麼多篇已發佈文章的使用者，以及管理人員的文章，絕不會被取消發佈：只會回報。"

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "通知這些管理人員"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "接收通知的超級使用者、Meela 管理員與版主（按住 Ctrl／Cmd 並點擊可選取多位）。"
PLG_KUNENA_BALDRICK_NOTIFY_ON = "通知內容"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Baldrick 發出的每則回覆（回答、制式回覆、詳細資料的要求）與垃圾訊息，或只限垃圾訊息。錯誤一律會通知。"
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "每則回覆、垃圾訊息與錯誤"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "只限垃圾訊息與錯誤"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "通知這些地址"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "其他電子郵件地址，以逗號分隔。"

PLG_KUNENA_BALDRICK_PROCESSING = "處理"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "自動：在將話題排入佇列的頁面送出之後立即處理（搭配 PHP-FPM），或由對網站本身的背景要求處理。僅限命令列：從 cron 執行 &quot;php cli/joomla.php kunena:baldrick:process&quot;（Joomla 3.x UTD），例如每分鐘一次。"
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "自動"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "僅限命令列（cron）"
PLG_KUNENA_BALDRICK_LOG_DAYS = "保留活動記錄（天）"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "超過此天數的活動記錄列會被刪除。每月總計保留 36 個月。"

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "進階：處理、限制與逾時"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "發文絕不等待 AI：話題會排入佇列，並在背景處理。網路錯誤、速率限制與過載的供應商會重試（供應商允許時立即重試），之後話題會稍後再次嘗試（共 3 次）。帳號錯誤（金鑰無效、沒有餘額、模型未知）會使 Baldrick 暫停，並通知上述收件人。"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "連線逾時（秒）"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "等待供應商接受連線的時間。設定得短，使網路問題能迅速顯現。"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "分類回應逾時（秒）"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "等待分類模型完整回答的時間（回答很短）。"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "回答回應逾時（秒）"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "等待回答模型完整回答的時間。回答不採串流傳送：此時間涵蓋撰寫整個回覆的過程，而會先進行思考的模型可能需要一分鐘以上。"
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "分類的最大 token 數"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "回答的最大 token 數"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "模型輸出的上限（包括其思考過程，適用於會思考的模型）。若回答被截斷，請調高此值。"
PLG_KUNENA_BALDRICK_MAX_WAIT = "佇列中的最長等待時間（小時）"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "等待超過此時間（例如供應商故障後）的話題會被略過：數天後才回覆會很奇怪。0：無限制。"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "帳號錯誤後的暫停時間（分鐘）"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "API 金鑰無效、餘額或配額用盡，或模型未知時，Baldrick 會暫停（排隊中的話題等待），向通知收件人寄出一次電子郵件，並在此分鐘數後再次嘗試，直到供應商回應為止。儲存這些設定會結束暫停。"
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "重新整理"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "顯示所有模型"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "包括無法撰寫聊天回答的模型（嵌入、語音、圖像……）"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "輸入以搜尋模型"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "沒有符合的模型"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "已從供應商的價目表填入價格。"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "一般搜尋：搜尋最新的文章數"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "沒有全文索引時（SQLite，或在 Meela > Baldrick AI 中建立索引之前），相關話題會透過讀取文章來找出，每 50,000 篇約需 2.5 秒：只會搜尋這麼多篇最新的文章（0：全部）。有索引時，會搜尋每一篇文章。"
