PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, người trả lời AI đầu tiên của diễn đàn: trả lời các chủ đề mới và các chủ đề được mở lại sau một thời gian dài im lặng khi không có quản trị viên hay điều hành viên nào trả lời, bằng API của Anthropic hoặc các API tương thích OpenAI. <strong>Quyền riêng tư:</strong> nội dung các chủ đề mà nó xử lý (và của các chủ đề công khai liên quan) được gửi tới nhà cung cấp AI bạn cấu hình; hãy nêu điều này trong chính sách quyền riêng tư của bạn. Hoạt động, tổng số và chi phí: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Bước 1: mô hình phân loại (nhỏ, rẻ)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Đọc mọi câu hỏi mới trước: đánh giá (trả lời được, quá chung chung, thiếu chi tiết, không phải câu hỏi, spam) và viết các truy vấn tìm kiếm cho chủ đề liên quan. Một mô hình nhỏ, nhanh là đủ."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Bước 2: mô hình trả lời (mạnh hơn)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Viết câu trả lời cho các câu hỏi rõ ràng, dùng chủ đề và các chủ đề công khai liên quan tìm được trên diễn đàn. Có thể dùng kết nối của bước 1 với mô hình khác, hoặc một kết nối riêng."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Khi nào Baldrick trả lời"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick xem mọi chủ đề mới, các phản hồi của người mở chủ đề gửi cho Baldrick (một cuộc trò chuyện), và các trả lời trong chủ đề đã im lặng lâu hơn số ngày bên dưới. Nó không bao giờ trả lời khi bài cuối cùng do quản trị viên hoặc điều hành viên đăng."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Cách Baldrick trả lời"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Trả lời được công khai ngay với tư cách người dùng Baldrick, bằng BBCode của diễn đàn. Liên kết tới các chủ đề diễn đàn là liên kết tương đối."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Khi mô hình phân loại tin chắc chắn một bài viết là spam (quảng cáo, số điện thoại, liên kết SEO...), Baldrick sẽ ẩn bài đó: cả chủ đề nếu đó là bài đầu tiên. Bài viết đã ẩn chờ kiểm duyệt, nên nếu nhầm lẫn thì chỉ cần duyệt lại."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Thông báo"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "E-mail văn bản thuần được gửi qua cài đặt thư của Joomla, gồm bài viết đầu tiên của chủ đề và 5 bài viết cuối, mới nhất trước. Hành động spam và lỗi (chủ đề mà Baldrick đã bỏ cuộc, tạm dừng vì nhà cung cấp AI từ chối các yêu cầu) luôn được thông báo. Kết quả của mỗi e-mail được hiển thị trong nhật ký hoạt động."

PLG_KUNENA_BALDRICK_PROVIDER = "Loại API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "API Messages của Anthropic (Claude, và các điểm cuối tương thích Anthropic như của Qwen), hoặc Chat Completions tương thích OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Tương thích Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Tương thích OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Địa chỉ gốc (Base URL)"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Để trống để dùng API chính thức (https://api.anthropic.com hoặc https://api.openai.com/v1). Ví dụ cho Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (tương thích Anthropic) hoặc https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (tương thích OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Để trống: API chính thức"
PLG_KUNENA_BALDRICK_API_KEY = "Khóa API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Khóa API của nhà cung cấp. Baldrick không làm gì cho đến khi khóa và các mô hình được thiết lập."
PLG_KUNENA_BALDRICK_MODEL = "Mô hình"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Mô hình của bước phân loại, ví dụ claude-haiku-5-5. &quot;Lấy danh sách mô hình&quot; liệt kê các mô hình của nhà cung cấp với các giá trị ở trên (đã lưu hay chưa) trong một danh sách có thể tìm kiếm (giữ trong một giờ; &quot;Làm mới&quot; sẽ hỏi lại); bạn cũng có thể gõ tên. &quot;Kiểm tra&quot; gửi một yêu cầu rất nhỏ tới mô hình."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Mô hình của bước trả lời, ví dụ claude-sonnet-5-5 (hoặc claude-opus-5-5 để có câu trả lời tốt nhất). &quot;Lấy danh sách mô hình&quot; liệt kê các mô hình của nhà cung cấp; bạn cũng có thể gõ tên. &quot;Kiểm tra&quot; gửi một yêu cầu rất nhỏ tới mô hình."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Lấy danh sách mô hình"
PLG_KUNENA_BALDRICK_TEST = "Kiểm tra"
PLG_KUNENA_BALDRICK_WORKING = "Đang xử lý..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Chọn một mô hình -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Yêu cầu thất bại."
PLG_KUNENA_BALDRICK_PRICE_IN = "Giá: đầu vào"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Giá: đầu ra"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD cho mỗi triệu token, dùng cho ước tính chi phí. Để trống: giá niêm yết của các mô hình Claude đã biết, nếu không thì là 0 (trừ khi nhà cung cấp tự báo chi phí)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Dùng kết nối của bước 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Dùng cùng loại API, địa chỉ gốc và khóa như bước phân loại (với mô hình chọn bên dưới). Chọn Không để dùng nhà cung cấp khác cho các câu trả lời."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: dự phòng khi bị từ chối"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Chỉ trên API riêng của Anthropic với các mô hình Opus/Sonnet 5.x: khi các kiểm tra an toàn của mô hình từ chối một yêu cầu, API chạy lại yêu cầu đó trên một mô hình dự phòng do Anthropic chọn (dự phòng phía máy chủ). Không dùng được với Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Chạy thử"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Để thử nghiệm cấu hình: Baldrick chỉ trả lời trong các chủ đề do quản trị viên và điều hành viên mở (chủ đề mới, và các phản hồi tiếp theo của họ với Baldrick), và không bao giờ ẩn bài viết nào (spam chỉ được báo cáo)."
PLG_KUNENA_BALDRICK_USER = "Người dùng của Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Người dùng mà Baldrick đăng bài dưới tên. Để trống để tự động tạo người dùng &quot;Baldrick&quot; (không có mật khẩu dùng được, không có địa chỉ e-mail thật). Đặt ảnh đại diện và chữ ký trong hồ sơ diễn đàn của người dùng này (người dùng mới nhận chữ ký &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Mở lại sau (ngày)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Trả lời cho một chủ đề có bài trước đó cũ hơn số ngày này sẽ được xử lý như một câu hỏi mới."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Số trả lời mỗi chủ đề"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Baldrick được trả lời tối đa bao nhiêu lần trong cùng một chủ đề: trả lời đầu tiên, và các câu trả lời khi người mở chủ đề phản hồi lại (chi tiết nó đã yêu cầu, một câu hỏi tiếp theo) hoặc khi chủ đề được mở lại sau một thời gian dài im lặng."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Số trả lời mỗi ngày"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Tối đa bấy nhiêu trả lời trong 24 giờ (0: không giới hạn). Bảo vệ ngân sách API của bạn khỏi các đợt spam dồn dập."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Độ dài tối thiểu của bài viết"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Các bài viết ngắn hơn số ký tự này (không tính định dạng) sẽ bị bỏ qua."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Chỉ trong các chuyên mục này"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Chỉ trả lời trong các chuyên mục này (không chọn: mọi chuyên mục)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Không bao giờ trong các chuyên mục này"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Không bao giờ trả lời trong các chuyên mục này."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Chỉ chuyên mục công khai"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Chỉ trả lời trong các chuyên mục khách có thể đọc, để không có nội dung riêng tư nào được gửi tới nhà cung cấp AI. Các chủ đề liên quan luôn chỉ lấy từ chuyên mục công khai."

PLG_KUNENA_BALDRICK_TRANSLATE = "Thêm bản dịch tiếng Anh"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick trả lời bằng ngôn ngữ của người đăng. Với tùy chọn này, các trả lời bằng ngôn ngữ khác sẽ kèm theo bản dịch tiếng Anh (hữu ích cho ban quản trị và độc giả nói tiếng Anh)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Chủ đề liên quan"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Có bao nhiêu chủ đề công khai liên quan (tìm bằng các truy vấn tìm kiếm của bước phân loại) được đưa cho mô hình trả lời."
PLG_KUNENA_BALDRICK_PRESET = "Lệnh gốc tích hợp sẵn"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Các chỉ dẫn mà mọi câu trả lời đều bắt đầu từ đó (chỉ đọc). Ngữ cảnh trang web của bạn bên dưới sẽ được thêm vào."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Ngữ cảnh trang web"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Diễn đàn nói về điều gì, các sản phẩm và phiên bản được hỗ trợ, liên kết tới tài liệu, giọng điệu cần dùng, những điều Baldrick không bao giờ được làm... Được thêm vào lệnh của cả hai bước (nó cũng giúp mô hình phân loại phân biệt spam với bài đúng chủ đề)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "ví dụ: Đây là diễn đàn hỗ trợ của ExampleSoft. Chúng tôi hỗ trợ phiên bản 3 và 4. Tài liệu ở https://docs.example.com. Không bao giờ hứa hoàn tiền."
PLG_KUNENA_BALDRICK_CANNED = "Trả lời mẫu"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Trả lời cho các câu hỏi quá chung chung (không viết câu trả lời AI), và phương án dự phòng khi không thể viết câu trả lời. Tách các trả lời bằng một dòng ba dấu gạch ngang (---); một trả lời sẽ được chọn ngẫu nhiên. Các chỗ giữ chỗ: {name} (người đăng), {search_url} (tìm kiếm diễn đàn cho câu hỏi), {forum_url}, {topic_url}. Được phép dùng BBCode của diễn đàn."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Việc cần làm khi mô hình phân loại chắc chắn một bài là spam. Một e-mail được gửi trong hai trường hợp đầu."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Ẩn (cả chủ đề nếu là bài đầu tiên) và thông báo"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Chỉ thông báo"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Bỏ qua"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Đáng tin sau (bài viết)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Bài viết của người dùng có ít nhất bấy nhiêu bài đã công khai, và của ban quản trị, không bao giờ bị ẩn: chỉ được báo cáo."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Thông báo cho các thành viên ban quản trị này"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super User, quản trị viên và điều hành viên của Meela nhận thông báo (Ctrl/Cmd+nhấp chuột để chọn nhiều người)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Thông báo về"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Mọi trả lời Baldrick đăng (câu trả lời, trả lời mẫu, yêu cầu thêm chi tiết) và spam, hoặc chỉ spam. Lỗi luôn được thông báo."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Mọi trả lời, spam và lỗi"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Chỉ spam và lỗi"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Gửi thông báo tới các địa chỉ này"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Thêm các địa chỉ e-mail khác, cách nhau bằng dấu phẩy."

PLG_KUNENA_BALDRICK_PROCESSING = "Xử lý"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Tự động: ngay sau khi trang đưa một chủ đề vào hàng đợi được gửi đi (với PHP-FPM), hoặc bởi một yêu cầu nền tới chính trang web. Chỉ dòng lệnh: chạy &quot;php cli/joomla.php kunena:baldrick:process&quot; từ cron (Joomla 3.x UTD), ví dụ mỗi phút."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Tự động"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Chỉ dòng lệnh (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Giữ nhật ký hoạt động (ngày)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Các dòng nhật ký hoạt động cũ hơn số ngày này sẽ bị xóa. Tổng hằng tháng được giữ trong 36 tháng."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Nâng cao: xử lý, giới hạn và thời gian chờ"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Việc đăng bài không bao giờ phải chờ AI: các chủ đề được xếp vào hàng đợi và xử lý ở nền. Lỗi mạng, giới hạn tốc độ và nhà cung cấp quá tải được thử lại (ngay khi nhà cung cấp cho phép), sau đó chủ đề được thử lại sau (3 lần). Lỗi của tài khoản (khóa không hợp lệ, hết tín dụng, mô hình không tồn tại) sẽ tạm dừng Baldrick và thông báo cho người nhận ở trên."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Thời gian chờ kết nối (giây)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Thời gian chờ nhà cung cấp chấp nhận kết nối. Ngắn để các lỗi mạng hiện ra nhanh."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Thời gian chờ phản hồi của phân loại (giây)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Thời gian chờ toàn bộ câu trả lời của mô hình phân loại (câu này ngắn)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Thời gian chờ phản hồi của câu trả lời (giây)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Thời gian chờ toàn bộ câu trả lời của mô hình trả lời. Câu trả lời không được truyền trực tiếp (stream): con số này bao gồm cả việc viết xong toàn bộ trả lời, và các mô hình suy nghĩ trước có thể cần một phút hoặc hơn."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Số token tối đa cho phân loại"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Số token tối đa cho câu trả lời"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Giới hạn trên của đầu ra mô hình (kể cả phần suy nghĩ, với các mô hình biết suy nghĩ). Tăng lên nếu câu trả lời bị cắt."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Thời gian chờ tối đa trong hàng đợi (giờ)"
