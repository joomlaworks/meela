PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, primul răspuns AI al forumului: răspunde la subiectele noi și la subiectele reactivate după o lungă tăcere, când niciun administrator sau moderator nu a răspuns, folosind API-uri compatibile Anthropic sau OpenAI. <strong>Confidențialitate:</strong> textul subiectelor pe care le tratează (și al subiectelor publice conexe) este trimis furnizorului AI configurat; menționează asta în politica de confidențialitate. Activitate, totaluri și costuri: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Pasul 1: model de triaj (mic, ieftin)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Citește întâi fiecare întrebare nouă: o evaluează (poate fi răspunsă, prea generală, lipsesc detalii, nu este o întrebare, spam) și scrie interogările de căutare pentru subiectele conexe. Un model mic și rapid este suficient."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Pasul 2: model de răspuns (mai capabil)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Scrie răspunsul la întrebările clare, folosind subiectul și subiectele publice conexe găsite pe forum. Poate folosi conexiunea pasului 1 cu alt model sau o conexiune proprie."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Când răspunde Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick analizează fiecare subiect nou, răspunsurile autorului subiectului către Baldrick (o conversație) și răspunsurile la subiectele care au stat în tăcere mai mult decât numărul de zile de mai jos. Nu răspunde niciodată când ultimul mesaj vine de la un administrator sau moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Cum răspunde Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Răspunsurile se publică imediat, ca utilizator Baldrick, în BBCode-ul forumului. Linkurile către subiectele forumului sunt relative."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Când modelul de triaj este sigur că un mesaj este spam (publicitate, numere de telefon, linkuri SEO ...), Baldrick îl nepublică: un subiect întreg, dacă este primul mesaj. Mesajele nepublicate așteaptă moderarea, deci o greșeală se anulează aprobându-le."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notificări"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Un e-mail în text simplu este trimis prin setările de e-mail ale Joomla, cu primul mesaj al subiectului și ultimele 5 mesaje, cel mai nou primul. Acțiunile împotriva spamului și erorile (un subiect pe care Baldrick a renunțat, o pauză pentru că furnizorul AI refuză cererile) se notifică întotdeauna. Rezultatul fiecărui e-mail apare în jurnalul de activitate."

PLG_KUNENA_BALDRICK_PROVIDER = "Tip de API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude și punctele finale compatibile Anthropic, precum cele ale Qwen), sau Chat Completions compatibile OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Compatibil Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Compatibil OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL de bază"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Lasă gol pentru API-ul oficial (https://api.anthropic.com sau https://api.openai.com/v1). Exemple pentru Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (compatibil Anthropic) sau https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (compatibil OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Gol: API-ul oficial"
PLG_KUNENA_BALDRICK_API_KEY = "Cheie API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Cheia API a furnizorului. Baldrick nu face nimic până nu sunt setate o cheie și modelele."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modelul pasului de triaj, de exemplu claude-haiku-5-5. &quot;Preia modelele&quot; listează modelele furnizorului cu valorile de mai sus (salvate sau nu) într-o listă căutabilă (păstrată o oră; &quot;Reîmprospătează&quot; cere din nou); poți scrie și un nume. &quot;Testează&quot; trimite o cerere mică modelului."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modelul pasului de răspuns, de exemplu claude-sonnet-5-5 (sau claude-opus-5-5 pentru cele mai bune răspunsuri). &quot;Preia modelele&quot; listează modelele furnizorului; poți scrie și un nume. &quot;Testează&quot; trimite o cerere mică modelului."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Preia modelele"
PLG_KUNENA_BALDRICK_TEST = "Testează"
PLG_KUNENA_BALDRICK_WORKING = "Se lucrează..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Alege un model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Cererea a eșuat."
PLG_KUNENA_BALDRICK_PRICE_IN = "Preț: intrare"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Preț: ieșire"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD pe milion de tokeni, pentru estimările de cost. Gol: prețul de listă al modelelor Claude cunoscute, altfel 0 (cu excepția cazului în care furnizorul raportează singur costul)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Folosește conexiunea de la pasul 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Folosește același tip de API, același URL de bază și aceeași cheie ca pasul de triaj (cu modelul ales mai jos). Alege Nu ca să folosești alt furnizor pentru răspunsuri."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: rezervă la refuzuri"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Doar pe API-ul propriu Anthropic, cu modelele Opus/Sonnet 5.x: când verificările de siguranță ale modelului refuză o cerere, API-ul o rulează din nou pe un model de rezervă ales de Anthropic (rezerve pe server). Nu este disponibil pentru Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Test fără efecte"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Pentru testarea configurării: Baldrick răspunde doar în subiectele pornite de administratori și moderatori (subiecte noi și continuările lor către Baldrick) și nu nepublică niciodată mesaje (spamul este doar raportat)."
PLG_KUNENA_BALDRICK_USER = "Utilizatorul lui Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Utilizatorul sub care postează Baldrick. Lasă gol ca să se creeze automat un utilizator &quot;Baldrick&quot; (fără parolă utilizabilă, fără adresă de e-mail reală). Setează-i avatarul și semnătura în profilul de forum (un utilizator nou primește semnătura &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Reactivează după (zile)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Un răspuns la un subiect al cărui mesaj anterior este mai vechi decât atât este tratat ca o întrebare nouă."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Răspunsuri pe subiect"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "De câte ori poate răspunde Baldrick în același subiect: primul răspuns și răspunsurile la care autorul subiectului îi răspunde (detalii cerute, o întrebare suplimentară) sau când subiectul este reactivat după o lungă tăcere."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Răspunsuri pe zi"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Cel mult atâtea răspunsuri în 24 de ore (0: fără limită). Protejează bugetul tău API de inundații."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Lungime minimă a mesajului"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Mesajele mai scurte decât atât (caractere, fără formatare) sunt ignorate."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Doar în aceste categorii"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Răspunde doar în aceste categorii (niciuna selectată: toate categoriile)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Niciodată în aceste categorii"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nu răspunde niciodată în aceste categorii."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Doar categoriile publice"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Răspunde doar în categoriile pe care vizitatorii le pot citi, ca niciun conținut privat să nu fie trimis furnizorului AI. Subiectele conexe sunt luate întotdeauna doar din categoriile publice."

PLG_KUNENA_BALDRICK_TRANSLATE = "Adaugă o traducere în engleză"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick răspunde în limba autorului. Cu această opțiune, răspunsurile în alte limbi sunt urmate de o traducere în engleză (util pentru un personal și cititori vorbitori de engleză)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Subiecte conexe"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Câte subiecte publice conexe (găsite cu interogările de căutare din pasul de triaj) primește modelul de răspuns."
PLG_KUNENA_BALDRICK_PRESET = "Prompt principal încorporat"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Instrucțiunile de la care pornește fiecare răspuns (doar citire). Contextul site-ului tău, de mai jos, se adaugă la ele."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Contextul site-ului"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Despre ce este forumul, produse și versiuni acceptate, linkuri către documentație, tonul de folosit, ce nu trebuie să facă niciodată Baldrick ... Se adaugă la prompturile ambilor pași (ajută și modelul de triaj să distingă spamul de mesajele pe subiect)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "de ex. Acesta este forumul de suport al ExampleSoft. Susținem versiunile 3 și 4. Documentația este la https://docs.example.com. Nu promite niciodată rambursări."
PLG_KUNENA_BALDRICK_CANNED = "Răspunsuri standard"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Răspunsuri la întrebările prea generale (nu se scrie niciun răspuns AI) și soluții de rezervă când nu se poate scrie un răspuns. Separă răspunsurile printr-o linie cu trei liniuțe (---); se alege unul la întâmplare. Substituenți: {name} (autorul), {search_url} (căutarea pe forum a întrebării), {forum_url}, {topic_url}. Este permis BBCode-ul forumului."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Ce se întâmplă când modelul de triaj este sigur că un mesaj este spam. În primele două cazuri se trimite un e-mail."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Nepublică (întregul subiect, pentru un prim mesaj) și notifică"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Doar notifică"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignoră"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "De încredere după (mesaje)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Mesajele utilizatorilor cu cel puțin atâtea mesaje publicate, precum și ale personalului, nu se nepublică niciodată: sunt doar raportate."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notifică acești membri ai personalului"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, administratorii și moderatorii Meela care primesc notificările (Ctrl/Cmd+clic pentru a alege mai mulți)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notifică la"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Fiecare răspuns postat de Baldrick (răspunsuri, răspunsuri standard, cereri de detalii) și spam, sau doar spam. Erorile se notifică întotdeauna."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Fiecare răspuns, spam și erori"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Doar spam și erori"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notifică aceste adrese"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Alte adrese de e-mail, separate prin virgulă."

PLG_KUNENA_BALDRICK_PROCESSING = "Procesare"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automată: imediat după ce pagina care a pus subiectul în coadă a fost trimisă (cu PHP-FPM), sau printr-o cerere de fundal către site-ul însuși. Doar din linia de comandă: rulează \"php cli/joomla.php kunena:baldrick:process\" din cron (Joomla 3.x UTD), de exemplu la fiecare minut."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automată"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Doar din linia de comandă (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Păstrează jurnalul de activitate (zile)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Rândurile jurnalului de activitate mai vechi decât atât se șterg. Totalurile lunare se păstrează 36 de luni."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avansat: procesare, limite și timpi de așteptare"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Publicarea nu așteaptă niciodată AI-ul: subiectele sunt puse în coadă și procesate în fundal. Erorile de rețea, limitele de viteză și furnizorii supraîncărcați sunt reîncercate (imediat ce furnizorul permite), apoi subiectul este reîncercat mai târziu (3 încercări). Erorile contului (cheie invalidă, credite epuizate, model necunoscut) pun Baldrick pe pauză și notifică destinatarii de mai sus."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Timp maxim de conectare (secunde)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Cât se așteaptă ca furnizorul să accepte conexiunea. Scurt, ca problemele de rețea să se vadă repede."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Triaj: timp maxim de așteptare pentru răspuns (secunde)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Cât se așteaptă răspunsul complet al modelului de triaj (este scurt)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Timp maxim de așteptare pentru răspuns (secunde)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Cât se așteaptă răspunsul complet al modelului de răspuns. Răspunsurile nu sunt transmise în flux: aceasta acoperă scrierea întregului răspuns, iar modelele care gândesc întâi pot avea nevoie de un minut sau mai mult."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Triaj: tokeni maximi"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Răspuns: tokeni maximi"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Limita superioară a ieșirii modelului (inclusiv gândirea lui, la modelele care gândesc). Mărește-o dacă răspunsurile sunt tăiate."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Timp maxim de așteptare în coadă (ore)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Subiectele care încă așteaptă după atât timp (de exemplu după o pană a furnizorului) sunt omise: un răspuns după zile ar fi ciudat. 0: fără limită."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pauză după erori de cont (minute)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "După o cheie invalidă, credite sau cotă epuizate, sau un model necunoscut, Baldrick se pune pe pauză (subiectele din coadă așteaptă), trimite destinatarilor notificărilor un e-mail o singură dată și reîncearcă după atâtea minute, până când furnizorul răspunde. Salvarea acestor setări oprește pauza."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Reîmprospătează"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Arată toate modelele"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Include modelele care nu pot scrie răspunsuri de chat (embeddings, vorbire, imagini ...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Scrie pentru a căuta modelele"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Niciun model nu se potrivește"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Prețurile au fost completate din lista furnizorului."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Căutare simplă: ultimele mesaje căutate"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Fără index de text integral (SQLite, sau înainte să îl creezi în Meela > Baldrick AI), subiectele conexe se găsesc citind mesajele, aproximativ 2,5 secunde la 50.000 de mesaje: se caută doar atâtea dintre ultimele mesaje (0: toate). Cu indexul, se caută în toate mesajele."
