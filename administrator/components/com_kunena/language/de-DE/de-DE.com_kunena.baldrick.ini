COM_KUNENA_BALDRICK_PAUSED_NOTICE = "<strong>Baldrick AI ist pausiert</strong> seit %s, weil der KI-Anbieter seine Anfragen abgelehnt hat: <em>%s</em>. Wartende Themen warten; Baldrick versucht es alle paar Minuten erneut und nimmt die Arbeit von selbst wieder auf, sobald der Anbieter antwortet. Prüfen Sie API-Schlüssel, Guthaben/Kontingent und Modelle in <a href=\"%s\">den Einstellungen</a> (Speichern beendet die Pause sofort)."
