PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Upišite za pretragu modela"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Nijedan model ne odgovara"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Cijene popunjene s liste provajdera."
