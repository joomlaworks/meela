PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrickは、フォーラムの最初のAI応答者です。新しいトピックと、長く放置された後に再開されたトピックに、管理者もモデレータも返信していない場合、AnthropicまたはOpenAI互換のAPIを使って返信します。<strong>プライバシー:</strong> 処理するトピック（および関連する公開トピック）のテキストは、設定したAIプロバイダーに送信されます。プライバシーポリシーに記載してください。アクティビティ、合計、費用: Meela &gt; Baldrick AI。"

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "ステップ1: 仕分けモデル（小型・低コスト）"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "新しい質問はまず1つずつ読まれ、評価されます（回答可能、範囲が広すぎる、詳細が不足、質問ではない、スパム）。関連するトピックの検索クエリも書かれます。小型で高速なモデルで十分です。"
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "ステップ2: 回答モデル（より高性能）"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "トピックとフォーラムで見つかった関連する公開トピックを使って、明確な質問への回答を書きます。ステップ1の接続を別のモデルで使うことも、独自の接続を使うこともできます。"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Baldrickが返信するとき"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrickは、新しいすべてのトピック、トピックの投稿者がBaldrickに返した返信（会話）、および以下の日数より長く放置されたトピックへの返信を確認します。最後の投稿が管理者またはモデレータによるものである場合は、決して返信しません。"
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Baldrickの返信方法"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "返信は、Baldrickのユーザとして、フォーラムのBBCodeですぐに投稿されます。フォーラムのトピックへのリンクは相対リンクです。"
PLG_KUNENA_BALDRICK_SECTION_SPAM = "スパム"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "仕分けモデルがある投稿をスパム（広告、電話番号、SEOリンクなど）と確信した場合、Baldrickはそれを非公開にします。投稿が最初の投稿であれば、トピック全体を非公開にします。非公開の投稿は承認待ちになるため、承認すれば誤りを取り消せます。"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "通知"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Joomlaのメール設定を通じて、プレーンテキストのメールが送信されます。内容はトピックの最初の投稿と、その最後の5件の投稿（新しい順）です。スパムへの対応とエラー（Baldrickが断念したトピック、AIプロバイダーがリクエストを拒否したための一時停止）は常に通知されます。各メールの結果はアクティビティ・ログに表示されます。"

PLG_KUNENA_BALDRICK_PROVIDER = "APIの種類"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API（Claude、およびQwenなどのAnthropic互換エンドポイント）、またはOpenAI互換のChat Completions（OpenAI、Qwen/DashScope、OpenRouter、DeepSeek、Ollama、vLLMなど）。"
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic互換（Messages API）"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI互換（Chat Completions）"
PLG_KUNENA_BALDRICK_BASE_URL = "ベースURL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "公式APIを使う場合は空欄のままにしてください（https://api.anthropic.com または https://api.openai.com/v1）。Qwen Cloudの例: https://token-plan.maas.qwencloudapi.com/apps/anthropic（Anthropic互換）または https://token-plan.maas.qwencloudapi.com/compatible-mode/v1（OpenAI互換）。"
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "空欄: 公式API"
PLG_KUNENA_BALDRICK_API_KEY = "APIキー"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "プロバイダーのAPIキーです。キーとモデルが設定されるまで、Baldrickは何もしません。"
PLG_KUNENA_BALDRICK_MODEL = "モデル"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "仕分けステップのモデルです。例: claude-haiku-5-5。&quot;モデルを取得&quot;は、上の値（保存済みかどうかに関わらず）を使ってプロバイダーのモデルを、検索可能な一覧で表示します（1時間保持されます。&quot;更新&quot;で再取得）。名前を直接入力することもできます。&quot;テスト&quot;は小さなリクエストをモデルに送信します。"
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "回答ステップのモデルです。例: claude-sonnet-5-5（最良の回答にはclaude-opus-5-5）。&quot;モデルを取得&quot;でプロバイダーのモデルを一覧表示できます。名前を直接入力することもできます。&quot;テスト&quot;は小さなリクエストをモデルに送信します。"
PLG_KUNENA_BALDRICK_FETCH_MODELS = "モデルを取得"
PLG_KUNENA_BALDRICK_TEST = "テスト"
PLG_KUNENA_BALDRICK_WORKING = "処理中..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- モデルを選択 -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "リクエストに失敗しました。"
PLG_KUNENA_BALDRICK_PRICE_IN = "価格: 入力"
PLG_KUNENA_BALDRICK_PRICE_OUT = "価格: 出力"
PLG_KUNENA_BALDRICK_PRICE_DESC = "費用の見積もり用の、100万トークンあたりのUSD。空欄: 既知のClaudeモデルの定価。それ以外は0（プロバイダーが費用そのものを報告する場合を除く）。"
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "ステップ1の接続を使用"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "仕分けステップと同じAPIの種類、ベースURL、キーを使います（下で選んだモデルで）。回答に別のプロバイダーを使うには「いいえ」を選んでください。"
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: 拒否時のフォールバック"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Anthropic自身のAPIでOpus/Sonnet 5.xモデルを使う場合のみ: モデルの安全性チェックがリクエストを拒否すると、APIはAnthropicが選んだフォールバックモデルで再実行します（サーバー側のフォールバック）。Haikuでは利用できません。"

PLG_KUNENA_BALDRICK_DRY_RUN = "ドライラン"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "設定をテストするため: Baldrickは管理者とモデレータが始めたトピック（新しいトピックと、Baldrickへのその後の返信）にのみ返信し、投稿を非公開にすることは決してありません（スパムは通報のみ）。"
PLG_KUNENA_BALDRICK_USER = "Baldrickのユーザ"
PLG_KUNENA_BALDRICK_USER_DESC = "Baldrickが投稿するユーザです。空欄にすると、&quot;Baldrick&quot;というユーザが自動的に作成されます（使用可能なパスワードも実際のメールアドレスもありません）。フォーラムのプロファイルでアバターと署名を設定してください（新しいユーザには署名 &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot; が設定されます）。"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "再開するまでの日数"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "前回の投稿がこの日数より古いトピックへの返信は、新しい質問として扱われます。"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "トピックごとの返信数"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "同じトピックでBaldrickが返信できる回数です: 最初の返信と、トピックの投稿者がBaldrickに返信した場合（求められた詳細、さらなる質問）の回答、またはトピックが長く放置された後に再開された場合の回答を含みます。"
PLG_KUNENA_BALDRICK_DAILY_CAP = "1日あたりの返信数"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "24時間以内の返信は最大でこの数までです（0: 制限なし）。大量投稿からAPIの予算を守ります。"
PLG_KUNENA_BALDRICK_MIN_LENGTH = "投稿の最小文字数"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "これより短い投稿（書式を除く文字数）は無視されます。"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "次のカテゴリーのみ"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "これらのカテゴリーでのみ返信します（何も選択しない場合: すべてのカテゴリー）。"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "次のカテゴリーでは決して返信しない"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "これらのカテゴリーでは決して返信しません。"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "公開カテゴリーのみ"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "ゲストが閲覧できるカテゴリーでのみ返信し、非公開のコンテンツがAIプロバイダーに送られないようにします。関連するトピックは常に公開カテゴリーからのみ取得されます。"

PLG_KUNENA_BALDRICK_TRANSLATE = "英語の翻訳を追加"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrickは投稿者の言語で返信します。このオプションを有効にすると、他の言語での返信の後に英語の翻訳が続きます（英語を話すスタッフや読者に便利です）。"
PLG_KUNENA_BALDRICK_RETRIEVAL = "関連するトピック"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "仕分けステップの検索クエリで見つかった関連する公開トピックのうち、回答モデルに渡される数です。"
PLG_KUNENA_BALDRICK_PRESET = "組み込みのマスタープロンプト"
PLG_KUNENA_BALDRICK_PRESET_DESC = "すべての回答の基になる指示です（読み取り専用）。以下のサイトのコンテキストがこれに追加されます。"
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "サイトのコンテキスト"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "フォーラムの内容、対応する製品とバージョン、ドキュメントへのリンク、使うべき口調、Baldrickが決してしてはならないことなど。両方のステップのプロンプトに追加されます（仕分けモデルがスパムと話題に沿った投稿を見分けるのにも役立ちます）。"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "例: これはExampleSoftのサポートフォーラムです。バージョン3と4に対応しています。ドキュメントは https://docs.example.com にあります。返金を約束しないでください。"
PLG_KUNENA_BALDRICK_CANNED = "定型返信"
PLG_KUNENA_BALDRICK_CANNED_DESC = "範囲が広すぎる質問への返信（AIの回答は書かれません）と、回答を作成できない場合の代わりの返信です。返信は3つのダッシュ（---）の行で区切ります。ランダムに1つが選ばれます。プレースホルダー: {name}（投稿者）、{search_url}（質問のフォーラム検索）、{forum_url}、{topic_url}。フォーラムのBBCodeが使えます。"

PLG_KUNENA_BALDRICK_SPAM_ACTION = "スパム"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "仕分けモデルが投稿をスパムと確信した場合に行う操作です。最初の2つの場合は、メールも送信されます。"
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "非公開にして通知（最初の投稿の場合はトピック全体）"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "通知のみ"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "無視"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "信頼される条件（投稿数）"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "公開済みの投稿をこの数以上持つユーザの投稿、およびスタッフの投稿は、決して非公開にされず、通報のみされます。"

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "次のスタッフに通知"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "通知を受け取るスーパーユーザ、Meelaの管理者、モデレータ（Ctrl/Cmd+クリックで複数選択）。"
PLG_KUNENA_BALDRICK_NOTIFY_ON = "通知する対象"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Baldrickが投稿するすべての返信（回答、定型返信、詳細の質問）とスパム、またはスパムのみ。エラーは常に通知されます。"
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "すべての返信、スパム、エラー"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "スパムとエラーのみ"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "次のアドレスに通知"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "追加のメールアドレス（カンマで区切る）。"

PLG_KUNENA_BALDRICK_PROCESSING = "処理"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "自動: トピックをキューに入れたページが送信された直後（PHP-FPMの場合）、またはサイト自体へのバックグラウンドリクエストによって処理されます。コマンドラインのみ: cron（Joomla 3.x UTD）から &quot;php cli/joomla.php kunena:baldrick:process&quot; を実行します（例: 毎分）。"
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "自動"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "コマンドラインのみ（cron）"
PLG_KUNENA_BALDRICK_LOG_DAYS = "アクティビティ・ログを保持する日数"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "この日数より古いアクティビティ・ログの行は削除されます。月ごとの合計は36か月間保持されます。"

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "詳細: 処理、制限、タイムアウト"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "投稿がAIを待つことは決してありません: トピックはキューに入れられ、バックグラウンドで処理されます。ネットワークのエラー、レート制限、過負荷のプロバイダーは再試行されます（プロバイダーが許す限り早く）。その後、トピックは後で再度試行されます（3回まで）。アカウントのエラー（無効なキー、クレジットなし、不明なモデル）はBaldrickを一時停止させ、上記の宛先に通知します。"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "接続のタイムアウト（秒）"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "プロバイダーが接続を受け付けるまでの待ち時間です。ネットワークの問題をすばやく表示するため、短くしています。"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "仕分けの応答タイムアウト（秒）"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "仕分けモデルが回答を完成させるまでの待ち時間です（短い回答です）。"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "回答の応答タイムアウト（秒）"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "回答モデルが回答を完成させるまでの待ち時間です。回答はストリーミングされません。そのため、返信全体の作成が含まれ、先に考えるモデルでは1分以上かかることがあります。"
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "仕分けの最大トークン数"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "回答の最大トークン数"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "モデルの出力の上限です（思考するモデルの場合は思考を含む）。回答が途切れる場合は増やしてください。"
PLG_KUNENA_BALDRICK_MAX_WAIT = "キューでの最大待ち時間（時間）"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "この時間を超えて待機しているトピック（例: プロバイダーの障害の後）はスキップされます。数日後の返信は不自然だからです。0: 制限なし。"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "アカウントのエラーの後の一時停止（分）"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "APIキーが無効になった場合、クレジットや利用枠が尽きた場合、または不明なモデルの場合、Baldrickは一時停止します（キューのトピックは待機します）。通知の宛先に1回だけメールを送り、プロバイダーが応答するまで、この分数ごとに再試行します。これらの設定を保存すると一時停止が終わります。"
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "更新"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "すべてのモデルを表示"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "チャットの回答を書けないモデル（埋め込み、音声、画像など）も含めます。"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "入力してモデルを検索"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "一致するモデルがありません"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "価格はプロバイダーの一覧から入力されました。"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "通常の検索: 検索する最新の投稿数"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "全文検索インデックスがない場合（SQLite、または「Meela > Baldrick AI」で作成する前）、関連するトピックは投稿を読み込んで見つけます（投稿5万件につき約2.5秒）。検索するのは最新のこの件数だけです（0: すべて）。インデックスがあれば、すべての投稿が検索されます。"
