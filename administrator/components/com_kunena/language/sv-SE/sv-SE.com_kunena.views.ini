COM_KUNENA_A_MAILMOD = "E-post Moderatorer"
COM_KUNENA_A_MAILMOD_DESC = "Sätt till <em>Ej godkända inlägg</em> eller <em>Alla nya inlägg</em> om du vill att e-postaviseringar på nya inlägg ska sändas till kategorimoderatorerna. Obs: Globala moderatorer och administratörer kommer inte att få e-postaviseringar med den här inställningen, om du inte specifikt anger dem som moderatorer för kategorin."
COM_KUNENA_A_PESONNALTEXT = "Max. personlig textlängd"
COM_KUNENA_A_PESONNALTEXT_DESC = "Maximalt antal tillåtna tecken för den personliga texten i användarprofilen."
COM_KUNENA_A_POLL_ALLOW_ONE_VOTE = "Enbart singel röst"
