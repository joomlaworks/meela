PLG_KUNENA_BALDRICK_PROCESSING = "עיבוד"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "אוטומטי: מיד לאחר שהדף שהוסיף נושא לתור נשלח (עם PHP-FPM), או בבקשת רקע לאתר עצמו. משורת הפקודה בלבד: הרץ &quot;php cli/joomla.php kunena:baldrick:process&quot; מ-cron (Joomla 3.x UTD), למשל כל דקה."
