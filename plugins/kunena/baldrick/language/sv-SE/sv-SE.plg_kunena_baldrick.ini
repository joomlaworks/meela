PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, forumets AI-förstahandssvarare: svarar på nya trådar och på trådar som väckts efter lång tystnad, när ingen administratör eller moderator har svarat, med hjälp av Anthropics eller OpenAI-kompatibla API:er. <strong>Integritet:</strong> texten i trådarna den hanterar (och i relaterade publika trådar) skickas till den AI-leverantör du konfigurerar; nämn detta i din integritetspolicy. Aktivitet, summor och kostnader: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Steg 1: sorteringsmodell (liten, billig)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Läser varje ny fråga först: bedömer den (kan besvaras, för bred, saknar detaljer, inte en fråga, spam) och skriver sökfrågorna för relaterade trådar. En liten, snabb modell räcker."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Steg 2: svarsmodell (mer kapabel)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Skriver svaret på tydliga frågor, med hjälp av tråden och de relaterade publika trådarna som finns i forumet. Den kan använda anslutningen från steg 1 med en annan modell, eller en egen anslutning."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "När Baldrick svarar"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick tittar på varje ny tråd, på trådstartarens svar till Baldrick (ett samtal) och på svar i trådar som varit tysta längre än antalet dagar nedan. Den svarar aldrig när det sista inlägget kommer från en administratör eller moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Så svarar Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Svar publiceras direkt som Baldricks användare, i forumets BBCode. Länkar till forumtrådar är relativa."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "När sorteringsmodellen är säker på att ett inlägg är spam (reklam, telefonnummer, SEO-länkar ...) avpublicerar Baldrick det: en hel tråd när det är det första inlägget. Avpublicerade inlägg väntar på moderering, så ett misstag rättas genom att du godkänner dem."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Aviseringar"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Ett e-postmeddelande i ren text skickas via Joomlas e-postinställningar, med trådens första inlägg och dess senaste 5 inlägg, nyast först. Spamåtgärder och fel (en tråd Baldrick gav upp på, en paus eftersom AI-leverantören avvisar förfrågningarna) meddelas alltid. Resultatet av varje e-post visas i aktivitetsloggen."

PLG_KUNENA_BALDRICK_PROVIDER = "API-typ"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, och Anthropic-kompatibla slutpunkter som Qwens), eller OpenAI-kompatibla Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM ...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-kompatibel (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-kompatibel (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Bas-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Lämna tomt för det officiella API:et (https://api.anthropic.com eller https://api.openai.com/v1). Exempel för Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-kompatibelt) eller https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-kompatibelt)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Tomt: det officiella API:et"
PLG_KUNENA_BALDRICK_API_KEY = "API-nyckel"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Leverantörens API-nyckel. Baldrick gör ingenting förrän en nyckel och modellerna är angivna."
PLG_KUNENA_BALDRICK_MODEL = "Modell"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modell för sorteringssteget, t.ex. claude-haiku-5-5. &quot;Hämta modeller&quot; listar leverantörens modeller med värdena ovan (sparade eller inte) i en sökbar lista (sparas i en timme; &quot;Uppdatera&quot; hämtar på nytt); du kan också skriva ett namn. &quot;Testa&quot; skickar en liten förfrågan till modellen."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modell för svarssteget, t.ex. claude-sonnet-5-5 (eller claude-opus-5-5 för de bästa svaren). &quot;Hämta modeller&quot; listar leverantörens modeller; du kan också skriva ett namn. &quot;Testa&quot; skickar en liten förfrågan till modellen."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Hämta modeller"
PLG_KUNENA_BALDRICK_TEST = "Testa"
PLG_KUNENA_BALDRICK_WORKING = "Arbetar..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Välj en modell -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Förfrågan misslyckades."
PLG_KUNENA_BALDRICK_PRICE_IN = "Pris: indata"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Pris: utdata"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per miljon tokens, för kostnadsberäkningarna. Tomt: listpriset för kända Claude-modeller, annars 0 (om inte leverantören själv rapporterar kostnaden)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Använd anslutningen från steg 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Använd samma API-typ, bas-URL och nyckel som sorteringssteget (med modellen som väljs nedan). Välj Nej för att använda en annan leverantör för svaren."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: reserv vid avslag"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Endast på Anthropics eget API med Opus/Sonnet 5.x-modeller: när modellens säkerhetskontroller avböjer en förfrågan körs den om på en reservmodell som Anthropic väljer (serverbaserade reserver). Inte tillgängligt för Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Testkörning"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "För att testa inställningarna: Baldrick svarar bara i trådar som startats av administratörer och moderatorer (nya trådar, och deras uppföljningar till Baldrick), och avpublicerar aldrig inlägg (spam rapporteras bara)."
PLG_KUNENA_BALDRICK_USER = "Baldricks användare"
PLG_KUNENA_BALDRICK_USER_DESC = "Användaren som Baldrick skriver som. Lämna tomt för att en användare &quot;Baldrick&quot; ska skapas automatiskt (inget användbart lösenord, ingen riktig e-postadress). Ange dess avatar och signatur i dess forumprofil (en ny användare får signaturen &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Väck upp efter (dagar)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Ett svar i en tråd vars föregående inlägg är äldre än så här behandlas som en ny fråga."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Svar per tråd"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Hur många gånger Baldrick får svara i samma tråd: dess första svar, och dess svar när trådens startare svarar på det (detaljer som den bad om, en ytterligare fråga) eller när tråden väcks efter lång tystnad."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Svar per dag"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Högst så här många svar på 24 timmar (0: ingen gräns). Skyddar din API-budget mot översvämningar."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Lägsta längd på inlägg"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Inlägg som är kortare än så här (tecken, utan formatering) ignoreras."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Endast i dessa kategorier"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Svara bara i dessa kategorier (ingen vald: alla kategorier)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Aldrig i dessa kategorier"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Svara aldrig i dessa kategorier."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Endast publika kategorier"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Svara bara i kategorier som gäster kan läsa, så att inget privat innehåll skickas till AI-leverantören. Relaterade trådar hämtas alltid från publika kategorier."

PLG_KUNENA_BALDRICK_TRANSLATE = "Lägg till en engelsk översättning"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick svarar på avsändarens språk. Med det här alternativet följs svar på andra språk av en engelsk översättning (användbart för engelskspråkig personal och läsare)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Relaterade trådar"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Hur många relaterade publika trådar (hittade med sökfrågorna från sorteringssteget) som ges till svarsmodellen."
PLG_KUNENA_BALDRICK_PRESET = "Inbyggd huvudprompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Instruktionerna som varje svar utgår från (skrivskyddad). Din webbplatskontext nedan läggs till dem."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Webbplatskontext"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Vad forumet handlar om, vilka produkter och versioner som stöds, länkar till dokumentation, vilken ton som ska användas, vad Baldrick aldrig får göra ... Läggs till i prompterna för båda stegen (det hjälper också sorteringsmodellen att skilja spam från relevanta inlägg)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "t.ex. Det här är supportforumet för ExampleSoft. Vi stöder version 3 och 4. Dokumentationen finns på https://docs.example.com. Lova aldrig återbetalningar."
PLG_KUNENA_BALDRICK_CANNED = "Standardsvar"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Svar på frågor som är för breda (inget AI-svar skrivs), och reservsvar när inget svar kan skrivas. Skilj svaren åt med en rad med tre bindestreck (---); ett väljs slumpmässigt. Platshållare: {name} (skribenten), {search_url} (forumsökning efter frågan), {forum_url}, {topic_url}. Forumets BBCode är tillåten."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Vad som ska göras när sorteringsmodellen är säker på att ett inlägg är spam. Ett e-postmeddelande skickas i de två första fallen."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Avpublicera (hela tråden för ett första inlägg) och meddela"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Meddela bara"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorera"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Betrodd efter (inlägg)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Inlägg från användare med minst så här många publicerade inlägg, och från personalen, avpubliceras aldrig: de rapporteras bara."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Meddela dessa medlemmar i personalen"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, Meela-administratörer och moderatorer som får aviseringarna (Ctrl/Cmd-klicka för att välja flera)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Meddela om"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Varje svar som Baldrick lägger ut (svar, standardsvar, förfrågningar om detaljer) och spam, eller endast spam. Fel meddelas alltid."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Varje svar, spam och fel"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Endast spam och fel"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Meddela dessa adresser"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Fler e-postadresser, åtskilda med kommatecken."

PLG_KUNENA_BALDRICK_PROCESSING = "Bearbetning"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatisk: direkt efter att sidan som köade tråden har skickats (med PHP-FPM), eller via en bakgrundsförfrågan till webbplatsen själv. Endast kommandoraden: kör \"php cli/joomla.php kunena:baldrick:process\" från cron (Joomla 3.x UTD), t.ex. varje minut."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatisk"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Endast kommandoraden (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Behåll aktivitetsloggen (dagar)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Rader i aktivitetsloggen som är äldre än så här raderas. Månadssummor behålls i 36 månader."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avancerat: bearbetning, gränser och tidsgränser"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Publicering väntar aldrig på AI: trådar köas och bearbetas i bakgrunden. Nätverksfel, hastighetsgränser och överbelastade leverantörer försöks igen (så snart leverantören tillåter), sedan försöks tråden igen senare (3 försök). Kontofel (ogiltig nyckel, slut på krediter, okänd modell) pausar Baldrick och meddelar mottagarna ovan."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Anslutningens tidsgräns (sekunder)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Hur länge det ska väntas på att leverantören godtar anslutningen. Kort, så att nätverksproblem syns snabbt."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Sortering: svarstidsgräns (sekunder)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Hur länge det ska väntas på sorteringsmodellens fullständiga svar (det är kort)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Svarets svarstidsgräns (sekunder)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Hur länge det ska väntas på svarsmodellens fullständiga svar. Svaren strömmas inte: det här gäller hela svaret, och modeller som tänker först kan behöva en minut eller mer."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Sortering: max-tokens"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Svarets max-tokens"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Övre gräns för modellens utdata (inklusive dess tänkande, för modeller som tänker). Höj den om svar klipps av."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Längsta väntetid i kön (timmar)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Trådar som fortfarande väntar efter så här lång tid (t.ex. efter ett avbrott hos leverantören) hoppas över: ett svar flera dagar senare vore märkligt. 0: ingen gräns."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Paus efter kontofel (minuter)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Efter en ogiltig nyckel, slut på krediter eller kvot, eller en okänd modell pausar Baldrick (köade trådar väntar), skickar ett e-postmeddelande till mottagarna en gång och försöker igen efter så här många minuter tills leverantören svarar. Om du sparar inställningarna avslutas pausen."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Uppdatera"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Visa alla modeller"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Ta med modeller som inte kan skriva chattsvar (embeddings, tal, bilder ...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Skriv för att söka bland modellerna"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Inga modeller matchar"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Priserna har fyllts i från leverantörens lista."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Enkel sökning: senaste inlägg som söks"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Utan fulltextindex (SQLite, eller innan du skapar det i Meela > Baldrick AI) hittas relaterade trådar genom att läsa inläggen, ungefär 2,5 sekunder per 50 000 inlägg: bara så här många av de senaste inläggen söks (0: alla). Med indexet söks varje inlägg."
