PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick អ្នកឆ្លើយតបដំបូងដោយ AI របស់វេទិកា៖ ឆ្លើយតបទៅប្រធានបទថ្មី និងប្រធានបទដែលត្រូវបានរស់ឡើងវិញក្រោយពេលស្ងាត់យូរ នៅពេលដែលគ្មានអ្នកគ្រប់គ្រង ឬអន្តរការីណាបានឆ្លើយ ដោយប្រើ API របស់ Anthropic ឬ API ដែលត្រូវគ្នានឹង OpenAI។ <strong>ឯកជនភាព៖</strong> អត្ថបទនៃប្រធានបទដែលវាដោះស្រាយ (និងប្រធានបទសាធារណៈដែលពាក់ព័ន្ធ) ត្រូវបានផ្ញើទៅអ្នកផ្តល់សេវា AI ដែលអ្នកកំណត់រចនាសម្ព័ន្ធ សូមនិយាយអំពីរឿងនេះក្នុងគោលការណ៍ឯកជនភាពរបស់អ្នក។ សកម្មភាព សរុប និងថ្លៃចំណាយ៖ Meela &gt; Baldrick AI។"
