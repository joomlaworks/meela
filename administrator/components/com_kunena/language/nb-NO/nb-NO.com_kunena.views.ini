COM_KUNENA_A_ENABLED_DESC = "Aktiver funksjonalitet for avstemning. Dette må settes til <em>Ja</em> for å støtte avstemninger. I tillegg må du angi kategori IDer som du vil tillate avstemninger i. Uten kategori IDer spesifisert, vil ingen avstemninger være synlig."
