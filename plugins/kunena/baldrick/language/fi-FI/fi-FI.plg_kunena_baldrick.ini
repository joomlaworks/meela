PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, foorumin tekoälyn ensivastaaja: vastaa uusiin aiheisiin ja pitkän hiljaisuuden jälkeen herätettyihin aiheisiin, kun yksikään ylläpitäjä tai valvoja ei ole vastannut, käyttäen Anthropicin tai OpenAI-yhteensopivia rajapintoja. <strong>Tietosuoja:</strong> sen käsittelemien aiheiden teksti (ja aiheeseen liittyvien julkisten aiheiden teksti) lähetetään määrittämallesi tekoälypalveluntarjoajalle; mainitse tämä tietosuojaselosteessasi. Toiminta, yhteissummat ja kustannukset: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Vaihe 1: lajitteluvaiheen malli (pieni, halpa)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Lukee jokaisen uuden kysymyksen ensin: arvioi sen (vastattavissa, liian laaja, puuttuvia tietoja, ei kysymys, roskaposti) ja kirjoittaa hakukyselyt aiheeseen liittyville aiheille. Pieni ja nopea malli riittää."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Vaihe 2: vastausmalli (pätevämpi)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Kirjoittaa vastauksen selkeisiin kysymyksiin käyttäen aihetta ja foorumista löydettyjä aiheeseen liittyviä julkisia aiheita. Se voi käyttää vaiheen 1 yhteyttä toisella mallilla tai omaa yhteyttä."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Milloin Baldrick vastaa"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick tarkastelee jokaista uutta aihetta, aiheen aloittajan vastauksia Baldrickille (keskustelu) ja vastauksia aiheisiin, jotka ovat olleet hiljaa alla olevaa päivämäärää pidempään. Se ei vastaa koskaan, kun viimeinen viesti on ylläpitäjältä tai valvojalta."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Miten Baldrick vastaa"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Vastaukset julkaistaan heti Baldrickin käyttäjänä foorumin BBCode-muodossa. Linkit foorumin aiheisiin ovat suhteellisia."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Roskaposti"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kun lajitteluvaiheen malli on varma, että viesti on roskapostia (mainontaa, puhelinnumeroita, SEO-linkkejä ...), Baldrick poistaa sen julkaisusta: koko aiheen, jos kyseessä on ensimmäinen viesti. Julkaisusta poistetut viestit odottavat valvontaa, joten virhe korjataan hyväksymällä ne."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Ilmoitukset"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Pelkkätekstinen sähköposti lähetetään Joomlan postiasetusten kautta; siinä on aiheen ensimmäinen viesti ja sen viimeiset 5 viestiä, uusin ensin. Roskapostitoimista ja virheistä (aihe, josta Baldrick luopui; tauko, koska tekoälypalveluntarjoaja hylkää sen pyynnöt) ilmoitetaan aina. Jokaisen sähköpostin tulos näkyy toimintalokissa."

PLG_KUNENA_BALDRICK_PROVIDER = "API-tyyppi"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude sekä Anthropic-yhteensopivat päätepisteet, kuten Qwenin), tai OpenAI-yhteensopivat Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM ...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-yhteensopiva (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-yhteensopiva (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Perus-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Jätä tyhjäksi virallista API:a varten (https://api.anthropic.com tai https://api.openai.com/v1). Esimerkkejä Qwen Cloudille: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-yhteensopiva) tai https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-yhteensopiva)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Tyhjä: virallinen API"
PLG_KUNENA_BALDRICK_API_KEY = "API-avain"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Palveluntarjoajan API-avain. Baldrick ei tee mitään ennen kuin avain ja mallit on asetettu."
PLG_KUNENA_BALDRICK_MODEL = "Malli"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Lajitteluvaiheen malli, esim. claude-haiku-5-5. &quot;Hae mallit&quot; listaa palveluntarjoajan mallit yllä olevilla arvoilla (tallennettuina tai ei) haettavassa listassa (säilytetään tunnin; &quot;Päivitä&quot; hakee uudelleen); voit myös kirjoittaa nimen. &quot;Testaa&quot; lähettää pienen pyynnön mallille."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Vastausvaiheen malli, esim. claude-sonnet-5-5 (tai claude-opus-5-5 parhaisiin vastauksiin). &quot;Hae mallit&quot; listaa palveluntarjoajan mallit; voit myös kirjoittaa nimen. &quot;Testaa&quot; lähettää pienen pyynnön mallille."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Hae mallit"
PLG_KUNENA_BALDRICK_TEST = "Testaa"
PLG_KUNENA_BALDRICK_WORKING = "Työskennellään..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Valitse malli -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Pyyntö epäonnistui."
PLG_KUNENA_BALDRICK_PRICE_IN = "Hinta: syöte"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Hinta: tuloste"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD miljoonaa tokenia kohden, kustannusarvioita varten. Tyhjä: tunnettujen Claude-mallien listahinta, muuten 0 (ellei palveluntarjoaja itse ilmoita kustannusta)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Käytä vaiheen 1 yhteyttä"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Käytä samaa API-tyyppiä, perus-URL:ia ja avainta kuin lajitteluvaiheessa (alla valitulla mallilla). Valitse Ei, jos haluat käyttää vastauksiin toista palveluntarjoajaa."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: varavaihtoehto kieltäytymisissä"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Vain Anthropicin omassa API:ssa Opus/Sonnet 5.x -malleilla: kun mallin turvallisuustarkistus hylkää pyynnön, API suorittaa sen uudelleen Anthropicin valitsemalla varamallilla (palvelinpuolen varavaihtoehdot). Ei saatavilla Haikulle."

PLG_KUNENA_BALDRICK_DRY_RUN = "Koeajo"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Asetusten testaamiseen: Baldrick vastaa vain ylläpitäjien ja valvojien aloittamissa aiheissa (uudet aiheet ja niiden jatkokysymykset Baldrickille) eikä koskaan poista viestejä julkaisusta (roskapostista vain ilmoitetaan)."
PLG_KUNENA_BALDRICK_USER = "Baldrickin käyttäjä"
PLG_KUNENA_BALDRICK_USER_DESC = "Käyttäjä, jonka nimissä Baldrick kirjoittaa. Jätä tyhjäksi, jolloin käyttäjä &quot;Baldrick&quot; luodaan automaattisesti (ei käytettävissä olevaa salasanaa, ei oikeaa sähköpostiosoitetta). Aseta sen profiilikuva ja allekirjoitus foorumiprofiilissa (uusi käyttäjä saa allekirjoituksen &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Herätä henkiin, kun on kulunut (päivää)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Vastaus aiheeseen, jonka edellinen viesti on tätä vanhempi, käsitellään uutena kysymyksenä."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Vastauksia aiheeseen"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Kuinka monta kertaa Baldrick saa vastata samaan aiheeseen: ensimmäinen vastaus, sekä vastaukset silloin, kun aiheen aloittaja vastaa sille (pyytämiinsä lisätietoihin tai jatkokysymykseen), tai kun aihe herätetään pitkän hiljaisuuden jälkeen."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Vastauksia päivässä"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Enintään tämä määrä vastauksia 24 tunnissa (0: ei rajaa). Suojaa API-budjettiasi ryntäyksiltä."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Viestin vähimmäispituus"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Tätä lyhyemmät viestit (merkkejä muotoilematta) ohitetaan."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Vain näissä kategorioissa"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Vastaa vain näissä kategorioissa (ei valintaa: kaikki kategoriat)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Ei koskaan näissä kategorioissa"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Älä vastaa koskaan näissä kategorioissa."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Vain julkiset kategoriat"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Vastaa vain kategorioissa, jotka vierailijat voivat lukea, jotta yksityistä sisältöä ei lähetetä tekoälypalveluntarjoajalle. Aiheeseen liittyvät aiheet haetaan aina vain julkisista kategorioista."

PLG_KUNENA_BALDRICK_TRANSLATE = "Lisää englanninkielinen käännös"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick vastaa kirjoittajan kielellä. Tämän asetuksen ollessa päällä muilla kielillä kirjoitettujen vastausten perään lisätään englanninkielinen käännös (hyödyllinen englanninkielisille ylläpitäjille ja lukijoille)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Aiheeseen liittyvät aiheet"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Kuinka monta aiheeseen liittyvää julkista aihetta (löydetty lajitteluvaiheen hakukyselyillä) annetaan vastausmallille."
PLG_KUNENA_BALDRICK_PRESET = "Sisäänrakennettu pääkehote"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Ohjeet, joista jokainen vastaus lähtee liikkeelle (vain luku). Alla oleva sivuston konteksti lisätään niihin."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Sivuston konteksti"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Mistä foorumissa on kyse, tuetut tuotteet ja versiot, linkit dokumentaatioon, käytettävä sävy, mitä Baldrickin ei koskaan tule tehdä ... Lisätään molempien vaiheiden kehotteisiin (se auttaa myös lajitteluvaihetta erottamaan roskapostin aiheeseen kuuluvista viesteistä)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "esim. Tämä on ExampleSoftin tukifoorumi. Tuemme versioita 3 ja 4. Dokumentaatio löytyy osoitteesta https://docs.example.com. Älä koskaan luvata hyvityksiä."
PLG_KUNENA_BALDRICK_CANNED = "Valmiit vastaukset"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Vastaukset kysymyksiin, jotka ovat liian laajoja (tekoälyvastausta ei kirjoiteta), ja varavastaukset, kun vastausta ei voida kirjoittaa. Erottele vastaukset kolmen viivan rivillä (---); yksi valitaan satunnaisesti. Paikanvaraajat: {name} (kirjoittaja), {search_url} (foorumihaku kysymyksellä), {forum_url}, {topic_url}. Foorumin BBCode on sallittu."

