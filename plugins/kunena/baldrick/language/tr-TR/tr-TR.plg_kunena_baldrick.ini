PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Modelin çıktısının üst sınırı (düşünen modeller için düşünme dahil). Yanıtlar kesiliyorsa artırın."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Kuyrukta en fazla bekleme (saat)"
