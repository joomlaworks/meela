PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Без индекса пуног текста (SQLite, или пре него што га направите у Meela > Baldrick AI) сродне теме се налазе читањем порука, око 2,5 секунде на 50.000 порука: претражује се само толико последњих порука (0: све). Са индексом се претражује свака порука."
