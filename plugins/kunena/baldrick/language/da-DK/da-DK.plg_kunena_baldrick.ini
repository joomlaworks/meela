PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, forummets AI-førstesvarer: svarer på nye tråde og på tråde, der er genoplivet efter lang tavshed, når ingen administrator eller moderator har svaret, ved hjælp af Anthropic- eller OpenAI-kompatible API'er. <strong>Privatliv:</strong> teksten i de tråde, den håndterer (og relaterede offentlige tråde), sendes til den AI-udbyder, du konfigurerer; nævn dette i din privatlivspolitik. Aktivitet, totaler og omkostninger: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Trin 1: sorteringsmodel (lille, billig)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Læser hvert nyt spørgsmål først: vurderer det (kan besvares, for bredt, mangler detaljer, ikke et spørgsmål, spam) og skriver søgeforespørgslerne til relaterede tråde. En lille, hurtig model er nok."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Trin 2: svarmodel (mere kapabel)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Skriver svaret på klare spørgsmål ved hjælp af tråden og de relaterede offentlige tråde, der findes i forummet. Den kan bruge forbindelsen fra trin 1 med en anden model, eller en forbindelse af sin egen."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Hvornår Baldrick svarer"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick ser på hver ny tråd, på trådstarterens svar til Baldrick (en samtale) og på svar i tråde, der har været tavse længere end antallet af dage nedenfor. Den svarer aldrig, når det sidste indlæg kommer fra en administrator eller moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Sådan svarer Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Svar publiceres med det samme som Baldricks bruger, i forummets BBCode. Links til forumtråde er relative."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Når sorteringsmodellen er sikker på, at et indlæg er spam (reklame, telefonnumre, SEO-links ...), afpublicerer Baldrick det: en hel tråd, når det er det første indlæg. Afpublicerede indlæg venter på moderation, så en fejl rettes ved at godkende dem."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notifikationer"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "En e-mail i almindelig tekst sendes via Joomlas mailindstillinger, med trådens første indlæg og dens sidste 5 indlæg, nyeste først. Spamhandlinger og fejl (en tråd Baldrick opgav, en pause fordi AI-udbyderen afviser dens forespørgsler) notificeres altid. Resultatet af hver e-mail vises i aktivitetsloggen."

PLG_KUNENA_BALDRICK_PROVIDER = "API-type"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude og Anthropic-kompatible endpoints, såsom Qwens), eller OpenAI-kompatible Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM ...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-kompatibel (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-kompatibel (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Basis-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Lad feltet være tomt for det officielle API (https://api.anthropic.com eller https://api.openai.com/v1). Eksempler for Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-kompatibel) eller https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-kompatibel)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Tom: det officielle API"
PLG_KUNENA_BALDRICK_API_KEY = "API-nøgle"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Udbyderens API-nøgle. Baldrick gør intet, før en nøgle og modellerne er angivet."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model til sorteringstrinnet, f.eks. claude-haiku-5-5. &quot;Hent modeller&quot; lister udbyderens modeller med værdierne ovenfor (gemte eller ej) i en søgbar liste (gemmes i en time; &quot;Opdatér&quot; henter igen); du kan også skrive et navn. &quot;Test&quot; sender en lille forespørgsel til modellen."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model til svar-trinnet, f.eks. claude-sonnet-5-5 (eller claude-opus-5-5 for de bedste svar). &quot;Hent modeller&quot; lister udbyderens modeller; du kan også skrive et navn. &quot;Test&quot; sender en lille forespørgsel til modellen."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Hent modeller"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Arbejder..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Vælg en model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Forespørgslen mislykkedes."
PLG_KUNENA_BALDRICK_PRICE_IN = "Pris: input"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Pris: output"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD pr. million tokens, til omkostningsskønnene. Tom: listeprisen for kendte Claude-modeller, ellers 0 (medmindre udbyderen selv angiver omkostningen)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Brug forbindelsen fra trin 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Brug samme API-type, basis-URL og nøgle som sorteringstrinnet (med modellen valgt nedenfor). Vælg Nej for at bruge en anden udbyder til svarene."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: reserve ved afslag"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Kun på Anthropics eget API med Opus/Sonnet 5.x-modeller: når modellens sikkerhedstjek afviser en forespørgsel, køres den igen på en reservemodel valgt af Anthropic (serverbaserede reserver). Ikke tilgængelig for Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Testkørsel"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Til at teste konfigurationen: Baldrick svarer kun i tråde startet af administratorer og moderatorer (nye tråde og deres opfølgninger til Baldrick) og afpublicerer aldrig indlæg (spam rapporteres kun)."
PLG_KUNENA_BALDRICK_USER = "Baldricks bruger"
PLG_KUNENA_BALDRICK_USER_DESC = "Brugeren Baldrick skriver som. Lad feltet være tomt for at få oprettet en bruger &quot;Baldrick&quot; automatisk (ingen brugbar adgangskode, ingen rigtig e-mailadresse). Angiv dens avatar og signatur i dens forumprofil (en ny bruger får signaturen &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Genopliv efter (dage)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Et svar i en tråd, hvis forrige indlæg er ældre end dette, behandles som et nyt spørgsmål."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Svar pr. tråd"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Hvor mange gange Baldrick må svare i samme tråd: dets første svar, og dets svar, når trådens starter svarer på det (detaljer den har bedt om, et yderligere spørgsmål), eller tråden genoplives efter lang tavshed."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Svar pr. dag"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Højst så mange svar på 24 timer (0: ingen grænse). Beskytter dit API-budget mod oversvømmelser."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Mindste indlægslængde"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Indlæg, der er kortere end dette (tegn uden formatering), ignoreres."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Kun i disse kategorier"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Svar kun i disse kategorier (ingen valgt: alle kategorier)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Aldrig i disse kategorier"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Svar aldrig i disse kategorier."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Kun offentlige kategorier"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Svar kun i kategorier, gæster kan læse, så intet privat indhold sendes til AI-udbyderen. Relaterede tråde hentes altid kun fra offentlige kategorier."

PLG_KUNENA_BALDRICK_TRANSLATE = "Tilføj en engelsk oversættelse"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick svarer på skriverens sprog. Med denne mulighed efterfølges svar på andre sprog af en engelsk oversættelse (nyttigt for et engelsksproget personale og læsere)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Relaterede tråde"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Hvor mange relaterede offentlige tråde (fundet med søgeforespørgslerne fra sorteringstrinnet), der gives til svarmodellen."
PLG_KUNENA_BALDRICK_PRESET = "Indbygget masterprompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "De instruktioner, hvert svar tager udgangspunkt i (skrivebeskyttet). Din sitekontekst nedenfor føjes til dem."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Sitekontekst"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Hvad forummet handler om, understøttede produkter og versioner, links til dokumentation, den tone der skal bruges, hvad Baldrick aldrig må gøre ... Føjes til prompterne for begge trin (det hjælper også sorteringsmodellen med at skelne spam fra relevante indlæg)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "f.eks. Dette er supportforummet for ExampleSoft. Vi understøtter version 3 og 4. Dokumentationen findes på https://docs.example.com. Lov aldrig refusion."
PLG_KUNENA_BALDRICK_CANNED = "Standardsvar"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Svar på spørgsmål, der er for brede (der skrives intet AI-svar), og reservesvar, når intet svar kan skrives. Adskil svarene med en linje med tre bindestreger (---); et vælges tilfældigt. Pladsholdere: {name} (skriveren), {search_url} (forumsøgning efter spørgsmålet), {forum_url}, {topic_url}. Forummets BBCode er tilladt."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Hvad der skal ske, når sorteringsmodellen er sikker på, at et indlæg er spam. En e-mail sendes i de to første tilfælde."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Afpublicér (hele tråden for et første indlæg) og notificér"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Kun notificér"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorér"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Betroet efter (indlæg)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Indlæg fra brugere med mindst så mange publicerede indlæg, og fra personalet, afpubliceres aldrig: de rapporteres kun."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notificér disse medlemmer af personalet"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, Meela-administratorer og moderatorer, der modtager notifikationerne (Ctrl/Cmd+klik for at vælge flere)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notificér ved"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Hvert svar Baldrick skriver (svar, standardsvar, anmodninger om detaljer) og spam, eller kun spam. Fejl notificeres altid."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Hvert svar, spam og fejl"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Kun spam og fejl"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notificér disse adresser"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Flere e-mailadresser, adskilt med kommaer."

PLG_KUNENA_BALDRICK_PROCESSING = "Behandling"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatisk: lige efter siden, der satte tråden i kø, er sendt (med PHP-FPM), eller via en baggrundsforespørgsel til selve sitet. Kun kommandolinjen: kør \"php cli/joomla.php kunena:baldrick:process\" fra cron (Joomla 3.x UTD), f.eks. hvert minut."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatisk"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Kun kommandolinjen (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Behold aktivitetsloggen (dage)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Rækker i aktivitetsloggen, der er ældre end dette, slettes. Månedlige totaler gemmes i 36 måneder."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avanceret: behandling, grænser og timeouts"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Udgivelse venter aldrig på AI: tråde sættes i kø og behandles i baggrunden. Netværksfejl, hastighedsbegrænsninger og overbelastede udbydere forsøges igen (så snart udbyderen tillader det), derefter forsøges tråden igen senere (3 forsøg). Kontofejl (ugyldig nøgle, ingen kreditter, ukendt model) sætter Baldrick på pause og notificerer modtagerne ovenfor."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Timeout for forbindelse (sekunder)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Hvor længe der ventes på, at udbyderen accepterer forbindelsen. Kort, så netværksproblemer viser sig hurtigt."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Sortering: timeout for svar (sekunder)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Hvor længe der ventes på sorteringsmodellens komplette svar (det er kort)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Svar: timeout for svar (sekunder)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Hvor længe der ventes på svarmodellens komplette svar. Svar streames ikke: det dækker hele skrivningen af svaret, og modeller, der tænker først, kan have brug for et minut eller mere."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Sortering: maks. tokens"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Svar: maks. tokens"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Øvre grænse for modellens output (inklusive dens tænkning, for modeller der tænker). Hæv den, hvis svar bliver afkortet."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maksimal ventetid i køen (timer)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Tråde, der stadig venter efter så lang tid (f.eks. efter en udbyders nedbrud), springes over: et svar flere dage senere ville være mærkeligt. 0: ingen grænse."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pause efter kontofejl (minutter)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Efter en ugyldig nøgle, opbrugte kreditter eller kvote, eller en ukendt model går Baldrick på pause (køede tråde venter), modtagerne notificeres én gang, og den prøver igen efter så mange minutter, indtil udbyderen svarer. Gemmer du disse indstillinger, afbrydes pausen."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Opdatér"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Vis alle modeller"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Medtag modeller, der ikke kan skrive chatsvar (embeddings, tale, billeder ...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Skriv for at søge i modellerne"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Ingen modeller matcher"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Priserne er udfyldt fra udbyderens liste."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Simpel søgning: seneste indlæg der søges i"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Uden et fuldtekstindeks (SQLite, eller før du opretter det i Meela > Baldrick AI) findes relaterede tråde ved at læse indlæggene, ca. 2,5 sekunder pr. 50.000 indlæg: kun så mange af de seneste indlæg søges (0: alle). Med indekset søges alle indlæg."
