COM_KUNENA_A_FLOOD = "Flood-beskyttelse"
COM_KUNENA_A_FLOOD_DESC = "Antall sekunder en bruker må vente mellom hvert innlegg han/hun legger inn. Velg 0 (null) for å slå Flood-beskyttelse av. MERK: Flood-beskyttelse <em>kan</em> påvirke ytelsen negativt.."
COM_KUNENA_A_FORUM_JUMP = "Aktiver &quot;Bytt kategori&quot;"
