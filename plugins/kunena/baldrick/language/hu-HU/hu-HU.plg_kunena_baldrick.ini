PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, a fórum MI-alapú első válaszadója: válaszol az új témákra és a hosszú csend után újraindult témákra, ha még nem válaszolt adminisztrátor vagy moderátor, Anthropic- vagy OpenAI-kompatibilis API-k használatával. <strong>Adatvédelem:</strong> a kezelt témák szövegét (és a kapcsolódó nyilvános témák szövegét) a beállított MI-szolgáltató kapja meg; ezt tüntesse fel az adatvédelmi szabályzatában. Tevékenység, összesítések és költségek: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1. lépés: lajitelő modell (kicsi, olcsó)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Minden új kérdést először elolvas: értékeli (megválaszolható, túl általános, hiányzó részletek, nem kérdés, spam), és megírja a kapcsolódó témák keresőlekérdezéseit. Egy kis, gyors modell elegendő."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2. lépés: válaszmodell (képesebb)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Megírja a választ az egyértelmű kérdésekre, a témát és a fórumban talált kapcsolódó nyilvános témákat felhasználva. Használhatja az 1. lépés kapcsolatát másik modellel, vagy saját kapcsolattal."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Mikor válaszol a Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "A Baldrick minden új témát megnéz, a téma indítójának a Baldricknak írt válaszait (beszélgetés), valamint a válaszokat olyan témákban, amelyek az alábbi napoknál tovább voltak csendben. Soha nem válaszol, ha az utolsó hozzászólás adminisztrátortól vagy moderátortól származik."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Hogyan válaszol a Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "A válaszok azonnal, a Baldrick felhasználójaként, a fórum BBCode-jában jelennek meg. A fórumtémákra mutató hivatkozások relatívak."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Ha a lajitelő modell biztos abban, hogy egy hozzászólás spam (reklám, telefonszámok, SEO-linkek ...), a Baldrick visszavonja: első hozzászólás esetén az egész témát. A visszavont hozzászólások moderálásra várnak, így a tévedés jóváhagyással visszavonható."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Értesítések"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Egyszerű szöveges e-mail küldődik a Joomla levelezési beállításain keresztül, a téma első hozzászólásával és az utolsó 5 hozzászólásával, a legújabb elöl. A spam-intézkedésekről és a hibákról (olyan téma, amelyről a Baldrick feladta, szünet, mert az MI-szolgáltató elutasítja a kéréseit) mindig értesítés érkezik. Minden e-mail eredménye megjelenik a tevékenységnaplóban."

PLG_KUNENA_BALDRICK_PROVIDER = "API típusa"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, és az Anthropic-kompatibilis végpontok, például a Qwenéi), vagy OpenAI-kompatibilis Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM ...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-kompatibilis (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-kompatibilis (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Alap-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Hagyja üresen a hivatalos API-hoz (https://api.anthropic.com vagy https://api.openai.com/v1). Példák a Qwen Cloudhoz: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-kompatibilis) vagy https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-kompatibilis)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Üres: a hivatalos API"
PLG_KUNENA_BALDRICK_API_KEY = "API-kulcs"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "A szolgáltató API-kulcsa. A Baldrick nem csinál semmit, amíg nincs beállítva a kulcs és a modellek."
PLG_KUNENA_BALDRICK_MODEL = "Modell"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "A lajitelő lépés modellje, pl. claude-haiku-5-5. &quot;Modellek lekérése&quot; listázza a szolgáltató modelljeit a fenti értékekkel (mentve vagy sem) egy kereshető listában (egy óráig őrzi; a &quot;Frissítés&quot; újra lekéri); nevet is beírhat. &quot;Teszt&quot; egy apró kérést küld a modellnek."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "A válaszlépés modellje, pl. claude-sonnet-5-5 (vagy claude-opus-5-5 a legjobb válaszokhoz). &quot;Modellek lekérése&quot; listázza a szolgáltató modelljeit; nevet is beírhat. &quot;Teszt&quot; egy apró kérést küld a modellnek."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Modellek lekérése"
PLG_KUNENA_BALDRICK_TEST = "Teszt"
PLG_KUNENA_BALDRICK_WORKING = "Feldolgozás..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Válasszon modellt -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "A kérés nem sikerült."
PLG_KUNENA_BALDRICK_PRICE_IN = "Ár: bemenet"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Ár: kimenet"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD millió tokenenként, a költségbecslésekhez. Üresen: az ismert Claude-modellek listaára, különben 0 (hacsak a szolgáltató maga nem közli a költséget)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Az 1. lépés kapcsolatának használata"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Ugyanazt az API-típust, alap-URL-t és kulcsot használja, mint a lajitelő lépés (az alább kiválasztott modellel). Válassza a Nem lehetőséget, ha a válaszokhoz másik szolgáltatót szeretne használni."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: tartalék elutasítás esetén"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Csak az Anthropic saját API-jában, Opus/Sonnet 5.x modellekkel: ha a modell biztonsági ellenőrzése elutasít egy kérést, az API újrafuttatja azt az Anthropic által választott tartalékmodellen (szerveroldali tartalékok). Haikuhoz nem érhető el."

PLG_KUNENA_BALDRICK_DRY_RUN = "Próbafutás"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "A beállítások teszteléséhez: a Baldrick csak adminisztrátorok és moderátorok által indított témákban válaszol (az új témákban és a Baldricknak címzett követésekben), és soha nem von vissza hozzászólásokat (a spamet csak jelenti)."
PLG_KUNENA_BALDRICK_USER = "A Baldrick felhasználója"
PLG_KUNENA_BALDRICK_USER_DESC = "Az a felhasználó, akiként a Baldrick ír. Üresen hagyva automatikusan létrejön egy &quot;Baldrick&quot; nevű felhasználó (nincs használható jelszó, nincs valódi e-mail-cím). Állítsa be az avatárját és aláírását a fórumprofilban (az új felhasználó aláírása: &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Újraélesztés ennyi után (nap)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Az olyan témában lévő válasz, amelynek előző hozzászólása ennél régebbi, új kérdésként kezelendő."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Válaszok témánként"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Hányszor válaszolhat a Baldrick ugyanabban a témában: az első válasza, valamint a válaszai, amikor a téma indítója rájuk válaszol (kért részletek, további kérdés), vagy a téma hosszú csend után újraéled."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Válaszok naponta"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Legfeljebb ennyi válasz 24 óra alatt (0: nincs korlát). Megóvja az API-költségvetést az elárasztástól."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Hozzászólás minimális hossza"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Az ennél rövidebb hozzászólásokat (karakterek, formázás nélkül) figyelmen kívül hagyja."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Csak ezekben a kategóriákban"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Csak ezekben a kategóriákban válaszoljon (ha nincs kijelölés: minden kategória)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Soha ezekben a kategóriákban"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Soha ne válaszoljon ezekben a kategóriákban."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Csak nyilvános kategóriák"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Csak olyan kategóriákban válaszol, amelyeket a vendégek olvashatnak, így semmilyen privát tartalom nem kerül az MI-szolgáltatóhoz. A kapcsolódó témák mindig csak nyilvános kategóriákból származnak."

PLG_KUNENA_BALDRICK_TRANSLATE = "Angol fordítás hozzáadása"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "A Baldrick a hozzászóló nyelvén válaszol. Ezzel a beállítással a más nyelvű válaszokat angol fordítás követi (hasznos angol nyelvű stáb és olvasók számára)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Kapcsolódó témák"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Hány kapcsolódó nyilvános témát (a lajitelő lépés keresőlekérdezéseivel találva) kapjon meg a válaszmodell."
PLG_KUNENA_BALDRICK_PRESET = "Beépített főprompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Az utasítások, amelyekből minden válasz indul (csak olvasható). Az alábbi webhelykontextus ezekhez fűződik."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Webhelykontextus"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "A fórum témája, a támogatott termékek és verziók, a dokumentációra mutató hivatkozások, a használandó hangnem, és amit a Baldrick soha nem tehet ... Mindkét lépés kérésébe bekerül (a lajitelő modellnek is segít megkülönböztetni a spamet a témába illő hozzászólásoktól)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "pl. Ez az ExampleSoft támogatási fóruma. A 3-as és 4-es verziót támogatjuk. A dokumentáció itt érhető el: https://docs.example.com. Soha ne ígérjen visszatérítést."
PLG_KUNENA_BALDRICK_CANNED = "Előre megírt válaszok"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Válaszok a túl általános kérdésekre (MI-válasz nem készül), és tartalék válaszok, ha nem lehet választ írni. A válaszokat három kötőjelből álló sorral (---) válassza szét; a rendszer véletlenszerűen választ egyet. Helyőrzők: {name} (a hozzászóló), {search_url} (fórumkeresés a kérdésre), {forum_url}, {topic_url}. A fórum BBCode-ja megengedett."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Mi történjen, ha a lajitelő modell biztos abban, hogy egy hozzászólás spam. Az első két esetben e-mail küldődik."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Visszavonás (első hozzászólásnál az egész téma) és értesítés"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Csak jelentés"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Figyelmen kívül hagyás"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Megbízható ennyi hozzászólás után"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Az ennyi közzétett hozzászólással rendelkező felhasználók, valamint a stáb hozzászólásait soha nem vonják vissza: csak jelentik őket."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Értesítendő stábtagok"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Azok a Super Userek, Meela-adminisztrátorok és moderátorok, akik az értesítéseket kapják (több kijelöléséhez Ctrl/Cmd+kattintás)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Értesítés"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "A Baldrick által közzétett összes válasz (válaszok, előre megírt válaszok, részletkérések) és a spam, vagy csak a spam. A hibákról mindig értesítést küldünk."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Minden válasz, spam és hiba"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Csak spam és hibák"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Értesítendő e-mail-címek"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "További e-mail-címek, vesszővel elválasztva."

PLG_KUNENA_BALDRICK_PROCESSING = "Feldolgozás"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatikus: közvetlenül azután, hogy az oldal, amely a témát a sorba tette, elküldésre került (PHP-FPM mellett), vagy a webhelynek küldött háttérkéréssel. Csak parancssor: a cronból futtassa a &quot;php cli/joomla.php kunena:baldrick:process&quot; parancsot (Joomla 3.x UTD), pl. percenként."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatikus"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Csak parancssor (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Tevékenységnapló megtartása (nap)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "A tevékenységnapló ennél régebbi sorai törlődnek. A havi összesítések 36 hónapig megmaradnak."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Speciális: feldolgozás, korlátok és időkorlátok"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "A közzététel soha nem vár az MI-re: a témák sorba kerülnek és a háttérben dolgozzák fel őket. A hálózati hibákat, sebességkorlátokat és túlterhelt szolgáltatókat (amint a szolgáltató engedi) újrapróbáljuk, majd a témát később (3 próbálkozás). A fiókhibák (érvénytelen kulcs, nincs kredit, ismeretlen modell) szünetet okoznak a Baldrick számára, és értesítik a fenti címzetteket."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Kapcsolódás időkorlátja (másodperc)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Meddig várjon, hogy a szolgáltató elfogadja a kapcsolatot. Rövid, hogy a hálózati problémák gyorsan kiderüljenek."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Lajitelés: válasz időkorlátja (másodperc)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Meddig várjon a lajitelő modell teljes válaszára (az rövid)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Válasz időkorlátja (másodperc)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Meddig várjon a válaszmodell teljes válaszára. A válaszok nem streamelődnek: ez a teljes válasz megírását jelenti, és az előzetesen gondolkodó modelleknek egy perc vagy több is kellhet."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Lajitelés: maximális tokenek"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Válasz: maximális tokenek"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "A modell kimenetének felső korlátja (a gondolkodási részt is beleértve, a gondolkodó modelleknél). Emelje, ha a válaszok el vannak vágva."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maximális várakozás a sorban (óra)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Az ennyi ideje még váró témákat kihagyja (pl. a szolgáltató kiesése után): napokkal későbbi válasz furcsa lenne. 0: nincs korlát."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Szünet fiókhibák után (perc)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Érvénytelen kulcs, elfogyott kredit vagy keret, illetve ismeretlen modell után a Baldrick szünetel (a sorban álló témák várnak), egyszer e-mailt küld az értesítendő címzetteknek, és ennyi perc múlva újra próbálkozik, amíg a szolgáltató válaszol. A beállítások mentése véget vet a szünetnek."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Frissítés"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Összes modell megjelenítése"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Azokat a modelleket is, amelyek nem tudnak csevegési válaszokat írni (beágyazások, beszéd, képek ...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Gépeljen a modellek kereséséhez"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Nincs egyező modell"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Az árakat a szolgáltató listájából töltöttük ki."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Egyszerű keresés: keresett legutóbbi hozzászólások"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Teljes szöveges index nélkül (SQLite, vagy mielőtt létrehozza a Meela > Baldrick AI menüpontban) a kapcsolódó témák a hozzászólások beolvasásával találhatók, körülbelül 2,5 másodperc 50 000 hozzászólásonként: csak ennyi legutóbbi hozzászólásban keres (0: mind). Az indexszel minden hozzászólásban keres."
