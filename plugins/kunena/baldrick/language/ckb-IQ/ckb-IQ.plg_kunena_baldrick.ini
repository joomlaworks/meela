PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "ئاگادارکردنەوەکان"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "ئیمەیڵێکی دەقی ئاسایی بە ڕێکخستنەکانی پۆستی Joomla دەنێردرێت، لەگەڵ یەکەم بەشداری بابەتەکە و دوایین ٥ بەشداری، نوێترین یەکەم. کرداری سپام و هەڵەکان (بابەتێک Baldrick واز لێی هێنا، ڕاگرتنێک چونکە دابینکەری AI داواکارییەکانی ڕەتدەکاتەوە) هەمیشە ئاگادار دەکرێنەوە. ئەنجامی هەر ئیمەیڵێک لە تۆماری چالاکی پیشان دەدرێت."

