COM_KUNENA_INSTALL_MIGRATE_HINT = "हमें #COMPONENT_OLD# का एक पुराना संस्करण मिला है, जो अप्रचलित डेटाबेस मॉडल और पुराने फ़ाइल स्थानों का उपयोग करता है। अपना डेटा इस पुराने संस्करण से Meela #VERSION# में स्थानांतरित करने के लिए इस विकल्प का उपयोग करें। आपके पुराने डेटा का बैकअप बनेगा, पर सभी टेम्पलेट और कस्टम परिवर्तन खो जाएँगे। यदि आप Kunena 1.6+ पहले ही संस्थापित कर चुके हैं, तो यह कार्रवाई #COMPONENT_OLD# #VERSION_OLD# का डेटा (या बैकअप) पुनर्स्थापित करती है और उसे नए डेटा मॉडल में स्थानांतरित करती है।"
