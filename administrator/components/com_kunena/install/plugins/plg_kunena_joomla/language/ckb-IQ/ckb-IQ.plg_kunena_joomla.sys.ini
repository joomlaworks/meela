PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "ئەو گروپە بەکارهێنەرانە هەڵبژێرە کە ڕێگەیان پێدراوە بابەتێکی نوێ لەم هاوپۆلەدا بڵاو بکەنەوە. ئەم ڕێکخستنە تەنها کاریگەرییەتی لەسەر ئەو بەکارهێنەرانەی پێشتر مافی خوێندنەوەیان بۆ هاوپۆلەکە هەیە. میوانەکان ناتوانن بابەتی نوێ دروست بکەن ئەگەر <em>ڕێکخستنی فۆرۆم > ئاسایش & چاودێری > ڕێگەدان بە میوان بۆ بەشداریکردن/نووسین</em> چالاک نەکەیت. <br /><br /> <strong>ئاماژە:</strong> دەتوانیت چەند گروپێک هەڵبژێریت بە گرتنی دوگمەکانی <em>Ctrl</em> یان <em>Shift</em>."
