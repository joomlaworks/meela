PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "الحد الأقصى لرموز الفرز"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "الحد الأقصى لرموز الإجابة"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "الحد الأعلى لمخرجات النموذج (بما فيها تفكيره، للنماذج التي تفكر). ارفعه إن قُطعت الإجابات."
PLG_KUNENA_BALDRICK_MAX_WAIT = "أقصى مدة انتظار في القائمة (ساعات)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "تُتخطى المواضيع التي تبقى منتظرة بعد هذه المدة (مثلا بعد عطل لدى المزود)، فالرد بعد أيام سيكون غريبا. 0: بلا حد."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "إيقاف مؤقت بعد أخطاء الحساب (دقائق)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "بعد مفتاح غير صالح، أو نفاد الرصيد أو الحصة، أو نموذج غير معروف، يتوقف Baldrick مؤقتا (تنتظر المواضيع في القائمة)، ويرسل إشعارا واحدا إلى مستلمي الإشعارات، ويحاول مجددا بعد هذا العدد من الدقائق حتى يجيب المزود. حفظ هذه الإعدادات ينهي الإيقاف."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "تحديث"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "عرض كل النماذج"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "يشمل النماذج التي لا تكتب إجابات محادثة (التضمينات، والكلام، والصور...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "اكتب لتبحث في النماذج"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "لا يوجد نموذج مطابق"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "عُبئت الأسعار من قائمة المزود."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "البحث العادي: آخر المشاركات المفحوصة"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "بدون فهرس نص كامل (SQLite، أو قبل إنشائه في Meela > Baldrick AI) تُوجد المواضيع ذات الصلة بقراءة المشاركات، نحو 2.5 ثانية لكل 50000 مشاركة: يُفحص هذا العدد فقط من أحدث المشاركات (0: الكل). مع الفهرس تُفحص كل المشاركات."
