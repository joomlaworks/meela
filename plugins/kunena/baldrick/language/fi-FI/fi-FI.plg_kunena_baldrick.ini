PLG_KUNENA_BALDRICK_PROCESSING = "Käsittely"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automaattinen: heti sen sivun lähetyksen jälkeen, joka lisäsi aiheen jonoon (PHP-FPM:n kanssa), tai taustapyynnöllä sivustolle itselleen. Vain komentorivi: aja cronista \"php cli/joomla.php kunena:baldrick:process\" (Joomla 3.x UTD), esim. minuutin välein."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automaattinen"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Vain komentorivi (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Säilytä toimintalokia (päivää)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Toimintalokin rivit, jotka ovat tätä vanhempia, poistetaan. Kuukausisummat säilytetään 36 kuukautta."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Lisäasetukset: käsittely, rajat ja aikarajat"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Julkaisu ei koskaan odota tekoälyä: aiheet jonotetaan ja käsitellään taustalla. Verkkovirheitä, nopeusrajoituksia ja ylikuormitettuja palveluntarjoajia yritetään uudelleen (heti kun palveluntarjoaja sallii), minkä jälkeen aihetta yritetään myöhemmin uudelleen (3 yritystä). Tilin virheet (virheellinen avain, krediitit loppu, tuntematon malli) keskeyttävät Baldrickin ja ilmoittavat yllä oleville vastaanottajille."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Yhteyden aikaraja (sekuntia)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Kuinka kauan odotetaan, että palveluntarjoaja hyväksyy yhteyden. Lyhyt, jotta verkko-ongelmat näkyvät nopeasti."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Lajittelu: vastauksen aikaraja (sekuntia)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Kuinka kauan odotetaan lajittelumallin valmista vastausta (se on lyhyt)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Vastauksen aikaraja (sekuntia)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Kuinka kauan odotetaan vastausmallin valmista vastausta. Vastauksia ei suoratoisteta: tämä kattaa koko vastauksen kirjoittamisen, ja mallit, jotka pohtivat ensin, voivat tarvita minuutin tai enemmän."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Lajittelu: enimmäistokenit"
