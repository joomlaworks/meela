PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, foruma MI pirmais atbildētājs: atbild uz jaunām tēmām un uz tēmām, kas atdzīvinātas pēc ilgāka klusuma, ja neviens administrators vai moderators nav atbildējis, izmantojot Anthropic vai ar OpenAI saderīgus API. <strong>Privātums:</strong> to apstrādāto tēmu (un saistīto publisko tēmu) teksts tiek sūtīts jūsu konfigurētajam MI sniedzējam; pieminiet to savā privātuma politikā. Aktivitāte, kopsummas un izmaksas: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1. posms: šķirošanas modelis (mazs, lēts)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Vispirms izlasa katru jaunu jautājumu: novērtē to (var atbildēt, pārāk plašs, trūkst detaļu, nav jautājums, surogātpasts) un uzraksta meklēšanas vaicājumus saistītajām tēmām. Pietiek ar mazu, ātru modeli."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2. posms: atbildes modelis (spējīgāks)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Raksta atbildi uz skaidriem jautājumiem, izmantojot tēmu un forumā atrastās saistītās publiskās tēmas. Tas var izmantot 1. posma savienojumu ar citu modeli vai savu savienojumu."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kad Baldrick atbild"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick skata katru jaunu tēmu, tēmas sācēja atbildes Baldrick (sarunu) un atbildes uz tēmām, kas bijušas klusas ilgāk nekā tālāk norādītais dienu skaits. Tas nekad neatbild, ja pēdējais ziņojums ir no administratora vai moderatora."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kā Baldrick atbild"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Atbildes tiek publicētas uzreiz kā Baldrick lietotājs, foruma BBCode. Saites uz foruma tēmām ir relatīvas."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Surogātpasts"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kad šķirošanas modelis ir pārliecināts, ka ziņojums ir surogātpasts (reklāma, tālruņa numuri, SEO saites...), Baldrick noņem to no publikācijas: visu tēmu, ja tas ir pirmais ziņojums. Nepublicētie ziņojumi gaida moderēšanu, tāpēc kļūdu var labot, tos apstiprinot."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Paziņojumi"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Vienkārša teksta e-pasts tiek sūtīts ar Joomla pasta iestatījumiem, ar tēmas pirmo ziņojumu un tās pēdējiem 5 ziņojumiem, jaunākie vispirms. Par surogātpasta darbībām un kļūdām (tēma, ko Baldrick atmeta, apturēšana, jo MI sniedzējs noraida tā pieprasījumus) vienmēr tiek paziņots. Katra e-pasta rezultāts tiek parādīts aktivitātes žurnālā."

PLG_KUNENA_BALDRICK_PROVIDER = "API veids"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude un ar Anthropic saderīgi galapunkti, piem., Qwen) vai ar OpenAI saderīgs Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Saderīgs ar Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Saderīgs ar OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Bāzes URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Atstājiet tukšu oficiālajam API (https://api.anthropic.com vai https://api.openai.com/v1). Piemēri Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (saderīgs ar Anthropic) vai https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (saderīgs ar OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Tukšs: oficiālais API"
PLG_KUNENA_BALDRICK_API_KEY = "API atslēga"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Sniedzēja API atslēga. Baldrick nedara neko, kamēr nav iestatīta atslēga un modeļi."
PLG_KUNENA_BALDRICK_MODEL = "Modelis"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Šķirošanas posma modelis, piem., claude-haiku-5-5. &quot;Iegūt modeļus&quot; meklējamā sarakstā parāda sniedzēja modeļus ar iepriekš norādītajām vērtībām (saglabātām vai nē) (tiek glabāts stundu; &quot;Atsvaidzināt&quot; pieprasa vēlreiz); varat arī ierakstīt nosaukumu. &quot;Pārbaudīt&quot; nosūta modelim nelielu pieprasījumu."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Atbildes posma modelis, piem., claude-sonnet-5-5 (vai claude-opus-5-5 labākajām atbildēm). &quot;Iegūt modeļus&quot; parāda sniedzēja modeļus; varat arī ierakstīt nosaukumu. &quot;Pārbaudīt&quot; nosūta modelim nelielu pieprasījumu."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Iegūt modeļus"
PLG_KUNENA_BALDRICK_TEST = "Pārbaudīt"
PLG_KUNENA_BALDRICK_WORKING = "Notiek darbs..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Izvēlieties modeli -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Pieprasījums neizdevās."
PLG_KUNENA_BALDRICK_PRICE_IN = "Cena: ievade"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cena: izvade"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD par miljonu tokenu, izmaksu aprēķiniem. Tukšs: zināmo Claude modeļu cenrāža cena, citādi 0 (ja vien sniedzējs pats nenorāda izmaksas)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Izmantot 1. posma savienojumu"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Izmantot to pašu API veidu, bāzes URL un atslēgu kā šķirošanas posmā (ar tālāk izvēlēto modeli). Izvēlieties Nē, lai atbildēm izmantotu citu sniedzēju."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: rezerves modelis noraidījuma gadījumā"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Tikai Anthropic paša API ar Opus/Sonnet 5.x modeļiem: kad modeļa drošības pārbaudes noraida pieprasījumu, API to palaiž vēlreiz ar Anthropic izvēlētu rezerves modeli (servera puses rezerves modeļi). Nav pieejams Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Mēģinājuma režīms"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Konfigurācijas pārbaudei: Baldrick atbild tikai tēmās, ko sākuši administratori un moderatori (jaunas tēmas un viņu turpmākās atbildes Baldrick), un nekad nenoņem ziņojumus no publikācijas (par surogātpastu tikai ziņo)."
PLG_KUNENA_BALDRICK_USER = "Baldrick lietotājs"
PLG_KUNENA_BALDRICK_USER_DESC = "Lietotājs, kā Baldrick publicē. Atstājiet tukšu, lai lietotājs &quot;Baldrick&quot; tiktu izveidots automātiski (bez lietojamas paroles, bez īstas e-pasta adreses). Iestatiet tā profila attēlu un parakstu tā foruma profilā (jaunam lietotājam tiek piešķirts paraksts &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Atdzīvināt pēc (dienām)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Atbilde uz tēmu, kuras iepriekšējais ziņojums ir vecāks par šo, tiek apstrādāta kā jauns jautājums."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Atbildes tēmā"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Cik reižu Baldrick drīkst atbildēt vienā tēmā: tā pirmā atbilde un atbildes, kad tēmas sācējs tam atbild (pieprasītā informācija, turpmāks jautājums) vai tēma tiek atdzīvināta pēc ilgāka klusuma."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Atbildes dienā"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Ne vairāk kā tik atbilžu 24 stundās (0: bez ierobežojuma). Pasargā jūsu API budžetu no pārpludināšanas."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimālais ziņojuma garums"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Par šo īsāki ziņojumi (rakstzīmes, bez formatējuma) tiek ignorēti."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Tikai šajās kategorijās"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Atbildēt tikai šajās kategorijās (ja nav izvēlēta neviena: visās kategorijās)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nekad šajās kategorijās"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nekad neatbildēt šajās kategorijās."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Tikai publiskās kategorijas"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Atbildēt tikai kategorijās, ko var lasīt viesi, lai MI sniedzējam netiktu sūtīts privāts saturs. Saistītās tēmas vienmēr tiek ņemtas tikai no publiskajām kategorijām."

PLG_KUNENA_BALDRICK_TRANSLATE = "Pievienot tulkojumu angļu valodā"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick atbild autora valodā. Ar šo opciju atbildēm citās valodās seko tulkojums angļu valodā (noderīgi angliski runājošam personālam un lasītājiem)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Saistītās tēmas"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Cik saistītu publisko tēmu (atrastas ar šķirošanas posma meklēšanas vaicājumiem) tiek dotas atbildes modelim."
PLG_KUNENA_BALDRICK_PRESET = "Iebūvētais galvenais uzvednes teksts"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Norādījumi, ar kuriem sākas katra atbilde (tikai lasāms). Tālāk norādītais jūsu vietnes konteksts tiek pievienots tiem."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Vietnes konteksts"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Par ko ir forums, atbalstītie produkti un versijas, saites uz dokumentāciju, lietojamais tonis, ko Baldrick nekad nedrīkst darīt... Tiek pievienots abu posmu uzvednēm (tas palīdz arī šķirošanas modelim atšķirt surogātpastu no ziņojumiem par tēmu)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "piem., Šis ir ExampleSoft atbalsta forums. Mēs atbalstām 3. un 4. versiju. Dokumentācija ir https://docs.example.com. Nekad neapsoliet naudas atmaksu."
PLG_KUNENA_BALDRICK_CANNED = "Sagatavotās atbildes"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Atbildes uz pārāk plašiem jautājumiem (MI atbilde netiek rakstīta) un rezerves atbildes, kad atbildi nevar uzrakstīt. Atdaliet atbildes ar rindu no trim domuzīmēm (---); viena tiek izvēlēta nejauši. Vietturi: {name} (autors), {search_url} (foruma meklēšana pēc jautājuma), {forum_url}, {topic_url}. Foruma BBCode ir atļauts."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Surogātpasts"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Ko darīt, kad šķirošanas modelis ir pārliecināts, ka ziņojums ir surogātpasts. E-pasts tiek nosūtīts abos pirmajos gadījumos."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Noņemt no publikācijas (visu tēmu, ja tas ir pirmais ziņojums) un paziņot"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Tikai paziņot"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorēt"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Uzticams pēc (ziņojumiem)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Lietotāju, kuriem ir vismaz tik publicētu ziņojumu, un personāla ziņojumi netiek noņemti no publikācijas nekad: par tiem tikai ziņo."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Paziņot šiem personāla locekļiem"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, Meela administratori un moderatori, kas saņem paziņojumus (Ctrl/Cmd+klikšķis, lai izvēlētos vairākus)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Paziņot par"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Katru Baldrick publicēto atbildi (atbildes, sagatavotās atbildes, papildu informācijas pieprasījumus) un surogātpastu vai tikai surogātpastu. Par kļūdām vienmēr tiek paziņots."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Katru atbildi, surogātpastu un kļūdas"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Tikai surogātpasts un kļūdas"
