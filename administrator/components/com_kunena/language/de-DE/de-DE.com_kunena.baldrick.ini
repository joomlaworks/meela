COM_KUNENA_BALDRICK_MAIL_PAUSED_BODY = "Baldrick AI hat sich selbst pausiert, weil der KI-Anbieter seine Anfragen mit einem Fehler abgelehnt hat, der nicht von allein verschwindet:\n\n%s\n\nÜbliche Ursachen: ein ungültiger oder abgelaufener API-Schlüssel, kein Guthaben oder Kontingent mehr, ein Modell oder eine Basis-URL, die es nicht gibt.\n\nWartende Themen bleiben erhalten. Baldrick versucht es alle %d Minuten erneut und nimmt die Arbeit von selbst wieder auf, sobald der Anbieter antwortet; das Speichern der Plugin-Einstellungen beendet die Pause sofort. Zu dieser Pause erhalten Sie keine weitere E-Mail.\n\nAktivität und Einstellungen: %s"
