PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Sailkatze-urratsaren eredua, adib. claude-haiku-5-5. &quot;Eskuratu ereduak&quot;-ek hornitzailearen ereduak zerrendatzen ditu goiko balioekin (gordeta ala ez) zerrenda bilagarri batean (ordubetez gordetzen da; &quot;Eguneratu&quot;-k berriro eskatzen du); izen bat ere idatz dezakezu. &quot;Probatu&quot;-k eskaera txiki bat bidaltzen dio ereduari."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Erantzun-urratsaren eredua, adib. claude-sonnet-5-5 (edo claude-opus-5-5 erantzun onenetarako). &quot;Eskuratu ereduak&quot;-ek hornitzailearen ereduak zerrendatzen ditu; izen bat ere idatz dezakezu. &quot;Probatu&quot;-k eskaera txiki bat bidaltzen dio ereduari."
