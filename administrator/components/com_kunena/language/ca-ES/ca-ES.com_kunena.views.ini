COM_KUNENA_A_IMGHEIGHT = "Altura Màx. de la imatge"
COM_KUNENA_A_IMGHEIGHT_DESC = "Altura màxima de la imatge en píxels. Els arxius més grans es pujaran, però seran reduïts a aquest límit."
COM_KUNENA_A_IMGQUALITY = "Qualitat d'imagen JPG al canviar de mida"
COM_KUNENA_A_IMGQUALITY_DESC = "Qualitat de les imatges JPEG, WebP i AVIF redimensionades, de l'1 al 100: més alt vol dir més qualitat però fitxers més grans. Per defecte: 50 (valors habituals: 50-85). Les imatges PNG i GIF es redimensionen sense pèrdua."
COM_KUNENA_A_IMGSIZE = "Tamany Màx. d'arxiu d'imatge<br/><em>en KB</em>"
COM_KUNENA_A_IMGSIZE_DESC = "Tamany màxim d'arxiu d'imatge en <em>kilobytes</em> permés per pujar al lloc. <strong>No pot excedir el límit de pujada expresat per PHP post_max_size: %s i upload_max_filesize: %s </strong>. Per canviar el límit de càrrega PHP si us plau consulta els ajustaments del teu arxiu php.ini a (%s)."
COM_KUNENA_A_IMGTHUMBHEIGHT = "Altura de la miniatura"
