PLG_KUNENA_BALDRICK_DRY_RUN = "Sınaq rejimi"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Tənzimləmənin sınanması üçün: Baldrick yalnız administratorların və moderatorların başlatdığı mövzulara (yeni mövzular və onların Baldrick-ə davam cavabları) cavab verir və heç vaxt ismarıcları yayımdan götürmür (spam yalnız bildirilir)."
PLG_KUNENA_BALDRICK_USER = "Baldrick-in istifadəçisi"
PLG_KUNENA_BALDRICK_USER_DESC = "Baldrick-in ismarıc göndərdiyi istifadəçi. &quot;Baldrick&quot; istifadəçisinin avtomatik yaradılması üçün boş buraxın (istifadə oluna bilən parol yoxdur, real e-poçt ünvanı yoxdur). Onun avatarını və imzasını forum profilində təyin edin (yeni istifadəçi &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot; imzasını alır)."
