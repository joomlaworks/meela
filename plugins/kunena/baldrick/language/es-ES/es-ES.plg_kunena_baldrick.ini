PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, el primer respondedor de IA del foro: responde a temas nuevos y a temas reactivados tras un largo silencio cuando ningún administrador o moderador ha respondido, usando APIs compatibles con Anthropic u OpenAI. <strong>Privacidad:</strong> el texto de los temas que procesa (y de los temas públicos relacionados) se envía al proveedor de IA que configure; menciónelo en su política de privacidad. Actividad, totales y costes: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Paso 1: modelo de clasificación (pequeño, económico)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Lee primero cada pregunta nueva: la califica (respondible, demasiado general, faltan detalles, no es una pregunta, spam) y escribe las consultas de búsqueda de temas relacionados. Basta con un modelo pequeño y rápido."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Paso 2: modelo de respuesta (más capaz)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Redacta la respuesta a las preguntas claras, usando el tema y los temas públicos relacionados encontrados en el foro. Puede usar la conexión del paso 1 con otro modelo, o una conexión propia."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Cuándo responde Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick revisa cada tema nuevo, las respuestas del iniciador del tema a Baldrick (una conversación) y las respuestas a temas que llevaban más tiempo en silencio que el número de días indicado más abajo. Nunca responde cuando el último mensaje es de un administrador o un moderador."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Cómo responde Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Las respuestas se publican de inmediato con el usuario de Baldrick, en BBCode del foro. Los enlaces a temas del foro son relativos."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Cuando el modelo de clasificación está seguro de que un mensaje es spam (publicidad, números de teléfono, enlaces SEO...), Baldrick lo despublica: todo el tema si es el primer mensaje. Los mensajes despublicados esperan a la moderación, así que un error se corrige aprobándolos."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notificaciones"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Se envía un correo de texto simple a través de la configuración de correo de Joomla, con el primer mensaje del tema y sus últimos 5 mensajes, del más reciente al más antiguo. Las acciones contra el spam y los errores (un tema que Baldrick abandonó, una pausa porque el proveedor de IA rechaza sus peticiones) siempre se notifican. El resultado de cada correo aparece en el registro de actividad."

PLG_KUNENA_BALDRICK_PROVIDER = "Tipo de API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, y puntos de acceso compatibles con Anthropic como los de Qwen), o Chat Completions compatible con OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Compatible con Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Compatible con OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL base"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Déjelo vacío para la API oficial (https://api.anthropic.com o https://api.openai.com/v1). Ejemplos para Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (compatible con Anthropic) o https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (compatible con OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Vacío: la API oficial"
PLG_KUNENA_BALDRICK_API_KEY = "Clave de API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "La clave de API del proveedor. Baldrick no hace nada hasta que se configuren una clave y los modelos."
PLG_KUNENA_BALDRICK_MODEL = "Modelo"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modelo del paso de clasificación, por ejemplo claude-haiku-5-5. &quot;Obtener modelos&quot; lista los modelos del proveedor con los valores de arriba (guardados o no) en una lista con búsqueda (se conserva una hora; &quot;Actualizar&quot; vuelve a consultarla); también puede escribir un nombre. &quot;Probar&quot; envía una petición pequeña al modelo."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modelo del paso de respuesta, por ejemplo claude-sonnet-5-5 (o claude-opus-5-5 para las mejores respuestas). &quot;Obtener modelos&quot; lista los modelos del proveedor; también puede escribir un nombre. &quot;Probar&quot; envía una petición pequeña al modelo."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Obtener modelos"
PLG_KUNENA_BALDRICK_TEST = "Probar"
PLG_KUNENA_BALDRICK_WORKING = "Procesando..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Elija un modelo -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "La petición ha fallado."
PLG_KUNENA_BALDRICK_PRICE_IN = "Precio: entrada"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Precio: salida"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD por millón de tokens, para las estimaciones de coste. Vacío: la tarifa pública de los modelos Claude conocidos; si no, 0 (salvo que el proveedor informe del coste)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Usar la conexión del paso 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Usa el mismo tipo de API, URL base y clave que el paso de clasificación (con el modelo elegido abajo). Elija No para usar otro proveedor en las respuestas."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: alternativa ante rechazos"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Solo en la API propia de Anthropic con los modelos Opus y Sonnet 5.x: cuando las comprobaciones de seguridad del modelo rechazan una petición, la API la vuelve a ejecutar con un modelo alternativo elegido por Anthropic (alternativas en el servidor). No disponible para Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Prueba"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Para probar la configuración: Baldrick solo responde en temas iniciados por administradores y moderadores (temas nuevos, y sus seguimientos dirigidos a Baldrick), y nunca despublica mensajes (el spam solo se notifica)."
PLG_KUNENA_BALDRICK_USER = "Usuario de Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "El usuario con el que publica Baldrick. Déjelo vacío para que se cree automáticamente un usuario &quot;Baldrick&quot; (sin contraseña utilizable ni dirección de correo real). Configure su avatar y su firma en su perfil del foro (un usuario nuevo recibe la firma &quot;Respondido por Baldrick AI, mi señor, con un modelo astuto (...y recuerde que la IA puede equivocarse, así que compruebe bien las respuestas)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Reactivar tras (días)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Una respuesta a un tema cuyo mensaje anterior sea más antiguo que esto se trata como una pregunta nueva."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Respuestas por tema"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Cuántas veces puede responder Baldrick en el mismo tema: su primera respuesta, y sus respuestas cuando el iniciador del tema le contesta (detalles solicitados, una nueva pregunta) o cuando el tema se reactiva tras un largo silencio."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Respuestas por día"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Como máximo este número de respuestas en 24 horas (0: sin límite). Protege su presupuesto de API frente a avalanchas."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Longitud mínima del mensaje"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Se ignoran los mensajes más cortos que esto (caracteres, sin contar el formato)."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Solo en estas categorías"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Responder solo en estas categorías (ninguna seleccionada: todas las categorías)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nunca en estas categorías"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "No responder nunca en estas categorías."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Solo categorías públicas"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Responder solo en las categorías que los invitados pueden leer, para que no se envíe contenido privado al proveedor de IA. Los temas relacionados siempre se toman solo de categorías públicas."

PLG_KUNENA_BALDRICK_TRANSLATE = "Añadir una traducción al inglés"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick responde en el idioma del autor. Con esta opción, las respuestas en otros idiomas van seguidas de una traducción al inglés (útil para un equipo y unos lectores de habla inglesa)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Temas relacionados"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Cuántos temas públicos relacionados (encontrados con las consultas de búsqueda del paso de clasificación) se envían al modelo de respuesta."
PLG_KUNENA_BALDRICK_PRESET = "Prompt maestro integrado"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Las instrucciones de las que parte cada respuesta (solo lectura). El contexto de su sitio, más abajo, se añade a ellas."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Contexto del sitio"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "De qué trata el foro, productos y versiones compatibles, enlaces a la documentación, el tono que debe usarse, lo que Baldrick nunca debe hacer... Se añade a las instrucciones de ambos pasos (también ayuda al modelo de clasificación a distinguir el spam de los mensajes en tema)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "p. ej. Este es el foro de soporte de ExampleSoft. Damos soporte a las versiones 3 y 4. La documentación está en https://docs.example.com. Nunca prometa reembolsos."
PLG_KUNENA_BALDRICK_CANNED = "Respuestas predefinidas"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Respuestas a preguntas demasiado generales (no se redacta ninguna respuesta de IA) y alternativas cuando no se puede redactar una respuesta. Separe las respuestas con una línea de tres guiones (---); se elige una al azar. Marcadores: {name} (el autor), {search_url} (búsqueda en el foro de la pregunta), {forum_url}, {topic_url}. Se permite el BBCode del foro."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Qué hacer cuando el modelo de clasificación está seguro de que un mensaje es spam. En los dos primeros casos se envía un correo."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Despublicar (todo el tema si es un primer mensaje) y notificar"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Solo notificar"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorar"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "De confianza a partir de (mensajes)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Los mensajes de usuarios con al menos este número de mensajes publicados, y los del equipo, nunca se despublican: solo se notifican."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notificar a estos miembros del equipo"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Usuarios, administradores y moderadores de Meela que reciben las notificaciones (Ctrl/Cmd+clic para elegir varios)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notificar sobre"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Cada respuesta que publica Baldrick (respuestas, respuestas predefinidas, peticiones de detalles) y el spam, o solo el spam. Los errores siempre se notifican."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Cada respuesta, el spam y los errores"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Solo el spam y los errores"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notificar a estas direcciones"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Más direcciones de correo, separadas por comas."

PLG_KUNENA_BALDRICK_PROCESSING = "Procesamiento"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automático: justo después de enviar la página que puso un tema en cola (con PHP-FPM), o mediante una petición en segundo plano al propio sitio. Solo línea de comandos: ejecute &quot;php cli/joomla.php kunena:baldrick:process&quot; desde cron (Joomla 3.x UTD), por ejemplo cada minuto."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automático"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Solo línea de comandos (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Conservar el registro de actividad (días)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Se borran las filas del registro de actividad más antiguas que esto. Los totales mensuales se conservan durante 36 meses."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avanzado: procesamiento, límites y tiempos de espera"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Publicar nunca espera a la IA: los temas se ponen en cola y se procesan en segundo plano. Los errores de red, los límites de frecuencia y los proveedores saturados se reintentan (en cuanto el proveedor lo permite) y después el tema se vuelve a intentar más tarde (3 intentos). Los errores de la cuenta (clave no válida, sin créditos, modelo desconocido) pausan Baldrick y notifican a los destinatarios indicados arriba."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Tiempo de espera de la conexión (segundos)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Cuánto tiempo se espera a que el proveedor acepte la conexión. Corto, para que los problemas de red se vean enseguida."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Tiempo de espera de la respuesta de clasificación (segundos)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Cuánto tiempo se espera la respuesta completa del modelo de clasificación (es breve)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Tiempo de espera de la respuesta (segundos)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Cuánto tiempo se espera la respuesta completa del modelo de respuesta. Las respuestas no se transmiten en flujo: esto incluye escribir la respuesta entera, y los modelos que razonan antes pueden necesitar un minuto o más."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Tokens máximos de la clasificación"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Tokens máximos de la respuesta"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Límite superior de la salida del modelo (incluido su razonamiento, en los modelos que razonan). Auméntelo si las respuestas se cortan."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Espera máxima en la cola (horas)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Los temas que sigan en espera tras este tiempo (por ejemplo, tras una caída del proveedor) se omiten: una respuesta días después resultaría extraña. 0: sin límite."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pausa tras errores de cuenta (minutos)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Tras una clave no válida, créditos o cuota agotados, o un modelo desconocido, Baldrick se pausa (los temas en cola esperan), envía una vez un correo a los destinatarios de notificación y vuelve a intentarlo tras este número de minutos hasta que el proveedor responda. Guardar estos ajustes termina la pausa."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Actualizar"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Mostrar todos los modelos"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Incluir los modelos que no pueden escribir respuestas de chat (embeddings, voz, imágenes...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Escriba para buscar modelos"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Ningún modelo coincide"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Precios completados con la lista del proveedor."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Búsqueda simple: últimos mensajes buscados"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Sin índice de texto completo (SQLite, o antes de crearlo en Meela > Baldrick AI), los temas relacionados se encuentran leyendo los mensajes, unos 2,5 segundos por cada 50.000 mensajes: solo se buscan estos últimos mensajes (0: todos). Con el índice se busca en todos los mensajes."
