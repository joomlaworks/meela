PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Viestejä käyttäjiltä, joilla on vähintään näin monta julkaistua viestiä, sekä henkilökunnan viestejä ei koskaan poisteta julkaisusta: niistä vain ilmoitetaan."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Ilmoita nämä henkilökunnan jäsenet"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Userit, Meelan ylläpitäjät ja valvojat, jotka saavat ilmoitukset (valitse useita pitämällä Ctrl/Cmd painettuna napsauttaessasi)."
