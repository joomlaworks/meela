PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "השהיה לאחר שגיאות חשבון (דקות)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "לאחר מפתח לא תקף, קרדיטים או מכסה שנגמרו, או מודל לא מוכר, Baldrick מושהה (הנושאים בתור ממתינים), שולח התראה אחת לנמענים בדוא\"ל, ומנסה שוב לאחר מספר הדקות הזה עד שהספק עונה. שמירת ההגדרות האלה מסיימת את ההשהיה."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "רענן"
