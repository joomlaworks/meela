PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Objave korisnika s najmanje toliko objavljenih objava i osoblja nikada se ne skidaju s objavljivanja: samo se prijavljuju."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Obavijesti ove članove osoblja"
