COM_KUNENA_A_FILE = "Arxius"
COM_KUNENA_A_FILEALLOWEDTYPES = "Tipus d'arxius permesos"
COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "Quins tipus de fitxer poden adjuntar els membres: extensions en minúscules separades per comes (els espais s&#039;eliminen). Per defecte: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov. Els tipus executables i de pàgines web no es permeten mai. Si es deixa buit, en desar es torna el valor per defecte."
COM_KUNENA_A_FILESIZE = "Mida Màxima de l'Arxiu"
COM_KUNENA_A_FILESIZE_DESC = "Mida màxima de l'arxiu permesa per pujar. <strong>No pot excedir el límit de pujada establerta en l´arxiu .ini de PHP: post_max_size: %s & upload_max_filesize: %s </strong>. Per canviar el límit de càrrega PHP si us plau consulta els ajustaments de php.ini (%s)."
COM_KUNENA_A_FILESIZE_KB = "KB"
COM_KUNENA_A_FILE_UPLOAD = "Permet la càrrega d'arxius"
COM_KUNENA_A_FILE_UPLOAD_DESC = "Permet la càrrega d'arxius per a tothom, usuaris registrats, moderadors, administradors o per ningú."
COM_KUNENA_A_FLOOD = "Protecció AntiFlood"
COM_KUNENA_A_FLOOD_DESC = "La quantitat de segons que un usuari/a ha d'esperar entre dos missatges consecutius. Configura a 0 per apagar la protecció AntiFlood.<br/><strong>NOTA</strong>: La protecció AntiFlood <em>pot</em> causar degradació del rendiment del fòrum."
COM_KUNENA_A_FORUM_JUMP = "Habilita salt al fòrum"
COM_KUNENA_A_FORUM_JUMP_DESC = "Si es configura a <em>Sí</em>, mostra un selector a les pàgines del fòrum que permeten saltar ràpidament d'un fòrum o categoria a un altre."
COM_KUNENA_A_FRONTEND = "Lloc Web"
COM_KUNENA_A_GHOSTMESSAGE = "Casella de Missatges Anònims Marcada per Defecte?"
COM_KUNENA_A_HIGHLIGHTCODE = "Habilita ajudant de codi"
COM_KUNENA_A_HIGHLIGHTCODE_DESC = "Activa un ajudant en Meela de codi javascript. Si els membres publiquen Php o altres fragments de codi similars amb els tags de codi, activant aquesta opció, acoloreix el codi. Si al teu fòrum no es fa ús de missatges amb llenguatge de programació, segurament preferiràs desactivar-lo per evitar problemes."
COM_KUNENA_A_HISTLIM = "Límit de l'Historial"
COM_KUNENA_A_HISTLIM_DESC = "Número de temes a Mostra en l'historial del fòrum"
COM_KUNENA_A_HISTORY = "Mostra Historial"
COM_KUNENA_A_HISTORY_DESC = "Estableix a <em>Sí</em>, si desitges que en un tema es mostri en l´historial del fòrum, quan una resposta/cita és donada pels usuaris/es"
COM_KUNENA_A_HOLD_GUEST_POSTS = "Modera convidats"
COM_KUNENA_A_HOLD_GUEST_POSTS_DESC = "Selecciona <em>Sí</em> si desitges que els missatges enviats pels convidats primer siguin revisats per un moderador abans de publicar-se."
COM_KUNENA_A_HOLD_NEWUSERS_POSTS = "Modera nous usuaris"
COM_KUNENA_A_HOLD_NEWUSERS_POSTS_DESC = "Entra un número de missatges. Si l'usuari té menys missatges, tots els seus missatges seran marcats per ser revisats per un moderador abans de publicar-se."
COM_KUNENA_A_IMAGE = "Imatges"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES = "Tipus MIME Permesos"
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "Quins tipus MIME d'imatge s'accepten quan «Comprova els tipus MIME» està activat: separats per comes, <strong>en minúscules</strong>. Per defecte: image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif. Si es deixa buit, en desar es torna el valor per defecte."
COM_KUNENA_A_IMAGEALLOWEDTYPES = "Tipus d'imatges permeses"
COM_KUNENA_A_IMAGEALLOWEDTYPES_DESC = "Quins tipus d'imatge poden adjuntar els membres: extensions separades per comes, <strong>en minúscules</strong> (els espais s&#039;eliminen). Per defecte: jpg,jpeg,gif,png,webp,avif (WebP i AVIF si el PHP del servidor els pot processar). Si es deixa buit, en desar es torna el valor per defecte."
COM_KUNENA_A_IMAGECHECKMIMETYPES = "Verifica Tipus MIME"
