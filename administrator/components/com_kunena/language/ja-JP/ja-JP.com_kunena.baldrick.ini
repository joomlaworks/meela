COM_KUNENA_BALDRICK_MAIL_PAUSED_BODY = "AIプロバイダーが、自然には解消されないエラーでリクエストを拒否したため、Baldrick AIは自ら一時停止しました:\n\n%s\n\n主な原因: APIキーが無効または期限切れ、クレジットや利用枠がない、モデルやベースURLが存在しない。\n\nキューのトピックは保持されます。Baldrickは%d分ごとに再試行し、プロバイダーが応答すると自動的に再開します。プラグインの設定を保存すると、ただちに一時停止が終わります。この一時停止についてのメールは再度送られません。\n\nアクティビティと設定: %s"
