PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Foroak zertaz duen, onartutako produktuak eta bertsioak, dokumentaziorako estekak, erabili beharreko tonua, Baldrick-ek inoiz egin behar ez duena... Bi urratsen jarraibideei gehitzen zaie (sailkatze-ereduari spama gaiari dagozkion mezuetatik bereizten ere laguntzen dio)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "adib. Hau ExampleSoft-en laguntza-foroa da. 3 eta 4 bertsioak onartzen ditugu. Dokumentazioa https://docs.example.com helbidean dago. Ez agindu inoiz dirua itzultzea."
PLG_KUNENA_BALDRICK_CANNED = "Erantzun prestatuak"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Zabalegiak diren galderen erantzunak (ez da AA erantzunik idazten), eta erantzunik idatzi ezin denean erabiltzeko ordezkoak. Bereizi erantzunak hiru gidoiz osatutako lerro batekin (---); bat ausaz hautatzen da. Leku-markak: {name} (argitaratzailea), {search_url} (galderaren foro-bilaketa), {forum_url}, {topic_url}. Foroko BBCode onartzen da."

