PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Gornja granica izlaza modela (uključujući njegovo razmišljanje, za modele koji razmišljaju). Povećajte ako su odgovori presečeni."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maksimalno čekanje u redu (sati)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Teme koje i posle ovog vremena još čekaju (npr. posle ispada dobavljača) se preskaču: odgovor danima kasnije bio bi čudan. 0: bez ograničenja."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pauza posle grešaka naloga (minuta)"
