PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, forumun yapay zekâ destekli ilk yanıtlayıcısı: yönetici veya moderatör yanıtlamadığında yeni konulara ve uzun süre sonra canlandırılan konulara Anthropic veya OpenAI uyumlu API'lerle yanıt verir. <strong>Gizlilik:</strong> işlediği konuların metni (ve ilgili herkese açık konuların metni) yapılandırdığınız yapay zekâ sağlayıcısına gönderilir; gizlilik politikanızda bunu belirtin. Etkinlik, toplamlar ve maliyetler: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1. adım: sınıflandırma modeli (küçük, ucuz)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Her yeni soruyu önce okur: değerlendirir (yanıtlanabilir, çok geniş, ayrıntı eksik, soru değil, spam) ve ilgili konular için arama sorgularını yazar. Küçük, hızlı bir model yeterlidir."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2. adım: yanıt modeli (daha yetenekli)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Açık sorulara, konuyu ve forumda bulunan ilgili herkese açık konuları kullanarak yanıt yazar. 1. adımın bağlantısını farklı bir modelle kullanabilir ya da kendi bağlantısını kullanabilir."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Baldrick ne zaman yanıt verir"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick her yeni konuya, konuyu açan kişinin Baldrick'e yanıtlarına (bir sohbet) ve aşağıdaki gün sayısından uzun süre sessiz kalan konulardaki yanıtlara bakar. Son ileti bir yönetici veya moderatörden geldiyse asla yanıt vermez."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Baldrick nasıl yanıt verir"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Yanıtlar Baldrick'in kullanıcısı olarak hemen yayımlanır, forum BBCode'uyla yazılır. Forum konularına giden bağlantılar göreli olur."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Sınıflandırma modeli bir iletinin spam olduğundan (reklam, telefon numaraları, SEO bağlantıları...) emin olduğunda Baldrick onu yayından kaldırır: ilk ileti ise tüm konuyu. Yayından kaldırılan iletiler denetim bekler; bu yüzden bir hata, onaylanarak geri alınır."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Bildirimler"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Joomla'nın posta ayarları üzerinden düz metin bir e-posta gönderilir; konunun ilk iletisi ve son 5 iletisi, en yenisi önce. Spam işlemleri ve hatalar (Baldrick'in vazgeçtiği bir konu, yapay zekâ sağlayıcısının isteklerini reddetmesi nedeniyle duraklatma) her zaman bildirilir. Her e-postanın sonucu işlem günlüğünde görünür."

PLG_KUNENA_BALDRICK_PROVIDER = "API türü"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude ve Qwen gibi Anthropic uyumlu uç noktalar) ya da OpenAI uyumlu Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic uyumlu (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI uyumlu (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Temel URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Resmi API için boş bırakın (https://api.anthropic.com veya https://api.openai.com/v1). Qwen Cloud için örnekler: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic uyumlu) veya https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI uyumlu)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Boş: resmi API"
PLG_KUNENA_BALDRICK_API_KEY = "API anahtarı"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Sağlayıcının API anahtarı. Bir anahtar ve modeller ayarlanana kadar Baldrick hiçbir şey yapmaz."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Sınıflandırma adımının modeli, ör. claude-haiku-5-5. \"Modelleri getir\" sağlayıcının modellerini yukarıdaki değerlerle (kaydedilmiş ya da değil) aranabilir bir listede getirir (bir saat saklanır; \"Yenile\" yeniden sorar); bir ad da yazabilirsiniz. \"Test\" modele küçük bir istek gönderir."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Yanıt adımının modeli, ör. claude-sonnet-5-5 (ya da en iyi yanıtlar için claude-opus-5-5). \"Modelleri getir\" sağlayıcının modellerini listeler; bir ad da yazabilirsiniz. \"Test\" modele küçük bir istek gönderir."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Modelleri getir"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Çalışıyor..."
