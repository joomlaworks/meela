PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Mallin tulosteen yläraja (mukaan lukien sen päättely, malleille jotka päättelevät). Nosta, jos vastauksia katkeaa."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Enimmäisodotus jonossa (tuntia)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Aiheet, jotka odottavat tämän pidempään (esim. palveluntarjoajan katkoksen jälkeen), ohitetaan: vastaus päivien päästä olisi outo. 0: ei rajaa."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Tauko tilivirheiden jälkeen (minuuttia)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Virheellisen avaimen, loppuneiden krediittien tai kiintiön taikka tuntemattoman mallin jälkeen Baldrick keskeytyy (jonossa olevat aiheet odottavat), lähettää vastaanottajille ilmoituksen kerran ja yrittää uudelleen tämän monen minuutin päästä, kunnes palveluntarjoaja vastaa. Asetusten tallentaminen lopettaa keskeytyksen."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Päivitä"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Näytä kaikki mallit"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Sisällytä mallit, jotka eivät osaa kirjoittaa keskusteluvastauksia (upotukset, puhe, kuvat ...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Kirjoita hakeaksesi malleja"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Ei vastaavia malleja"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Hinnat täytetty palveluntarjoajan listasta."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Tavallinen haku: viimeisimmät haetut viestit"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Ilman kokotekstihakemistoa (SQLite, tai ennen kuin luot sen kohdassa Meela > Baldrick AI) aiheeseen liittyvät aiheet löydetään lukemalla viestit, noin 2,5 sekuntia per 50 000 viestiä: vain näin monta viimeisintä viestiä haetaan (0: kaikki). Hakemiston kanssa haetaan kaikki viestit."
