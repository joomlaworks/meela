PLG_KUNENA_BALDRICK_PRICE_IN = "מחיר: קלט"
PLG_KUNENA_BALDRICK_PRICE_OUT = "מחיר: פלט"
PLG_KUNENA_BALDRICK_PRICE_DESC = "דולר ארה\"ב למיליון טוקנים, להערכות העלות. ריק: מחירון המודלים הידועים של Claude, אחרת 0 (אלא אם הספק מדווח על העלות בעצמו)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "השתמש בחיבור של שלב 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "השתמש באותו סוג API, כתובת בסיס ומפתח כמו בשלב המיון (עם המודל שנבחר להלן). בחר לא כדי להשתמש בספק אחר לתשובות."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: גיבוי בסירובים"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "רק ב-API של Anthropic עצמו עם מודלי Opus/Sonnet 5.x: כאשר בדיקות הבטיחות של המודל דוחות בקשה, ה-API מריץ אותה שוב על מודל גיבוי שנבחר על ידי Anthropic (גיבויים בצד השרת). אינו זמין ל-Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "הרצת ניסיון"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "לבדיקת ההגדרות: Baldrick משיב רק בנושאים שפתחו מנהלים ומפקחים (נושאים חדשים, והמשכים שלהם ל-Baldrick), ואינו מסיר הודעות מפרסום לעולם (ספאם רק מדווח)."
PLG_KUNENA_BALDRICK_USER = "המשתמש של Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "המשתמש שבשמו Baldrick מפרסם. השאר ריק כדי שייווצר אוטומטית משתמש &quot;Baldrick&quot; (ללא סיסמה שמישה וללא כתובת דוא\"ל אמיתית). הגדר את האווטר והחתימה שלו בפרופיל הפורום (משתמש חדש מקבל את החתימה &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "הפעל מחדש לאחר (ימים)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "תגובה לנושא שההודעה הקודמת בו ישנה מזה ייחשבת כשאלה חדשה."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "תגובות לנושא"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "כמה פעמים Baldrick רשאי להשיב באותו נושא: תגובתו הראשונה, ותשובותיו כאשר פותח הנושא משיב לו (פרטים שביקש, שאלה נוספת), או כאשר הנושא מופעל מחדש לאחר שתיקה ארוכה."
PLG_KUNENA_BALDRICK_DAILY_CAP = "תשובות ביום"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "לכל היותר מספר תשובות זה ב-24 שעות (0: ללא הגבלה). מגן על התקציב של ה-API מפני הצפות."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "אורך הודעה מינימלי"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "הודעות קצרות מזה (תווים, ללא עיצוב) מתעלמים מהן."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "רק בקטגוריות אלה"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "השב רק בקטגוריות אלה (אם לא נבחרה אף אחת: בכל הקטגוריות)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "לעולם לא בקטגוריות אלה"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "לעולם אל תשיב בקטגוריות אלה."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "קטגוריות ציבוריות בלבד"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "השב רק בקטגוריות שאורחים יכולים לקרוא, כך שאף תוכן פרטי לא נשלח לספק הבינה המלאכותית. נושאים קשורים נלקחים תמיד מקטגוריות ציבוריות בלבד."

PLG_KUNENA_BALDRICK_TRANSLATE = "הוסף תרגום לאנגלית"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick משיב בשפתו של כותב ההודעה. עם אפשרות זו, תשובות בשפות אחרות מלוות בתרגום לאנגלית (שימושי לצוות ולקוראים דוברי אנגלית)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "נושאים קשורים"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "כמה נושאים ציבוריים קשורים (שנמצאו בעזרת שאילתות החיפוש של שלב המיון) יינתנו למודל התשובות."
PLG_KUNENA_BALDRICK_PRESET = "הנחיית מערכת מובנית"
PLG_KUNENA_BALDRICK_PRESET_DESC = "ההוראות שממנן כל תשובה מתחילה (לקריאה בלבד). הקשר האתר שלך מתווסף אליהן למטה."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "הקשר האתר"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "על מה הפורום, מוצרים וגרסאות נתמכים, קישורים לתיעוד, הטון שיש להשתמש בו, מה Baldrick לעולם לא צריך לעשות... מתווסף להנחיות של שני השלבים (זה גם עוזר למודל המיון להבחין בין ספאם להודעות רלוונטיות)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "למשל: זהו פורום התמיכה של ExampleSoft. אנו תומכים בגרסאות 3 ו-4. התיעוד נמצא בכתובת https://docs.example.com. לעולם אל תבטיח החזרי כספים."
PLG_KUNENA_BALDRICK_CANNED = "תשובות מוכנות"
PLG_KUNENA_BALDRICK_CANNED_DESC = "תשובות לשאלות רחבות מדי (לא נכתבת תשובת בינה מלאכותית), וגיבויים כאשר לא ניתן לכתוב תשובה. הפרד בין תשובות בשורה של שלושה מקפים (---); אחת מהן נבחרת באקראי. משתנים: {name} (כותב ההודעה), {search_url} (חיפוש בפורום לשאלה), {forum_url}, {topic_url}. מותר BBCode של הפורום."

