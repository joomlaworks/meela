PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Максимум токена разврставања"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Максимум токена одговора"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Горња граница излаза модела (укључујући његово размишљање, за моделе који размишљају). Повећајте ако су одговори пресечени."
