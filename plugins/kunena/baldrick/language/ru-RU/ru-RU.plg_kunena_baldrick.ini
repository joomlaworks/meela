PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Модель шага ответа, например claude-sonnet-5-5 (или claude-opus-5-5 для лучших ответов). &quot;Получить модели&quot; показывает список моделей поставщика; можно также ввести название вручную. &quot;Проверить&quot; отправляет модели небольшой запрос."
