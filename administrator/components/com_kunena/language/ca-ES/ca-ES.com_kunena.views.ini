COM_KUNENA_A_EBAYLANGUAGECODE_DESC = "És important Estableix el codi del widget d'eBay en el teu propi idioma per derivar tant l'idioma i la moneda del mateix. El valor predeterminat és en-us per ebay.com. Exemples: ebay.es: es-es, ebay.de: de-de, ebay.at: de-at, ebay.co.uk: en-gb"
COM_KUNENA_A_EBAY_AFFILIATE_ID = "ID d'afiliat a eBay"
COM_KUNENA_A_EBAY_AFFILIATE_ID_DESC = "Entra l'ID d'afiliat a eBay"
COM_KUNENA_A_EMAIL = "Direcció de correu electrònic del Fòrum"
COM_KUNENA_A_EMAIL_DESC2 = "Aquesta es la direcció de correu electrònic del fòrum. Si es deixa buit, Meela utilizarà l'adreça predeterminada de Joomla. Posa una adreça de correu electrònic vàlida ja que totes les subscripcions i notificacions de moderació s'enviaran a través d'aquesta adreça."
COM_KUNENA_A_ENABLED_DESC = "Habilita la funcionalitat d'enquestes pel fòrum. Això s'ha d'Estableix <em>Sí</em> per poder soportar enquestes."
COM_KUNENA_A_FAVORITES = "Permetre favorits"
