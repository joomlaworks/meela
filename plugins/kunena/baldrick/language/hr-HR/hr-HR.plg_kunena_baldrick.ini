PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model koraka razvrstavanja, npr. claude-haiku-5-5. &quot;Dohvati modele&quot; popisuje modele pružatelja s gornjim vrijednostima (spremljenim ili ne) u popisu za pretragu (čuva se sat vremena; &quot;Osvježi&quot; pita ponovno); možeš upisati i naziv. &quot;Test&quot; šalje kratak zahtjev modelu."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model koraka odgovora, npr. claude-sonnet-5-5 (ili claude-opus-5-5 za najbolje odgovore). &quot;Dohvati modele&quot; popisuje modele pružatelja; možeš upisati i naziv. &quot;Test&quot; šalje kratak zahtjev modelu."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Dohvati modele"
PLG_KUNENA_BALDRICK_TEST = "Test"
