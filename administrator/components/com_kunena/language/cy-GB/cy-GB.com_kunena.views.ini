COM_KUNENA_CFG_SEO_SHARE_IMAGE_DESC="Delwedd a ddangosir gyda chysylltau a rennir o dudalennau heb ddelwedd eu hunain (defnyddir delwedd gyntaf wedi'i hatodi pwnc os oes un): dewiswch neu uwchlwythwch hi gyda'r Rheolwr Cyfryngau. Maint a argymhellir: 1200 x 630 picsel."
