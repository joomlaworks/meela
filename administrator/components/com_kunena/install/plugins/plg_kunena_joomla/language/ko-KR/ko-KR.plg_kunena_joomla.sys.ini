PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "이 카테고리에 새 주제를 작성할 수 있는 사용자 그룹을 선택하세요. 이 설정은 이미 카테고리를 읽을 수 있는 사용자에게만 영향을 줍니다. 손님은 <em>포럼 설정 > 보안 &amp; 모더레이션 > 손님의 게시/작성 허용</em>을 켜지 않는 한 새 주제를 만들 수 없습니다. <br /><br /> <strong>팁:</strong> <em>Ctrl</em> 또는 <em>Shift</em> 키를 누른 채 클릭하여 여러 그룹을 선택할 수 있습니다."
