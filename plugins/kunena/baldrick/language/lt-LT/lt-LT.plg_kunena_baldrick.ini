PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, forumo DI pirmasis atsakiklis: atsako į naujas temas ir į temas, atgaivintas po ilgos tylos, kai joks administratorius ar moderatorius neatsakė, naudodamas Anthropic arba su OpenAI suderinamus API. <strong>Privatumas:</strong> jo apdorojamų temų (ir susijusių viešų temų) tekstas siunčiamas jūsų sukonfigūruotam DI teikėjui; paminėkite tai savo privatumo politikoje. Veikla, sumos ir kainos: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1 žingsnis: rūšiavimo modelis (mažas, pigus)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Pirmiausia perskaito kiekvieną naują klausimą: jį įvertina (galima atsakyti, per platus, trūksta detalių, ne klausimas, šlamštas) ir parašo paieškos užklausas susijusioms temoms. Pakanka mažo, greito modelio."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2 žingsnis: atsakymo modelis (galingesnis)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Rašo atsakymą į aiškius klausimus, naudodamas temą ir forume rastas susijusias viešas temas. Gali naudoti 1 žingsnio ryšį su kitu modeliu arba savo ryšį."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kada Baldrick atsako"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick žiūri į kiekvieną naują temą, į temos pradėjėjo atsakymus Baldrick (pokalbį) ir į atsakymus temose, kurios buvo tylios ilgiau nei žemiau nurodytas dienų skaičius. Jis niekada neatsako, kai paskutinė žinutė yra administratoriaus ar moderatoriaus."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kaip Baldrick atsako"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Atsakymai skelbiami iš karto kaip Baldrick naudotojas, forumo BBCode. Nuorodos į forumo temas yra santykinės."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Šlamštas"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kai rūšiavimo modelis tikras, kad žinutė yra šlamštas (reklama, telefono numeriai, SEO nuorodos...), Baldrick nustoja ją skelbti: visą temą, jei tai pirmoji žinutė. Neskelbiamos žinutės laukia moderavimo, todėl klaida ištaisoma jas patvirtinus."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Pranešimai"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Paprasto teksto el. laiškas siunčiamas per Joomla pašto nustatymus, su pirmąja temos žinute ir jos paskutinėmis 5 žinutėmis, naujausios pirma. Apie veiksmus su šlamštu ir klaidas (temą, kurios Baldrick atsisakė, pristabdymą dėl DI teikėjo užklausų atmetimo) pranešama visada. Kiekvieno el. laiško rezultatas rodomas veiklos žurnale."

