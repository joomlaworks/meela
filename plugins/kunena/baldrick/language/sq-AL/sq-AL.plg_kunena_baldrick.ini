PLG_KUNENA_BALDRICK_PRICE_OUT = "Çmimi: dalja"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD për milion tokena, për vlerësimet e kostos. Bosh: çmimi i listës për modelet e njohura Claude, përndryshe 0 (përveç nëse ofruesi e raporton vetë koston)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Përdor lidhjen e hapit 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Përdor të njëjtin lloj API, URL bazë dhe çelës si hapi i klasifikimit (me modelin e zgjedhur më poshtë). Zgjidhni Jo për të përdorur një ofrues tjetër për përgjigjet."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: zgjidhje rezervë në refuzime"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Vetëm në API-n e vetë Anthropic me modelet Opus/Sonnet 5.x: kur kontrollet e sigurisë së modelit refuzojnë një kërkesë, API e ekzekuton sërish në një model rezervë të zgjedhur nga Anthropic (fallback nga ana e serverit). Nuk disponohet për Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Provë"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Për testimin e konfigurimit: Baldrick u përgjigjet vetëm temave të nisura nga administratorët dhe moderatorët (temat e reja, dhe vazhdimet e tyre ndaj Baldrick), dhe nuk çpublikon asnjëherë postime (spami vetëm raportohet)."
PLG_KUNENA_BALDRICK_USER = "Përdoruesi i Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Përdoruesi si i cili poston Baldrick. Lëreni bosh që të krijohet automatikisht një përdorues &quot;Baldrick&quot; (pa fjalëkalim të përdorshëm, pa adresë e-mail reale). Caktoni avatarin dhe nënshkrimin e tij në profilin e tij në forum (një përdorues i ri merr nënshkrimin &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Ringjall pas (ditë)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Një përgjigje në një temë që ka postimin e mëparshëm më të vjetër se kjo trajtohet si pyetje e re."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Përgjigje për temë"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Sa herë mund të përgjigjet Baldrick në të njëjtën temë: përgjigjja e tij e parë, dhe përgjigjet e tij kur nisësi i temës i përgjigjet (detajet që kërkoi, një pyetje tjetër) ose tema ringjallet pas një heshtjeje të gjatë."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Përgjigje në ditë"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Më së shumti kaq përgjigje brenda 24 orësh (0: pa kufi). Mbron buxhetin tuaj API nga vërshimet."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Gjatësia minimale e postimit"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Postimet më të shkurtra se kjo (karaktere, pa formatim) injorohen."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Vetëm këto kategori"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Përgjigju vetëm në këto kategori (asnjë e zgjedhur: të gjitha kategoritë)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Kurrë në këto kategori"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Mos u përgjigj kurrë në këto kategori."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Vetëm kategoritë publike"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Përgjigju vetëm në kategoritë që mysafirët mund t'i lexojnë, që asnjë përmbajtje private të mos dërgohet te ofruesi i AI. Temat e ngjashme merren gjithmonë vetëm nga kategoritë publike."

PLG_KUNENA_BALDRICK_TRANSLATE = "Shto një përkthim në anglisht"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick përgjigjet në gjuhën e postuesit. Me këtë opsion, përgjigjet në gjuhë të tjera pasohen nga një përkthim në anglisht (e dobishme për një staf dhe lexues që flasin anglisht)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Tema të ngjashme"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Sa tema publike të ngjashme (të gjetura me pyetjet e kërkimit të hapit të klasifikimit) i jepen modelit të përgjigjes."
PLG_KUNENA_BALDRICK_PRESET = "Prompti kryesor i integruar"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Udhëzimet nga të cilat nis çdo përgjigje (vetëm për lexim). Konteksti i faqes tuaj më poshtë u shtohet atyre."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Konteksti i faqes"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Për çfarë është forumi, produktet dhe versionet e mbështetura, lidhje te dokumentacioni, toni që duhet përdorur, çfarë nuk duhet të bëjë kurrë Baldrick... Shtohet te promptet e të dy hapave (ndihmon edhe modelin e klasifikimit të dallojë spamin nga postimet në temë)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "p.sh. Ky është forumi i mbështetjes së ExampleSoft. Mbështesim versionet 3 dhe 4. Dokumentacioni është te https://docs.example.com. Mos premtoni kurrë rimbursime."
PLG_KUNENA_BALDRICK_CANNED = "Përgjigje të gatshme"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Përgjigje për pyetje shumë të gjera (nuk shkruhet përgjigje AI), dhe zgjidhje rezervë kur nuk mund të shkruhet përgjigje. Ndani përgjigjet me një rresht me tre viza (---); zgjidhet një në mënyrë të rastësishme. Zëvendësuesit: {name} (postuesi), {search_url} (kërkimi në forum për pyetjen), {forum_url}, {topic_url}. BBCode i forumit lejohet."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Çfarë të bëhet kur modeli i klasifikimit është i sigurt se një postim është spam. Një e-mail dërgohet në dy rastet e para."
