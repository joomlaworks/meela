PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "Zgjidhni grupet e përdoruesve që lejohen të postojnë një temë të re në këtë kategori. Ky cilësim ndikon vetëm te përdoruesit që kanë tashmë të drejtë leximi në kategori. Mysafirët nuk mund të krijojnë tema të reja përveç nëse aktivizoni <em>Konfigurimi i forumit > Siguria & Moderimi > Lejo mysafirët të postojnë/shkruajnë</em>. <br /><br /> <strong>Këshillë:</strong> Mund të zgjidhni disa grupe duke mbajtur shtypur tastet <em>Ctrl</em> ose <em>Shift</em>."
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_DESC = "Zgjidhni grupet e përdoruesve që lejohen t'u përgjigjen temave në këtë kategori. Ky cilësim ndikon vetëm te përdoruesit që kanë tashmë të drejtë leximi në kategori. Mysafirët nuk mund t'u përgjigjen temave përveç nëse aktivizoni <em>Konfigurimi i forumit > Siguria & Moderimi > Lejo mysafirët të postojnë/shkruajnë</em>. <br /><br /> <strong>Këshillë:</strong> Mund të zgjidhni disa grupe duke mbajtur shtypur tastet <em>Ctrl</em> ose <em>Shift</em>."

