COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "Hvilke bilde-MIME-typer som godtas når &quot;Sjekk MIME-typer&quot; er på: kommaseparerte, <strong>med små bokstaver</strong>. Standard: image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif. Er feltet tomt, settes standarden inn ved lagring."
