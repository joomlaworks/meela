PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Gadewch yn wag ar gyfer yr API swyddogol (https://api.anthropic.com neu https://api.openai.com/v1). Enghreifftiau ar gyfer Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (cydnaws ag Anthropic) neu https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (cydnaws ag OpenAI)."
