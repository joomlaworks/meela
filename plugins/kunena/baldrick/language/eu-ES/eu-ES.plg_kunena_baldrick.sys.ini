PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, foroaren lehen erantzule adimen artifiziala: gai berriei eta isilaldi luzearen ondoren berpiztutako gaiei erantzuten die, administratzaile edo moderatzailerik erantzun ez dienean, Anthropic edo OpenAI-rekin bateragarriak diren API-ak erabiliz. <strong>Pribatutasuna:</strong> tratatzen dituen gaien (eta erlazionatutako gai publikoen) testua zuk konfiguratutako AA hornitzaileari bidaltzen zaio; aipatu hori zure pribatutasun-politikan. Jarduera, guztizkoak eta kostuak: Meela &gt; Baldrick AI."
