PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model y cam didoli, e.e. claude-haiku-5-5. Mae &quot;Nôl modelau&quot; yn rhestru modelau'r darparwr gyda'r gwerthoedd uchod (wedi'u cadw neu beidio) mewn rhestr chwiliadwy (a gedwir am awr; mae &quot;Adnewyddu&quot; yn gofyn eto); gallwch hefyd deipio enw. Mae &quot;Prawf&quot; yn anfon cais bach at y model."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model y cam ateb, e.e. claude-sonnet-5-5 (neu claude-opus-5-5 ar gyfer yr atebion gorau). Mae &quot;Nôl modelau&quot; yn rhestru modelau'r darparwr; gallwch hefyd deipio enw. Mae &quot;Prawf&quot; yn anfon cais bach at y model."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Nôl modelau"
