PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, prvý AI odpovedajúci na fóre: odpovedá v nových témach a v témach oživených po dlhom tichu, ak ešte neodpovedal administrátor ani moderátor, a používa API Anthropic alebo API kompatibilné s OpenAI. <strong>Súkromie:</strong> text tém, ktoré spracúva (a súvisiacich verejných tém), sa odosiela vami nastavenému poskytovateľovi AI; uveďte to vo svojich zásadách ochrany súkromia. Aktivita, súčty a náklady: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Krok 1: model triedenia (malý, lacný)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Najprv prečíta každú novú otázku: ohodnotí ju (dá sa zodpovedať, príliš všeobecná, chýbajú podrobnosti, nie je to otázka, spam) a zostaví hľadacie dotazy pre súvisiace témy. Stačí malý a rýchly model."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Krok 2: model odpovedí (výkonnejší)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Píše odpovede na jasné otázky s použitím témy a súvisiacich verejných tém nájdených na fóre. Môže použiť pripojenie kroku 1 s iným modelom, alebo vlastné pripojenie."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kedy Baldrick odpovedá"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick sleduje každú novú tému, odpovede autora témy Baldrickovi (konverzáciu) a odpovede v témach, ktoré boli ticho dlhšie než počet dní nižšie. Nikdy neodpovie, ak je posledný príspevok od administrátora alebo moderátora."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Ako Baldrick odpovedá"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Odpovede sa zverejňujú okamžite ako používateľ Baldrick, v BBCode fóra. Odkazy na témy fóra sú relatívne."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Keď je model triedenia presvedčený, že príspevok je spam (reklama, telefónne čísla, SEO odkazy...), Baldrick mu zruší zverejnenie: celú tému, ak ide o prvý príspevok. Zrušené zverejnenie čaká na moderovanie, takže omyl sa napraví jeho schválením."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Upozornenia"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Jednoduchý textový e-mail sa odosiela cez nastavenia pošty Joomla: prvý príspevok témy a jej posledných 5 príspevkov, od najnovšieho. Akcie proti spamu a chyby (téma, od ktorej sa Baldrick vzdal, pauza kvôli odmietaniu požiadaviek poskytovateľom AI) sa vždy oznamujú. Výsledok každého e-mailu je zobrazený v zázname aktivity."

PLG_KUNENA_BALDRICK_PROVIDER = "Typ API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Messages API Anthropic (Claude a koncové body kompatibilné s Anthropic, napríklad Qwen), alebo Chat Completions kompatibilné s OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Kompatibilné s Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Kompatibilné s OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Základná adresa URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Pre oficiálne API nechajte prázdne (https://api.anthropic.com alebo https://api.openai.com/v1). Príklady pre Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (kompatibilné s Anthropic) alebo https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (kompatibilné s OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Prázdne: oficiálne API"
PLG_KUNENA_BALDRICK_API_KEY = "Kľúč API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Kľúč API poskytovateľa. Baldrick nerobí nič, kým nie sú nastavené kľúč a modely."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model kroku triedenia, napr. claude-haiku-5-5. &quot;Načítať modely&quot; vypíše modely poskytovateľa s hodnotami vyššie (uloženými alebo nie) v prehľadávateľnom zozname (uchová sa hodinu; &quot;Obnoviť&quot; načíta znova); môžete aj zadať názov. &quot;Test&quot; odošle modelu krátku požiadavku."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model kroku odpovede, napr. claude-sonnet-5-5 (alebo claude-opus-5-5 pre najlepšie odpovede). &quot;Načítať modely&quot; vypíše modely poskytovateľa; môžete aj zadať názov. &quot;Test&quot; odošle modelu krátku požiadavku."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Načítať modely"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Prebieha..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Vyberte model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Požiadavka zlyhala."
PLG_KUNENA_BALDRICK_PRICE_IN = "Cena: vstup"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cena: výstup"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD za milión tokenov, na odhad nákladov. Prázdne: cenníková cena známych modelov Claude, inak 0 (ak poskytovateľ náklady sám neuvádza)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Použiť pripojenie kroku 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Použiť rovnaký typ API, základnú adresu URL a kľúč ako krok triedenia (s modelom vybraným nižšie). Zvoľte Nie, ak chcete na odpovede použiť iného poskytovateľa."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: záložný model pri odmietnutí"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Len vo vlastnom API Anthropic s modelmi Opus/Sonnet 5.x: keď bezpečnostné kontroly modelu požiadavku odmietnu, API ju spustí znova na záložnom modeli, ktorý vyberie Anthropic (záložné modely na strane servera). Pre Haiku nedostupné."

PLG_KUNENA_BALDRICK_DRY_RUN = "Skúšobný režim"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Na otestovanie nastavení: Baldrick odpovedá len v témach, ktoré založili administrátori a moderátori (v nových témach a v ich pokračovaniach s Baldrickom), a príspevky nikdy nezverejňuje (spam sa len nahlasuje)."
PLG_KUNENA_BALDRICK_USER = "Používateľ Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Používateľ, pod ktorým Baldrick prispieva. Nechajte prázdne, aby sa automaticky vytvoril používateľ &quot;Baldrick&quot; (bez použiteľného hesla a skutočnej e-mailovej adresy). Jeho avatar a podpis nastavte v jeho profile na fóre (nový používateľ dostane podpis &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Oživiť po (dňoch)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Odpoveď v téme, ktorej predchádzajúci príspevok je starší ako táto doba, sa spracuje ako nová otázka."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Odpovedí v téme"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Koľkokrát smie Baldrick odpovedať v tej istej téme: jeho prvá odpoveď a odpovede, keď mu autor témy odpovie (vyžiadané podrobnosti, ďalšia otázka), alebo keď sa téma oživí po dlhom tichu."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Odpovedí za deň"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Najviac toľko odpovedí za 24 hodín (0: bez obmedzenia). Chráni váš rozpočet API pred nápormi."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimálna dĺžka príspevku"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Príspevky kratšie ako toto (znakov bez formátovania) sa ignorujú."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Len v týchto kategóriách"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Odpovedať len v týchto kategóriách (nič nevybraté: všetky kategórie)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nikdy v týchto kategóriách"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nikdy neodpovedať v týchto kategóriách."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Len verejné kategórie"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Odpovedať len v kategóriách, ktoré môžu čítať hostia, aby sa poskytovateľovi AI neposielal žiadny súkromný obsah. Súvisiace témy sa vždy berú len z verejných kategórií."

PLG_KUNENA_BALDRICK_TRANSLATE = "Pridať anglický preklad"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick odpovedá v jazyku autora príspevku. Pri tejto voľbe sa odpovede v iných jazykoch dopĺňajú anglickým prekladom (užitočné pre anglicky hovoriaci personál a čitateľov)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Súvisiace témy"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Koľko súvisiacich verejných tém (nájdených hľadacími dotazmi kroku triedenia) sa odovzdá modelu odpovedí."
PLG_KUNENA_BALDRICK_PRESET = "Vstavaný hlavný prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Pokyny, z ktorých každá odpoveď vychádza (len na čítanie). Kontext vášho webu nižšie sa k nim pridá."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontext webu"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "O čom fórum je, aké produkty a verzie podporuje, odkazy na dokumentáciu, aký tón použiť, čo Baldrick nikdy nesmie robiť... Pridá sa k pokynom oboch krokov (pomáha aj modelu triedenia odlíšiť spam od príspevkov k veci)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "napr. Toto je podporné fórum ExampleSoft. Podporujeme verzie 3 a 4. Dokumentácia je na https://docs.example.com. Nikdy nesľubujte vrátenie peňazí."
PLG_KUNENA_BALDRICK_CANNED = "Pripravené odpovede"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Odpovede na príliš všeobecné otázky (AI odpoveď sa nepíše) a záložné odpovede, keď sa odpoveď nedá napísať. Jednotlivé odpovede oddeľte riadkom troch pomlčiek (---); jedna sa vyberie náhodne. Zástupné symboly: {name} (autor príspevku), {search_url} (hľadanie na fóre podľa otázky), {forum_url}, {topic_url}. BBCode fóra je povolený."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Čo robiť, keď je model triedenia presvedčený, že príspevok je spam. E-mail sa odošle v oboch prvých prípadoch."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Zrušiť zverejnenie (pri prvom príspevku celú tému) a upozorniť"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Len nahlásiť"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorovať"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Dôveryhodný po (príspevkoch)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Príspevky používateľov s aspoň toľkými zverejnenými príspevkami a príspevky personálu sa nikdy nezrušia zverejnenie: len sa nahlasujú."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Upozorniť týchto členov personálu"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Useri, administrátori a moderátori Meela, ktorí dostávajú upozornenia (Ctrl/Cmd+klik na výber viacerých)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Upozorňovať na"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Každú odpoveď, ktorú Baldrick zverejní (odpovede, pripravené odpovede, žiadosti o podrobnosti), a spam, alebo len spam. Chyby sa vždy oznamujú."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Každú odpoveď, spam a chyby"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Len spam a chyby"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Upozorniť tieto adresy"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Ďalšie e-mailové adresy oddelené čiarkami."

PLG_KUNENA_BALDRICK_PROCESSING = "Spracovanie"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automaticky: hneď po odoslaní stránky, ktorá tému zaradila do frontu (s PHP-FPM), alebo požiadavkou na pozadí na samotný web. Iba príkazový riadok: spúšťajte z cronu (Joomla 3.x UTD) príkaz &quot;php cli/joomla.php kunena:baldrick:process&quot;, napr. každú minútu."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automaticky"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Iba príkazový riadok (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Uchovávať aktivitu (dní)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Záznamy aktivity staršie ako táto doba sa zmažú. Mesačné súčty sa uchovávajú 36 mesiacov."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Pokročilé: spracovanie, limity a časové limity"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Pridávanie príspevkov nikdy nečaká na AI: témy sa zaraďujú do frontu a spracúvajú na pozadí. Sieťové chyby, limity rýchlosti a preťažení poskytovatelia sa opakujú (akonáhle to poskytovateľ dovolí), potom sa téma skúsi znova neskôr (3 pokusy). Chyby účtu (neplatný kľúč, žiadne kredity, neznámy model) pozastavia Baldricka a upozornia vyššie uvedených príjemcov."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Časový limit pripojenia (sekundy)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Ako dlho čakať, kým poskytovateľ prijme spojenie. Krátky čas, aby sa sieťové problémy prejavili rýchlo."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Časový limit odpovede triedenia (sekundy)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Ako dlho čakať na úplnú odpoveď modelu triedenia (je krátka)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Časový limit odpovede (sekundy)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Ako dlho čakať na úplnú odpoveď modelu odpovedí. Odpovede sa nestreamujú: tento čas zahŕňa napísanie celej odpovede a modely, ktoré najprv premýšľajú, môžu potrebovať minútu alebo viac."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maximum tokenov triedenia"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maximum tokenov odpovede"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Horný limit výstupu modelu (vrátane jeho uvažovania, pri modeloch, ktoré uvažujú). Zvýšte ho, ak sa odpovede useknú."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maximálne čakanie vo fronte (hodiny)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Témy, ktoré čakajú dlhšie ako túto dobu (napr. po výpadku poskytovateľa), sa preskočia: odpoveď o niekoľko dní neskôr by bola zvláštna. 0: bez obmedzenia."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pauza po chybách účtu (minúty)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Po neplatnom kľúči, vyčerpaných kreditoch alebo kvóte či neznámom modeli sa Baldrick pozastaví (témy vo fronte čakajú), raz odošle upozornenie e-mailom príjemcom a po toľkých minútach skúsi znova, kým poskytovateľ neodpovie. Uložením týchto nastavení sa pauza ukončí."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Obnoviť"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Zobraziť všetky modely"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Zahrnúť modely, ktoré nevedia písať chatové odpovede (embeddingy, reč, obrázky...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Zadajte text na vyhľadanie modelov"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Žiadny zodpovedajúci model"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Ceny doplnené zo zoznamu poskytovateľa."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Jednoduché hľadanie: prehľadať posledných príspevkov"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Bez fulltextového indexu (SQLite, alebo kým ho nevytvoríte v Meela > Baldrick AI) sa súvisiace témy hľadajú čítaním príspevkov, zhruba 2,5 sekundy na 50 000 príspevkov: prehľadá sa len toľko najnovších príspevkov (0: všetky). S indexom sa prehľadajú všetky príspevky."
