PLG_KUNENA_BALDRICK_PROCESSING = "Obrada"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatski: odmah pošto je poslata stranica koja je stavila temu u red (sa PHP-FPM), ili pozadinskim zahtevom ka samom sajtu. Samo komandna linija: pokrećite &quot;php cli/joomla.php kunena:baldrick:process&quot; iz cron-a (Joomla 3.x UTD), npr. svakog minuta."
