PLG_KUNENA_BALDRICK_NOTIFY_ON = "Obavijesti o"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Svaki odgovor koji Baldrick objavi (odgovori, gotovi odgovori, zahtjevi za detalje) i spam, ili samo spam. O greškama se uvijek obavještava."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Svaki odgovor, spam i greške"
