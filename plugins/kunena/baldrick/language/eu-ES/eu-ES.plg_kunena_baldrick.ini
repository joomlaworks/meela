PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Kategoria publikoak bakarrik"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Erantzun gonbidatuek irakur ditzaketen kategorietan bakarrik, AA hornitzaileari eduki pribaturik bidal ez dakion. Erlazionatutako gaiak kategoria publikoetatik bakarrik hartzen dira beti."

