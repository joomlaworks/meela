PLG_KUNENA_BALDRICK_REQUEST_FAILED = "İstek başarısız oldu."
PLG_KUNENA_BALDRICK_PRICE_IN = "Fiyat: girdi"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Fiyat: çıktı"
PLG_KUNENA_BALDRICK_PRICE_DESC = "Maliyet tahminleri için milyon belirteç başına USD. Boş: bilinen Claude modellerinin liste fiyatı, aksi halde 0 (sağlayıcı maliyeti kendisi bildirmedikçe)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "1. adımın bağlantısını kullan"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Sınıflandırma adımıyla aynı API türünü, temel URL'yi ve anahtarı kullanın (aşağıda seçilen modelle). Yanıtlar için başka bir sağlayıcı kullanmak üzere Hayır seçin."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: reddedilmelerde yedek"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Yalnızca Anthropic'in kendi API'sinde Opus/Sonnet 5.x modelleriyle: modelin güvenlik denetimleri bir isteği reddederse, API isteği Anthropic'in seçtiği bir yedek modelde (sunucu tarafı yedekler) yeniden çalıştırır. Haiku için kullanılamaz."

PLG_KUNENA_BALDRICK_DRY_RUN = "Deneme çalıştırması"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Yapılandırmayı denemek için: Baldrick yalnızca yönetici ve moderatörlerin başlattığı konulara yanıt verir (yeni konular ve bunlardaki Baldrick'e yanıtlar) ve iletileri asla yayından kaldırmaz (spam yalnızca bildirilir)."
PLG_KUNENA_BALDRICK_USER = "Baldrick'in kullanıcısı"
PLG_KUNENA_BALDRICK_USER_DESC = "Baldrick'in yazdığı kullanıcı. Boş bırakırsanız \"Baldrick\" adlı bir kullanıcı otomatik oluşturulur (kullanılabilir parola yok, gerçek e-posta adresi yok). Bu kullanıcının avatarını ve imzasını forum profilinde ayarlayın (yeni bir kullanıcı şu imzayı alır: \"Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)\")."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Şu kadar gün sonra canlandır"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Önceki iletisi bu süreden daha eski olan bir konuya verilen yanıt, yeni bir soru gibi işlenir."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Konu başına yanıt"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Baldrick aynı konuda en fazla kaç kez yanıt verebilir: ilk yanıtı ve konuyu açan kişi Baldrick'e yanıt verdiğinde (istediği ayrıntılar, ek bir soru) ya da konu uzun süre sonra canlandığında verdiği yanıtlar."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Günlük yanıt sayısı"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "24 saatte en fazla bu kadar yanıt (0: sınır yok). API bütçenizi ani yoğunluklara karşı korur."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "En kısa ileti uzunluğu"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Bundan kısa iletiler (biçimlendirme olmadan karakter sayısı) yok sayılır."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Yalnızca bu kategorilerde"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Yalnızca bu kategorilerde yanıt verin (hiçbiri seçili değilse: tüm kategoriler)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Bu kategorilerde asla"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Bu kategorilerde asla yanıt verme."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Yalnızca herkese açık kategoriler"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Yalnızca misafirlerin okuyabildiği kategorilerde yanıt verin; böylece hiçbir özel içerik yapay zekâ sağlayıcısına gönderilmez. İlgili konular her zaman yalnızca herkese açık kategorilerden alınır."

PLG_KUNENA_BALDRICK_TRANSLATE = "İngilizce çeviri ekle"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick, yazanın dilinde yanıt verir. Bu seçenekle, başka dillerdeki yanıtların ardından İngilizce çeviri gelir (İngilizce konuşan yönetim ve okuyucular için yararlı)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "İlgili konular"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Yanıt modeline, sınıflandırma adımının arama sorgularıyla bulunan kaç ilgili herkese açık konunun verileceği."
PLG_KUNENA_BALDRICK_PRESET = "Yerleşik ana komut"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Her yanıtın başladığı talimatlar (salt okunur). Aşağıdaki site bağlamınız bunlara eklenir."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Site bağlamı"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Forumun konusu, desteklenen ürün ve sürümler, belgelerin bağlantıları, kullanılacak ton, Baldrick'in asla yapmaması gerekenler... Her iki adımın istemlerine eklenir (sınıflandırma modelinin spam ile konuyla ilgili iletileri ayırt etmesine de yardım eder)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "ör. Bu, ExampleSoft'un destek forumudur. Sürüm 3 ve 4'ü destekliyoruz. Belgeler https://docs.example.com adresinde. Asla geri ödeme vaat etmeyin."
PLG_KUNENA_BALDRICK_CANNED = "Hazır yanıtlar"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Çok geniş sorulara yanıtlar (yapay zekâ yanıtı yazılmaz) ve hiçbir yanıt yazılamadığında yedek yanıtlar. Yanıtları üç tire (---) satırıyla ayırın; biri rastgele seçilir. Yer tutucular: {name} (yazan kişi), {search_url} (sorunun forum araması), {forum_url}, {topic_url}. Forum BBCode'una izin verilir."

