PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "Hautatu kategoria honetan gai berri bat argitaratzeko baimena duten erabiltzaile-taldeak. Ezarpen honek kategoriarako irakurketa-sarbidea duten erabiltzaileei bakarrik eragiten die. Gonbidatuek ezin dituzte gai berriak sortu <em>Forum Configuration > Security & Moderation > Allow Guests to Post/Write</em> aktibatzen ez baduzu. <br /><br /> <strong>Pista:</strong> Talde bat baino gehiago hauta ditzakezu <em>Ctrl</em> edo <em>Shift</em> tekla sakatuta."
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_DESC = "Hautatu kategoria honetako gai bati erantzuteko baimena duten erabiltzaile-taldeak. Ezarpen honek kategoriarako irakurketa-sarbidea duten erabiltzaileei bakarrik eragiten die. Gonbidatuek ezin diete gaiei erantzun <em>Forum Configuration > Security & Moderation > Allow Guests to Post/Write</em> aktibatzen ez baduzu. <br /><br /> <strong>Pista:</strong> Talde bat baino gehiago hauta ditzakezu <em>Ctrl</em> edo <em>Shift</em> tekla sakatuta."

