PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, परिचर्चा मंच का AI प्रथम उत्तरदाता: जब किसी व्यवस्थापक या परिनियामक ने उत्तर न दिया हो, तब Anthropic या OpenAI-संगत API का उपयोग करके नए विषयों और लंबी चुप्पी के बाद पुनर्जीवित विषयों का उत्तर देता है। <strong>गोपनीयता:</strong> वह जिन विषयों को संभालता है (और संबंधित सार्वजनिक विषयों) का पाठ आपके द्वारा कॉन्फ़िगर किए गए AI प्रदाता को भेजा जाता है; इसका उल्लेख अपनी गोपनीयता नीति में करें। गतिविधि, कुल और लागत: Meela &gt; Baldrick AI।"
