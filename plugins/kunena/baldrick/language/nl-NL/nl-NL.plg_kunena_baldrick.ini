PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, de AI-eerstelijnsreageerder van het forum: antwoordt op nieuwe onderwerpen en op onderwerpen die na een lange stilte weer tot leven komen wanneer geen beheerder of moderator heeft geantwoord, via Anthropic- of OpenAI-compatibele API's. <strong>Privacy:</strong> de tekst van de onderwerpen die hij behandelt (en van gerelateerde openbare onderwerpen) wordt naar de door jou ingestelde AI-aanbieder gestuurd; vermeld dit in je privacyverklaring. Activiteit, totalen en kosten: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Stap 1: sorteermodel (klein, goedkoop)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Leest elke nieuwe vraag eerst: beoordeelt die (beantwoordbaar, te algemeen, details ontbreken, geen vraag, spam) en schrijft de zoekopdrachten voor gerelateerde onderwerpen. Een klein, snel model is voldoende."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Stap 2: antwoordmodel (krachtiger)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Schrijft het antwoord op duidelijke vragen, met gebruik van het onderwerp en de gerelateerde openbare onderwerpen op het forum. Het kan de verbinding van stap 1 met een ander model gebruiken, of een eigen verbinding."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Wanneer Baldrick antwoordt"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick kijkt naar elk nieuw onderwerp, naar de antwoorden van de starter van het onderwerp aan Baldrick (een gesprek), en naar antwoorden op onderwerpen die langer stil waren dan het aantal dagen hieronder. Hij antwoordt nooit wanneer het laatste bericht van een beheerder of moderator is."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Hoe Baldrick antwoordt"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Antwoorden worden direct gepubliceerd als de gebruiker van Baldrick, in forum-BBCode. Links naar forumonderwerpen zijn relatief."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Wanneer het sorteermodel er zeker van is dat een bericht spam is (reclame, telefoonnummers, SEO-links...), haalt Baldrick het van de site: bij een eerste bericht het hele onderwerp. Niet-gepubliceerde berichten wachten op moderatie, dus een vergissing wordt hersteld door ze goed te keuren."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Meldingen"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Er wordt een e-mail in platte tekst verstuurd via de mailinstellingen van Joomla, met het eerste bericht van het onderwerp en de laatste 5 berichten, nieuwste eerst. Spamacties en fouten (een onderwerp dat Baldrick heeft opgegeven, een pauze omdat de AI-aanbieder zijn verzoeken weigert) worden altijd gemeld. Het resultaat van elke e-mail staat in het activiteitenlogboek."

PLG_KUNENA_BALDRICK_PROVIDER = "API-type"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, en Anthropic-compatibele eindpunten zoals die van Qwen), of OpenAI-compatibele Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-compatibel (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-compatibel (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Basis-URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Leeg laten voor de officiële API (https://api.anthropic.com of https://api.openai.com/v1). Voorbeelden voor Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (Anthropic-compatibel) of https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (OpenAI-compatibel)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Leeg: de officiële API"
PLG_KUNENA_BALDRICK_API_KEY = "API-sleutel"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "De API-sleutel van de aanbieder. Baldrick doet niets totdat een sleutel en de modellen zijn ingesteld."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model van de sorteerstap, bijvoorbeeld claude-haiku-5-5. &quot;Modellen ophalen&quot; toont de modellen van de aanbieder met de waarden hierboven (opgeslagen of niet) in een doorzoekbare lijst (een uur bewaard; &quot;Vernieuwen&quot; vraagt opnieuw); je kunt ook een naam typen. &quot;Testen&quot; stuurt een klein verzoek naar het model."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model van de antwoordstap, bijvoorbeeld claude-sonnet-5-5 (of claude-opus-5-5 voor de beste antwoorden). &quot;Modellen ophalen&quot; toont de modellen van de aanbieder; je kunt ook een naam typen. &quot;Testen&quot; stuurt een klein verzoek naar het model."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Modellen ophalen"
PLG_KUNENA_BALDRICK_TEST = "Testen"
PLG_KUNENA_BALDRICK_WORKING = "Bezig..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Kies een model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Het verzoek is mislukt."
PLG_KUNENA_BALDRICK_PRICE_IN = "Prijs: invoer"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Prijs: uitvoer"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per miljoen tokens, voor de kostenramingen. Leeg: de adviesprijs voor bekende Claude-modellen, anders 0 (tenzij de aanbieder de kosten zelf opgeeft)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "De verbinding van stap 1 gebruiken"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Gebruik hetzelfde API-type, dezelfde basis-URL en dezelfde sleutel als de sorteerstap (met het hieronder gekozen model). Kies Nee om voor de antwoorden een andere aanbieder te gebruiken."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: terugval bij weigeringen"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Alleen op de eigen API van Anthropic met de Opus- en Sonnet 5.x-modellen: wanneer de veiligheidscontroles van het model een verzoek weigeren, voert de API het opnieuw uit op een terugvalmodel dat Anthropic kiest (terugvallen aan serverzijde). Niet beschikbaar voor Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Proefrun"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Om de configuratie te testen: Baldrick antwoordt alleen in onderwerpen die door beheerders en moderators zijn gestart (nieuwe onderwerpen, en hun vervolgberichten aan Baldrick), en plaatst nooit berichten terug als niet-gepubliceerd (spam wordt alleen gemeld)."
PLG_KUNENA_BALDRICK_USER = "Gebruiker van Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "De gebruiker waarmee Baldrick plaatst. Laat leeg om automatisch een gebruiker \"Baldrick\" aan te laten maken (geen bruikbaar wachtwoord, geen echt e-mailadres). Stel de avatar en handtekening in via zijn forumprofiel (een nieuwe gebruiker krijgt de handtekening &quot;Beantwoord door Baldrick AI, mijn heer, met een listig model (...en onthoud dat AI fouten kan maken, controleer antwoorden dus goed)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Opnieuw tot leven wekken na (dagen)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Een antwoord op een onderwerp waarvan het vorige bericht ouder is dan dit, wordt behandeld als een nieuwe vraag."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Antwoorden per onderwerp"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Hoe vaak Baldrick in hetzelfde onderwerp mag antwoorden: zijn eerste antwoord, en zijn antwoorden wanneer de starter van het onderwerp erop reageert (gevraagde details, een verdere vraag) of het onderwerp na een lange stilte weer tot leven komt."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Antwoorden per dag"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Maximaal zoveel antwoorden in 24 uur (0: geen limiet). Beschermt je API-budget tegen overstromingen."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimale lengte van een bericht"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Berichten die korter zijn dan dit (tekens, zonder opmaak) worden genegeerd."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Alleen in deze categorieën"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Alleen in deze categorieën antwoorden (niets geselecteerd: alle categorieën)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nooit in deze categorieën"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nooit antwoorden in deze categorieën."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Alleen openbare categorieën"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Alleen antwoorden in categorieën die gasten kunnen lezen, zodat er geen privé-inhoud naar de AI-aanbieder wordt gestuurd. Gerelateerde onderwerpen komen altijd alleen uit openbare categorieën."

PLG_KUNENA_BALDRICK_TRANSLATE = "Een Engelse vertaling toevoegen"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick antwoordt in de taal van de schrijver. Met deze optie krijgen antwoorden in andere talen een Engelse vertaling erachter (handig voor een Engelstalig team en Engelstalige lezers)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Gerelateerde onderwerpen"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Hoeveel gerelateerde openbare onderwerpen (gevonden met de zoekopdrachten van de sorteerstap) aan het antwoordmodel worden gegeven."
PLG_KUNENA_BALDRICK_PRESET = "Ingebouwde masterprompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "De instructies waarmee elk antwoord begint (alleen lezen). Je sitecontext hieronder wordt eraan toegevoegd."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Sitecontext"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Waar het forum over gaat, ondersteunde producten en versies, links naar de documentatie, de te gebruiken toon, wat Baldrick nooit mag doen... Wordt aan de prompts van beide stappen toegevoegd (het helpt het sorteermodel ook om spam te onderscheiden van berichten over het onderwerp)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "bijv. Dit is het supportforum van ExampleSoft. We ondersteunen versies 3 en 4. De documentatie staat op https://docs.example.com. Beloof nooit terugbetalingen."
PLG_KUNENA_BALDRICK_CANNED = "Standaardantwoorden"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Antwoorden op vragen die te algemeen zijn (er wordt dan geen AI-antwoord geschreven), en terugvalantwoorden wanneer geen antwoord kan worden geschreven. Scheid de antwoorden met een regel van drie streepjes (---); er wordt er willekeurig één gekozen. Plaatshouders: {name} (de schrijver), {search_url} (forumzoekopdracht naar de vraag), {forum_url}, {topic_url}. Forum-BBCode is toegestaan."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Wat te doen wanneer het sorteermodel er zeker van is dat een bericht spam is. In de eerste twee gevallen wordt een e-mail verstuurd."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Niet publiceren (bij een eerste bericht het hele onderwerp) en melden"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Alleen melden"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Negeren"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Vertrouwd vanaf (berichten)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Berichten van gebruikers met minstens zoveel gepubliceerde berichten, en van het team, worden nooit als niet-gepubliceerd gemarkeerd: ze worden alleen gemeld."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Deze teamleden op de hoogte brengen"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super-gebruikers, beheerders en moderators van Meela die de meldingen ontvangen (Ctrl/Cmd+klik om er meerdere te kiezen)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Melden bij"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Elk antwoord dat Baldrick plaatst (antwoorden, standaardantwoorden, verzoeken om details) en spam, of alleen spam. Fouten worden altijd gemeld."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Elk antwoord, spam en fouten"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Alleen spam en fouten"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Deze adressen op de hoogte brengen"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Meer e-mailadressen, gescheiden door komma's."

PLG_KUNENA_BALDRICK_PROCESSING = "Verwerking"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatisch: direct nadat de pagina die een onderwerp in de wachtrij zette is verzonden (met PHP-FPM), of door een achtergrondverzoek aan de site zelf. Alleen opdrachtregel: voer &quot;php cli/joomla.php kunena:baldrick:process&quot; uit vanuit cron (Joomla 3.x UTD), bijvoorbeeld elke minuut."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatisch"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Alleen via de opdrachtregel (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Activiteitenlogboek bewaren (dagen)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Regels van het activiteitenlogboek die ouder zijn dan dit, worden verwijderd. Maandtotalen worden 36 maanden bewaard."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Geavanceerd: verwerking, limieten en time-outs"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Plaatsen wacht nooit op de AI: onderwerpen worden in de wachtrij gezet en op de achtergrond verwerkt. Netwerkfouten, snelheidslimieten en overbelaste aanbieders worden opnieuw geprobeerd (zodra de aanbieder het toestaat), daarna wordt het onderwerp later nog eens geprobeerd (3 pogingen). Accountfouten (ongeldige sleutel, geen tegoed, onbekend model) pauzeren Baldrick en brengen de hierboven genoemde ontvangers op de hoogte."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Time-out voor de verbinding (seconden)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Hoe lang er wordt gewacht tot de aanbieder de verbinding accepteert. Kort, zodat netwerkproblemen snel zichtbaar worden."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Time-out voor het antwoord van het sorteren (seconden)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Hoe lang er wordt gewacht op het volledige antwoord van het sorteermodel (dat is kort)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Time-out voor het antwoord (seconden)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Hoe lang er wordt gewacht op het volledige antwoord van het antwoordmodel. Antwoorden worden niet gestreamd: dit omvat het schrijven van het hele antwoord, en modellen die eerst nadenken hebben misschien een minuut of langer nodig."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maximaal aantal tokens voor het sorteren"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maximaal aantal tokens voor het antwoord"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Bovengrens voor de uitvoer van het model (inclusief zijn denkwerk, voor modellen die nadenken). Verhoog deze als antwoorden worden afgekapt."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maximale wachttijd in de wachtrij (uren)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Onderwerpen die na deze tijd nog wachten (bijvoorbeeld na een storing bij de aanbieder) worden overgeslagen: een antwoord dagen later zou vreemd zijn. 0: geen limiet."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pauze na accountfouten (minuten)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Na een ongeldige sleutel, op tegoed of quotum, of een onbekend model pauzeert Baldrick (wachtende onderwerpen wachten), stuurt het de ontvangers van de meldingen eenmaal een e-mail, en probeert het na zoveel minuten opnieuw totdat de aanbieder antwoordt. Het opslaan van deze instellingen beëindigt de pauze."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Vernieuwen"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Alle modellen tonen"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Modellen opnemen die geen chatantwoorden kunnen schrijven (embeddings, spraak, afbeeldingen...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Typ om de modellen te doorzoeken"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Geen model komt overeen"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Prijzen ingevuld vanuit de lijst van de aanbieder."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Gewone zoekfunctie: laatste berichten doorzocht"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Zonder volledige-tekstindex (SQLite, of voordat je die aanmaakt in Meela > Baldrick AI) worden gerelateerde onderwerpen gevonden door de berichten te lezen, ongeveer 2,5 seconden per 50.000 berichten: alleen zoveel van de laatste berichten worden doorzocht (0: alle). Met de index wordt elk bericht doorzocht."
