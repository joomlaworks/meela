PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Kategoria hauetan bakarrik"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Erantzun kategoria hauetan bakarrik (bat ere hautatu gabe: kategoria guztiak)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Inoiz ez kategoria hauetan"
