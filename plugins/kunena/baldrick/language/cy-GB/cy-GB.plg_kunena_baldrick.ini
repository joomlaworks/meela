PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Pob ateb y mae Baldrick yn ei bostio (atebion, atebion parod, ceisiadau am fanylion) a sbam, neu sbam yn unig. Hysbysir am wallau bob amser."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Pob ateb, sbam a gwallau"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Sbam a gwallau yn unig"
