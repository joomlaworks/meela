PLG_KUNENA_JOOMLA_ACCESS_LEVEL_TITLE = "កម្រិត​សិទ្ធិ៖"
PLG_KUNENA_JOOMLA_ACCESS_LEVEL_DESC = "<em>ក្រុម​កម្រិត​សិទ្ធិ</em> ដែល​អនុញ្ញាត​ឲ្យ​មើល​ជំពូក​នេះ ។"
PLG_KUNENA_JOOMLA_ACCESS_LEVEL_DESC_J25 = "<strong>ការណែនាំ៖</strong> អ្នក​អាច​កំណត់​កម្រិត​សិទ្ធិ​ផ្ទាល់​ខ្លួន​ក្នុង <em>Joomla >> អ្នកប្រើប្រាស់ >> កម្រិត​សិទ្ធិ</em> ។"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_TITLE = "ក្រុម​អ្នកប្រើប្រាស់​សំខាន់៖"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_DESC_J25 = "<strong>ការណែនាំ៖</strong> <em>សាធារណៈ</em> មាន​ន័យ​ថា​អ្នក​ទាំងអស់​គ្នា ឬ​ភ្ញៀវ​អាស្រ័យ​លើ​ការកំណត់​ <em>រួម​បញ្ចូល​ក្រុម​រង</em> បើ​អ្នក​ពុំ​បាន​ផ្លាស់​ប្ដូរ <em>ក្រុម​អ្នកប្រើប្រាស់​ភ្ញៀវ</em> ពី <em>Joomla >> អ្នកប្រើប្រាស់ >> ក្រុម​អ្នកប្រើប្រាស់ >> ជម្រើស</em> ។"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_CHILDS_TITLE = "សំខាន់​រួម​បញ្ចូល​ក្រុម​រង៖"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_TITLE = "ក្រុម​អ្នកប្រើប្រាស់​រង៖"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_DESC_J25 = "<strong>ការណែនាំ៖</strong> អ្នក​អាច​បិទ​ប្រើ​ក្រុម​រង​ដោយ​ការ​កំណត់​វា​ឲ្យ​មាន​តម្លៃ​ដូចគ្នា​នឹង​ <em>ក្រុម​អ្នកប្រើប្រាស់​សំខាន់</em> ។ <br /> <strong>ការណែនាំ៖</strong> វា​ជា​ការ​ល្អ​ក្នុង​ការ​បង្កើត <em>ក្រុម​កម្រិត​សិទ្ធិ</em> ជំនួស​ដោយ​ការ​ប្រើ <em>ក្រុម​អ្នកប្រើប្រាស់​រង</em> ។"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_CHILDS_TITLE = "រង​រួម​បញ្ចូល​ក្រុម​កូន៖"
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "ជ្រើសរើសក្រុមអ្នកប្រើប្រាស់ដែលត្រូវបានអនុញ្ញាតឱ្យប្រកាសប្រធានបទថ្មីក្នុងជំពូកនេះ។ ការកំណត់នេះមានឥទ្ធិពលតែលើអ្នកប្រើប្រាស់ដែលមានសិទ្ធិអានជំពូករួចហើយប៉ុណ្ណោះ។ ភ្ញៀវមិនអាចបង្កើតប្រធានបទថ្មីបានទេ លុះត្រាតែអ្នកបើក <em>Forum Configuration > Security & Moderation > Allow Guests to Post/Write</em>។ <br /><br /> <strong>ព័ត៌មានជំនួយ៖</strong> អ្នកអាចជ្រើសរើសច្រើនក្រុមដោយសង្កត់ប៊ូតុង <em>Ctrl</em> ឬ <em>Shift</em>។"
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_DESC = "ជ្រើសរើសក្រុមអ្នកប្រើប្រាស់ដែលត្រូវបានអនុញ្ញាតឱ្យប្រកាសចម្លើយតបទៅប្រធានបទក្នុងជំពូកនេះ។ ការកំណត់នេះមានឥទ្ធិពលតែលើអ្នកប្រើប្រាស់ដែលមានសិទ្ធិអានជំពូករួចហើយប៉ុណ្ណោះ។ ភ្ញៀវមិនអាចឆ្លើយតបទៅប្រធានបទបានទេ លុះត្រាតែអ្នកបើក <em>Forum Configuration > Security & Moderation > Allow Guests to Post/Write</em>។ <br /><br /> <strong>ព័ត៌មានជំនួយ៖</strong> អ្នកអាចជ្រើសរើសច្រើនក្រុមដោយសង្កត់ប៊ូតុង <em>Ctrl</em> ឬ <em>Shift</em>។"

