PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Ereduaren irteeraren goiko muga (pentsamendua barne, pentsatzen duten ereduetan). Handitu erantzunak erdibitan geratzen badira."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Gehieneko itxaronaldia ilaran (ordu)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Denbora hau igaro ondoren oraindik zain dauden gaiak (adib. hornitzailearen etenaldi baten ondoren) saltatu egiten dira: egun batzuk geroago emandako erantzuna arraroa litzateke. 0: mugarik gabe."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pausa kontu-erroreen ondoren (minutu)"
