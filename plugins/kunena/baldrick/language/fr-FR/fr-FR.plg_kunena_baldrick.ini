PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, le premier répondant IA du forum : il répond aux nouveaux sujets et aux sujets relancés après un long silence lorsqu'aucun administrateur ou modérateur n'a répondu, via les API compatibles Anthropic ou OpenAI. <strong>Confidentialité :</strong> le texte des sujets traités (et des sujets publics liés) est envoyé au fournisseur d'IA que vous configurez ; mentionnez-le dans votre politique de confidentialité. Activité, totaux et coûts : Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Étape 1 : modèle de tri (petit, économique)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Lit d'abord chaque nouvelle question : l'évalue (réponse possible, trop générale, détails manquants, pas une question, spam) et rédige les requêtes de recherche des sujets liés. Un petit modèle rapide suffit."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Étape 2 : modèle de réponse (plus performant)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Rédige la réponse aux questions claires, à partir du sujet et des sujets publics liés trouvés dans le forum. Il peut utiliser la connexion de l'étape 1 avec un autre modèle, ou une connexion propre."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Quand Baldrick répond"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick examine chaque nouveau sujet, les réponses de l'auteur du sujet à Baldrick (une conversation), et les réponses aux sujets restés silencieux plus longtemps que le nombre de jours indiqué ci-dessous. Il ne répond jamais lorsque le dernier message émane d'un administrateur ou d'un modérateur."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Comment Baldrick répond"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Les réponses sont publiées immédiatement sous l'identité de Baldrick, en BBCode du forum. Les liens vers les sujets du forum sont relatifs."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Lorsque le modèle de tri est sûr qu'un message est du spam (publicité, numéros de téléphone, liens SEO...), Baldrick le dépublie : tout le sujet lorsqu'il s'agit du premier message. Les messages dépubliés attendent la modération ; une erreur se corrige donc en les approuvant."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notifications"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Un e-mail en texte brut est envoyé par les réglages de messagerie de Joomla, avec le premier message du sujet et ses 5 derniers messages, du plus récent au plus ancien. Les actions anti-spam et les erreurs (un sujet abandonné par Baldrick, une pause parce que le fournisseur d'IA refuse ses requêtes) sont toujours notifiées. Le résultat de chaque e-mail figure dans le journal d'activité."

PLG_KUNENA_BALDRICK_PROVIDER = "Type d'API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "API Messages d'Anthropic (Claude, et points d'accès compatibles Anthropic comme ceux de Qwen), ou Chat Completions compatible OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Compatible Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Compatible OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL de base"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Laisser vide pour l'API officielle (https://api.anthropic.com ou https://api.openai.com/v1). Exemples pour Qwen Cloud : https://token-plan.maas.qwencloudapi.com/apps/anthropic (compatible Anthropic) ou https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (compatible OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Vide : l'API officielle"
PLG_KUNENA_BALDRICK_API_KEY = "Clé d'API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "La clé d'API du fournisseur. Baldrick ne fait rien tant qu'une clé et les modèles ne sont pas définis."
PLG_KUNENA_BALDRICK_MODEL = "Modèle"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modèle de l'étape de tri, par exemple claude-haiku-5-5. &quot;Récupérer les modèles&quot; liste les modèles du fournisseur avec les valeurs ci-dessus (enregistrées ou non) dans une liste consultable (conservée une heure ; &quot;Actualiser&quot; interroge à nouveau) ; vous pouvez aussi saisir un nom. &quot;Tester&quot; envoie une petite requête au modèle."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modèle de l'étape de réponse, par exemple claude-sonnet-5-5 (ou claude-opus-5-5 pour les meilleures réponses). &quot;Récupérer les modèles&quot; liste les modèles du fournisseur ; vous pouvez aussi saisir un nom. &quot;Tester&quot; envoie une petite requête au modèle."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Récupérer les modèles"
PLG_KUNENA_BALDRICK_TEST = "Tester"
PLG_KUNENA_BALDRICK_WORKING = "Traitement en cours..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Choisir un modèle -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "La requête a échoué."
PLG_KUNENA_BALDRICK_PRICE_IN = "Tarif : entrée"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Tarif : sortie"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD par million de jetons, pour les estimations de coût. Vide : le tarif public des modèles Claude connus, sinon 0 (sauf si le fournisseur communique lui-même le coût)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Utiliser la connexion de l'étape 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Utilise le même type d'API, la même URL de base et la même clé que l'étape de tri (avec le modèle choisi ci-dessous). Choisissez Non pour utiliser un autre fournisseur pour les réponses."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic : repli en cas de refus"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Uniquement sur l'API d'Anthropic avec les modèles Opus et Sonnet 5.x : lorsque les contrôles de sécurité du modèle refusent une requête, l'API la relance sur un modèle de repli choisi par Anthropic (replis côté serveur). Non disponible pour Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Essai à blanc"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Pour tester la configuration : Baldrick ne répond que dans les sujets lancés par des administrateurs et des modérateurs (nouveaux sujets, et leurs suites adressées à Baldrick), et ne dépublie jamais de messages (le spam est seulement signalé)."
PLG_KUNENA_BALDRICK_USER = "Utilisateur de Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "L'utilisateur sous lequel Baldrick publie. Laissez vide pour qu'un utilisateur \"Baldrick\" soit créé automatiquement (pas de mot de passe utilisable, pas d'adresse e-mail réelle). Définissez son avatar et sa signature dans son profil du forum (un nouvel utilisateur reçoit la signature &quot;Réponse de Baldrick AI, mon seigneur, à l'aide d'un modèle astucieux (...et n'oubliez pas que l'IA peut se tromper, vérifiez donc bien les réponses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Relancer après (jours)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Une réponse à un sujet dont le message précédent est plus ancien que ce délai est traitée comme une nouvelle question."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Réponses par sujet"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Nombre de fois où Baldrick peut répondre dans le même sujet : sa première réponse, et ses réponses lorsque l'auteur du sujet lui répond (détails demandés, nouvelle question) ou que le sujet est relancé après un long silence."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Réponses par jour"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Au maximum ce nombre de réponses en 24 heures (0 : pas de limite). Protège votre budget d'API contre les afflux."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Longueur minimale d'un message"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Les messages plus courts que cette valeur (caractères, sans la mise en forme) sont ignorés."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Uniquement dans ces catégories"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Répondre uniquement dans ces catégories (aucune sélectionnée : toutes les catégories)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Jamais dans ces catégories"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Ne jamais répondre dans ces catégories."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Catégories publiques uniquement"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Répondre uniquement dans les catégories que les invités peuvent lire, afin qu'aucun contenu privé ne soit envoyé au fournisseur d'IA. Les sujets liés sont toujours pris dans les catégories publiques uniquement."

PLG_KUNENA_BALDRICK_TRANSLATE = "Ajouter une traduction anglaise"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick répond dans la langue de l'auteur. Avec cette option, les réponses dans d'autres langues sont suivies d'une traduction en anglais (utile pour une équipe et des lecteurs anglophones)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Sujets liés"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Nombre de sujets publics liés (trouvés avec les requêtes de recherche de l'étape de tri) transmis au modèle de réponse."
PLG_KUNENA_BALDRICK_PRESET = "Prompt maître intégré"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Les instructions dont part chaque réponse (lecture seule). Le contexte de votre site ci-dessous leur est ajouté."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Contexte du site"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Le sujet du forum, les produits et versions pris en charge, les liens vers la documentation, le ton à employer, ce que Baldrick ne doit jamais faire... Ajouté aux instructions des deux étapes (il aide aussi le modèle de tri à distinguer le spam des messages pertinents)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "par ex. Ceci est le forum d'assistance d'ExampleSoft. Nous prenons en charge les versions 3 et 4. La documentation se trouve à l'adresse https://docs.example.com. Ne promettez jamais de remboursement."
PLG_KUNENA_BALDRICK_CANNED = "Réponses types"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Réponses aux questions trop générales (aucune réponse IA n'est rédigée), et solutions de repli lorsqu'aucune réponse ne peut être rédigée. Séparez les réponses par une ligne de trois tirets (---) ; une est choisie au hasard. Marqueurs : {name} (l'auteur), {search_url} (recherche dans le forum pour la question), {forum_url}, {topic_url}. Le BBCode du forum est autorisé."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Que faire lorsque le modèle de tri est sûr qu'un message est du spam. Un e-mail est envoyé dans les deux premiers cas."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Dépublier (tout le sujet pour un premier message) et notifier"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Signaler seulement"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorer"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Fiable à partir de (messages)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Les messages des utilisateurs ayant au moins ce nombre de messages publiés, ainsi que ceux de l'équipe, ne sont jamais dépubliés : ils sont seulement signalés."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notifier ces membres de l'équipe"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Les Super Utilisateurs, administrateurs et modérateurs de Meela qui reçoivent les notifications (Ctrl/Cmd+clic pour en choisir plusieurs)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notifier pour"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Chaque réponse publiée par Baldrick (réponses, réponses types, demandes de détails) et le spam, ou seulement le spam. Les erreurs sont toujours notifiées."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Chaque réponse, le spam et les erreurs"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Seulement le spam et les erreurs"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notifier ces adresses"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "D'autres adresses e-mail, séparées par des virgules."

PLG_KUNENA_BALDRICK_PROCESSING = "Traitement"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatique : juste après l'envoi de la page qui a mis un sujet en file d'attente (avec PHP-FPM), ou par une requête en arrière-plan vers le site lui-même. Ligne de commande uniquement : lancez &quot;php cli/joomla.php kunena:baldrick:process&quot; depuis cron (Joomla 3.x UTD), par exemple chaque minute."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatique"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Ligne de commande uniquement (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Conserver le journal d'activité (jours)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Les lignes du journal d'activité plus anciennes que ce délai sont supprimées. Les totaux mensuels sont conservés pendant 36 mois."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avancé : traitement, limites et délais"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "La publication n'attend jamais l'IA : les sujets sont mis en file d'attente et traités en arrière-plan. Les erreurs réseau, les limitations de débit et les fournisseurs surchargés sont réessayés (dès que le fournisseur le permet), puis le sujet est réessayé plus tard (3 tentatives). Les erreurs de compte (clé invalide, crédits épuisés, modèle inconnu) mettent Baldrick en pause et notifient les destinataires ci-dessus."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Délai de connexion (secondes)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Durée d'attente de l'acceptation de la connexion par le fournisseur. Court, pour que les problèmes réseau apparaissent vite."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Délai de réponse du tri (secondes)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Durée d'attente de la réponse complète du modèle de tri (elle est courte)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Délai de réponse de la réponse (secondes)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Durée d'attente de la réponse complète du modèle de réponse. Les réponses ne sont pas diffusées en flux : cela couvre la rédaction de toute la réponse, et les modèles qui réfléchissent d'abord peuvent prendre une minute ou plus."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Nombre maximal de jetons du tri"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Nombre maximal de jetons de la réponse"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Limite supérieure de la sortie du modèle (y compris sa réflexion, pour les modèles qui réfléchissent). Augmentez-la si les réponses sont coupées."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Attente maximale dans la file (heures)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Les sujets qui attendent encore après ce délai (par exemple après une panne du fournisseur) sont ignorés : une réponse des jours plus tard serait étrange. 0 : pas de limite."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pause après des erreurs de compte (minutes)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Après une clé invalide, des crédits ou un quota épuisés, ou un modèle inconnu, Baldrick se met en pause (les sujets en attente patientent), envoie une seule fois un e-mail aux destinataires de notification, et réessaie après ce nombre de minutes jusqu'à ce que le fournisseur réponde. L'enregistrement de ces paramètres met fin à la pause."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Actualiser"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Afficher tous les modèles"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Inclure les modèles qui ne savent pas rédiger de réponses de conversation (embeddings, parole, images...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Saisissez pour rechercher les modèles"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Aucun modèle ne correspond"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Tarifs renseignés à partir de la liste du fournisseur."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Recherche simple : derniers messages recherchés"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Sans index de texte intégral (SQLite, ou avant que vous le créiez dans Meela > Baldrick AI), les sujets liés sont trouvés en lisant les messages, soit environ 2,5 secondes pour 50 000 messages : seuls ce nombre de messages les plus récents sont recherchés (0 : tous). Avec l'index, chaque message est recherché."
