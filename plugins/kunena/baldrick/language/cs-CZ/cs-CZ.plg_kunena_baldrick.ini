PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, první AI odpovídající na fóru: odpovídá v nových tématech a v tématech oživených po dlouhém tichu, pokud dosud neodpověděl administrátor ani moderátor, a používá API Anthropic nebo API kompatibilní s OpenAI. <strong>Soukromí:</strong> text témat, která zpracovává (a souvisejících veřejných témat), se odesílá vámi nastavenému poskytovateli AI; uveďte to ve svých zásadách ochrany osobních údajů. Aktivita, součty a náklady: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Krok 1: model třídění (malý, levný)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Nejprve přečte každou novou otázku: ohodnotí ji (lze zodpovědět, příliš obecná, chybí podrobnosti, není to otázka, spam) a sestaví hledací dotazy pro související témata. Stačí malý a rychlý model."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Krok 2: model pro odpovědi (výkonnější)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Píše odpovědi na jasné otázky s využitím tématu a souvisejících veřejných témat nalezených na fóru. Může použít připojení kroku 1 s jiným modelem, nebo vlastní připojení."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kdy Baldrick odpovídá"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick sleduje každé nové téma, odpovědi autora tématu Baldrickovi (konverzaci) a odpovědi v tématech, která byla tichá déle než uvedený počet dnů. Nikdy neodpoví, je-li poslední příspěvek od administrátora nebo moderátora."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Jak Baldrick odpovídá"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Odpovědi se zveřejňují okamžitě jako uživatel Baldrick, v BBCode fóra. Odkazy na témata fóra jsou relativní."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Je-li model třídění přesvědčen, že příspěvek je spam (reklama, telefonní čísla, SEO odkazy...), Baldrick jej zneveřejní: celé téma, je-li to první příspěvek. Zneveřejněné příspěvky čekají na moderaci, takže omyl se napraví jejich schválením."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Upozornění"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Prostý textový e-mail se odesílá přes nastavení pošty Joomla: první příspěvek tématu a jeho posledních 5 příspěvků, od nejnovějšího. Akce proti spamu a chyby (téma, které se Baldrick vzdal, pauza kvůli odmítání požadavků poskytovatelem AI) se vždy oznamují. Výsledek každého e-mailu je zobrazen v záznamu aktivity."

PLG_KUNENA_BALDRICK_PROVIDER = "Typ API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Messages API Anthropic (Claude a koncové body kompatibilní s Anthropic, například Qwen), nebo Chat Completions kompatibilní s OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Kompatibilní s Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Kompatibilní s OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Základní adresa URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Pro oficiální API nechte prázdné (https://api.anthropic.com nebo https://api.openai.com/v1). Příklady pro Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (kompatibilní s Anthropic) nebo https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (kompatibilní s OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Prázdné: oficiální API"
PLG_KUNENA_BALDRICK_API_KEY = "Klíč API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Klíč API poskytovatele. Baldrick nedělá nic, dokud nejsou nastaveny klíč a modely."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model kroku třídění, např. claude-haiku-5-5. &quot;Načíst modely&quot; vypíše modely poskytovatele s hodnotami výše (uloženými či nikoli) v prohledávatelném seznamu (uchová se hodinu; &quot;Obnovit&quot; načte znovu); můžete také zadat název. &quot;Test&quot; odešle modelu krátký požadavek."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model kroku odpovědi, např. claude-sonnet-5-5 (nebo claude-opus-5-5 pro nejlepší odpovědi). &quot;Načíst modely&quot; vypíše modely poskytovatele; můžete také zadat název. &quot;Test&quot; odešle modelu krátký požadavek."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Načíst modely"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Probíhá..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Vyberte model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Požadavek selhal."
PLG_KUNENA_BALDRICK_PRICE_IN = "Cena: vstup"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cena: výstup"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD za milion tokenů, pro odhad nákladů. Prázdné: ceníková cena známých modelů Claude, jinak 0 (pokud poskytovatel náklady sám neuvádí)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Použít připojení kroku 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Použít stejný typ API, základní adresu URL a klíč jako krok třídění (s modelem vybraným níže). Zvolte Ne, chcete-li pro odpovědi použít jiného poskytovatele."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: záložní model při odmítnutí"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Jen u vlastního API Anthropic s modely Opus/Sonnet 5.x: když bezpečnostní kontroly modelu požadavek odmítnou, API jej spustí znovu na záložním modelu, který vybere Anthropic (záložní modely na straně serveru). Pro Haiku nedostupné."

PLG_KUNENA_BALDRICK_DRY_RUN = "Zkušební režim"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Pro otestování nastavení: Baldrick odpovídá jen v tématech založených administrátory a moderátory (v nových tématech a v jejich navazujících příspěvcích pro Baldricka) a nikdy příspěvky nezneveřejňuje (spam se pouze nahlásí)."
PLG_KUNENA_BALDRICK_USER = "Uživatel Baldricka"
PLG_KUNENA_BALDRICK_USER_DESC = "Uživatel, pod kterým Baldrick přispívá. Nechte prázdné, aby se automaticky vytvořil uživatel &quot;Baldrick&quot; (bez použitelného hesla a skutečné e-mailové adresy). Jeho avatar a podpis nastavte v jeho profilu na fóru (nový uživatel dostane podpis &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Oživit po (dnech)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Odpověď v tématu, jehož předchozí příspěvek je starší než tato doba, se zpracuje jako nová otázka."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Odpovědí v tématu"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Kolikrát smí Baldrick odpovědět ve stejném tématu: jeho první odpověď a odpovědi, když mu autor tématu odpoví (vyžádané podrobnosti, další otázka), nebo když je téma oživeno po dlouhém tichu."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Odpovědí za den"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Nejvýše tolik odpovědí za 24 hodin (0: bez omezení). Chrání váš rozpočet API před nápory."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimální délka příspěvku"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Příspěvky kratší než tato délka (znaků bez formátování) se ignorují."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Pouze v těchto kategoriích"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Odpovídat pouze v těchto kategoriích (nic nevybráno: všechny kategorie)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nikdy v těchto kategoriích"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nikdy neodpovídat v těchto kategoriích."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Pouze veřejné kategorie"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Odpovídat jen v kategoriích, které mohou číst hosté, aby se poskytovateli AI neposílal žádný soukromý obsah. Související témata se vždy berou jen z veřejných kategorií."

PLG_KUNENA_BALDRICK_TRANSLATE = "Přidat anglický překlad"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick odpovídá v jazyce autora příspěvku. S touto volbou jsou odpovědi v jiných jazycích doplněny anglickým překladem (vhodné pro anglicky mluvící personál a čtenáře)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Související témata"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Kolik souvisejících veřejných témat (nalezených hledacími dotazy kroku třídění) se předá modelu pro odpovědi."
PLG_KUNENA_BALDRICK_PRESET = "Vestavěný hlavní prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Pokyny, ze kterých každá odpověď vychází (pouze ke čtení). Níže uvedený kontext vašeho webu se k nim přidá."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontext webu"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "O čem fórum je, které produkty a verze podporuje, odkazy na dokumentaci, jaký tón použít, co Baldrick nesmí nikdy dělat... Přidá se k pokynům obou kroků (pomáhá také modelu třídění odlišit spam od příspěvků k věci)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "např. Toto je podpůrné fórum ExampleSoft. Podporujeme verze 3 a 4. Dokumentace je na https://docs.example.com. Nikdy neslibujte vrácení peněz."
PLG_KUNENA_BALDRICK_CANNED = "Předpřipravené odpovědi"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Odpovědi na příliš obecné otázky (žádná odpověď AI se nepíše) a záložní odpovědi, když nelze odpověď napsat. Jednotlivé odpovědi oddělte řádkem tří pomlček (---); jedna se vybere náhodně. Zástupné symboly: {name} (autor příspěvku), {search_url} (hledání na fóru podle otázky), {forum_url}, {topic_url}. BBCode fóra je povoleno."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Co dělat, když si je model třídění jistý, že příspěvek je spam. E-mail se odešle v obou prvních případech."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Zneveřejnit (u prvního příspěvku celé téma) a upozornit"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Pouze nahlásit"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorovat"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Důvěryhodný po (příspěvcích)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Příspěvky uživatelů s alespoň tolika zveřejněnými příspěvky a příspěvky personálu se nikdy nezneveřejňují: pouze se nahlásí."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Upozornit tyto členy personálu"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Useři, administrátoři a moderátoři Meela, kteří dostávají upozornění (Ctrl/Cmd+klik pro výběr více osob)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Upozorňovat na"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Každou odpověď, kterou Baldrick zveřejní (odpovědi, předpřipravené odpovědi, žádosti o podrobnosti), a spam, nebo jen spam. Chyby se vždy oznamují."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Každou odpověď, spam a chyby"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Pouze spam a chyby"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Upozornit tyto adresy"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Další e-mailové adresy oddělené čárkami."

PLG_KUNENA_BALDRICK_PROCESSING = "Zpracování"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automaticky: ihned po odeslání stránky, která téma zařadila do fronty (s PHP-FPM), nebo požadavkem na pozadí na samotný web. Pouze příkazová řádka: spouštějte z cronu (Joomla 3.x UTD) příkaz &quot;php cli/joomla.php kunena:baldrick:process&quot;, např. každou minutu."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automaticky"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Pouze příkazová řádka (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Uchovávat aktivitu (dnů)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Záznamy aktivity starší než tato doba se smažou. Měsíční součty se uchovávají 36 měsíců."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Pokročilé: zpracování, limity a časové limity"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Přidávání příspěvků nikdy nečeká na AI: témata se řadí do fronty a zpracovávají na pozadí. Síťové chyby, limity rychlosti a přetížení poskytovatelé se opakují (jakmile to poskytovatel dovolí), poté se téma zkusí znovu později (3 pokusy). Chyby účtu (neplatný klíč, žádné kredity, neznámý model) pozastaví Baldricka a upozorní výše uvedené příjemce."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Časový limit připojení (sekundy)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Jak dlouho čekat, než poskytovatel přijme spojení. Krátký čas, aby se síťové problémy projevily rychle."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Časový limit odpovědi třídění (sekundy)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Jak dlouho čekat na úplnou odpověď modelu třídění (je krátká)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Časový limit odpovědi (sekundy)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Jak dlouho čekat na úplnou odpověď modelu pro odpovědi. Odpovědi se nestreamují: tento čas zahrnuje napsání celé odpovědi a modely, které nejprve přemýšlejí, mohou potřebovat minutu nebo déle."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Maximum tokenů třídění"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Maximum tokenů odpovědi"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Horní limit výstupu modelu (včetně jeho přemýšlení, u modelů, které přemýšlejí). Zvyšte jej, pokud se odpovědi useknou."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maximální čekání ve frontě (hodiny)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Témata, která čekají déle než tuto dobu (např. po výpadku poskytovatele), se přeskočí: odpověď o několik dní později by byla divná. 0: bez omezení."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pauza po chybách účtu (minuty)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Po neplatném klíči, vyčerpaných kreditech nebo kvótě či neznámém modelu se Baldrick pozastaví (témata ve frontě čekají), jednou pošle upozornění e-mailem příjemcům a po tolika minutách zkusí znovu, dokud poskytovatel neodpoví. Uložení těchto nastavení pauzu ukončí."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Obnovit"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Zobrazit všechny modely"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Zahrnout modely, které neumějí psát chatové odpovědi (embeddingy, řeč, obrázky...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Zadejte text pro hledání modelů"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Žádný odpovídající model"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Ceny doplněny ze seznamu poskytovatele."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Jednoduché hledání: prohledat posledních příspěvků"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Bez fulltextového indexu (SQLite, nebo dokud jej nevytvoříte v Meela > Baldrick AI) se související témata hledají čtením příspěvků, zhruba 2,5 sekundy na 50 000 příspěvků: prohledá se jen tolik nejnovějších příspěvků (0: všechny). S indexem se prohledají všechny příspěvky."
