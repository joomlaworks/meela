COM_KUNENA_A_HIGHLIGHTCODE_DESC = "Aktiverer Meelas java-skript for kodefremheving. Aktivering av dette vil fargemerke kode, om dine brukere poster php og lignende kodefragmenter innenfor kode-tagger. Om ditt forum ikke har behov for posting av slike koder vil du kanskje slå av funksjonen for å unngå at kode-tagger blir feilformet."
COM_KUNENA_A_HISTLIM = "Historiebegrensning"
