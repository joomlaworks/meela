PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Erantzunak gaiko"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Zenbat aldiz erantzun dezakeen Baldrick gai berean: bere lehen erantzuna, eta bere erantzunak gaiaren hasleak erantzuten dionean (eskatutako xehetasunak, beste galdera bat) edo gaia isilaldi luze baten ondoren berpizten denean."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Erantzunak egunean"
