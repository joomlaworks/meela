PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, 포럼의 AI 첫 응답자: Anthropic 또는 OpenAI 호환 API를 사용하여, 관리자나 모더레이터가 답하지 않은 새 주제와 오랫동안 잠잠했던 주제에 답합니다. <strong>개인정보:</strong> Baldrick이 처리하는 주제(및 관련 공개 주제)의 텍스트는 설정한 AI 제공자에게 전송됩니다. 개인정보 처리방침에 이를 명시하세요. 활동, 합계 및 비용: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1단계: 분류 모델(작고 저렴함)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "모든 새 질문을 먼저 읽고 등급을 매기며(답변 가능, 너무 포괄적, 세부 정보 부족, 질문 아님, 스팸) 관련 주제를 위한 검색 질의를 작성합니다. 작고 빠른 모델이면 충분합니다."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2단계: 답변 모델(더 성능이 좋은 모델)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "포럼에서 찾은 주제와 관련 공개 주제를 이용해 명확한 질문에 대한 답변을 작성합니다. 1단계의 연결을 다른 모델과 함께 쓰거나, 자체 연결을 쓸 수 있습니다."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Baldrick이 답하는 시점"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick은 모든 새 주제, 주제 작성자가 Baldrick에게 남긴 답글(대화), 그리고 아래 일수보다 오래 잠잠했던 주제에 대한 답글을 살펴봅니다. 마지막 게시물이 관리자나 모더레이터의 것이면 절대 답하지 않습니다."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Baldrick의 답변 방식"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "답변은 Baldrick 사용자로서 포럼 BBCode로 즉시 게시됩니다. 포럼 주제 링크는 상대 경로입니다."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "스팸"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "분류 모델이 게시물을 스팸(광고, 전화번호, SEO 링크 등)이라고 확신하면, Baldrick은 이를 비공개 처리합니다. 첫 게시물이면 주제 전체를 비공개 처리합니다. 비공개 게시물은 검토를 기다리므로, 승인하면 실수를 되돌릴 수 있습니다."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "알림"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Joomla의 메일 설정을 통해 일반 텍스트 이메일이 발송되며, 주제의 첫 게시물과 마지막 5개 게시물(최신순)이 포함됩니다. 스팸 조치와 오류(Baldrick이 포기한 주제, AI 제공자의 요청 거부로 인한 일시 중지)는 항상 알립니다. 각 이메일의 결과는 활동 기록에 표시됩니다."

