PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, prvi odzivnik foruma z umetno inteligenco: odgovarja na nove teme in na teme, obujene po dolgi tišini, ko noben skrbnik ali moderator ni odgovoril, z uporabo API-jev Anthropic ali združljivih z OpenAI. <strong>Zasebnost:</strong> besedilo tem, ki jih obdela (in sorodnih javnih tem), se pošlje ponudniku umetne inteligence, ki ga nastavite; omenite to v svoji politiki zasebnosti. Dejavnost, seštevki in stroški: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1. korak: model za razvrščanje (majhen, poceni)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Najprej prebere vsako novo vprašanje: oceni ga (mogoče odgovoriti, preširoko, manjkajo podrobnosti, ni vprašanje, neželeno) in napiše iskalne poizvedbe za sorodne teme. Zadošča majhen, hiter model."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2. korak: model za odgovore (zmogljivejši)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Napiše odgovor na jasna vprašanja s pomočjo teme in sorodnih javnih tem, najdenih na forumu. Lahko uporabi povezavo iz 1. koraka z drugim modelom ali svojo povezavo."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kdaj Baldrick odgovori"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick pregleda vsako novo temo, odgovore začetnika teme Baldricku (pogovor) in odgovore na teme, ki so bile tihe dlje od spodaj navedenega števila dni. Nikoli ne odgovori, če je zadnja objava od skrbnika ali moderatorja."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kako Baldrick odgovarja"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Odgovori se objavijo takoj kot uporabnik Baldrick, v BBCode foruma. Povezave do tem foruma so relativne."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Neželene objave"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Ko je model razvrščanja prepričan, da je objava neželena (oglaševanje, telefonske številke, povezave SEO...), jo Baldrick umakne: celotno temo, če je to prva objava. Umaknjene objave čakajo na moderiranje, zato se napaka popravi z odobritvijo."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Obvestila"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "E-sporočilo v navadnem besedilu se pošlje prek poštnih nastavitev Joomla, s prvo objavo teme in njenimi zadnjimi 5 objavami, najnovejše prve. O dejanjih z neželenimi objavami in napakah (tema, ki jo je Baldrick opustil, premor, ker ponudnik umetne inteligence zavrača njegove zahteve) se obvešča vedno. Rezultat vsakega e-sporočila je prikazan v dnevniku dejavnosti."

PLG_KUNENA_BALDRICK_PROVIDER = "Vrsta API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude in končne točke, združljive z Anthropic, kot je Qwen) ali Chat Completions, združljiv z OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Združljiv z Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Združljiv z OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Osnovni URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Pustite prazno za uradni API (https://api.anthropic.com ali https://api.openai.com/v1). Primera za Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (združljiv z Anthropic) ali https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (združljiv z OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Prazno: uradni API"
PLG_KUNENA_BALDRICK_API_KEY = "Ključ API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "Ključ API ponudnika. Baldrick ne počne ničesar, dokler ključ in modeli niso nastavljeni."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model koraka razvrščanja, npr. claude-haiku-5-5. &quot;Pridobi modele&quot; v iskalnem seznamu navede modele ponudnika z zgornjimi vrednostmi (shranjenimi ali ne) (hrani se eno uro; &quot;Osveži&quot; vpraša znova); ime lahko tudi vpišete. &quot;Preizkusi&quot; modelu pošlje drobno zahtevo."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model koraka odgovora, npr. claude-sonnet-5-5 (ali claude-opus-5-5 za najboljše odgovore). &quot;Pridobi modele&quot; navede modele ponudnika; ime lahko tudi vpišete. &quot;Preizkusi&quot; modelu pošlje drobno zahtevo."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Pridobi modele"
PLG_KUNENA_BALDRICK_TEST = "Preizkusi"
PLG_KUNENA_BALDRICK_WORKING = "Delam..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Izberite model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Zahteva ni uspela."
PLG_KUNENA_BALDRICK_PRICE_IN = "Cena: vhod"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cena: izhod"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD na milijon žetonov, za ocene stroškov. Prazno: cena iz cenika za znane modele Claude, sicer 0 (razen če ponudnik sam sporoči strošek)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Uporabi povezavo iz 1. koraka"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Uporabi isto vrsto API, osnovni URL in ključ kot korak razvrščanja (z modelom, izbranim spodaj). Izberite Ne, če želite za odgovore uporabiti drugega ponudnika."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: nadomestni model ob zavrnitvah"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Samo na API-ju Anthropic z modeli Opus/Sonnet 5.x: ko varnostni pregledi modela zahtevo zavrnejo, jo API znova požene na nadomestnem modelu, ki ga izbere Anthropic (nadomestni modeli na strežniku). Ni na voljo za Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Poskusni zagon"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Za preizkus konfiguracije: Baldrick odgovarja samo v temah, ki so jih začeli skrbniki in moderatorji (nove teme in njihovi nadaljnji odgovori Baldricku), in nikoli ne umakne objav (neželene se samo prijavijo)."
PLG_KUNENA_BALDRICK_USER = "Uporabnik Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Uporabnik, kot kateri Baldrick objavlja. Pustite prazno, da se uporabnik &quot;Baldrick&quot; ustvari samodejno (brez uporabnega gesla, brez pravega e-poštnega naslova). Avatar in podpis nastavite v njegovem profilu na forumu (novi uporabnik dobi podpis &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Obudi po (dneh)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Odgovor na temo, katere prejšnja objava je starejša od tega, se obravnava kot novo vprašanje."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Odgovorov na temo"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Kolikokrat lahko Baldrick odgovori v isti temi: njegov prvi odgovor in odgovori, ko mu začetnik teme odgovori (zahtevane podrobnosti, dodatno vprašanje) ali ko je tema obujena po dolgi tišini."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Odgovorov na dan"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Največ toliko odgovorov v 24 urah (0: brez omejitve). Varuje vaš proračun API pred poplavo."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Najmanjša dolžina objave"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Objave, krajše od tega (znaki, brez oblikovanja), se prezrejo."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Samo te kategorije"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Odgovarjaj samo v teh kategorijah (nobena izbrana: vse kategorije)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nikoli v teh kategorijah"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nikoli ne odgovarjaj v teh kategorijah."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Samo javne kategorije"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Odgovarjaj samo v kategorijah, ki jih gostje lahko berejo, da se ponudniku umetne inteligence ne pošlje zasebna vsebina. Sorodne teme se vedno vzamejo samo iz javnih kategorij."

PLG_KUNENA_BALDRICK_TRANSLATE = "Dodaj angleški prevod"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick odgovarja v jeziku avtorja. S to možnostjo odgovorom v drugih jezikih sledi angleški prevod (uporabno za angleško govoreče osebje in bralce)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Sorodne teme"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Koliko sorodnih javnih tem (najdenih z iskalnimi poizvedbami koraka razvrščanja) dobi model za odgovore."
PLG_KUNENA_BALDRICK_PRESET = "Vgrajeno glavno navodilo"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Navodila, s katerimi se začne vsak odgovor (samo za branje). Spodnji kontekst vašega spletišča se jim doda."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontekst spletišča"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "O čem je forum, podprti izdelki in različice, povezave do dokumentacije, ton, ki naj se uporablja, česa Baldrick ne sme nikoli storiti... Doda se pozivom obeh korakov (pomaga tudi modelu za razvrščanje razlikovati neželene objave od objav na temo)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "npr. To je forum za podporo ExampleSoft. Podpiramo različici 3 in 4. Dokumentacija je na https://docs.example.com. Nikoli ne obljubljajte povračil."
PLG_KUNENA_BALDRICK_CANNED = "Pripravljeni odgovori"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Odgovori na preširoka vprašanja (odgovor umetne inteligence se ne napiše) in nadomestni odgovori, ko odgovora ni mogoče napisati. Odgovore ločite z vrstico treh pomišljajev (---); eden se izbere naključno. Označbe mesta: {name} (avtor), {search_url} (iskanje po forumu za vprašanje), {forum_url}, {topic_url}. BBCode foruma je dovoljen."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Neželene objave"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Kaj storiti, ko je model za razvrščanje prepričan, da je objava neželena. E-sporočilo se pošlje v obeh prvih primerih."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Umakni (celotno temo za prvo objavo) in obvesti"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Samo obvesti"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Prezri"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Zaupanja vreden po (objavah)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Objave uporabnikov z vsaj toliko objavljenimi objavami in objave osebja se nikoli ne umaknejo: samo prijavijo se."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Obvesti te člane osebja"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, skrbniki in moderatorji Meela, ki prejemajo obvestila (Ctrl/Cmd+klik za izbiro več)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Obvesti o"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Vsak odgovor, ki ga Baldrick objavi (odgovori, pripravljeni odgovori, zahteve za podrobnosti), in neželene objave, ali samo neželene objave. O napakah se obvešča vedno."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Vsakem odgovoru, neželenih objavah in napakah"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Samo neželene objave in napake"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Obvesti te naslove"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Več e-poštnih naslovov, ločenih z vejicami."

PLG_KUNENA_BALDRICK_PROCESSING = "Obdelava"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Samodejno: takoj po tem, ko je poslana stran, ki je temo dodala v vrsto (s PHP-FPM), ali z zahtevo v ozadju na samo spletišče. Samo ukazna vrstica: zaženite &quot;php cli/joomla.php kunena:baldrick:process&quot; iz cron (Joomla 3.x UTD), npr. vsako minuto."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Samodejno"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Samo ukazna vrstica (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Hrani dnevnik dejavnosti (dni)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Vrstice dnevnika dejavnosti, starejše od tega, se izbrišejo. Mesečni seštevki se hranijo 36 mesecev."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Napredno: obdelava, omejitve in časovne omejitve"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Objavljanje nikoli ne čaka na umetno inteligenco: teme se dodajo v vrsto in obdelajo v ozadju. Omrežne napake, omejitve hitrosti in preobremenjeni ponudniki se poskusijo znova (takoj, ko ponudnik dovoli), nato se tema poskusi znova pozneje (3 poskusi). Napake računa (neveljaven ključ, ni kreditov, neznan model) Baldricka začasno ustavijo in obvestijo zgornje prejemnike."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Časovna omejitev povezave (sekunde)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Kako dolgo čakati, da ponudnik sprejme povezavo. Kratko, da se težave z omrežjem hitro pokažejo."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Časovna omejitev odgovora razvrščanja (sekunde)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Kako dolgo čakati na celoten odgovor modela za razvrščanje (je kratek)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Časovna omejitev odgovora (sekunde)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Kako dolgo čakati na celoten odgovor modela za odgovore. Odgovori se ne pretakajo: to zajema pisanje celotnega odgovora, modeli, ki najprej razmišljajo, pa lahko potrebujejo minuto ali več."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Največ žetonov razvrščanja"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Največ žetonov odgovora"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Zgornja meja izhoda modela (vključno z razmišljanjem pri modelih, ki razmišljajo). Povečajte, če so odgovori odrezani."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Največje čakanje v vrsti (ure)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Teme, ki po tem času še čakajo (npr. po izpadu ponudnika), se preskočijo: odgovor čez več dni bi bil čuden. 0: brez omejitve."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Premor po napakah računa (minute)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Po neveljavnem ključu, porabljenih kreditih ali kvoti ali neznanem modelu se Baldrick začasno ustavi (teme v vrsti čakajo), enkrat po e-pošti obvesti prejemnike obvestil in po toliko minutah poskusi znova, dokler ponudnik ne odgovori. S shranjevanjem teh nastavitev se premor konča."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Osveži"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Pokaži vse modele"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Vključi modele, ki ne morejo pisati odgovorov v pogovoru (vdelave, govor, slike...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Vpišite za iskanje modelov"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Noben model se ne ujema"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Cene so izpolnjene iz seznama ponudnika."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Navadno iskanje: iskane zadnje objave"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Brez polnobesedilnega indeksa (SQLite ali preden ga ustvarite v Meela > Baldrick AI) se sorodne teme najdejo z branjem objav, približno 2,5 sekunde na 50.000 objav: išče se samo po toliko zadnjih objavah (0: vse). Z indeksom se išče po vseh objavah."
