PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, ymatebwr cyntaf AI y fforwm: yn ateb pynciau newydd a phynciau a adfywiwyd ar ôl tawelwch hir pan nad oes gweinyddwr na chymedrolwr wedi ateb, gan ddefnyddio APIau cydnaws ag Anthropic neu OpenAI. <strong>Preifatrwydd:</strong> anfonir testun y pynciau y mae'n eu trin (a phynciau cyhoeddus cysylltiedig) at y darparwr AI a ffurfweddwch; soniwch am hyn yn eich polisi preifatrwydd. Gweithgarwch, cyfansymiau a chostau: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Cam 1: model didoli (bach, rhad)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Yn darllen pob cwestiwn newydd yn gyntaf: yn ei raddio (modd ei ateb, rhy eang, manylion ar goll, nid cwestiwn, sbam) ac yn ysgrifennu'r ymholiadau chwilio am bynciau cysylltiedig. Mae model bach, cyflym yn ddigon."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Cam 2: model ateb (mwy galluog)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Yn ysgrifennu'r ateb i gwestiynau clir, gan ddefnyddio'r pwnc a'r pynciau cyhoeddus cysylltiedig a ganfuwyd yn y fforwm. Gall ddefnyddio cysylltiad cam 1 gyda model arall, neu gysylltiad ei hun."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Pryd mae Baldrick yn ateb"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Mae Baldrick yn edrych ar bob pwnc newydd, ar atebion cychwynnwr y pwnc i Baldrick (sgwrs), ac ar atebion i bynciau a fu'n dawel am fwy na nifer y dyddiau isod. Nid yw byth yn ateb pan fo'r postiad olaf gan weinyddwr neu gymedrolwr."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Sut mae Baldrick yn ateb"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Cyhoeddir atebion ar unwaith fel defnyddiwr Baldrick, mewn BBCode fforwm. Mae cysylltau â phynciau fforwm yn berthynol."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Sbam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Pan fydd y model didoli yn hyderus bod postiad yn sbam (hysbysebion, rhifau ffôn, cysylltau SEO...), mae Baldrick yn ei ddad-gyhoeddi: pwnc cyfan pan mai'r postiad cyntaf ydyw. Mae postiadau heb eu cyhoeddi yn aros am gymedroli, felly mae camgymeriad yn cael ei ddadwneud drwy eu cymeradwyo."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Hysbysiadau"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Anfonir e-bost testun plaen drwy osodiadau post Joomla, gyda phostiad cyntaf y pwnc a'i 5 postiad olaf, y diweddaraf yn gyntaf. Hysbysir bob amser am weithredoedd sbam a gwallau (pwnc y rhoddodd Baldrick y gorau iddo, oedi am fod y darparwr AI yn gwrthod ei geisiadau). Dangosir canlyniad pob e-bost yn y log gweithgarwch."

PLG_KUNENA_BALDRICK_PROVIDER = "Math o API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, a phwyntiau terfyn cydnaws ag Anthropic fel rhai Qwen), neu Chat Completions cydnaws ag OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Cydnaws ag Anthropic (Messages API)"
