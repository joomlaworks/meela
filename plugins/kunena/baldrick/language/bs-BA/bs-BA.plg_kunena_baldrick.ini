PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Bez indeksa cijelog teksta (SQLite ili prije nego ga kreirate u Meela > Baldrick AI) srodne teme se pronalaze čitanjem objava, oko 2,5 sekunde na 50.000 objava: pretražuje se samo toliko posljednjih objava (0: sve). S indeksom se pretražuje svaka objava."
