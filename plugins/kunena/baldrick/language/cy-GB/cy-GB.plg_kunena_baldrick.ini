PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Ni chaiff postiadau defnyddwyr sydd â'r nifer hwn o leiaf o bostiadau cyhoeddedig, a'r staff, byth eu dad-gyhoeddi: dim ond eu hadrodd a wneir."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Hysbysu'r aelodau staff hyn"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, gweinyddwyr a chymedrolwyr Meela sy'n derbyn yr hysbysiadau (Ctrl/Cmd+clic i ddewis sawl un)."
