PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "تُحذف صفوف سجل النشاط الأقدم من هذا. تُحفظ المجاميع الشهرية لمدة 36 شهرا."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "متقدم: المعالجة والحدود والمهل"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "لا ينتظر النشر الذكاء الاصطناعي أبدا: تُوضع المواضيع في قائمة وتُعالج في الخلفية. تُعاد محاولة أخطاء الشبكة وحدود المعدل والمزودين المثقلين (حين يسمح المزود)، ثم يُعاد محاولة الموضوع لاحقا (3 محاولات). أخطاء الحساب (مفتاح غير صالح، لا رصيد، نموذج غير معروف) توقف Baldrick وتُبلغ المستلمين أعلاه."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "مهلة الاتصال (ثوان)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "المدة التي ينتظر فيها قبول المزود للاتصال. قصيرة حتى تظهر مشكلات الشبكة سريعا."
