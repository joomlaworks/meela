PLG_KUNENA_BALDRICK_PROCESSING = "Obrada"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatski: odmah nakon što je stranica koja je stavila temu u red poslana (s PHP-FPM-om), ili pozadinskim zahtjevom samoj stranici. Samo naredbeni redak: pokreni &quot;php cli/joomla.php kunena:baldrick:process&quot; iz crona (Joomla 3.x UTD), npr. svake minute."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatski"
