PLG_KUNENA_BALDRICK_PRICE_IN = "Cijena: ulaz"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cijena: izlaz"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD po milion tokena, za procjene troškova. Prazno: cjenovnik za poznate Claude modele, inače 0 (osim ako provajder sam prijavljuje trošak)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Koristi vezu iz koraka 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Koristi istu vrstu API-ja, osnovni URL i ključ kao korak razvrstavanja (s modelom odabranim ispod). Odaberite Ne da biste za odgovore koristili drugog provajdera."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: rezervni model pri odbijanju"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Samo na vlastitom API-ju Anthropic s modelima Opus/Sonnet 5.x: kada sigurnosne provjere modela odbiju zahtjev, API ga ponovo pokreće na rezervnom modelu koji bira Anthropic (rezervni modeli na strani servera). Nije dostupno za Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Probni rad"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Za testiranje konfiguracije: Baldrick odgovara samo u temama koje su započeli administratori i moderatori (nove teme i njihovi nastavci Baldricku) i nikada ne skida objave s objavljivanja (spam se samo prijavljuje)."
PLG_KUNENA_BALDRICK_USER = "Baldrickov korisnik"
PLG_KUNENA_BALDRICK_USER_DESC = "Korisnik kao kojeg Baldrick objavljuje. Ostavite prazno da se korisnik &quot;Baldrick&quot; kreira automatski (bez upotrebljive lozinke, bez prave e-mail adrese). Avatar i potpis postavite u njegovom forumskom profilu (novi korisnik dobiva potpis &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Oživi nakon (dana)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Odgovor na temu čija je prethodna objava starija od ovoga obrađuje se kao novo pitanje."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Odgovora po temi"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Koliko puta Baldrick smije odgovoriti u istoj temi: njegov prvi odgovor i odgovori kada mu autor teme odgovori (traženi detalji, dodatno pitanje) ili kada se tema oživi nakon duge šutnje."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Odgovora dnevno"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Najviše toliko odgovora u 24 sata (0: bez ograničenja). Štiti vaš API budžet od poplava."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimalna dužina objave"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Objave kraće od ovoga (znakova, bez formatiranja) se ignorišu."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Samo ove kategorije"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Odgovaraj samo u ovim kategorijama (ništa odabrano: sve kategorije)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nikada u ovim kategorijama"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nikada ne odgovaraj u ovim kategorijama."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Samo javne kategorije"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Odgovaraj samo u kategorijama koje gosti mogu čitati, tako da se nikakav privatni sadržaj ne šalje AI provajderu. Srodne teme se uvijek uzimaju samo iz javnih kategorija."

PLG_KUNENA_BALDRICK_TRANSLATE = "Dodaj prijevod na engleski"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick odgovara na jeziku autora objave. S ovom opcijom, odgovorima na drugim jezicima slijedi prijevod na engleski (korisno za osoblje i čitatelje koji govore engleski)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Srodne teme"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Koliko se srodnih javnih tema (pronađenih upitima za pretragu iz koraka razvrstavanja) daje modelu za odgovore."
PLG_KUNENA_BALDRICK_PRESET = "Ugrađeni glavni prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Upute od kojih počinje svaki odgovor (samo za čitanje). Kontekst vaše stranice ispod dodaje im se."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontekst stranice"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "O čemu je forum, podržani proizvodi i verzije, veze na dokumentaciju, ton koji treba koristiti, šta Baldrick nikada ne smije raditi... Dodaje se promptovima oba koraka (pomaže i modelu za razvrstavanje da razlikuje spam od objava na temu)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "npr. Ovo je forum za podršku kompanije ExampleSoft. Podržavamo verzije 3 i 4. Dokumentacija je na https://docs.example.com. Nikada ne obećavaj povrat novca."
PLG_KUNENA_BALDRICK_CANNED = "Gotovi odgovori"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Odgovori na preširoka pitanja (AI odgovor se ne piše) i rezervni odgovori kada se odgovor ne može napisati. Odvojite odgovore redom od tri crtice (---); jedan se bira nasumično. Rezervirana mjesta: {name} (autor objave), {search_url} (pretraga foruma za pitanje), {forum_url}, {topic_url}. BBCode foruma je dozvoljen."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
