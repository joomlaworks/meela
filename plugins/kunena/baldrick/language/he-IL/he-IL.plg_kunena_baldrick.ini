PLG_KUNENA_BALDRICK_MODEL = "מודל"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "מודל שלב המיון, למשל claude-haiku-5-5. &quot;הבא מודלים&quot; מציג את המודלים של הספק עם הערכים שלמעלה (שמורים או לא) ברשימה שניתנת לחיפוש (נשמרת לשעה; &quot;רענן&quot; מבקש שוב); אפשר גם להקליד שם. &quot;בדיקה&quot; שולחת בקשה קטנה למודל."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "מודל שלב התשובה, למשל claude-sonnet-5-5 (או claude-opus-5-5 לתשובות הטובות ביותר). &quot;הבא מודלים&quot; מציג את המודלים של הספק; אפשר גם להקליד שם. &quot;בדיקה&quot; שולחת בקשה קטנה למודל."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "הבא מודלים"
PLG_KUNENA_BALDRICK_TEST = "בדיקה"
