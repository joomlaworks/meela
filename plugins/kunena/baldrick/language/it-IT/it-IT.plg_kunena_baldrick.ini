PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, il primo rispondente IA del forum: risponde alle nuove discussioni e a quelle riattivate dopo un lungo silenzio quando nessun amministratore o moderatore ha risposto, usando API compatibili con Anthropic o OpenAI. <strong>Privacy:</strong> il testo delle discussioni che gestisce (e di quelle pubbliche correlate) viene inviato al fornitore di IA configurato; indicatelo nella vostra informativa sulla privacy. Attività, totali e costi: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Passo 1: modello di smistamento (piccolo, economico)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Legge per prima ogni nuova domanda: la valuta (risolvibile, troppo generica, dettagli mancanti, non una domanda, spam) e scrive le query di ricerca per le discussioni correlate. Basta un modello piccolo e veloce."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Passo 2: modello di risposta (più capace)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Scrive la risposta alle domande chiare, usando la discussione e le discussioni pubbliche correlate trovate nel forum. Può usare la connessione del passo 1 con un altro modello, oppure una connessione propria."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Quando Baldrick risponde"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick esamina ogni nuova discussione, le risposte di chi l'ha avviata a Baldrick (una conversazione) e le risposte alle discussioni rimaste silenziose per più giorni del valore indicato sotto. Non risponde mai quando l'ultimo messaggio è di un amministratore o di un moderatore."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Come risponde Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Le risposte vengono pubblicate subito con l'utente di Baldrick, in BBCode del forum. I link alle discussioni del forum sono relativi."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Quando il modello di smistamento è sicuro che un messaggio sia spam (pubblicità, numeri di telefono, link SEO...), Baldrick ne annulla la pubblicazione: l'intera discussione se è il primo messaggio. I messaggi non pubblicati attendono la moderazione, quindi un errore si corregge approvandoli."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notifiche"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Un'e-mail in testo semplice viene inviata tramite le impostazioni di posta di Joomla, con il primo messaggio della discussione e i suoi ultimi 5 messaggi, dal più recente. Le azioni antispam e gli errori (una discussione abbandonata da Baldrick, una pausa perché il fornitore di IA rifiuta le sue richieste) vengono sempre notificati. Il risultato di ogni e-mail è mostrato nel registro attività."

PLG_KUNENA_BALDRICK_PROVIDER = "Tipo di API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, e endpoint compatibili con Anthropic come quelli di Qwen), oppure Chat Completions compatibili con OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Compatibile con Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Compatibile con OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL di base"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Lasciare vuoto per l'API ufficiale (https://api.anthropic.com o https://api.openai.com/v1). Esempi per Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (compatibile con Anthropic) o https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (compatibile con OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Vuoto: l'API ufficiale"
PLG_KUNENA_BALDRICK_API_KEY = "Chiave API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "La chiave API del fornitore. Baldrick non fa nulla finché non vengono impostate una chiave e i modelli."
PLG_KUNENA_BALDRICK_MODEL = "Modello"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modello del passo di smistamento, ad es. claude-haiku-5-5. &quot;Recupera modelli&quot; elenca i modelli del fornitore con i valori qui sopra (salvati o no) in un elenco ricercabile (conservato per un'ora; &quot;Aggiorna&quot; chiede di nuovo); si può anche digitare un nome. &quot;Prova&quot; invia una piccola richiesta al modello."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modello del passo di risposta, per esempio claude-sonnet-5-5 (o claude-opus-5-5 per le risposte migliori). &quot;Recupera modelli&quot; elenca i modelli del fornitore; si può anche digitare un nome. &quot;Prova&quot; invia una piccola richiesta al modello."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Recupera modelli"
PLG_KUNENA_BALDRICK_TEST = "Prova"
PLG_KUNENA_BALDRICK_WORKING = "Elaborazione in corso..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Scegli un modello -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "La richiesta non è riuscita."
PLG_KUNENA_BALDRICK_PRICE_IN = "Prezzo: input"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Prezzo: output"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per milione di token, per le stime dei costi. Vuoto: il prezzo di listino dei modelli Claude noti, altrimenti 0 (salvo che il fornitore comunichi il costo)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Usa la connessione del passo 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Usa lo stesso tipo di API, URL di base e chiave del passo di smistamento (con il modello scelto qui sotto). Scegliere No per usare un altro fornitore per le risposte."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: ripiego in caso di rifiuto"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Solo sull'API di Anthropic con i modelli Opus e Sonnet 5.x: quando i controlli di sicurezza del modello rifiutano una richiesta, l'API la esegue di nuovo con un modello di ripiego scelto da Anthropic (ripieghi lato server). Non disponibile per Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Prova"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Per testare la configurazione: Baldrick risponde solo nelle discussioni avviate da amministratori e moderatori (nuove discussioni e i loro seguiti rivolti a Baldrick), e non annulla mai la pubblicazione dei messaggi (lo spam viene solo segnalato)."
PLG_KUNENA_BALDRICK_USER = "Utente di Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "L'utente con cui Baldrick pubblica. Lasciare vuoto per creare automaticamente un utente &quot;Baldrick&quot; (senza password utilizzabile né indirizzo e-mail reale). Impostare avatar e firma nel suo profilo del forum (a un nuovo utente viene assegnata la firma &quot;Risposto da Baldrick AI, mio signore, usando un modello astuto (...e ricordate che l'IA può sbagliare, quindi verificate le risposte)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Riattiva dopo (giorni)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Una risposta a una discussione il cui messaggio precedente è più vecchio di questo valore viene trattata come una nuova domanda."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Risposte per discussione"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Quante volte Baldrick può rispondere nella stessa discussione: la sua prima risposta, e le sue risposte quando chi ha avviato la discussione gli risponde (dettagli richiesti, un'altra domanda) o la discussione viene riattivata dopo un lungo silenzio."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Risposte al giorno"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Al massimo queste risposte in 24 ore (0: nessun limite). Protegge il budget API da raffiche di richieste."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Lunghezza minima del messaggio"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "I messaggi più brevi di questo valore (caratteri, senza formattazione) vengono ignorati."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Solo in queste categorie"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Rispondere solo in queste categorie (nessuna selezionata: tutte le categorie)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Mai in queste categorie"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Non rispondere mai in queste categorie."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Solo categorie pubbliche"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Rispondere solo nelle categorie che gli ospiti possono leggere, così nessun contenuto privato viene inviato al fornitore di IA. Le discussioni correlate vengono sempre prese solo dalle categorie pubbliche."

PLG_KUNENA_BALDRICK_TRANSLATE = "Aggiungi una traduzione in inglese"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick risponde nella lingua di chi scrive. Con questa opzione, alle risposte in altre lingue segue una traduzione in inglese (utile per uno staff e dei lettori di lingua inglese)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Discussioni correlate"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Quante discussioni pubbliche correlate (trovate con le query di ricerca del passo di smistamento) vengono fornite al modello di risposta."
PLG_KUNENA_BALDRICK_PRESET = "Prompt master integrato"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Le istruzioni da cui parte ogni risposta (sola lettura). Il contesto del sito qui sotto viene aggiunto a esse."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Contesto del sito"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Di cosa tratta il forum, prodotti e versioni supportati, link alla documentazione, il tono da usare, ciò che Baldrick non deve mai fare... Viene aggiunto ai prompt di entrambi i passi (aiuta anche il modello di smistamento a distinguere lo spam dai messaggi pertinenti)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "ad es. Questo è il forum di supporto di ExampleSoft. Supportiamo le versioni 3 e 4. La documentazione si trova su https://docs.example.com. Non promettere mai rimborsi."
PLG_KUNENA_BALDRICK_CANNED = "Risposte predefinite"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Risposte a domande troppo generiche (non viene scritta alcuna risposta IA) e risposte di riserva quando non è possibile scrivere una risposta. Separare le risposte con una riga di tre trattini (---); ne viene scelta una a caso. Segnaposto: {name} (l'autore), {search_url} (ricerca nel forum per la domanda), {forum_url}, {topic_url}. Il BBCode del forum è consentito."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "Cosa fare quando il modello di smistamento è sicuro che un messaggio sia spam. In entrambi i primi casi viene inviata un'e-mail."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Annulla la pubblicazione (l'intera discussione per un primo messaggio) e notifica"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Solo notifica"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignora"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Attendibile dopo (messaggi)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "I messaggi degli utenti con almeno questo numero di messaggi pubblicati, e quelli dello staff, non vengono mai annullati: vengono solo segnalati."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notifica questi membri dello staff"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Utenti, amministratori e moderatori di Meela che ricevono le notifiche (Ctrl/Cmd+clic per sceglierne più d'uno)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notifica per"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Ogni risposta pubblicata da Baldrick (risposte, risposte predefinite, richieste di dettagli) e lo spam, oppure solo lo spam. Gli errori vengono sempre notificati."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Ogni risposta, spam ed errori"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Solo spam ed errori"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notifica questi indirizzi"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Altri indirizzi e-mail, separati da virgole."

PLG_KUNENA_BALDRICK_PROCESSING = "Elaborazione"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatica: subito dopo l'invio della pagina che ha messo in coda una discussione (con PHP-FPM), oppure tramite una richiesta in background al sito stesso. Solo riga di comando: eseguire &quot;php cli/joomla.php kunena:baldrick:process&quot; da cron (Joomla 3.x UTD), per esempio ogni minuto."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatica"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Solo da riga di comando (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Conserva il registro attività (giorni)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Le righe del registro attività più vecchie di questo valore vengono eliminate. I totali mensili vengono conservati per 36 mesi."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avanzate: elaborazione, limiti e timeout"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "La pubblicazione non attende mai l'IA: le discussioni vengono messe in coda ed elaborate in background. Errori di rete, limiti di frequenza e fornitori sovraccarichi vengono ritentati (non appena il fornitore lo consente), poi la discussione viene ritentata più tardi (3 tentativi). Gli errori dell'account (chiave non valida, crediti esauriti, modello sconosciuto) mettono in pausa Baldrick e notificano i destinatari indicati sopra."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Timeout di connessione (secondi)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Quanto attendere che il fornitore accetti la connessione. Breve, così i problemi di rete si notano subito."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Timeout della risposta dello smistamento (secondi)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Quanto attendere la risposta completa del modello di smistamento (è breve)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Timeout della risposta (secondi)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Quanto attendere la risposta completa del modello di risposta. Le risposte non sono trasmesse in streaming: questo comprende la scrittura dell'intera risposta, e i modelli che ragionano prima possono richiedere un minuto o più."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Token massimi dello smistamento"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Token massimi della risposta"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Limite massimo dell'output del modello (incluso il suo ragionamento, per i modelli che ragionano). Aumentarlo se le risposte vengono troncate."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Attesa massima in coda (ore)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Le discussioni che attendono ancora dopo questo tempo (per esempio dopo un'interruzione del fornitore) vengono saltate: una risposta dopo giorni sarebbe strana. 0: nessun limite."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pausa dopo errori dell'account (minuti)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Dopo una chiave non valida, crediti o quota esauriti, o un modello sconosciuto, Baldrick si mette in pausa (le discussioni in coda attendono), invia una volta un'e-mail ai destinatari della notifica e riprova dopo questo numero di minuti finché il fornitore non risponde. Salvare queste impostazioni interrompe la pausa."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Aggiorna"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Mostra tutti i modelli"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Includi i modelli che non sanno scrivere risposte di chat (embedding, voce, immagini...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Digita per cercare i modelli"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Nessun modello corrisponde"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Prezzi compilati dall'elenco del fornitore."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Ricerca semplice: ultimi messaggi cercati"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Senza un indice full-text (SQLite, o prima di crearlo in Meela > Baldrick AI) le discussioni correlate vengono trovate leggendo i messaggi, circa 2,5 secondi ogni 50.000 messaggi: vengono cercati solo questi ultimi messaggi (0: tutti). Con l'indice viene cercato ogni messaggio."
