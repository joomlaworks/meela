PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "Изберете групите потребители, на които е разрешено да създават нова тема в тази категория. Тази настройка засяга само потребители, които вече имат достъп за четене до категорията. Гостите не могат да създават нови теми, освен ако не включите <em>Конфигурация на форума > Сигурност и модериране > Позволяване на гостите да публикуват/пишат</em>. <br /><br /> <strong>Подсказка:</strong> можете да изберете няколко групи, като държите <em>Ctrl</em> или <em>Shift</em>."
