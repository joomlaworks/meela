PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, foroaren lehen erantzule adimen artifiziala: gai berriei eta isilaldi luzearen ondoren berpiztutako gaiei erantzuten die, administratzaile edo moderatzailerik erantzun ez dienean, Anthropic edo OpenAI-rekin bateragarriak diren API-ak erabiliz. <strong>Pribatutasuna:</strong> tratatzen dituen gaien (eta erlazionatutako gai publikoen) testua zuk konfiguratutako AA hornitzaileari bidaltzen zaio; aipatu hori zure pribatutasun-politikan. Jarduera, guztizkoak eta kostuak: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1. urratsa: sailkatze-eredua (txikia, merkea)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Galdera berri bakoitza lehenik irakurtzen du: baloratu egiten du (erantzungarria, zabalegia, xehetasunak falta dira, ez da galdera bat, spama) eta erlazionatutako gaien bilaketa-kontsultak idazten ditu. Eredu txiki eta azkar batek aski du."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2. urratsa: erantzun-eredua (ahalmen handiagokoa)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Galdera argiei erantzuna idazten die, gaia eta foroan aurkitutako erlazionatutako gai publikoak erabiliz. 1. urratsaren konexioa erabil dezake beste eredu batekin, edo bere konexio propioa."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Noiz erantzuten duen Baldrick-ek"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick-ek gai berri bakoitza aztertzen du, gaiaren hasleak Baldrick-i egindako erantzunak (elkarrizketa), eta beheko egun kopurua baino denbora luzeagoz isilik egon diren gaien erantzunak. Ez du inoiz erantzuten azken mezua administratzaile edo moderatzaile batena denean."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Nola erantzuten duen Baldrick-ek"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Erantzunak berehala argitaratzen dira Baldrick-en erabiltzaile gisa, foroko BBCode-an. Foroko gaietarako estekak erlatiboak dira."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spama"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Sailkatze-ereduak mezu bat spama dela ziur dagoenean (publizitatea, telefono-zenbakiak, SEO estekak...), Baldrick-ek argitaratu gabe uzten du: gai osoa lehen mezua denean. Argitaratu gabeko mezuak moderazioaren zain geratzen dira, beraz akats bat onartuz desegiten da."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Jakinarazpenak"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Testu soileko e-posta bat bidaltzen da Joomla-ren posta-ezarpenen bidez, gaiaren lehen mezuarekin eta azken 5 mezuekin, berrienak lehenik. Spam-ekintzak eta erroreak (Baldrick-ek utzi duen gai bat, AA hornitzaileak bere eskaerak baztertzen dituelako pausa bat) beti jakinarazten dira. E-posta bakoitzaren emaitza jarduera-erregistroan ikusten da."

