PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, forumun süni intellektli ilk cavabverəni: heç bir administrator və ya moderator cavab verməyibsə, yeni mövzulara və uzun sükutdan sonra canlanan mövzulara Anthropic və ya OpenAI ilə uyğun API-lərdən istifadə edərək cavab yazır. <strong>Məxfilik:</strong> işlədiyi mövzuların (və əlaqəli açıq mövzuların) mətni sizin tənzimlədiyiniz AI provayderinə göndərilir; bunu məxfilik siyasətinizdə qeyd edin. Fəaliyyət, cəmlər və xərclər: Meela &gt; Baldrick AI."
