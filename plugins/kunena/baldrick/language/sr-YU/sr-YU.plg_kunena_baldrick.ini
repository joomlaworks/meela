PLG_KUNENA_BALDRICK_PRICE_IN = "Cena: ulaz"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Cena: izlaz"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD po milion tokena, za procene troškova. Prazno: cenovnik za poznate Claude modele, inače 0 (osim ako dobavljač sam prijavljuje trošak)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Koristi vezu iz koraka 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Koristi isti tip API-ja, osnovni URL i ključ kao korak razvrstavanja (sa modelom izabranim ispod). Izaberite Ne da biste za odgovore koristili drugog dobavljača."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: rezervni model pri odbijanju"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Samo na Anthropic-ovom API-ju sa Opus/Sonnet 5.x modelima: kada bezbednosne provere modela odbiju zahtev, API ga ponovo izvršava na rezervnom modelu koji bira Anthropic (rezervni modeli na strani servera). Nije dostupno za Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Proba"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Za testiranje podešavanja: Baldrick odgovara samo u temama koje su započeli administratori i moderatori (nove teme i njihovi nastavci Baldrick-u) i nikada ne uklanja poruke iz objavljenih (spam se samo prijavljuje)."
PLG_KUNENA_BALDRICK_USER = "Baldrick-ov korisnik"
PLG_KUNENA_BALDRICK_USER_DESC = "Korisnik kao koji Baldrick objavljuje. Ostavite prazno da se automatski napravi korisnik &quot;Baldrick&quot; (bez upotrebljive lozinke, bez prave adrese e-pošte). Sliku i potpis postavite u njegovom forumskom profilu (novi korisnik dobija potpis &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Oživi posle (dana)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Odgovor na temu čija je prethodna poruka starija od ovoga tretira se kao novo pitanje."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Odgovora po temi"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Koliko puta Baldrick sme da odgovori u istoj temi: njegov prvi odgovor i njegovi odgovori kada mu pokretač teme odgovori (traženi detalji, novo pitanje) ili kada se tema oživi posle dugog ćutanja."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Odgovora dnevno"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Najviše toliko odgovora u 24 sata (0: bez ograničenja). Štiti vaš API budžet od poplave."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimalna dužina poruke"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Poruke kraće od ovoga (znakova, bez formatiranja) se ignorišu."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Samo ove kategorije"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Odgovaraj samo u ovim kategorijama (nijedna izabrana: sve kategorije)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nikada u ovim kategorijama"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nikada ne odgovaraj u ovim kategorijama."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Samo javne kategorije"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Odgovaraj samo u kategorijama koje gosti mogu da čitaju, da se nikakav privatan sadržaj ne bi slao dobavljaču veštačke inteligencije. Srodne teme se uvek uzimaju samo iz javnih kategorija."

PLG_KUNENA_BALDRICK_TRANSLATE = "Dodaj prevod na engleski"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick odgovara na jeziku autora poruke. Sa ovom opcijom, odgovorima na drugim jezicima sledi prevod na engleski (korisno za osoblje i čitaoce koji govore engleski)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Srodne teme"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Koliko srodnih javnih tema (pronađenih upitima za pretragu iz koraka razvrstavanja) se daje modelu za odgovore."
PLG_KUNENA_BALDRICK_PRESET = "Ugrađeni glavni prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Uputstva od kojih polazi svaki odgovor (samo za čitanje). Kontekst vašeg sajta ispod im se dodaje."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Kontekst sajta"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "O čemu je forum, podržani proizvodi i verzije, veze ka dokumentaciji, ton koji treba koristiti, šta Baldrick nikada ne sme da radi... Dodaje se promptima oba koraka (pomaže i modelu za razvrstavanje da razlikuje spam od poruka na temu)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "npr. Ovo je forum za podršku ExampleSoft-a. Podržavamo verzije 3 i 4. Dokumentacija je na https://docs.example.com. Nikada ne obećavajte povraćaj novca."
PLG_KUNENA_BALDRICK_CANNED = "Gotovi odgovori"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Odgovori na pitanja koja su preširoka (ne piše se AI odgovor) i rezervni odgovori kada odgovor ne može biti napisan. Razdvojite odgovore redom od tri crtice (---); jedan se bira nasumično. Rezervisana mesta: {name} (autor poruke), {search_url} (pretraga foruma za pitanje), {forum_url}, {topic_url}. Dozvoljen je BBCode foruma."

