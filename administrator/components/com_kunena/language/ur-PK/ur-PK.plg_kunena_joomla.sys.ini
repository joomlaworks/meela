PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "ان صارف گروپس کو منتخب کریں جنہیں اس زمرے میں نیا موضوع پوسٹ کرنے کی اجازت ہے۔ یہ ترتیب صرف ان صارفین پر اثر انداز ہوتی ہے جنہیں پہلے سے زمرہ پڑھنے کی رسائی حاصل ہے۔ مہمان نئے موضوعات نہیں بنا سکتے جب تک آپ <em>مجلس کی تبدیلیاں > سیکیورٹی & اعتدال > مہمانوں کو پوسٹ کرنے/لکھنے کی اجازت دیں</em> فعال نہ کریں۔ <br /><br /> <strong>اشارہ:</strong> آپ <em>Ctrl</em> یا <em>Shift</em> بٹن دبائے رکھ کر کئی گروپس منتخب کر سکتے ہیں۔"
