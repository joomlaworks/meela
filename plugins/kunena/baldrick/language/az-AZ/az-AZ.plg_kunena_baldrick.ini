PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, forumun süni intellektli ilk cavabverəni: heç bir administrator və ya moderator cavab verməyibsə, yeni mövzulara və uzun sükutdan sonra canlanan mövzulara Anthropic və ya OpenAI ilə uyğun API-lərdən istifadə edərək cavab yazır. <strong>Məxfilik:</strong> işlədiyi mövzuların (və əlaqəli açıq mövzuların) mətni sizin tənzimlədiyiniz AI provayderinə göndərilir; bunu məxfilik siyasətinizdə qeyd edin. Fəaliyyət, cəmlər və xərclər: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "1-ci mərhələ: triaj modeli (kiçik, ucuz)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Hər yeni sualı əvvəlcə oxuyur: onu qiymətləndirir (cavablandırıla bilən, çox geniş, təfərrüat çatışmır, sual deyil, spam) və əlaqəli mövzular üçün axtarış sorğularını yazır. Kiçik, sürətli model kifayətdir."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "2-ci mərhələ: cavab modeli (daha güclü)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Aydın suallara cavabı mövzudan və forumda tapılan əlaqəli açıq mövzulardan istifadə edərək yazır. 1-ci mərhələnin qoşulmasından başqa modellə və ya öz qoşulması ilə işləyə bilər."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Baldrick nə vaxt cavab verir"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick hər yeni mövzuya, mövzunu açan şəxsin Baldrick-ə cavablarına (söhbət) və aşağıdakı gün sayından uzun müddət səssiz qalmış mövzulara yazılan cavablara baxır. Sonuncu ismarıc administrator və ya moderatordandırsa, heç vaxt cavab vermir."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Baldrick necə cavab verir"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Cavablar dərhal Baldrick istifadəçisi kimi, forum BBCode-u ilə yayımlanır. Forum mövzularına keçidlər nisbidir."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Triaj modeli ismarıcın spam olduğuna əmin olduqda (reklam, telefon nömrələri, SEO keçidləri...), Baldrick onu yayımdan götürür: ilk ismarıc olduqda bütün mövzunu. Yayımdan götürülmüş ismarıclar moderasiyanı gözləyir, buna görə səhvi təsdiqləməklə düzəltmək olar."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Bildirişlər"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Joomla-nın poçt tənzimləmələri ilə mövzunun ilk ismarıcı və sonuncu 5 ismarıcı ilə, ən yenisi əvvəldə, sadə mətnli e-poçt göndərilir. Spam əməliyyatları və xətalar (Baldrick-in əl çəkdiyi mövzu, AI provayderinin sorğularını rədd etməsi səbəbindən dayanma) həmişə bildirilir. Hər e-poçtun nəticəsi fəaliyyət jurnalında göstərilir."

