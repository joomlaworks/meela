COM_KUNENA_BALDRICK_MAIL_PAUSED_BODY = "Baldrick AI heeft zichzelf gepauzeerd omdat de AI-aanbieder zijn verzoeken heeft geweigerd met een fout die niet vanzelf verdwijnt:\n\n%s\n\nGebruikelijke oorzaken: een ongeldige of verlopen API-sleutel, geen tegoed of quotum meer, een model of basis-URL die niet bestaat.\n\nWachtende onderwerpen blijven bewaard. Baldrick probeert het elke %d minuten opnieuw en hervat zichzelf zodra de aanbieder antwoordt; het opslaan van de instellingen van de plug-in beëindigt de pauze meteen. Je krijgt geen nieuwe e-mail over deze pauze.\n\nActiviteit en instellingen: %s"
