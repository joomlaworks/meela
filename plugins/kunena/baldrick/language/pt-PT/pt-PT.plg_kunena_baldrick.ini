PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "O Baldrick, o primeiro respondente de IA do fórum: responde a tópicos novos e a tópicos reativados após um longo silêncio quando nenhum administrador ou moderador respondeu, usando APIs compatíveis com a Anthropic ou a OpenAI. <strong>Privacidade:</strong> o texto dos tópicos que processa (e dos tópicos públicos relacionados) é enviado ao fornecedor de IA que configurar; mencione-o na sua política de privacidade. Atividade, totais e custos: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Passo 1: modelo de triagem (pequeno, económico)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Lê primeiro cada pergunta nova: avalia-a (respondível, demasiado geral, faltam detalhes, não é uma pergunta, spam) e escreve as consultas de pesquisa de tópicos relacionados. Basta um modelo pequeno e rápido."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Passo 2: modelo de resposta (mais capaz)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Escreve a resposta a perguntas claras, usando o tópico e os tópicos públicos relacionados encontrados no fórum. Pode usar a ligação do passo 1 com outro modelo, ou uma ligação própria."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Quando o Baldrick responde"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "O Baldrick analisa cada tópico novo, as respostas de quem iniciou o tópico ao Baldrick (uma conversa) e as respostas a tópicos que estiveram em silêncio mais tempo do que o número de dias indicado abaixo. Nunca responde quando a última mensagem é de um administrador ou moderador."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Como o Baldrick responde"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "As respostas são publicadas de imediato com o utilizador do Baldrick, em BBCode do fórum. As ligações para tópicos do fórum são relativas."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Quando o modelo de triagem tem a certeza de que uma mensagem é spam (publicidade, números de telefone, ligações SEO...), o Baldrick despublica-a: o tópico inteiro, se for a primeira mensagem. As mensagens despublicadas aguardam moderação, por isso um erro corrige-se aprovando-as."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notificações"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "É enviado um e-mail de texto simples através das definições de correio do Joomla, com a primeira mensagem do tópico e as suas últimas 5 mensagens, da mais recente para a mais antiga. As ações contra spam e os erros (um tópico que o Baldrick abandonou, uma pausa porque o fornecedor de IA recusa os seus pedidos) são sempre notificados. O resultado de cada e-mail aparece no registo de atividade."

PLG_KUNENA_BALDRICK_PROVIDER = "Tipo de API"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, e pontos de acesso compatíveis com a Anthropic, como os da Qwen), ou Chat Completions compatível com OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Compatível com Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Compatível com OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "URL base"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Deixe vazio para a API oficial (https://api.anthropic.com ou https://api.openai.com/v1). Exemplos para o Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (compatível com Anthropic) ou https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (compatível com OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Vazio: a API oficial"
PLG_KUNENA_BALDRICK_API_KEY = "Chave de API"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "A chave de API do fornecedor. O Baldrick não faz nada até que uma chave e os modelos estejam definidos."
PLG_KUNENA_BALDRICK_MODEL = "Modelo"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Modelo da etapa de triagem, por exemplo claude-haiku-5-5. &quot;Obter modelos&quot; lista os modelos do fornecedor com os valores acima (guardados ou não) numa lista pesquisável (mantida durante uma hora; &quot;Atualizar&quot; volta a consultar); também pode escrever um nome. &quot;Testar&quot; envia um pedido pequeno ao modelo."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Modelo da etapa de resposta, por exemplo claude-sonnet-5-5 (ou claude-opus-5-5 para as melhores respostas). &quot;Obter modelos&quot; lista os modelos do fornecedor; também pode escrever um nome. &quot;Testar&quot; envia um pedido pequeno ao modelo."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Obter modelos"
PLG_KUNENA_BALDRICK_TEST = "Testar"
PLG_KUNENA_BALDRICK_WORKING = "A processar..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Escolha um modelo -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "O pedido falhou."
PLG_KUNENA_BALDRICK_PRICE_IN = "Preço: entrada"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Preço: saída"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD por milhão de tokens, para as estimativas de custo. Vazio: a tabela de preços dos modelos Claude conhecidos, senão 0 (a menos que o fornecedor indique o custo)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Usar a ligação do passo 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Usa o mesmo tipo de API, URL base e chave da etapa de triagem (com o modelo escolhido abaixo). Escolha Não para usar outro fornecedor nas respostas."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: alternativa em caso de recusa"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Apenas na API própria da Anthropic com os modelos Opus/Sonnet 5.x: quando as verificações de segurança do modelo recusam um pedido, a API volta a executá-lo com um modelo alternativo escolhido pela Anthropic (alternativas no servidor). Não disponível para o Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Teste"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Para testar a configuração: o Baldrick só responde em tópicos iniciados por administradores e moderadores (tópicos novos e os respetivos seguimentos dirigidos ao Baldrick), e nunca despublica mensagens (o spam é apenas denunciado)."
PLG_KUNENA_BALDRICK_USER = "Utilizador do Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "O utilizador com que o Baldrick publica. Deixe vazio para que seja criado automaticamente um utilizador \"Baldrick\" (sem palavra-passe utilizável nem e-mail real). Defina a imagem e a assinatura no perfil dele no fórum (um utilizador novo recebe a assinatura &quot;Respondido pelo Baldrick AI, meu senhor, com um modelo astuto (...e lembre-se de que a IA pode cometer erros, por isso verifique bem as respostas)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Reativar após (dias)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Uma resposta a um tópico cuja mensagem anterior seja mais antiga do que isto é tratada como uma pergunta nova."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Respostas por tópico"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Quantas vezes o Baldrick pode responder no mesmo tópico: a sua primeira resposta, e as suas respostas quando quem iniciou o tópico lhe responde (detalhes pedidos, uma nova pergunta) ou o tópico é reativado após um longo silêncio."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Respostas por dia"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "No máximo este número de respostas em 24 horas (0: sem limite). Protege o seu orçamento de API contra enxurradas."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Tamanho mínimo da mensagem"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "As mensagens mais curtas do que isto (caracteres, sem formatação) são ignoradas."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Apenas nestas categorias"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Responder apenas nestas categorias (nenhuma selecionada: todas as categorias)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Nunca nestas categorias"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Nunca responder nestas categorias."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Apenas categorias públicas"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Responder apenas em categorias que os visitantes podem ler, para que nenhum conteúdo privado seja enviado ao fornecedor de IA. Os tópicos relacionados são sempre obtidos apenas de categorias públicas."

PLG_KUNENA_BALDRICK_TRANSLATE = "Acrescentar uma tradução para inglês"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "O Baldrick responde na língua de quem escreve. Com esta opção, as respostas noutras línguas são seguidas de uma tradução para inglês (útil para uma equipa e leitores de língua inglesa)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Tópicos relacionados"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Quantos tópicos públicos relacionados (encontrados com as consultas de pesquisa da etapa de triagem) são enviados ao modelo de resposta."
PLG_KUNENA_BALDRICK_PRESET = "Prompt mestre incorporado"
PLG_KUNENA_BALDRICK_PRESET_DESC = "As instruções com que cada resposta começa (apenas leitura). O contexto do seu site, abaixo, é-lhes acrescentado."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Contexto do site"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Sobre o que trata o fórum, produtos e versões suportados, ligações para a documentação, o tom a usar, o que o Baldrick nunca deve fazer... É acrescentado aos prompts das duas etapas (ajuda também o modelo de triagem a distinguir o spam das mensagens sobre o tema)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "p. ex. Este é o fórum de suporte da ExampleSoft. Damos suporte às versões 3 e 4. A documentação está em https://docs.example.com. Nunca prometa reembolsos."
PLG_KUNENA_BALDRICK_CANNED = "Respostas predefinidas"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Respostas a perguntas demasiado gerais (não é escrita nenhuma resposta de IA) e alternativas quando não é possível escrever uma resposta. Separe as respostas com uma linha de três hífenes (---); é escolhida uma ao acaso. Marcadores: {name} (o autor), {search_url} (pesquisa no fórum pela pergunta), {forum_url}, {topic_url}. É permitido o BBCode do fórum."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "O que fazer quando o modelo de triagem tem a certeza de que uma mensagem é spam. Nos dois primeiros casos é enviado um e-mail."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Despublicar (o tópico inteiro, numa primeira mensagem) e notificar"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Apenas denunciar"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignorar"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Fiável após (mensagens)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "As mensagens de utilizadores com pelo menos este número de mensagens publicadas, e as da equipa, nunca são despublicadas: são apenas denunciadas."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notificar estes membros da equipa"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Utilizadores, administradores e moderadores do Meela que recebem as notificações (Ctrl/Cmd+clique para escolher vários)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notificar sobre"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Cada resposta publicada pelo Baldrick (respostas, respostas predefinidas, pedidos de detalhes) e o spam, ou apenas o spam. Os erros são sempre notificados."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Cada resposta, spam e erros"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Apenas spam e erros"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notificar estes endereços"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Mais endereços de e-mail, separados por vírgulas."

PLG_KUNENA_BALDRICK_PROCESSING = "Processamento"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automático: logo após o envio da página que colocou um tópico em fila (com PHP-FPM), ou por um pedido em segundo plano ao próprio site. Apenas linha de comandos: execute &quot;php cli/joomla.php kunena:baldrick:process&quot; a partir do cron (Joomla 3.x UTD), por exemplo a cada minuto."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automático"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Apenas pela linha de comandos (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Manter o registo de atividade (dias)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "As linhas do registo de atividade mais antigas do que isto são eliminadas. Os totais mensais são mantidos durante 36 meses."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Avançado: processamento, limites e tempos limite"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "A publicação nunca espera pela IA: os tópicos entram em fila e são processados em segundo plano. Os erros de rede, os limites de pedidos e os fornecedores sobrecarregados são repetidos (assim que o fornecedor o permitir) e depois o tópico é tentado mais tarde (3 tentativas). Os erros da conta (chave inválida, sem créditos, modelo desconhecido) põem o Baldrick em pausa e notificam os destinatários acima."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Tempo limite da ligação (segundos)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Quanto tempo esperar que o fornecedor aceite a ligação. Curto, para que os problemas de rede se vejam depressa."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Tempo limite da resposta da triagem (segundos)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Quanto tempo esperar pela resposta completa do modelo de triagem (é curta)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Tempo limite da resposta (segundos)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Quanto tempo esperar pela resposta completa do modelo de resposta. As respostas não são transmitidas em fluxo: isto inclui escrever a resposta inteira, e os modelos que raciocinam antes podem precisar de um minuto ou mais."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Máximo de tokens da triagem"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Máximo de tokens da resposta"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Limite máximo da saída do modelo (incluindo o seu raciocínio, nos modelos que raciocinam). Aumente-o se as respostas forem cortadas."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Espera máxima na fila (horas)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Os tópicos que ainda aguardem após este tempo (por exemplo, depois de uma avaria do fornecedor) são ignorados: uma resposta dias depois seria estranha. 0: sem limite."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pausa após erros de conta (minutos)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Após uma chave inválida, créditos ou quota esgotados, ou um modelo desconhecido, o Baldrick entra em pausa (os tópicos em fila aguardam), envia uma vez um e-mail aos destinatários da notificação e volta a tentar após este número de minutos até o fornecedor responder. Guardar estas definições termina a pausa."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Atualizar"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Mostrar todos os modelos"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Incluir os modelos que não sabem escrever respostas de chat (embeddings, voz, imagens...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Escreva para pesquisar os modelos"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Nenhum modelo corresponde"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Preços preenchidos a partir da lista do fornecedor."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Pesquisa simples: últimas mensagens pesquisadas"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Sem índice de texto integral (SQLite, ou antes de o criar em Meela > Baldrick AI), os tópicos relacionados são encontrados lendo as mensagens, cerca de 2,5 segundos por cada 50.000 mensagens: só estas últimas mensagens são pesquisadas (0: todas). Com o índice, pesquisa-se em todas as mensagens."
