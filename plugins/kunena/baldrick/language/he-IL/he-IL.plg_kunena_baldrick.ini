PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "מתקדם: עיבוד, מגבלות וזמני המתנה"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "הפרסום לעולם אינו ממתין ל-AI: נושאים מוכנסים לתור ומעובדים ברקע. שגיאות רשת, הגבלות קצב וספקים עמוסים מנוסים שוב (ברגע שהספק מאפשר), ואז הנושא מנוסה שוב מאוחר יותר (3 ניסיונות). שגיאות חשבון (מפתח לא תקף, אין קרדיטים, מודל לא מוכר) משהות את Baldrick ומודיעות לנמענים שלמעלה."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "זמן המתנה לחיבור (שניות)"
