COM_KUNENA_CREDITS_INTRO = "Meela پڕۆژەیەکی سەرچاوە کراوەیە کە پێویستی بە تەرخانکردن و وەبەرهێنانی کاتی کەسی چەندین بەشداربوو هەیە. ئەم وەشانە بەهۆی ئەم <a target=\"_blank\" href=\"%s\">بەشداربووانەوە</a> بەدی هاتووە :"
COM_KUNENA_CREDITS_THANKS = "تیمی Kunena دەیەوێت سوپاسی <a target=\"_blank\" href=\"%s\">کۆمەڵگا</a> بکات بۆ یارمەتی و پشتگیریی. هەروەها قەدرزانی کاری سەختی هەموو ئەوانە دەکەین کە Meela یان <a target=\"_blank\" href=\"%s\">وەرگێڕاوەتە</a> سەر زۆر زمانی دیکە. جگە لەمەش دەمانەوێت سوپاسی زۆر لە ئەندامانی <a target=\"_blank\" href=\"%s\">www.kunena.org</a> بکەین، ئێستا و پێشوو، کە <a target=\"_blank\" href=\"%s\">بەشداریان کردووە</a> و یارمەتیان داوە ئەمە ببێتە وەشانێکی جێگیرتر و بێ هەڵەتر."

