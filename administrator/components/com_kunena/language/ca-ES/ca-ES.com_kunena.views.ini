COM_KUNENA_A_RSS_TIMELIMIT_DESC = "Selecciona la quantitat de l´historial que deurà ser inclosa globalment als canals RSS. El valor per defecte és d'un mes, però es recomana limitar a una setmana als llocs d'alt volum."
COM_KUNENA_A_RSS_TYPE = "Tipus de fonts RSS"
