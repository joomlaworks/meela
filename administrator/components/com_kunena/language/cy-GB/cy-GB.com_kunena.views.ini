COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "Pa fathau o ffeiliau y gall aelodau eu hatodi: estyniadau mewn llythrennau bach, wedi'u gwahanu gan atalnodau (caiff bylchau eu dileu). Diofyn: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov. Ni chaniateir ffeiliau gweithredadwy a mathau o dudalennau gwe byth. Os gadewir yn wag, daw'r diofyn yn ôl wrth gadw."
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "Pa fathau MIME o ddelweddau a dderbynnir pan fydd &quot;Gwirio mathau MIME&quot; ymlaen: wedi'u gwahanu gan atalnodau, <strong>llythrennau bach</strong>. Diofyn: image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif. Os gadewir yn wag, daw'r diofyn yn ôl wrth gadw."
COM_KUNENA_A_IMAGEALLOWEDTYPES_DESC = "Pa fathau o ddelweddau y gall aelodau eu hatodi: estyniadau <strong>llythrennau bach</strong>, wedi'u gwahanu gan atalnodau (caiff bylchau eu dileu). Diofyn: jpg,jpeg,gif,png,webp,avif (WebP ac AVIF lle gall PHP y gweinydd eu prosesu). Os gadewir yn wag, daw'r diofyn yn ôl wrth gadw."
COM_KUNENA_A_IMGQUALITY_DESC = "Ansawdd delweddau JPEG, WebP ac AVIF wedi'u hailfeintio, 1 i 100: mae uwch yn golygu gwell ansawdd ond ffeiliau mwy. Diofyn: 50 (gwerthoedd cyffredin: 50-85). Caiff delweddau PNG a GIF eu hailfeintio heb golled."
