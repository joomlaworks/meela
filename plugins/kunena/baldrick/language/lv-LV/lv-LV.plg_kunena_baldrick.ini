PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "Vairāk e-pasta adrešu, atdalītas ar komatiem."

PLG_KUNENA_BALDRICK_PROCESSING = "Apstrāde"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automātiska: uzreiz pēc tam, kad ir nosūtīta lapa, kas tēmu ielika rindā (ar PHP-FPM), vai ar fona pieprasījumu pašai vietnei. Tikai komandrinda: palaidiet &quot;php cli/joomla.php kunena:baldrick:process&quot; no cron (Joomla 3.x UTD), piem., katru minūti."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automātiska"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Tikai komandrinda (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Glabāt aktivitātes žurnālu (dienas)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Aktivitātes žurnāla rindas, kas vecākas par šo, tiek dzēstas. Mēneša kopsummas tiek glabātas 36 mēnešus."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Papildus: apstrāde, ierobežojumi un laika ierobežojumi"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Ziņojuma publicēšana nekad negaida MI: tēmas tiek ievietotas rindā un apstrādātas fonā. Tīkla kļūdas, ātruma ierobežojumi un pārslogoti sniedzēji tiek mēģināti vēlreiz (tiklīdz sniedzējs ļauj), pēc tam tēma tiek mēģināta vēlreiz vēlāk (3 mēģinājumi). Konta kļūdas (nederīga atslēga, nav kredītu, nezināms modelis) aptur Baldrick un paziņo iepriekš norādītajiem saņēmējiem."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Savienojuma laika ierobežojums (sekundes)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "Cik ilgi gaidīt, līdz sniedzējs pieņem savienojumu. Īss, lai tīkla problēmas parādītos ātri."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Šķirošanas atbildes laika ierobežojums (sekundes)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "Cik ilgi gaidīt šķirošanas modeļa pilnu atbildi (tā ir īsa)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Atbildes gaidīšanas laika ierobežojums (sekundes)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "Cik ilgi gaidīt atbildes modeļa pilnu atbildi. Atbildes netiek straumētas: tas aptver visas atbildes uzrakstīšanu, un modeļiem, kas vispirms domā, var būt vajadzīga minūte vai ilgāk."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Šķirošanas maks. tokeni"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Atbildes maks. tokeni"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Modeļa izvades augšējā robeža (ieskaitot domāšanu modeļiem, kas domā). Palieliniet, ja atbildes tiek apcirstas."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maksimālā gaidīšana rindā (stundas)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Tēmas, kas pēc tik ilga laika (piem., pēc sniedzēja pārtraukuma) joprojām gaida, tiek izlaistas: atbilde pēc dažām dienām izskatītos dīvaini. 0: bez ierobežojuma."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Apturēt pēc konta kļūdām (minūtes)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "Pēc nederīgas atslēgas, izsmeltiem kredītiem vai kvotas vai nezināma modeļa Baldrick apstājas (rindā esošās tēmas gaida), vienreiz nosūta e-pastu paziņojumu saņēmējiem un mēģina vēlreiz pēc tik minūtēm, līdz sniedzējs atbild. Šo iestatījumu saglabāšana beidz apturēšanu."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Atsvaidzināt"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Rādīt visus modeļus"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Iekļaut modeļus, kas nevar rakstīt sarunas atbildes (iegulšana, runa, attēli...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Rakstiet, lai meklētu modeļus"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "Neviens modelis neatbilst"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Cenas aizpildītas no sniedzēja saraksta."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Vienkāršā meklēšana: pēdējie meklējamie ziņojumi"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Bez pilnteksta indeksa (SQLite vai pirms tā izveides sadaļā Meela > Baldrick AI) saistītās tēmas tiek atrastas, lasot ziņojumus, apmēram 2,5 sekundes uz 50 000 ziņojumu: tiek meklēts tikai tik pēdējos ziņojumos (0: visos). Ar indeksu tiek meklēts visos ziņojumos."
