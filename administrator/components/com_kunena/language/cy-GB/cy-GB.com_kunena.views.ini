COM_KUNENA_CFG_DEV_DISABLE_EMAIL_DESC="Ar gyfer gwefannau datblygu a phrofi: nid yw Meela yn anfon unrhyw e-byst o gwbl (tanysgrifiadau, adroddiadau, crybwylliadau, hysbysiadau Baldrick AI). Yn lle hynny caiff pob e-bost a fyddai wedi'i anfon ei ysgrifennu i log Meela. Nid yw e-byst Joomla ei hun (cofrestru, ailosod cyfrinair) yn cael eu heffeithio."
