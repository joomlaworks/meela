COM_KUNENA_A_FILEALLOWEDTYPES_DESC = "Кои типови датотеки можат да ги прикачуваат членовите: наставки со мали букви, одделени со запирки (празните места се бришат). Стандардно: txt,rtf,pdf,zip,tar.gz,tgz,tar.bz2,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,mp3,m4a,ogg,wav,flac,mp4,webm,mov. Извршни датотеки и типови веб-страници никогаш не се дозволени. Ако се остави празно, при зачувување се враќа стандардната вредност."
COM_KUNENA_A_IMAGEALLOWEDMIMETYPES_DESC = "Кои MIME типови на слики се прифатени кога е вклучено \"Проверувај MIME типови\": одделени со запирки, <strong>со мали букви</strong>. Стандардно: image/jpeg,image/jpg,image/gif,image/png,image/webp,image/avif. Ако се остави празно, при зачувување се враќа стандардната вредност."
