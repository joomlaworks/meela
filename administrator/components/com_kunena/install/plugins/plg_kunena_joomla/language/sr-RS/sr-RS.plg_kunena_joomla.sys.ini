PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "Изаберите групе корисника којима је дозвољено да објаве нову тему у овој категорији. Ова поставка утиче само на кориснике који већ имају приступ за читање категорије. Гости не могу да праве нове теме осим ако не укључите <em>Конфигурација форума > Безбедност & Модерација > Дозволи гостима да објављују/пишу</em>. <br /><br /> <strong>Савет:</strong> Можете изабрати више група држећи притиснуте тастере <em>Ctrl</em> или <em>Shift</em>."
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_DESC = "Изаберите групе корисника којима је дозвољено да одговарају на теме у овој категорији. Ова поставка утиче само на кориснике који већ имају приступ за читање категорије. Гости не могу да одговарају на теме осим ако не укључите <em>Конфигурација форума > Безбедност & Модерација > Дозволи гостима да објављују/пишу</em>. <br /><br /> <strong>Савет:</strong> Можете изабрати више група држећи притиснуте тастере <em>Ctrl</em> или <em>Shift</em>."

