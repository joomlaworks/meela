PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Jokaisesta vastauksesta, jonka Baldrick kirjoittaa (vastaukset, valmiit vastaukset, lisätietopyynnöt) ja roskapostista, tai vain roskapostista. Virheistä ilmoitetaan aina."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Jokaisesta vastauksesta, roskapostista ja virheistä"
