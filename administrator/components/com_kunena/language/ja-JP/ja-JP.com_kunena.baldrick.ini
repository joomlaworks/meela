COM_KUNENA_BALDRICK = "Baldrick AI"
COM_KUNENA_BALDRICK_DESC = "Baldrickはフォーラムの最初のAI応答者です。管理者もモデレータも返信していない新しいトピックと、長く放置された後に再び動き出したトピックに返信します。まず小型のモデルが各質問を仕分けます。明確な質問には、関連する公開トピックを使ってより高性能なモデルが回答します。範囲の広い質問には定型返信を、スパムには非公開化の処理を行います。"
