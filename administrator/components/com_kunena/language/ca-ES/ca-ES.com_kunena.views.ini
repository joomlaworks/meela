COM_KUNENA_A_CATEGORY_SUBSCRIPTIONS = "Categories subscrites"
COM_KUNENA_A_CATEGORY_SUBSCRIPTIONS_DESC = "Aquesta opció requereix <em>Permetre subscripcions=Si</em>. Si està a <em>Envia Nous Temes</em>, els missatges de correu electrònic només seran enviats a subscriptors de categoria quan es creïn nous temes, els usuaris no rebran actualitzacions dels temes a menys que es subscriguin als temes de forma individual. Si s'estableix a <em>Envia Nous Missatges</em>, els missatges de correu electrònic s'enviaran per tots els nous temes publicats en les categories que els usuaris estiguin subscrits."
