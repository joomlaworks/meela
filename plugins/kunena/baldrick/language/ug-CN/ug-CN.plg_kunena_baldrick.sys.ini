PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick، مۇنبەرنىڭ سۈنئىي ئىدراكلىق تۇنجى جاۋاب بەرگۈچىسى: ھېچقانداق باشقۇرغۇچى ياكى مودېراتور جاۋاب بەرمىگەندە يېڭى تېمىلارغا ۋە ئۇزۇن جىمجىتلىقتىن كېيىن قايتا جانلانغان تېمىلارغا Anthropic ياكى OpenAI بىلەن ماسلاشقان API ئارقىلىق جاۋاب بېرىدۇ. <strong>مەخپىيەتلىك:</strong> ئۇ بىر تەرەپ قىلغان تېمىلارنىڭ (ۋە مۇناسىۋەتلىك ئاممىۋى تېمىلارنىڭ) تېكىستى سىز تەڭشىگەن سۈنئىي ئىدراك تەمىنلىگۈچىگە ئەۋەتىلىدۇ؛ بۇنى مەخپىيەتلىك سىياسىتىڭىزدە ئەسكەرتىڭ. پائالىيەت، جەمئىي سان ۋە چىقىملار: Meela &gt; Baldrick AI."
