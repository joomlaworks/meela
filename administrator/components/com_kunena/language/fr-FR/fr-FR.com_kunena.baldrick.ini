COM_KUNENA_BALDRICK_MAIL_PAUSED_BODY = "Baldrick AI s'est mis en pause lui-même, car le fournisseur d'IA a refusé ses requêtes avec une erreur qui ne disparaîtra pas d'elle-même :\n\n%s\n\nCauses habituelles : une clé d'API invalide ou expirée, plus de crédits ou de quota, un modèle ou une URL de base qui n'existe pas.\n\nLes sujets en attente sont conservés. Baldrick réessaie toutes les %d minutes et reprend tout seul dès que le fournisseur répond ; l'enregistrement des paramètres du plugin met fin à la pause immédiatement. Vous ne recevrez pas d'autre e-mail au sujet de cette pause.\n\nActivité et paramètres : %s"
