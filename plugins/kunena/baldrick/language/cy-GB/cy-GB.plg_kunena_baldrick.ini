PLG_KUNENA_BALDRICK_REQUEST_FAILED = "Methodd y cais."
PLG_KUNENA_BALDRICK_PRICE_IN = "Pris: mewnbwn"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Pris: allbwn"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD y filiwn o docynnau, ar gyfer yr amcangyfrifon cost. Gwag: y pris rhestr ar gyfer modelau Claude hysbys, fel arall 0 (oni bai bod y darparwr ei hun yn adrodd y gost)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Defnyddio cysylltiad cam 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Defnyddio'r un math o API, URL sylfaen ac allwedd â'r cam didoli (gyda'r model a ddewisir isod). Dewiswch Na i ddefnyddio darparwr arall ar gyfer yr atebion."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: dewis wrth gefn wrth wrthod"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Ar API Anthropic ei hun gyda modelau Opus/Sonnet 5.x yn unig: pan fydd gwiriadau diogelwch y model yn gwrthod cais, mae'r API yn ei redeg eto ar fodel wrth gefn a ddewisir gan Anthropic (dewisiadau wrth gefn ochr gweinydd). Ddim ar gael ar gyfer Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Rhediad prawf"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "Ar gyfer profi'r ffurfweddiad: dim ond mewn pynciau a ddechreuwyd gan weinyddwyr a chymedrolwyr y mae Baldrick yn ateb (pynciau newydd, a'u hatebion dilynol i Baldrick), ac nid yw byth yn dad-gyhoeddi postiadau (dim ond adrodd sbam a wneir)."
PLG_KUNENA_BALDRICK_USER = "Defnyddiwr Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "Y defnyddiwr y mae Baldrick yn postio fel ef. Gadewch yn wag i greu defnyddiwr &quot;Baldrick&quot; yn awtomatig (dim cyfrinair defnyddiadwy, dim cyfeiriad e-bost go iawn). Gosodwch ei avatar a'i lofnod yn ei broffil fforwm (mae defnyddiwr newydd yn cael y llofnod &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Adfywio ar ôl (dyddiau)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "Caiff ateb i bwnc y mae ei bostiad blaenorol yn hŷn na hyn ei drin fel cwestiwn newydd."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Atebion fesul pwnc"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "Sawl gwaith y caiff Baldrick ateb yn yr un pwnc: ei ateb cyntaf, a'i atebion pan fydd cychwynnwr y pwnc yn ei ateb (manylion y gofynnodd amdanynt, cwestiwn pellach) neu pan adfywir y pwnc ar ôl tawelwch hir."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Atebion y dydd"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "Y nifer hwn o atebion ar y mwyaf mewn 24 awr (0: dim terfyn). Yn amddiffyn cyllideb eich API rhag llifogydd."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Isafswm hyd postiad"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Anwybyddir postiadau byrrach na hyn (nodau, heb fformatio)."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Y categoriau hyn yn unig"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Atebwch yn y categoriau hyn yn unig (dim un wedi'i ddewis: pob categori)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Byth yn y categoriau hyn"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Peidiwch byth ag ateb yn y categoriau hyn."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Categoriau cyhoeddus yn unig"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Atebwch mewn categoriau y gall ymwelwyr eu darllen yn unig, fel na chaiff unrhyw gynnwys preifat ei anfon at y darparwr AI. Cymerir pynciau cysylltiedig o gategoriau cyhoeddus yn unig bob amser."

PLG_KUNENA_BALDRICK_TRANSLATE = "Ychwanegu cyfieithiad Saesneg"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Mae Baldrick yn ateb yn iaith y postiwr. Gyda'r opsiwn hwn, caiff atebion mewn ieithoedd eraill eu dilyn gan gyfieithiad Saesneg (defnyddiol i staff a darllenwyr Saesneg eu hiaith)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Pynciau cysylltiedig"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "Sawl pwnc cyhoeddus cysylltiedig (a ganfuwyd gyda chwestiynau chwilio'r cam didoli) a roddir i'r model ateb."
PLG_KUNENA_BALDRICK_PRESET = "Prif anogwr adeiledig"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Y cyfarwyddiadau y mae pob ateb yn dechrau ohonynt (darllen yn unig). Ychwanegir cyd-destun eich gwefan isod atynt."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Cyd-destun y wefan"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "Beth yw pwrpas y fforwm, cynhyrchion a fersiynau a gefnogir, cysylltau â dogfennaeth, y naws i'w defnyddio, beth na ddylai Baldrick ei wneud byth... Ychwanegir at anogwyr y ddau gam (mae hefyd yn helpu'r model didoli i wahaniaethu sbam oddi wrth bostiadau ar y pwnc)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "e.e. Fforwm cymorth ExampleSoft yw hwn. Rydym yn cefnogi fersiynau 3 a 4. Mae'r ddogfennaeth ar https://docs.example.com. Peidiwch byth ag addo ad-daliadau."
PLG_KUNENA_BALDRICK_CANNED = "Atebion parod"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Atebion i gwestiynau sy'n rhy eang (ni ysgrifennir ateb AI), a dewisiadau wrth gefn pan na ellir ysgrifennu ateb. Gwahanwch atebion gyda llinell o dair llinell doriad (---); dewisir un ar hap. Dalfannau: {name} (y postiwr), {search_url} (chwiliad fforwm am y cwestiwn), {forum_url}, {topic_url}. Caniateir BBCode y fforwm."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Sbam"
