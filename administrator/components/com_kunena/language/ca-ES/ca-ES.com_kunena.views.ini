COM_KUNENA_A_RSS_LIMIT = "Límit RSS"
COM_KUNENA_A_RSS_LIMIT_DESC = "També pots limitar el número d'elements dels teus canals RSS. Utilitza aixó si el límit de temps no és suficient. Es pot utilitzar amb ó sense un límit de temps.<br/>Usa 0 o deixa'l en blanc per no tenir cap límit."
