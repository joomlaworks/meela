PLG_KUNENA_BALDRICK_USER = "Baldrick-ов корисник"
PLG_KUNENA_BALDRICK_USER_DESC = "Корисник као који Baldrick објављује. Оставите празно да се аутоматски направи корисник &quot;Baldrick&quot; (без употребљиве лозинке, без праве адресе е-поште). Слику и потпис поставите у његовом форумском профилу (нови корисник добија потпис &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Оживи после (дана)"
