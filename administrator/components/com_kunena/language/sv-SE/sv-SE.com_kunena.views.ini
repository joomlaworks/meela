COM_KUNENA_A_POLL_TITLE = "Omröstnings inställningar"
COM_KUNENA_A_PUBWRITE = "Tillåt gäster att posta/skriva"
COM_KUNENA_A_PUBWRITE_DESC = "Sätt till <em>Ja</em> för att tillåta gästerna (icke registrerade användare t.ex. allmänheten) skriva / posta privilegier. Sätt till <em>Nej</em> för att tvinga gäståtkomst att vara läsbara."
COM_KUNENA_A_RANKING = "Ranking"
COM_KUNENA_A_RANKINGIMAGES = "Visa Rank"
COM_KUNENA_A_RANKINGIMAGES_DESC = "Välj <em> Titel</em> för endast visa rank titel. Välj <em>Bild</em>för att visa rank titel och rank bild. Välj <em>Användar Grupp</em>för att visa rank titel och användargruppnamn. Välj <em>Allt  ovanstående</em> för att visa rank titel, rank image och användargruppnamn. Välj <em>Rank efter CSS</em> för att visa rank titel och ikoner."
COM_KUNENA_A_RANKING_DESC = "Sätt till <em>Ja</em>, om du vill visa rang registrerade användare, baserat på antalet inlägg de gjort.<br /><strong>Notera: Du måste även aktivera <em>Visa användarstatistik</em> i <em>Användares</em> flik för att visa det.</strong>"
COM_KUNENA_A_RANKING_SETTINGS = "Ranking inställningar"
COM_KUNENA_A_RECAPTCHA_PRIVATEKEY = "Privat reCAPTCHA-nyckel"
COM_KUNENA_A_RECAPTCHA_PRIVATEKEY_DESC = "<a target='_blank' href='https://www.google.com/recaptcha/admin/create'/>Klicka här</a> för att få en privat reCAPTCHA-nyckel och ange den sedan i detta fält."
COM_KUNENA_A_RECAPTCHA_PUBLICKEY = "Publik reCAPTCHA-nyckel"
COM_KUNENA_A_RECAPTCHA_PUBLICKEY_DESC = "Fyll i din publika reCAPTCHA-nyckel i detta fält."
COM_KUNENA_A_RECAPTCHA_THEME = "reCAPTCHA-tema"
COM_KUNENA_A_RECAPTCHA_THEME_DESC = "Välj ett reCAPTCHA-tema."
COM_KUNENA_A_REGISTERED_ONLY = "Enbart registrerade användare"
COM_KUNENA_A_REG_ONLY_DESC = "Sätt till <em>Ja</em> kommer att begränsa all forum tillgångar till registrerade användare (se och posta). Sätt till <em>Nej</em> för att tillåta någon gäst (icke registrerade besökare) att minst se forumet. Se 'tillåt gäster att posta/skriva' för ytterligare gäst åtkomstkontroll."
COM_KUNENA_A_RSS = "Aktivera RSS feeds"
COM_KUNENA_A_RSS_ALLOW_HTML = "Återge HTML &amp; BBKod i RSS feeds"
COM_KUNENA_A_RSS_ALLOW_HTML_DESC = "Att tillåta HTML i RSS-flöden kan ses som ett hot mot säkerheten, eftersom hackare ibland försöker att smuggla onda javascript och bilder in i forum-inlägg.<br />Hur somhelst, har Meela en god säkerhet i denna fråga, och det rekommenderas att tillåta HTML i RSS-flöden för maximal användarupplevelse."
COM_KUNENA_A_RSS_AUTHOR_FORMAT = "Författare format"
COM_KUNENA_A_RSS_AUTHOR_FORMAT_DESC = "Välj att visa antingen författarnamn eller författarens e-post i RSS feeds."
COM_KUNENA_A_RSS_AUTHOR_IN_TITLE = "Föredra författare i titel"
COM_KUNENA_A_RSS_AUTHOR_IN_TITLE_DESC = "Välj om författaren också bör synas i RSS-objekt titlar."
COM_KUNENA_A_RSS_CACHE = "Caching interval"
COM_KUNENA_A_RSS_CACHE_DESC = "Hur många minuter mellan cache av RSS feed utgång. Välj '0' för att inaktivera cachening. <br />Vänligen se upp, lägre nummer kan påverka prestanda!"
COM_KUNENA_A_RSS_DESC = "RSS feed gör det möjligt för användare att ladda ner de senaste inläggen på sina skrivbord eller RSS-läsare applikation. Se <a href=&quot;http://www.rssreader.com&quot; target=&quot;_blank&quot;>rssreader.com</a> för ett exempel."
COM_KUNENA_A_RSS_EXCLUDED_CATEGORIES = "Uteslut kategorier"
COM_KUNENA_A_RSS_INCLUDED_CATEGORIES = "Inkludera kategorier"
COM_KUNENA_A_RSS_LIMIT = "RSS Begränsning"
COM_KUNENA_A_RSS_LIMIT_DESC = "Du kan också begränsa antalet artiklar i din RSS feeds. Använd detta, om tidsgränsen inte är tillräckligt. Kan användas med eller utan en tidsbegränsning.<br />Använd 0 eller lämna tom för att inte begränsa."
COM_KUNENA_A_RSS_OLD_TITLES = "Använd oldstyle titlar"
COM_KUNENA_A_RSS_OLD_TITLES_DESC = "<u>Nej</u> - Titlar kommer att hållas intakt, ser ut så här: \\'#post title#\\'<br /><u>Ja</u> - Titlar kommer att se ut så här: \\'Ämne: #post title# - Av: #author#\\'"
COM_KUNENA_A_RSS_SPEC = "RSS Specifikation"
COM_KUNENA_A_RSS_SPEC_DESC = "Ange ett anpassat format för alla rss feeds."
COM_KUNENA_A_RSS_TIMELIMIT = "RSS Historia (tidsgräns)"
COM_KUNENA_A_RSS_TIMELIMIT_DESC = "Välj hur mycket historia bör ingå i den globala RSS feeds. Standardinställningen är en månad, men det rekommenderas att begränsa det till en vecka på höga volyms webbplatser."
COM_KUNENA_A_RSS_TYPE = "RSS Feed typ"
COM_KUNENA_A_RSS_TYPE_DESC = "Välj mellan RSS feed typer.<br /><u>Post</u> - Visa de senaste inläggen från forumet.<br /><u>Ämne</u> - Visa de senaste ämnen från forumet (endast ämnen).<br /><u>Senaste ämnen</u> - Visa det senaste inlägget från nyligen uppdaterade ämnen."
COM_KUNENA_CONFIG_RSS_CHARACTERS_COUNT = "Begränsa Antalet tecken Per Artikel"
COM_KUNENA_CONFIG_RSS_CHARACTERS_COUNT_DESC = "Hur många ord skall varje post i feed innehålla?<br />Notera: Den här funktionen kan stänga av BBCode. De flesta feed läsare kan hantera detta."
COM_KUNENA_A_RSS_FEEDBURNER_URL = "URL till den enkla RSS-strömmens feed till FeedBurner."
COM_KUNENA_A_RSS_FEEDBURNER_URL_DESC = "Om du använder FeedBurner för din RSS, ange här hela URLen till din RSS på FeedBurner. http://feeds.feedburner.com/dinfeed . Notera att du kommer att behöva ställa in din feed på FeedBurner så att den pekar till feeden på din sida<br/>Lämna tomt om du inte använder FeedBurner."
COM_KUNENA_A_SECURITY = "Säkerhet"
COM_KUNENA_A_SECURITY_SETTINGS = "Säkerhetsinställning"
COM_KUNENA_A_SEND_EMAILS = "Skicka e-post till medlemmarna."
COM_KUNENA_A_SEND_EMAILS_DESC = "Välj om du vill skicka e-post till dina medlemmar. Detta val bör vara på om du inte bara testar funktionen."
COM_KUNENA_A_SHOWBANNEDREASON_PROFILE = "Visa bannlysnings orsak"
COM_KUNENA_A_SHOWBANNEDREASON_PROFILE_DESC = "Visa anledningen till att användaren har förbjudits i användarprofilen"
COM_KUNENA_A_SHOWMAIL = "Visa e-post"
COM_KUNENA_A_SHOWMAIL_DESC = "Sätt till <em>Nej</em> om du aldrig vill visa användarens e-postadress även för registrerade användare."
COM_KUNENA_A_SHOWNEW = "Visa nya inlägg"
COM_KUNENA_A_SHOWNEW_DESC = "Om satt till <em>Ja</em>, Meela kommer att visa användaren en indikator för forumen som innehåller nya inlägg och vilka inlägg som är nya sedan deras senaste besök."
COM_KUNENA_A_SIGNATURE = "Max. signatur längd"
COM_KUNENA_A_SIGNATURE_DESC = "Maximalt antal tillåtna tecken för användarens signatur."
COM_KUNENA_A_SUBJECTLENGTH = "Max. ämnes längd"
COM_KUNENA_A_SUBJECTLENGTH_DESC = "Maximum ämnesrad längd. Det högsta antalet som stöds av databasen är 255 tecken. Om din webbplats är konfigurerad att använda multi-byte-teckenuppsättningar som Unicode, UTF-8 eller non-ISO-8599-x, gör det maximala mindre med följande formel:<br /><tt>round_down(255/(maximal teckenuppsättnings storlek i byte per tecken))</tt><br /> Exempel: för UTF-8, för vilka max. tecken bite storlek per tecken är 4 bytes: 255/4=63."
COM_KUNENA_A_SUBSCRIPTIONS = "Tillåt prenumerationer"
COM_KUNENA_A_SUBSCRIPTIONS_DESC = "Sätt till <em>Ja</em> om du vill tillåta registrerade användare att prenumerera på ett ämne och ta emot e-postmeddelanden om nya inlägg"
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_RECIPIENT_COUNT = "E-posta till flera mottagare"
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_RECIPIENT_COUNT_DESC = "Om värdet > 1, skicka ett enda prenumerationsmail till flera mottagare. Genom att ange en relativt hög siffra förhindrar du att din sajt skickar för många e-brev om din web host begränsar mängden e-brev per sekund eller timma. En hög siffra förbättrar även prestandan då färre e-brev behöver skickas."
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_RECIPIENT_PRIVACY = "Skydd av E-postmottagarnas privatliv"
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_RECIPIENT_PRIVACY_DESC = "Används enbart om <em>E-posta till flera mottagare > 0</em>. Om alla på forumet känner varandra och du vill avslöja vem som är intresserad av ämnet kan du använda antingen  <em>TILL</em> eller <em>CC</em>. I alla andra fall bör forumet respekera sina användares privatliv och använda  <em>BCC</em>, då det är det enda val som döljer andra användares e-postadresser."
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_VISIBLE_ADDRESS = "Synlig e-postmottagare"
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_VISIBLE_ADDRESS_DESC = "Om ett enda prenumerationsmail skickas till mer än en mottagare och <em>Skydd av E-postmottagarnas anonymitet = Dölj andra mottagare (BCC)</em>, bör du ange en giltig e-postadress i detta fält.<br /><strong> Varning:</strong> denna address kommer att få all e-post som skickas av forumet. Om ingen e-postadress anges kan det hända att prenumerationsmail kommer att behandlas som spam."
COM_KUNENA_A_USE_SYSTEM_EMAILS = "Behandla som System Email"
COM_KUNENA_A_USE_SYSTEM_EMAILS_DESC = "När aktiverat, emails kommer endast sändas till användare vars Joomla konto är aktiverat till <em>Ta emot system emails</em>"
COM_KUNENA_A_TAHEIGHT = "Textarea höjd"
COM_KUNENA_A_TAHEIGHT_DESC = "Justera höjden på svaret/inläggs textinmatningsområdet för att matcha din mall"
COM_KUNENA_A_TAWIDTH = "Textarea bredd"
COM_KUNENA_A_TAWIDTH_DESC = "Justera bredden på svaret/inläggs textinmatningsområdet för att matcha din mall. <br />Ämnes emotikonens verktygsfält kommer att förpackas på två rader vid bredd <= 420 pixels"
COM_KUNENA_A_THANKYOU = "Aktivera tack funktionen"
COM_KUNENA_A_THANKYOU_DESC = "Sätt till <em>Ja</em> att möjliggöra för användarna att &quot;Tack&quot; meddelanden."
COM_KUNENA_A_THREADS = "Ämnen per sida"
COM_KUNENA_A_THREADS_DESC = "Antal ämne att visa per sida"
COM_KUNENA_A_TOPIC_SUBSCRIPTIONS = "Ämnesprenumerationer"
COM_KUNENA_A_TOPIC_SUBSCRIPTIONS_DESC = "This option requires <em>Allow Subscriptions = Yes</em>. If set to <em>Email First Update</em>, only one email will be sent to subscribers saying that there are new posts in that topic; users will not receive updates to those topics unless they log in and read the topics individually. If set to <em>Email Every Update</em>, emails will be posted for all new postings made in topics that users are subscribed to."
COM_KUNENA_A_TRIMLONGURLS = "Trim lång URLs"
COM_KUNENA_A_TRIMLONGURLSBACK = "Bakre delen av trimmed URLs"
COM_KUNENA_A_TRIMLONGURLSBACK_DESC = "Antal tecken för bakre delen av trimmed URLs. Trim långa URLs måste sättas till <em>Ja</em>."
COM_KUNENA_A_TRIMLONGURLSFRONT = "Främre delen av trimmed URLs"
COM_KUNENA_A_TRIMLONGURLSFRONT_DESC = "Antal tecken för främre delen av trimmed URLs. Trim långa URLs måste sättas till <em>Ja</em>."
COM_KUNENA_A_TRIMLONGURLS_DESC = "Sätt till <em>Ja</em> om du vill långa webbadresser skall justeras. Se URL trim fram och bak inställningar."
COM_KUNENA_A_UPLOADS = "Uppladdningar"
COM_KUNENA_A_USERNAME_DESC = "Sätt till <em>Ja</em> om du vill att användarnamn ska visas i stället för riktiga namn."
COM_KUNENA_A_USERS = "Användare"
COM_KUNENA_A_USERSTATS = "Visa användar statistik"
COM_KUNENA_A_USERSTATS_DESC = "Sätt till <em>Ja</em> för att visa användarstatistik likt användareinlägg och användaretyp (admin, moderator, användare, etc.)."
COM_KUNENA_A_USER_EDIT = "Användar redigering"
COM_KUNENA_A_USER_EDIT_DESC = "Sätt till <em>Ja</em> för att tillåta registrerade användare att redigera sina egna inlägg."
COM_KUNENA_A_USER_EDIT_TIME = "Användar redigerings tid"
COM_KUNENA_A_USER_EDIT_TIMEGRACE = "Användar redigerings frist tid"
COM_KUNENA_A_USER_EDIT_TIMEGRACE_DESC = "Standard 600 [sekunder], kan lagra en ändring på upp till 600 sekunder efter att redigeringslänken försvinner."
COM_KUNENA_A_USER_EDIT_TIME_DESC = "Sätt till 0 för obestämd tid, annars fönster i sekunder från inlägget eller senaste modifiering för att tillåta redigering."
COM_KUNENA_A_USER_KEYWORDS = "Tillåt användarnyckelord."
COM_KUNENA_A_USER_KEYWORDS_DESC = "Sätt <em>Ja</em> för att aktivera nyckelord för användare. Den har inställningen tillåter användare att lägga till deras egna nyckelord, som inte är synliga för andra användare."
COM_KUNENA_A_USER_MARKUP = "Visa redigerad markerad upp"
COM_KUNENA_A_USER_MARKUP_DESC = "Sätt till <em>Ja</em> om du vill att ett ändrat inlägg ska märkas upp med text som visar att inlägget ändrats av en användare och när."
COM_KUNENA_A_USER_RELATED = "Användarrelaterad"
COM_KUNENA_CACHING_SETTINGS = "Cacheinställningar"
COM_KUNENA_CATIMAGEPATH_LEGACY = "Kategory arv av bild sökväg"
COM_KUNENA_CATIMAGEPATH_LEGACY_DESC = "Kategory arv av bild sökväg. Det här är bildsökvägen används endast för kompabilitet med gamla mallar, denna inställning nu kan finnas i mallinställningar. Om du valt sökvägen som <em>kategori_bild</em>, den fulla sökvägen kommer att bli <em>your_html_rootfolder/media/kunena/category_images/</em>"
COM_KUNENA_CFG_ACCESS_COMPONENT_DESC = "Välj <em>Ja</em> för att tillåta direktåtkomst till <b>%s</b>-URLar. Du bör stänga av denna inställning, men endast efter ordentlig testning. Avstängning förbättrar SEO och skapar visst skydd mot spam-botar. <b>Varning:</b> Om du ser felmeddelande för <em>404 %s</em> när du valt <em>Nej</em>, kontrollera att Meela-menyn är korrekt inställd."
COM_KUNENA_CFG_CACHE = "Cachning"
COM_KUNENA_CFG_CACHE_DESC = "Välj för att spara innehåll i cache i Meela."
COM_KUNENA_CFG_CACHE_TIME = "Cachetid"
COM_KUNENA_CFG_CACHE_TIME_DESC = "Tid innan datat omcachas. Det här alternativet påverkar objekt såsom <em>Vem är online</em> och <em>Statistik</em> och ändrar endast innehållet när cachen går ut. För att behålla datat giltigt, rekommenderas att använda små värden, t ex 1-3 minuter."
COM_KUNENA_CFG_DEFAULT_SORT = "Meddelandesortering"
COM_KUNENA_CFG_DEFAULT_SORT_DESC = "Välj standard meddelandesortering vid visning av ett ämne. Den här inställningen kan överridas av användaren."
COM_KUNENA_CFG_FALLBACK_ENGLISH = "Använd Engelska på saknade strängar"
COM_KUNENA_CFG_FALLBACK_ENGLISH_DESC = "Använd Engelska om översättning saknas. Om satt till <em>Nej</em> eller om debugläge är påslaget, visas översättningsnycklar (COM_KUNENA_LANGUAGE_KEY) istället."
COM_KUNENA_CFG_LEGACY_URLS = "Stöd arv av URLs"
COM_KUNENA_CFG_LEGACY_URLS_DESC = "Välj Kunena-versionen för att aktivera stöd för gamla webbadresser från och med den versionen. Du har använt Kunena sedan version %s. Den här funktionen gör att alla gamla länkar till forumet fortsätter att fungera."
COM_KUNENA_CONFIG_LEGACY_URL_DEPRECATED_DESC = "<em><b>Stödet för gamla webbadresser tas bort i en framtida version. Kontrollera om du fortfarande behöver den här funktionen aktiverad.</b></em>"
COM_KUNENA_CFG_POST_DATEFORMAT = "Tidsformat meddelande"
COM_KUNENA_CFG_POST_DATEFORMAT_DESC = "Välj tidsformat för meddelanden som visas i forumet."
COM_KUNENA_CFG_POST_DATEFORMAT_HOVER = "Hover meddelandens tidsformat"
COM_KUNENA_CFG_POST_DATEFORMAT_HOVER_DESC = "Välj tidsformat, som visas när du hover på meddelandets tid."
COM_KUNENA_COM_A_ARTICLE_DISPLAY = "Välj hur artiklar skall visas som standard"
COM_KUNENA_COM_A_ARTICLE_DISPLAY_DESC = "Välj hur Joomla!-artiklar skall visas som standard i meddelanden"
COM_KUNENA_COM_A_BBCODE_IMG_SECURE = "Visa bilder med icke-standardiserade filtillägg"
