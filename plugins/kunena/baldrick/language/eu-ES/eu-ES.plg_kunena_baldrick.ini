PLG_KUNENA_BALDRICK_PRESET = "Barneko agindu nagusia"
PLG_KUNENA_BALDRICK_PRESET_DESC = "Erantzun guztiak hasten diren jarraibideak (irakurtzeko soilik). Beheko zure guneko testuingurua hauei gehitzen zaie."
