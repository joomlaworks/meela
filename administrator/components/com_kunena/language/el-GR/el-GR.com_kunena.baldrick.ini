COM_KUNENA_BALDRICK = "Baldrick AI"
COM_KUNENA_BALDRICK_DESC = "Ο Baldrick είναι ο πρώτος απαντών AI του φόρουμ: απαντά σε νέα θέματα και σε θέματα που αναβιώνουν μετά από μεγάλη σιωπή, όταν δεν έχει απαντήσει διαχειριστής ή συντονιστής. Ένα μικρό μοντέλο ταξινομεί πρώτα κάθε ερώτηση· οι σαφείς ερωτήσεις απαντώνται από ένα πιο ικανό μοντέλο με βάση σχετικά δημόσια θέματα, οι γενικές παίρνουν μια έτοιμη απάντηση, και το spam αποσύρεται."
