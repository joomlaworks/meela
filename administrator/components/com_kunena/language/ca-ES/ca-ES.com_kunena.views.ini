COM_KUNENA_A_KEYWORDS = "Habilita paraules clau en els temes"
COM_KUNENA_A_KEYWORDS_DESC = "Selecciona <em>Sí</em> per habilitar paraules clau. Aquesta característca permet als moderadors afegir paraules clau en els temes."
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT = "Temps de vida de Sessió"
COM_KUNENA_A_KUNENA_SESSION_TIMEOUT_DESC = "Per defecte aquest serà ajustat a 1800 [segons]. El temps de vida de la sesió (timeout) en segons serà similar al temps de vida de les sesions de Joomla. El temps de vida de les sesions és important per recalcular els drets d'accessos, mostra qui està connectat i per l'indicador de nous missatges. Una vegada expiri el període de sessió més enllà d'aquest temps, els drets d'accés i l'indicador de nous missatges seran restablerts."
