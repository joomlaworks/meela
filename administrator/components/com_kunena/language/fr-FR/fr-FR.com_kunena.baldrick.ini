COM_KUNENA_BALDRICK_PAUSED_NOTICE = "<strong>Baldrick AI est en pause</strong> depuis %s, car le fournisseur d'IA a refusé ses requêtes : <em>%s</em>. Les sujets en file d'attente patientent ; Baldrick réessaie toutes les quelques minutes et reprend tout seul dès que le fournisseur répond. Vérifiez la clé d'API, les crédits/quotas et les modèles dans <a href=\"%s\">ses paramètres</a> (l'enregistrement met fin à la pause immédiatement)."
