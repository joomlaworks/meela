PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick، یەکەمین وەڵامدەرەوەی AI ی فۆرۆم: وەڵامی بابەتە نوێیەکان و ئەو بابەتانە دەداتەوە کە دوای بێدەنگییەکی درێژ زیندوو بوونەتەوە کاتێک هیچ بەڕێوەبەرێک یان چاودێرێک وەڵامی نەداوەتەوە، بە بەکارهێنانی APIی گونجاو لەگەڵ Anthropic یان OpenAI. <strong>تایبەتێتی:</strong> دەقی ئەو بابەتانەی مامەڵەیان لەگەڵ دەکات (و بابەتە گشتییە پەیوەندیدارەکان) بۆ ئەو دابینکەری AI یە دەنێردرێت کە ڕێکی دەخەیت؛ لە سیاسەتی تایبەتێتیەکەتدا ئاماژەی پێ بکە. چالاکی، کۆی گشتی و تێچوون: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "هەنگاوی ١: مۆدێلی ڕیزکردن (بچووک، هەرزان)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "هەموو پرسیارێکی نوێ سەرەتا دەخوێنێتەوە: هەڵیدەسەنگێنێت (وەڵامدراوە، زۆر فراوان، وردەکاری کەمە، پرسیار نییە، سپام) و پرسیارەکانی گەڕان بۆ بابەتە پەیوەندیدارەکان دەنووسێت. مۆدێلێکی بچووک و خێرا بەسە."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "هەنگاوی ٢: مۆدێلی وەڵام (تواناتر)"
