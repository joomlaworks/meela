PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC = "Изберете корисничките групи на кои им е дозволено да објават нова тема во оваа категорија. Оваа поставка влијае само на корисниците што веќе имаат пристап за читање на категоријата. Гостите не можат да создаваат нови теми освен ако не вклучите <em>Конфигурација на форумот > Безбедност и модерација > Дозволи им на гостите да објавуваат/пишуваат</em>. <br /><br /> <strong>Совет:</strong> можете да изберете повеќе групи држејќи ги копчињата <em>Ctrl</em> или <em>Shift</em>."
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_DESC = "Изберете корисничките групи на кои им е дозволено да одговараат на тема во оваа категорија. Оваа поставка влијае само на корисниците што веќе имаат пристап за читање на категоријата. Гостите не можат да одговараат на теми освен ако не вклучите <em>Конфигурација на форумот > Безбедност и модерација > Дозволи им на гостите да објавуваат/пишуваат</em>. <br /><br /> <strong>Совет:</strong> можете да изберете повеќе групи држејќи ги копчињата <em>Ctrl</em> или <em>Shift</em>."

