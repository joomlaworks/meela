PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Без полнотекстового индекса (SQLite или пока вы его не создали в Meela > Baldrick AI) связанные темы находятся чтением сообщений, около 2,5 секунды на 50 000 сообщений: ищется только столько последних сообщений (0: все). С индексом ищутся все сообщения."
