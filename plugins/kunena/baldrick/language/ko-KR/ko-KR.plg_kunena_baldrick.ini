PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "답변 모델이 전체 답변을 마칠 때까지 기다리는 시간입니다. 답변은 스트리밍되지 않습니다: 이 시간에는 답변 전체를 작성하는 시간이 포함되며, 먼저 생각하는 모델은 1분 이상 걸릴 수 있습니다."
