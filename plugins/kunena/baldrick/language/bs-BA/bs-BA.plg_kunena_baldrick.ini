PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, AI prvi odgovarač foruma: odgovara na nove teme i na teme oživljene nakon duge šutnje kada nijedan administrator ili moderator nije odgovorio, koristeći API-je Anthropic ili kompatibilne s OpenAI. <strong>Privatnost:</strong> tekst tema koje obrađuje (i srodnih javnih tema) šalje se AI provajderu kojeg podesite; navedite to u svojoj politici privatnosti. Aktivnost, zbirovi i troškovi: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Korak 1: model za razvrstavanje (mali, jeftin)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Prvo čita svako novo pitanje: ocjenjuje ga (može se odgovoriti, preširoko, nedostaju detalji, nije pitanje, spam) i piše upite za pretragu srodnih tema. Dovoljan je mali, brz model."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Korak 2: model za odgovore (sposobniji)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Piše odgovor na jasna pitanja koristeći temu i srodne javne teme pronađene na forumu. Može koristiti vezu iz koraka 1 s drugim modelom ili vlastitu vezu."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kada Baldrick odgovara"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick gleda svaku novu temu, odgovore autora teme Baldricku (razgovor) i odgovore na teme koje su šutjele duže od broja dana ispod. Nikada ne odgovara kada posljednja objava dolazi od administratora ili moderatora."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Kako Baldrick odgovara"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Odgovori se objavljuju odmah kao Baldrickov korisnik, u BBCode-u foruma. Veze na teme foruma su relativne."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kada model za razvrstavanje bude siguran da je objava spam (reklame, brojevi telefona, SEO veze...), Baldrick je skida s objavljivanja: cijelu temu kada je to prva objava. Neobjavljene objave čekaju moderiranje, pa se greška ispravlja njihovim odobravanjem."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Obavijesti"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "E-mail u običnom tekstu šalje se putem Joomla postavki pošte, s prvom objavom teme i njenih posljednjih 5 objava, najnovije prve. O radnjama sa spamom i greškama (tema od koje je Baldrick odustao, pauza jer AI provajder odbija njegove zahtjeve) uvijek se obavještava. Rezultat svakog e-maila prikazan je u dnevniku aktivnosti."

PLG_KUNENA_BALDRICK_PROVIDER = "Vrsta API-ja"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude i krajnje tačke kompatibilne s Anthropic, kao one od Qwen), ili Chat Completions kompatibilan s OpenAI (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Kompatibilno s Anthropic (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "Kompatibilno s OpenAI (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Osnovni URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Ostavite prazno za službeni API (https://api.anthropic.com ili https://api.openai.com/v1). Primjeri za Qwen Cloud: https://token-plan.maas.qwencloudapi.com/apps/anthropic (kompatibilno s Anthropic) ili https://token-plan.maas.qwencloudapi.com/compatible-mode/v1 (kompatibilno s OpenAI)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Prazno: službeni API"
PLG_KUNENA_BALDRICK_API_KEY = "API ključ"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "API ključ provajdera. Baldrick ne radi ništa dok se ne postave ključ i modeli."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model koraka razvrstavanja, npr. claude-haiku-5-5. &quot;Dohvati modele&quot; navodi modele provajdera s gornjim vrijednostima (spremljenim ili ne) u listi koja se može pretraživati (čuva se sat vremena; &quot;Osvježi&quot; pita ponovo); možete i upisati naziv. &quot;Test&quot; šalje mali zahtjev modelu."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model koraka odgovora, npr. claude-sonnet-5-5 (ili claude-opus-5-5 za najbolje odgovore). &quot;Dohvati modele&quot; navodi modele provajdera; možete i upisati naziv. &quot;Test&quot; šalje mali zahtjev modelu."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Dohvati modele"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Radi se..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Odaberite model -"
