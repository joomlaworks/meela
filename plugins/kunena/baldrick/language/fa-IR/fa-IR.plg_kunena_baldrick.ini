PLG_KUNENA_BALDRICK_PRICE_DESC = "USD به ازای هر میلیون توکن، برای برآورد هزینه. خالی: قیمت رسمی برای مدل‌های شناخته‌شده Claude، در غیر این صورت 0 (مگر اینکه ارائه‌دهنده خودش هزینه را گزارش کند)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "استفاده از اتصال مرحله 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "از همان نوع API، نشانی پایه و کلید مرحله دسته‌بندی استفاده کن (با مدلی که در زیر انتخاب می‌شود). برای استفاده از ارائه‌دهنده دیگری برای پاسخ‌ها خیر را انتخاب کنید."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: مدل جایگزین هنگام امتناع"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "فقط روی API خود Anthropic با مدل‌های Opus/Sonnet 5.x: هنگامی که بررسی‌های ایمنی مدل درخواستی را رد کند، API آن را دوباره روی یک مدل جایگزین که Anthropic انتخاب می‌کند اجرا می‌کند (جایگزین‌های سمت سرور). برای Haiku در دسترس نیست."

PLG_KUNENA_BALDRICK_DRY_RUN = "اجرای آزمایشی"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "برای آزمایش پیکربندی: Baldrick فقط در موضوع‌هایی که مدیران و مدیران انجمن شروع کرده‌اند پاسخ می‌دهد (موضوع‌های جدید و پاسخ‌های بعدی آنها به Baldrick) و هرگز ارسالی را از انتشار خارج نمی‌کند (اسپم فقط گزارش می‌شود)."
PLG_KUNENA_BALDRICK_USER = "کاربر Baldrick"
PLG_KUNENA_BALDRICK_USER_DESC = "کاربری که Baldrick با نام او ارسال می‌کند. برای اینکه کاربری به نام &quot;Baldrick&quot; خودکار ایجاد شود خالی بگذارید (بدون کلمه عبور قابل استفاده، بدون نشانی ایمیل واقعی). آواتار و امضای آن را در پروفایل انجمن او تعیین کنید (کاربر جدید امضای &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot; را می‌گیرد)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "احیا پس از (روز)"
