COM_KUNENA_A_IMAGEALLOWEDTYPES_DESC = "Hvilke bildetyper brukerne kan legge ved: kommaseparerte filendelser, <strong>med små bokstaver</strong> (mellomrom fjernes). Standard: jpg,jpeg,gif,png,webp,avif (WebP og AVIF der serverens PHP kan behandle dem). Er feltet tomt, settes standarden inn ved lagring."
