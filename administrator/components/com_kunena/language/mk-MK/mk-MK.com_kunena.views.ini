COM_KUNENA_A_IMGQUALITY_DESC = "Квалитет на JPEG, WebP и AVIF слики по промената на големината, од 1 до 100: повисока вредност значи подобар квалитет, но поголеми датотеки. Стандардно: 50 (вообичаени вредности: 50-85). PNG и GIF сликите се променуваат без загуба."
