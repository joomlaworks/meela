PLG_KUNENA_BALDRICK = "Meela - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, përgjigjësi i parë me AI i forumit: u përgjigjet temave të reja dhe temave të ringjallura pas një heshtjeje të gjatë kur asnjë administrator apo moderator nuk ka përgjigjur, duke përdorur API-t Anthropic ose të përputhshme me OpenAI. <strong>Privatësia:</strong> teksti i temave që trajton (dhe i temave publike të ngjashme) dërgohet te ofruesi i AI që konfiguroni; përmendeni këtë në politikën tuaj të privatësisë. Aktiviteti, totalet dhe kostot: Meela &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Hapi 1: modeli i klasifikimit (i vogël, i lirë)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Lexon fillimisht çdo pyetje të re: e vlerëson (e përgjigjshme, shumë e gjerë, mungojnë detaje, nuk është pyetje, spam) dhe shkruan pyetjet e kërkimit për temat e ngjashme. Një model i vogël dhe i shpejtë mjafton."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Hapi 2: modeli i përgjigjes (më i aftë)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Shkruan përgjigjen për pyetjet e qarta, duke përdorur temën dhe temat publike të ngjashme të gjetura në forum. Mund të përdorë lidhjen e hapit 1 me një model tjetër, ose një lidhje të vetën."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "Kur përgjigjet Baldrick"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick shikon çdo temë të re, përgjigjet e nisësit të temës ndaj Baldrick (një bisedë), dhe përgjigjet në tema që kanë heshtur më gjatë se numri i ditëve më poshtë. Nuk përgjigjet kurrë kur postimi i fundit vjen nga një administrator ose moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "Si përgjigjet Baldrick"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Përgjigjet publikohen menjëherë si përdoruesi i Baldrick, me BBCode të forumit. Lidhjet drejt temave të forumit janë relative."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "Kur modeli i klasifikimit është i sigurt se një postim është spam (reklama, numra telefoni, lidhje SEO...), Baldrick e çpublikon: një temë të tërë kur është postimi i parë. Postimet e çpublikuara presin moderimin, kështu që një gabim zhbëhet duke i miratuar."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Njoftimet"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "Një e-mail me tekst të thjeshtë dërgohet përmes cilësimeve të postës të Joomla, me postimin e parë të temës dhe 5 postimet e fundit, më të rejat në fillim. Veprimet ndaj spamit dhe gabimet (një temë që Baldrick e braktisi, një pezullim sepse ofruesi i AI refuzon kërkesat e tij) njoftohen gjithmonë. Rezultati i çdo e-maili shfaqet në regjistrin e aktivitetit."

